/* Enregistrer une voix, ici même. Le son ne sort jamais de l'appareil : pas
   de reconnaissance, pas de serveur — c'est la voix elle-même qu'on garde,
   et c'est bien pour ça qu'on la garde. */
function peutEnr(){
  try{ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
  catch(e){ return false; }
}
let ENR=null;
function enrOuvre(){
  if(ENR || !peutEnr()) return;
  const n=node(S.nodeId); if(!n) return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(flux){
    let mr;
    try{ mr=new MediaRecorder(flux); }
    catch(e){ flux.getTracks().forEach(t=>t.stop()); return toast("Cet appareil ne sait pas enregistrer ici."); }
    const bouts=[];
    mr.ondataavailable=function(e){ if(e.data && e.data.size) bouts.push(e.data); };
    mr.onstop=function(){
      flux.getTracks().forEach(function(t){ try{ t.stop(); }catch(x){} });
      const garde=ENR && ENR.garde, cible=ENR && ENR.n;
      enrEteint();
      if(!garde || !bouts.length) return;
      const b=new Blob(bouts, {type:(mr.mimeType||"audio/webm").split(";")[0]});
      if(b.size<800) return toast("Trop court : rien n'a été gardé.");
      medJoint(cible, [b]);
    };
    /* Un micro qu'on ouvre sans pouvoir enregistrer doit se refermer : sinon
       la pastille rouge du système reste allumée pour rien. */
    try{ mr.start(); }
    catch(e){ flux.getTracks().forEach(function(t){ try{ t.stop(); }catch(x){} });
              return toast("L'enregistrement n'a pas pu démarrer."); }
    ENR={mr:mr, n:n, deb:Date.now(), garde:false, tic:0};
    const f=document.getElementById("enr");
    if(f){ f.hidden=false; fond.classList.add("backdrop-in"); }
    enrTic();
    ENR.tic=setInterval(enrTic, 250);
    /* Au-delà de dix minutes on arrête de soi-même : un enregistrement
       oublié en marche mangerait la réserve sans qu'on le sache. */
    ENR.butoir=setTimeout(function(){ toast("Dix minutes : arrêté."); enrFerme(true); }, 600000);
  }, function(){ toast("Le micro n'a pas été autorisé."); });
}
function enrTic(){
  if(!ENR) return;
  const e=document.querySelector("#enr .enrDur"); if(!e) return;
  const s=Math.floor((Date.now()-ENR.deb)/1000);
  e.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function enrEteint(){
  if(ENR){ clearInterval(ENR.tic); clearTimeout(ENR.butoir); }
  ENR=null;
  const f=document.getElementById("enr");
  if(f) f.hidden=true;
  if(!menu.classList.contains("modal-in")) fond.classList.remove("backdrop-in");
}
function enrFerme(garde){
  if(!ENR) return;
  ENR.garde=!!garde;
  try{ ENR.mr.stop(); }catch(e){ enrEteint(); }
}

function b64Blob(s64, mime){
  const bin=atob(s64), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a], {type:mime||"application/octet-stream"});
}
function blobB64(b){
  return new Promise(function(ok, non){
    const r=new FileReader();
    r.onload=function(){ ok(String(r.result).split(",")[1]||""); };
    r.onerror=function(){ non(r.error); };
    r.readAsDataURL(b);
  });
}

/* ---------- accès ---------- */
function node(id){ return db.nodes.find(n=>n.id===id); }
function gensNom(id){ const g=db.gens.find(x=>x.id===id); return g?g.nom:""; }
function gensId(nom){
  const v=String(nom||"").trim(); if(!v) return null;
  const k=v.toLowerCase();
  const f=db.gens.find(g=>String(g.nom).trim().toLowerCase()===k);
  if(f) return f.id;
  const id=uid("g"); db.gens.push({id:id,nom:v,maj:Date.now()}); return id;
}
function enfants(id){ return db.nodes.filter(n=>(n.par||[]).indexOf(id)!==-1); }
function dessous(id){
  const vus=[id]; let f=[id];
  while(f.length){ const g=[]; f.forEach(x=>enfants(x).forEach(e=>{ if(vus.indexOf(e.id)===-1){vus.push(e.id); g.push(e.id);} })); f=g; }
  return vus;
}
/* Un chemin, c'est un morceau du graphe où tout se tient : on part d'un acte,
   on suit les liens dans les deux sens, et on ramasse tout ce qui est relié.
   Ce n'est donc ni une branche ni une ligne — c'est ce qui se répond. */
function chemins(){
  const grp={}, vu={};
  db.nodes.forEach(n=>{ grp[n.id]=n.id; vu[n.id]=true; });
  function racine(x){ while(grp[x]!==x){ grp[x]=grp[grp[x]]; x=grp[x]; } return x; }
  db.nodes.forEach(n=>(n.par||[]).forEach(p=>{
    if(!vu[p]) return;
    const a=racine(n.id), b=racine(p); if(a!==b) grp[a]=b;
  }));
  const paquets={};
  db.nodes.forEach(n=>{ const r=racine(n.id); (paquets[r]=paquets[r]||[]).push(n); });
  return Object.keys(paquets).map(k=>paquets[k])
    .filter(a=>a.length>1)
    /* Du plus récent au plus ancien, comme partout ailleurs dans
       l'application : on arrive par ce qui vient de se passer, et on
       descend vers ce qui l'a causé. Lire à l'endroit demandait de
       chercher la fin avant de savoir de quoi il s'agissait. */
    .map(a=>a.slice().sort(parDate))
    /* Le chemin qui a bougé le plus récemment se lit d'abord — la longueur
       n'est pas ce qu'on cherche en ouvrant la liste. */
    .sort((a,b)=>parDate(a[0],b[0]) || b.length-a.length);
}
function cheminDe(id){ if(!id) return null; return chemins().filter(a=>a.some(n=>n.id===id))[0]||null; }
/* La romaine est réservée à ce qui est CITÉ, jamais à ce qui est raconté au
   sujet d'une parole. « Dieu m'a parlé pendant la croisade » n'est pas une
   parole : c'est un récit. Le texte lui-même le dit, par ses guillemets, et
   l'application n'a qu'à les lire — rien de plus à demander au disciple.
   Une parole notée sans guillemets est citée tout entière : c'est le seul
   cas où l'on devine, et il est sans danger. */
const GUIL = /«[^»]*»|“[^”]*”|"[^"]{1,600}"/g;
function cite(n){
  const t = String((n && n.txt!=null ? n.txt : n) || "");
  GUIL.lastIndex = 0;
  if(n && n.txt!=null && estParole(n) && !GUIL.test(t))
    return '<span class="cite">'+esc(t)+'</span>';
  GUIL.lastIndex = 0;
  let out="", i=0, m;
  while((m=GUIL.exec(t))){
    out += esc(t.slice(i, m.index)) + '<span class="cite">'+esc(m[0])+'</span>';
    i = m.index + m[0].length;
  }
  return out + esc(t.slice(i));
}
/* « … » suivi d'autre chose : ce qui suit la citation est sa référence, pas
   la parole. On ne devine que dans ce cas précis — le texte COMMENCE par une
   citation — parce qu'ailleurs la suite est une phrase, pas une source.
   Et l'on ne déplace rien : on propose, le disciple touche (P9). */
function reference(txt){
  const t=String(txt||"").trim();
  if(!/^[«“"]/.test(t)) return "";
  GUIL.lastIndex=0;
  const m=GUIL.exec(t);
  if(!m || m.index!==0) return "";
  const q=t.slice(m[0].length).replace(/^[\s,.;:–—-]+/,"").trim();
  return (q.length>=2 && q.length<=90) ? q : "";
}
function estParole(n){ return n.kind==="rhema" || n.kind==="ecriture" || (n.act==="dieu" && n.man==="parle"); }
function acteurTxt(n){
  if(n.act==="dieu") return n.kind==="ecriture" ? "Écriture" : (n.kind==="rhema" ? "Dieu · rhema" : "Dieu");
  if(n.act==="gens"){ const nom=gensNom(n.gid)||"quelqu'un"; return n.man ? ("Lui, par "+nom) : nom; }
  const d = n.dest==="gens" ? (gensNom(n.dgid)||"quelqu'un") : (n.dest==="moi" ? "moi-même" : "Dieu");
  return "moi → "+d;
}
function dieuNodes(){ return db.nodes.filter(n=>n.kind!=="ecriture" && (n.act==="dieu" || (n.act==="gens" && n.man))); }
function parDate(a,b){ return (b.date||"").localeCompare(a.date||"") || ((b.ts||0)-(a.ts||0)); }
/* Les lectures qui vont vers l'avant — ce qui est prévu, ce qu'on a laissé
   sans réponse — prennent le même départage, retourné : à date égale, le
   premier gardé ouvre la marche. Sans quoi deux actes du même jour se
   croisent au hasard de la mémoire, et une liste qui se croise ne se lit
   plus. Un chemin, lui, descend : voir chemins(). */
function parDateAsc(a,b){ return (a.date||"").localeCompare(b.date||"") || ((a.ts||0)-(b.ts||0)); }

/* ---------- ce qui revient ----------
   Pas un seul souvenir : tout ce qui revient aujourd'hui, à faire défiler.
   Une semaine, un mois, un an — et, quand la mémoire est pleine, le hasard. */
function jour0(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function joursDepuis(n){
  const p=parse(n.date); if(!p) return null;
  return Math.round((jour0(new Date()) - new Date(p.y,p.m-1,p.d)) / 86400000);
}
const FENETRES = [
  {j:7,   tol:0, t:"Il y a une semaine"},
  {j:14,  tol:1, t:"Il y a deux semaines"},
  {j:30,  tol:2, t:"Il y a un mois"},
  {j:91,  tol:4, t:"Il y a trois mois"},
  {j:182, tol:5, t:"Il y a six mois"}
];
function ansJourPourJour(n){
  const p=parse(n.date), now=new Date();
  if(!p || n.prec!=="j") return 0;
  if(p.m!==now.getMonth()+1 || p.d!==now.getDate()) return 0;
  const a=now.getFullYear()-p.y;
  return a>0 ? a : 0;
}
function carteAnniv(n){
  const a=ansJourPourJour(n);
  if(a) return {n:n, type:"anniv", quand:"Il y a "+(a===1?"un an":a+" ans"), rang:100-a};
  const j=joursDepuis(n);
  if(j==null || j<=1) return null;
  for(let i=0;i<FENETRES.length;i++){
    const f=FENETRES[i];
    if(Math.abs(j-f.j)<=f.tol) return {n:n, type:"anniv", quand:f.t, rang:i};
  }
  return null;
}
function remontees(){
  const vus={}, cartes=[];
  const prends=c=>{ if(c && !vus[c.n.id]){ vus[c.n.id]=1; cartes.push(c); } };

  db.nodes.filter(n=>n.etat==="prevu" && n.date && n.date<=today())
    .sort(parDateAsc)
    .slice(0,2)
    .forEach(n=>prends({n:n, type:"prevu", quand:"Tu avais prévu"}));

  dieuNodes().map(carteAnniv).filter(Boolean)
    .sort((a,b)=>a.rang-b.rang).forEach(prends);

  dieuNodes().filter(n=>!enfants(n.id).some(e=>e.act==="moi"))
    .sort(parDateAsc)
    .slice(0,2)
    .forEach(n=>prends({n:n, type:"dette", quand:"Sans réponse de toi"}));

  /* Quand il y en a beaucoup, le hasard ramène ce qu'on ne cherchait pas. */
  const reste=dieuNodes().filter(n=>!vus[n.id]);
  for(let k=0; k<3 && reste.length && cartes.length<8; k++){
    const n=reste.splice(Math.floor(Math.random()*reste.length),1)[0];
    prends({n:n, type:"hasard", quand:"Au hasard"});
  }
  return cartes;
}

function liste(contenu, opt){ return `<div class="list list-strong list-outline list-dividers inset ${opt||""}"><ul>${contenu}</ul></div>`; }

  const inner = `<div class="item-inner">

function ligneActe(n, o){
  o=o||{};
  const cls = n.act==="dieu" ? "lui" : (n.act==="gens" ? "gens" : "moi");
  /* « Dieu · rhema · parlé » dit deux fois la même chose : la nature de
     l'acte porte déjà la manière. */
  const pied = [ acteurTxt(n),
                 (n.man && n.kind!=="rhema") ? manCourt(n.man) : "",
                 human(n),
                 (n.etat && n.etat!=="fait") ? ETAT[n.etat] : "" ]
               .filter(Boolean).map(esc).join(" · ");
  return `<li><a class="item-link item-content acte" ${o.attr||""}>
      <div class="item-inner"><span class="pt ${cls}"></span>
        <span class="corps"><span class="ph">${cite(n)}</span>${pied?`<span class="pied">${pied}</span>`:""}</span>
        ${o.coche?`<span class="coche">✓</span>`:""}
      </div></a></li>`;
}

    <input type="${type||"text"}" id="${id}" placeholder="${ph||""}" value="${val||""}" ${extra||""}></div></div></li>`);
}
/* Le rouage est sur les quatre onglets, au même endroit. Un réglage qu'on
   cherche n'est pas un réglage : s'il n'est atteignable que depuis un écran,
   il faut déjà savoir lequel. */
const ROUAGE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.95 1.95 0 0 1-3.9 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3.4a1.95 1.95 0 0 1 0-3.9h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.95 1.95 0 1 1 2.76-2.76l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 .97-1.47V3.4a1.95 1.95 0 0 1 3.9 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.95 1.95 0 0 1 0 3.9h-.09a1.6 1.6 0 0 0-1.47.97Z"/></svg>`;
const OEIL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;
const OEIL_CLOS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 12S5.8 5.6 12 5.6c1.6 0 3 .37 4.2.95M19.3 8.5c1.6 1.7 2.5 3.5 2.5 3.5S18.2 18.4 12 18.4c-1.6 0-3-.37-4.2-.95"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3.6 3.6l16.8 16.8"/></svg>`;
/* Un mot de passe qu'on ne voit pas se tape mal, et celui-ci n'ouvre pas
   qu'une porte : il ouvre l'archive. Une faute de frappe non vue coûte un
   aller-retour entier, et au deuxième essai raté on choisit un mot plus
   court — c'est-à-dire plus faible. L'œil ne montre que si on le demande,
   et il ne redessine pas l'écran : ce qui est déjà tapé reste tapé. */
function champMdp(id, ph, auto){
  return liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap oeilleton">
    <input type="password" id="${id}" placeholder="${ph||""}" autocomplete="${auto||"current-password"}"
      autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="oeil" type="button" data-act="oeil" aria-label="Montrer le mot de passe">${OEIL}</button>
  </div></div></li>`);
}
function bouton(txt, attr){ return `<a class="button button-large button-fill button-round" ${attr}>${txt}</a>`; }
const PLUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M12 5.4v13.2M5.4 12h13.2"/></svg>`;
/* Le geste de noter n'est plus posé par chaque écran : il est dans la barre,
   au milieu, sur les quatre onglets. Un geste qui est toujours là n'a pas à
   être redemandé à chaque vue. */
/* Le compteur se réécrit tout seul, sans redessiner l'écran : redessiner
   ferait sauter la lecture en cours à chaque seconde.
   Les secondes défilent — « pour voir comment le temps passe ». Sans elles
   le bandeau semblait arrêté : une minute entière sans qu'un chiffre bouge,
   et on finit par croire que rien n'est compté. Elles sont écrites plus
   petites et plus pâles : le bandeau garde sa voix — « 57 min », « 4 h 20 »
   — et les secondes ne font que montrer que le temps court.
   Seul le chiffre est réécrit, jamais le lien qui l'entoure : réécrire tout
   chaque seconde annulerait une tape commencée. */
let chronoEtat="";
function secondes(ms){ return String(Math.floor(Math.max(0,ms)/1000)%60).padStart(2,"0"); }
/* Le rail dit la minute en grand et la seconde en exposant. Sous la minute,
   la grande valeur EST la seconde : la répéter donnerait « 35 s 35 ». */
function railDur(ms){
  return ms<60000 ? esc(hm(ms)) : esc(hm(ms))+`<i>${secondes(ms)}</i>`;
}
/* Le rail disparaissait dès qu'on s'arrêtait, et la chaîne du compte se
   rompait sans bruit : rien à l'écran ne disait qu'on avait cessé de dire.
   Il reste donc, et il continue de compter — non pas une activité, mais
   l'absence d'activité, depuis la fin du dernier bloc. C'est la même idée
   que la bande grise de « Mon temps » (13.bw), portée à l'instant présent :
   le temps non compté n'est pas une inconnue, c'est une réponse par défaut,
   et on la voit courir. Sans seuil ici — c'est tout l'objet que de montrer
   le creux dès la première minute. */
function creuxVif(){
  const a=db.temps||[];
  let fin=0;
  for(let i=0;i<a.length;i++){ if(!a[i].fin) return null; if(a[i].fin>fin) fin=a[i].fin; }
  return fin ? {deb:fin} : null;
}

/* ---------- replier le rail ----------
   Le rail dit une chose vraie en permanence, et c'est pourquoi il a une
   place à lui (13.bt). Mais une place à soi n'est pas un droit de rester :
   on doit pouvoir dégager le haut de l'écran pour lire. Replier n'est donc
   pas masquer — il reste un trait qui respire, et le compte continue.
   Le choix est gardé, avec le bloc pour lequel il a été fait : replier son
   compteur du matin ne doit pas replier d'avance celui du soir. */
const PLIK="ebenezer.rail";
let railPlie=false, railBloc="", railPrevenu=false;
try{ railPlie=localStorage.getItem(PLIK)==="1"; railBloc=localStorage.getItem(PLIK+".b")||""; }catch(e){}
function plieRail(v){
  v=!!v;
  rail.classList.toggle("plie", v);
  if(v===railPlie) return;
  railPlie=v;
  try{ localStorage.setItem(PLIK, v?"1":"0"); }catch(e){}
  place();
}
function railNote(id){
  if(id===railBloc) return;
  railBloc=id; railPrevenu=false;
  try{ localStorage.setItem(PLIK+".b", id||""); }catch(e){}
  plieRail(false);
}
/* Un glissé vertical sur le rail le replie ou le rouvre. On exige un vrai
   mouvement — dix-huit pixels, et plus haut que large — pour qu'un doigt
   qui tremble en tapant n'emporte pas le bandeau. Et on empêche alors la
   tape : sans cela, le glissé ouvrirait aussi le pointage. */
let railDoigt=null;
rail.addEventListener("touchstart", function(ev){
  const t=ev.changedTouches[0]; railDoigt={x:t.clientX, y:t.clientY};
}, {passive:true});
rail.addEventListener("touchend", function(ev){
  if(!railDoigt) return;
  const t=ev.changedTouches[0];
  const dy=t.clientY-railDoigt.y, dx=t.clientX-railDoigt.x;
  railDoigt=null;
  if(Math.abs(dy)<18 || Math.abs(dx)>Math.abs(dy)) return;
  ev.preventDefault();
  plieRail(dy<0);
}, {passive:false});
/* Replié, le trait ne mène plus au pointage : il se rouvre. On intercepte
   à la descente, avant que la tape n'atteigne le lien qu'il contient. */
rail.addEventListener("click", function(ev){
  if(!railPlie) return;
  ev.preventDefault(); ev.stopPropagation();
  plieRail(false);
}, true);
function majChrono(){
  const o=ouvert();
  const vif = o ? null : creuxVif();
  const etait=rail.hidden;
  rail.hidden = !o && !vif;
  if(rail.hidden){
    if(!etait){ rail.innerHTML=""; chronoEtat=""; haut.classList.remove("sousRail"); place(); }
    return;
  }
  if(vif){
    const d = Date.now()-vif.deb;
    railNote("creux");
    if(chronoEtat!=="creux" || !rail.firstElementChild){
      chronoEtat="creux";
      rail.innerHTML = `<a class="tic rien" data-act="comblerVif"><i class="pt creux"></i>`
        + `<span class="quoi">Rien de compté</span><span class="dur"></span></a>`;
    }
    rail.classList.toggle("plie", railPlie);
    if(etait){ haut.classList.add("sousRail"); place(); }
    const e=rail.querySelector(".dur");
    if(e) e.innerHTML = railDur(d);
    return;
  }
  const ec = Date.now()-o.deb;
  const vieux = ec>=10*3600000;
  /* Le rail nomme ce qui porte l'heure, et dit d'un chiffre combien
     d'autres tournent à côté. Les empiler ferait grandir le mobilier à
     chaque mission : un rail qui pousse n'est plus un rail. */
  const autres = ouverts().length-1;
  /* Un pointage qui commence rouvre le rail : c'est le reçu du geste qu'on
     vient de faire. Un compteur qui atteint dix heures le rouvre aussi, une
     fois — l'app prévient, puis se tait ; elle ne retient pas la main de
     celui qui le replie à nouveau. */
  railNote(o.id);
  if(vieux && !railPrevenu){ railPrevenu=true; plieRail(false); }
  const etat = o.id+"|"+tacheNom(o.t)+"|"+(vieux?"v":"")+"|"+autres;
  if(etat!==chronoEtat || !rail.firstElementChild){
    chronoEtat=etat;
    rail.innerHTML = `<a class="tic${vieux?" vieux":""}" data-go="pointer"><i class="pt"></i>`
      + `<span class="quoi">${esc(tacheNom(o.t))}</span>`
      + (autres>0 ? `<span class="pl">+${autres}</span>` : "")
      + `<span class="dur"></span></a>`;
  }
  /* Le rail qui apparaît ou disparaît décale toute la page : on remesure,
     mais seulement à ce moment-là, jamais à chaque seconde. */
  rail.classList.toggle("plie", railPlie);
  if(etait){ haut.classList.add("sousRail"); place(); }
  const d=rail.querySelector(".dur");
  if(d) d.innerHTML = railDur(ec);
}
setInterval(function(){ if(!document.hidden) majChrono(); }, 1000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) majChrono(); });
function titreBloc(t, cls){ return `<div class="block-title ${cls||""}">${t}</div>`; }

/* Les barres flottent au-dessus de la liste pour que le verre ait quelque chose
   à flouter. Leurs hauteurs changent d'un écran à l'autre : on les mesure. */
function place(){
  const rH = rail.hidden ? 0 : rail.offsetHeight;
  /* Le rouage est posé sur l'écran, pas sur la page : il ne sait pas qu'une
     barre vient d'apparaître au-dessus de lui. On la lui dit. */
  document.documentElement.style.setProperty("--rail", rH+"px");
  document.body.classList.toggle("avecRail", rH>0);
  const hH = haut.hidden ? 0 : haut.offsetHeight;
  const aH = avance.hidden ? 0 : 2;
  const basH = bas.offsetHeight;
  haut.style.top = rH+"px";
  avance.style.top = (rH+hH)+"px";
  main.style.paddingTop = hH
    ? (rH+hH+aH)+"px"
    : (rH ? (rH+aH+10)+"px"
          : "calc(env(safe-area-inset-top,0px) + "+(aH+10)+"px)");
  /* La pastille centrale déborde du haut de la barre : le contenu doit
     pouvoir défiler au-delà d'elle, sinon la dernière ligne reste dessous. */
  const debord = nav.hidden ? 20 : 46;
  main.style.paddingBottom = basH
    ? (basH+debord)+"px"
    : "calc(env(safe-area-inset-bottom,0px) + 24px)";
}
addEventListener("resize", place);
/* Au tout premier affichage, le téléphone ne connaît pas encore la hauteur de
   sa barre d'accueil, et la police n'est pas arrivée : les barres grandissent
   après coup, et l'action se retrouvait cachée. On replace dès que ça bouge. */
addEventListener("orientationchange", place);
try{
  const o=new ResizeObserver(()=>place());
  o.observe(haut,{box:"border-box"});   /* la bordure, pas le contenu : c'est le
     rembourrage de l'encoche qui grandit, et il n'entre pas dans la boîte de contenu */
  o.observe(bas,{box:"border-box"});
}catch(e){}
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(place); }catch(e){}

function phrase(c){

/* Le rappel de sauvegarde était dans Mes données, et Mes données est passée
   derrière un rouage : un rappel qu'il faut aller chercher ne rappelle rien.
   Il revient donc là où le disciple passe tous les jours — tout en bas, après
   ce qu'il est venu lire, jamais devant.
   Il ne parle pas avant que l'archive pèse quelque chose : réclamer une
   sauvegarde au troisième acte, c'est apprendre à ignorer l'avertissement
   avant qu'il ait servi. Et il ne gronde pas : il dit où en est la copie, et
   ouvre le partage. Ranger reste le geste du disciple (P9). */
/* Le rail n'existe que pendant qu'on compte. Il faut donc, quand rien ne
   compte, une porte pour commencer — et elle disparaît d'elle-même au
   premier pointage, puisque le rail la remplace alors en haut. */
function rappelTemps(){
  if(ouvert()) return "";
  const cj=cumul(minuit(0), Date.now());
  return liste(ligne({titre:"Rien n'est compté",
    sous: cj.tot ? esc(hm(cj.tot))+" comptés aujourd'hui" : "Dire à quoi va ton temps",
    attr:'data-go="pointer"'}), "lien") + `<div style="height:6px"></div>`;
}
function rappelFichier(){
  const n=db.nodes.length + (db.temps||[]).length;
  if(n<5) return "";
  const vieux = !db.exp || (Date.now()-db.exp) > 30*86400000;
  if(!vieux) return "";
  const quoi = db.exp
    ? "Ton dernier fichier date du "+new Date(db.exp).toLocaleDateString("fr-FR")+"."
    : "Tu n'as encore jamais sorti de fichier.";
  const pourquoi = SY.actif
    ? "La copie distante te suit, mais elle ne t'appartient pas : un fichier à toi, rangé où tu veux, ne dépend de personne."
    : "Tout est sur ce téléphone, et nulle part ailleurs.";
  return titreBloc("Au cas où","ecart")
    + `<div class="block amorce">${quoi} ${pourquoi}</div>`
    + liste(ligne({titre:"Sortir un fichier", sous:"iCloud, Drive, Fichiers — où tu veux",
                   attr:'data-act="fichier"'}), "lien")
    + `<div style="height:18px"></div>`;
}
/* Une fenêtre haute, c'est une tablette debout ou un grand écran. On ne
   redessine qu'au passage d'un côté à l'autre : redessiner à chaque pixel
   d'un redimensionnement ferait sauter la lecture. */
function haute(){ return window.innerHeight >= 900; }
let etaitHaute = false;
try{ etaitHaute = haute(); }catch(e){}
window.addEventListener("resize", function(){
  const h = haute();
  if(h!==etaitHaute){ etaitHaute=h; render(); }
});
function vToday(){

    Z.haut = RAMEAU("marque") + `<p class="titre-page">Rien encore.</p><p class="ssTitre">${d}</p>`;

  const cartes=remontees();

    Z.html = `<div class="block amorce" style="margin-top:20px">Tout ce qu'Il a fait a reçu quelque chose de toi. Note la suite quand elle vient.</div>`
      + rappelTemps() + rappelFichier();

  }
  /* Quatre derniers gardés remplissent un téléphone et laissent une tablette

  const recents=db.nodes.slice().sort(parDate).slice(0, haute() ? 9 : 4);
  Z.file = true;

  Z.html = `<div class="carr" id="carr" style="margin-top:16px">${cartes.map(carte).join("")}</div>

    ${rappelTemps()}
    ${titreBloc("Derniers gardés")}
    ${liste(recents.map(n=>ligneActe(n,{attr:'data-node="'+n.id+'"'})).join(""))}
    ${rappelFichier()}`;
}

/* ---------- Ses œuvres ---------- */
function vOeuvres(){
  const list=dieuNodes().slice().sort(parDate);
  const fl=["tout"].concat(Object.keys(MANS()));
  /* Deux lectures de la même archive : comment Il a agi, et ce que j'en ai
     fait. La seconde est la plus dure à regarder, c'est pour ça qu'elle doit
     être à portée de pouce. */
  const fr=[["tout","Tout"],["oui","J'ai répondu"],["non","Je n'ai rien rendu"]];
  const fg=[["an","Par année"],["mois","Par mois"],["semaine","Par semaine"]];
  /* Replié, le bandeau dit lui-même ce qu'il cache : sans cela, on filtre
     sans le savoir et on croit l'archive vide. */
  /* Le bandeau ne dit que ce qui s'écarte de l'ordinaire. « Toutes Ses
     manières · par année » décrivait l'état normal de l'écran en six mots :
     un bandeau qui parle quand il n'a rien à dire, on cesse de le lire, et le
     jour où il a quelque chose à dire on ne le lit plus non plus. Rien de
     réglé : « Filtres », et c'est tout. */
  const resume=[
    S.filtre==="tout" ? "" : manCourt(S.filtre),
    S.ret==="oui" ? "j'ai répondu" : (S.ret==="non" ? "rien rendu" : ""),
    S.grain==="an" ? "" : (S.grain==="mois" ? "par mois" : "par semaine")
  ].filter(Boolean).join(" · ");
  /* Un compte qui ne bouge pas quand le filtre retranche fait croire que
     l'archive est plus vide qu'elle n'est — ou plus pleine. */
  const rendu=n=>enfants(n.id).some(e=>e.act==="moi");
  const vus=list
    .filter(n=>S.filtre==="tout" || n.man===S.filtre)
    .filter(n=>S.ret==="tout" || rendu(n)===(S.ret==="oui"));
  const compte = (S.filtre==="tout" && S.ret==="tout")
    ? `${list.length} fois, par Lui-même ou par une main.`
    : `${vus.length} sur ${list.length}, sous ce filtre.`;
  Z.haut=`<p class="titre-page">Ses œuvres</p><p class="ssTitre">${compte}</p>
    <button class="plier" data-act="plier" aria-expanded="${!S.plie}">
      <b>Filtres</b>${resume?`<span class="q">${esc(resume)}</span>`:""}${BAS}</button>`;
  if(!S.plie) Z.haut+=`<div class="ptitre">Sa manière</div>
    <div class="puces">${fl.map(f=>`<button class="puce" data-filtre="${f}" aria-pressed="${S.filtre===f}">${f==="tout"?"Tout":manTxt(f)}</button>`).join("")}</div>
    <div class="ptitre">Mon retour</div>
    <div class="puces suite">${fr.map(([k,l])=>`<button class="puce" data-fret="${k}" aria-pressed="${S.ret===k}">${l}</button>`).join("")}</div>
    <div class="ptitre">Ranger</div>
    <div class="puces suite">${fg.map(([k,l])=>`<button class="puce" data-grain="${k}" aria-pressed="${S.grain===k}">${l}</button>`).join("")}</div>`;
  let h="";
  if(!vus.length) h+=`<p class="vide">Rien sous ce filtre.</p>`;
  let an=null, buf="";
  vus.forEach(n=>{
    const y=tranche(n, S.grain);
    if(y!==an){ if(buf){ h+=liste(buf); buf=""; } h+=titreBloc(esc(y), an===null?"":"ecart"); an=y; }
    buf += ligneActe(n, {attr:'data-node="'+n.id+'"'});
  });
  if(buf) h+=liste(buf);
  Z.html=h;
}

/* ---------- Révélations ---------- */
function vRevel(){

  Z.haut=`<p class="titre-page">Révélations</p><p class="ssTitre">Ce que tout cela t'a fait connaître de Lui.</p>
    <div class="puces">${o.map(([k,l])=>`<button class="puce" data-rev="${k}" aria-pressed="${S.rev===k}">${l}</button>`).join("")}</div>`;
  let h="";
  if(S.rev==="noms"){
    if(!db.noms.length) h+=`<p class="vide">Aucun nom encore. Ils viennent en relisant.</p>`;
    else h+=liste(db.noms.slice().reverse().map(nm=>ligne({titre:esc(nm.txt), serif:true,
      apres:`<span class="coche">${(nm.nodes||[]).length||"—"}</span>`})).join(""));
    h+=titreBloc("Garder un nom")+champ("newNom","Comment Il t'a traité ? « Celui qui… »")+
      `<div class="block">${bouton("Garder ce nom",'data-act="addNom"')}</div>`;
  } else if(S.rev==="chemins"){
    const ch=chemins();
    if(!ch.length) h+=`<p class="vide">Aucun chemin encore. Il en naît un dès que deux actes se répondent.</p>`;
    else h+=liste(ch.map(a=>{
      const an=a.map(n=>parse(n.date)).filter(Boolean).map(p=>p.y).sort();
      const sp=an.length ? (an[0]===an[an.length-1] ? ""+an[0] : an[0]+" → "+an[an.length-1]) : "";
      return ligne({titre:cite(a[0]),
        sous:a.length+" actes"+(sp?" · "+sp:""), attr:'data-chemin="'+a[0].id+'"'});
    }).join(""));
  } else if(S.rev==="gens"){
    if(!db.gens.length) h+=`<p class="vide">Personne encore.</p>`;
    else h+=liste(db.gens.slice().reverse().map(g=>{
      const par=db.nodes.filter(n=>n.gid===g.id).length;
      const dit=db.nodes.filter(n=>n.act==="moi"&&n.dest==="gens"&&n.dgid===g.id).length;
      return ligne({titre:esc(g.nom),
        texte:(par?("Il est passé par lui "+par+" fois.") : "Rien de Lui par lui, encore.")+" "+
              (dit?("Tu lui as rendu "+dit+" chose"+(dit>1?"s":"")+".") : "Tu ne lui as rien rendu.")});
    }).join(""));
  } else {
    /* La garde est en tête, une fois pour toutes — pas en note de bas de page
       après qu'on a déjà lu les chiffres. */
    h+=`<div class="block amorce" style="margin:16px 0 4px">Aucune moyenne n'est un jugement.
      Ce que le chiffre veut dire reste à toi.</div>`;
    CS=constats();
    if(!CS.length) h+=`<p class="vide">Pas encore de quoi compter. Garde quelques actes, et relie-les.</p>`;
    else {
      let fam=null, buf="", prem=true;
      CS.forEach((c,i)=>{
        if(c.fam!==fam){
          if(buf){ h+=liste(buf); buf=""; }
          h+=titreBloc(c.fam, prem?"":"ecart"); fam=c.fam; prem=false;
        }
        buf+=ligne({titre:c.txt, sous:c.ids.length?(c.ids.length+" acte"+(c.ids.length>1?"s":"")):"",
          attr:c.ids.length?'data-faits="'+i+'"':""});
      });
      if(buf) h+=liste(buf);
    }
  }
  Z.html=h;
}
function jours(a,b){
  const pa=parse(a), pb=parse(b); if(!pa||!pb) return null;
  return Math.round((Date.UTC(pb.y,pb.m-1,pb.d)-Date.UTC(pa.y,pa.m-1,pa.d))/86400000);
}
function duree(j){
  j=Math.abs(Math.round(j));
  if(j<31) return j+" jour"+(j>1?"s":"");
  const m=Math.round(j/30.44); if(m<24) return m+" mois";
  return Math.round(j/365.25)+" ans";
}
function court(t,n){ t=String(t||""); n=n||44;
  return t.length>n ? esc(t.slice(0,n-1).replace(/\s+\S*$/,""))+"…" : esc(t); }
/* Une citation déjà entre guillemets, remise entre guillemets, en porte deux
   paires : « « Je pourvoirai » ». On dénude avant de citer. */
function nue(t){ return String(t||"").trim().replace(/^[«“"]\s*/,"").replace(/\s*[»”"]$/,"").replace(/\s*\.$/,""); }

/* Mes chiffres : pas une jauge, des phrases. Chacune s'ouvre sur les faits
   qui la composent — un constat qu'on ne peut pas vérifier n'est pas un
   constat, c'est un verdict (14.5-bis.f, P4). Une famille dont la mémoire
   n'a pas encore de quoi parler se tait : mieux vaut six phrases vraies que
   douze dont la moitié dit « 0 sur 0 ». */
let CS=[];
function constats(){
  const out=[], dn=dieuNodes(), mien=db.nodes.filter(n=>n.act==="moi");
  const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
  const dit=(fam,txt,ids)=>out.push({fam:fam, txt:txt, ids:uniq(ids||[])});
  const pl=(n,m,p)=>n>1?(p||(m+"s")):m;

  /* --- Ses délais --- */
  const paroles=db.nodes.filter(n=>n.kind==="rhema"||n.kind==="ecriture");
  const paires=[];
  paroles.forEach(p=>enfants(p.id).filter(e=>e.act!=="moi"&&e.etat!=="prevu").forEach(e=>{
    const j=jours(p.date,e.date); if(j!=null&&j>=0) paires.push({p:p,e:e,j:j});
  }));
  if(paires.length){
    const moy=paires.reduce((s,x)=>s+x.j,0)/paires.length;
    dit("Ses délais", `Entre une parole et ce qui l'accomplit, Il a mis <b>${duree(moy)}</b> en moyenne, sur ${paires.length} ${pl(paires.length,"fois","fois")}.`, paires.map(x=>x.e.id));
    const max=paires.slice().sort((a,b)=>b.j-a.j)[0];
    if(max.j>0) dit("Ses délais", `Le plus long : <b>${duree(max.j)}</b>, après « ${court(nue(max.p.txt))} ».`, [max.p.id,max.e.id]);
  }
  const attente=paroles.filter(n=>!enfants(n.id).some(e=>e.act!=="moi"));
  if(attente.length) dit("Ses délais", `<b>${attente.length}</b> ${pl(attente.length,"parole")} ${attente.length>1?"attendent":"attend"} encore.`, attente.map(n=>n.id));

  /* --- Ce qui marche --- */
  const faits=mien.filter(n=>n.etat==="fait");
  const suivis=faits.filter(n=>enfants(n.id).some(e=>e.act!=="moi"));
  if(faits.length>=3) dit("Ce qui marche", `Sur tes ${faits.length} actes, <b>${suivis.length}</b> ont été suivis d'un acte de Lui.`, suivis.map(n=>n.id));
  [["dieu","pour Lui"],["gens","pour d'autres"],["moi","pour toi"]].forEach(([k,l])=>{
    const a=faits.filter(n=>n.dest===k); if(a.length<3) return;
    const b=a.filter(n=>enfants(n.id).some(e=>e.act!=="moi"));
    dit("Ce qui marche", `Tes actes ${l} : <b>${b.length}</b> sur ${a.length} ${b.length>1?"ont été suivis":"a été suivi"} d'un acte de Lui.`, b.map(n=>n.id));
  });

  /* --- Ta réponse --- */
  if(dn.length){
    const sans=dn.filter(n=>!enfants(n.id).some(e=>e.act==="moi"));
    dit("Ta réponse", sans.length
      ? `<b>${sans.length}</b> de Ses actes ${sans.length>1?"n'ont":"n'a"} jamais rien reçu de toi.`
      : `Chacun de Ses actes a reçu quelque chose de toi.`, sans.map(n=>n.id));
    const vieux=sans.filter(n=>n.date).sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0];
    if(vieux){ const j=jours(vieux.date,today());
      if(j!=null&&j>60) dit("Ta réponse", `Le plus ancien attend depuis <b>${duree(j)}</b>.`, [vieux.id]); }
    const rep=[];
    dn.forEach(n=>{
      const e=enfants(n.id).filter(x=>x.act==="moi"&&x.etat==="fait")
                           .sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0];
      if(e){ const j=jours(n.date,e.date); if(j!=null&&j>=0) rep.push({e:e,j:j}); }
    });
    if(rep.length>=2){ const moy=rep.reduce((s,x)=>s+x.j,0)/rep.length;
      dit("Ta réponse", `Quand tu réponds, tu mets <b>${duree(moy)}</b> en moyenne.`, rep.map(x=>x.e.id)); }
  }

  /* --- Les hommes --- */
  const par={};
  db.nodes.forEach(n=>{ if(n.act==="gens"&&n.gid) (par[n.gid]=par[n.gid]||[]).push(n.id); });
  const gids=Object.keys(par);
  if(gids.length){
    const top=gids.slice().sort((a,b)=>par[b].length-par[a].length)[0];
    dit("Les hommes", `Dieu est passé <b>${par[top].length}</b> fois par ${esc(gensNom(top))}.`, par[top]);
    const muets=gids.filter(g=>!db.nodes.some(n=>n.act==="moi"&&n.dest==="gens"&&n.dgid===g));
    if(muets.length) dit("Les hommes", `Tu n'as jamais rien rendu à <b>${muets.length}</b> ${pl(muets.length,"personne")} par qui Il est passé.`,
      [].concat.apply([], muets.map(g=>par[g])));
  }

  /* --- Tes chemins --- */
  const ch=chemins();
  if(ch.length){
    const plus=ch.slice().sort((a,b)=>b.length-a.length)[0];
    dit("Tes chemins", `Ta plus longue histoire compte <b>${plus.length}</b> actes.`, plus.map(n=>n.id));
    if(ch.length>1){
      const moy=ch.reduce((s,a)=>s+a.length,0)/ch.length;
      dit("Tes chemins", `<b>${ch.length}</b> chemins, ${String(Math.round(moy*10)/10).replace(".",",")} actes en moyenne.`, []);
    }
    const dort=ch.filter(a=>{ const j=jours(a[a.length-1].date, today()); return j!=null && j>365; });
    if(dort.length) dit("Tes chemins", `<b>${dort.length}</b> ${pl(dort.length,"chemin")} ${dort.length>1?"n'ont":"n'a"} rien reçu depuis plus d'un an.`,
      dort.map(a=>a[a.length-1].id));
  }

  /* --- Tes saisons --- */
  const ans={};
  db.nodes.forEach(n=>{ const p=parse(n.date); if(p) (ans[p.y]=ans[p.y]||[]).push(n.id); });
  const ks=Object.keys(ans).sort();
  if(ks.length>=2){
    const dense=ks.slice().sort((a,b)=>ans[b].length-ans[a].length)[0];
    dit("Tes saisons", `Ton année la plus dense : <b>${dense}</b>, ${ans[dense].length} actes.`, ans[dense]);
    const trous=[]; for(let y=+ks[0]+1; y<+ks[ks.length-1]; y++){ if(!ans[y]) trous.push(y); }
    if(trous.length) dit("Tes saisons", `Rien n'est gardé pour <b>${trous.join(", ")}</b>.`, []);
  }
  return out;
}

/* ---------- un chemin ---------- */
/* Le fil est la lecture, les liens sont la vérité : les actes descendent du
   plus récent au plus ancien, et chacun dit « après : … » quand sa cause
   n'est pas simplement celle du dessous. Aucun trait n'est tracé
   (14.5-bis.b). */
function vChemin(){
  const suite=cheminDe(S.cheminId);
  if(!suite){ S.view="revel"; return render(); }
  Z.titre="Un chemin"; Z.retour=true;
  /* Un acte prévu n'est pas un acte : le mêler au passé laisserait croire
     qu'il a eu lieu. On le garde dans le chemin — c'est bien une promesse de
     ce chemin-là — mais au-dessus d'une coupure. Le fil descendant, le
     prévu est ce qu'il y a de plus récent : il ouvre la lecture. */
  const faits=suite.filter(n=>n.etat!=="prevu"), prevus=suite.filter(n=>n.etat==="prevu");
  const ordre=prevus.concat(faits);
  const pos={}; ordre.forEach((n,i)=>{ pos[n.id]=i; });
  /* L'en-tête porte déjà le nom de l'écran : le dire deux fois ne dit rien. */
  let h=`<div class="block amorce" style="margin-top:20px">Ce n'est pas une ligne :
      plusieurs fils se rejoignent ici. On descend vers ce qui a précédé.</div>
    <div class="fil">`;
  ordre.forEach((n,i)=>{
    if(prevus.length && i===0) h+=`<div class="coupure">Ce qui est prévu</div>`;
    if(prevus.length && i===prevus.length) h+=`<div class="coupure">Ce qui a eu lieu</div>`;
    const cls = (n.act==="dieu" ? "dieu" : (n.act==="gens" ? "gens" : "moi"))
              + (n.etat==="prevu" ? " prevu" : "");
    /* La cause est maintenant en dessous : c'est elle qu'on ne redit pas. */
    const prec=(n.par||[]).map(node).filter(Boolean).filter(p=>pos[p.id]!==i+1);
    let apres="";
    /* Rappeler d'où ça vient, pas le relire en entier. */
    const court=t=>{ t=String(t); return t.length>46 ? esc(t.slice(0,45).replace(/\s+\S*$/,""))+"…" : esc(t); };
    if(prec.length) apres=`après : ${prec.map(p=>court(p.txt)).join(" · ")}`;
    else if(i<ordre.length-1 && !(n.par||[]).length) apres="un autre fil commence ici";
    h+=`<a class="pas ${cls}" data-node="${n.id}">
        <span class="dit">${cite(n)}</span>
        <span class="sous">${n.etat&&n.etat!=="fait"?`<span class="etiq">${ETAT[n.etat]}</span>`:""}${esc(acteurTxt(n))}${human(n)?" · "+human(n):""}</span>
        ${apres?`<span class="apres">${apres}</span>`:""}
      </a>`;
  });
  h+=`</div>`;
  /* Une chaîne qui s'arrête sur un acte de Lui pose une question, et laisse
     le droit de ne pas répondre (14.5-bis.e). */
  const fin=faits[0];
  if(fin && fin.act!=="moi" && !enfants(fin.id).length){
    h+=`<div class="block amorce" style="margin-top:18px">Qu'est-ce qui est sorti de ceci ?
      <span class="rien">Tu as le droit de ne pas répondre.</span></div>`;
    Z.action=bouton("Dire ce qui a suivi", 'data-attach="'+fin.id+'"');
  }
  Z.html=h;
}

  Z.titre="Un acte"; Z.retour=true; Z.plus=true;

      <p class="meta">${esc(acteurTxt(n))}${(n.man&&n.kind!=="rhema")?" · "+esc(manCourt(n.man)):""}${dte?" · "+dte:""}${n.etat&&n.etat!=="fait"?" · "+ETAT[n.etat]:""}</p>
      ${n.desc?`<p class="desc">${esc(n.desc)}</p>`:""}
    </div>`;
  /* Un acte à moi change d'état tout seul avec le temps : ce qui était prévu
     commence, ce qui a commencé s'achève. Si ça ne se dit qu'au moment de la
     capture, l'écran « Mes actes » ment au bout d'une semaine. Ici, un doigt
     suffit, et c'est le disciple qui le pose (P9). */
  h+=medBloc(n, false);
  if(n.act==="moi"){
    h+=titreBloc("Où ça en est");
    h+=liste(ETATS.map(([k,l])=>ligne({titre:l,
      apres:(n.etat||"fait")===k?`<span class="coche">✓</span>`:"",
      attr:'data-netat="'+k+'"'})).join(""));
  }
  h+=titreBloc("En réponse à", n.act==="moi"?"ecart":"");
  h+=liste(
    (par.length ? par.map(p=>ligneActe(p,{attr:'data-node="'+p.id+'"'})).join("")
      : ligne({titre:`<span class="rien">Rien, pour l'instant</span>`}))
    + ligne({titre:`<span class="coche">Dire ce qui a précédé</span>`, attr:'data-lierview="'+n.id+'"'}));
  /* « Mes retours » était faux une fois sur deux : ce qui suit peut être Sa
     réponse autant que la mienne. Le titre ne présume plus de l'acteur. */
  h+=titreBloc("Ce qui a suivi");
  h+= enf.length
    ? liste(enf.map(e=>ligneActe(e,{attr:'data-node="'+e.id+'"'})).join(""))
    : `<p class="vide">Rien n'a suivi, pour l'instant.</p>`;
  Z.html=h;
  Z.action = (n.etat==="prevu" || n.etat==="encours")
    ? bouton("C'est fait", 'data-fait="'+n.id+'"')
    : bouton("Dire ce qui a suivi", 'data-attach="'+n.id+'"');
}

/* ---------- choisir une cause ----------
   Un seul écran, pour l'assistant comme pour un acte déjà gardé (13.o).
   On cherche au texte ; si la cause n'est pas encore dans la mémoire,
   on l'écrit ici même, sans quitter l'écran. */
const NEUFS = [
  ["ecriture", "Une promesse de l'Écriture",   "elle ne compte pas parmi Ses œuvres", true],
  ["rhema",    "Une parole qu'Il m'a dite",    "", true],
  ["moi",      "Quelque chose que j'ai fait",  "une prière, un jeûne, une démarche", false],
  ["dieu",     "Quelque chose qu'Il a fait",   "", false]
];
function choixCause(sel, exclus){
  /* Deuxième mode : on écrit la cause qui manque. La liste disparaît. */
  if(S.cNeuf){
    return `<div class="block" style="margin-top:18px">
        <textarea class="dicte" id="cNeuf" placeholder="La parole, la prière, l'acte qui a précédé…"
          style="min-height:84px">${esc(S.cTxt)}</textarea>${micBloc("cNeuf")}</div>`
      + titreBloc("Qu'est-ce que c'est ?")
      + liste(NEUFS.map(n=>ligne({titre:n[1], sous:n[2], serif:n[3],
          apres:S.cType===n[0]?`<span class="coche">✓</span>`:"",
          attr:'data-ctype="'+n[0]+'"'})).join(""));
  }
  /* Premier mode : on cherche dans ce qui est déjà gardé. */
  const cands = db.nodes
    .filter(x => exclus.indexOf(x.id)===-1 && x.etat!=="prevu" && x.etat!=="abandon")
    .sort(parDate);
  /* Tout dérouler d'un coup, c'est un mur : on ne cherche pas dans un mur.
     L'écran reste donc vide tant qu'aucun mot n'est écrit — sauf ce qui est
     déjà lié, qui ne doit jamais disparaître sous le pouce. */
  return champ("cFiltre","Cherche : une parole, une prière, un acte…")
    + liste(ligne({titre:`<span class="coche">+ Ajouter quelque chose de nouveau</span>`,
        attr:'data-act="causeNeuf"'}))
    + (cands.length
        ? liste(cands.map(x=>ligneActe(x,{coche:sel.indexOf(x.id)!==-1,
            attr:'data-par="'+x.id+'"'+(sel.indexOf(x.id)!==-1?' data-sel="1"':"")})).join(""), "cands")
        : `<p class="vide">Rien d'autre dans ta mémoire pour l'instant.</p>`)
    + `<p class="vide" id="attente" hidden>Écris un mot : ce que tu as déjà gardé apparaîtra.</p>`
    + `<p class="vide" id="rien" hidden>Rien ne correspond. Touche « Ajouter quelque chose de nouveau ».</p>`;
}

/* ---------- rattacher une cause ---------- */
function vLier(){
  const n=node(S.nodeId); if(!n){ S.view="today"; return render(); }

/* Rien ne part en clair. Le journal nomme des frères et des sœurs, porte ce
   qu'Il a dit, et tient le relevé minute par minute d'une vie. Le serveur n'en
   voit qu'un bloc opaque, et celui qui l'héberge ne peut rien y lire. */
/* Mais « le serveur ne lit pas » et « on peut récupérer » semblent s'exclure,
   et c'est faux. Une clé est tirée au sort pour chaque personne : c'est elle
   qui chiffre l'archive. Cette clé est ensuite mise sous enveloppe DEUX fois —
   une enveloppe que le mot de passe ouvre, une enveloppe qu'un code de
   récupération ouvre. Le serveur ne garde que les deux enveloppes closes. Qui
   oublie son mot de passe ressort son code et retrouve tout ; le serveur,
   lui, n'a jamais rien pu lire. C'est le procédé des gestionnaires de mots de
   passe, et il n'y en a pas d'autre qui tienne les deux bouts. */
/* Rempli à la publication. Personne d'autre que l'auteur n'a à connaître
   Supabase, ni à exécuter du SQL pour tenir son journal : l'adresse et la clé
   publique du projet voyagent avec l'application. Le formulaire reste là,
   derrière un lien, pour qui veut héberger le sien. */

function b64(buf){ let s=""; const a=new Uint8Array(buf);
  for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
function deb64(t){ const s=atob(t), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function alea(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function deKDF(secret, sel){
  const brut=await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:sel, iterations:250000, hash:"SHA-256"},
    brut, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function ferme(dk, secret){
  const sel=alea(16), iv=alea(12), k=await deKDF(secret, sel);
  const c=await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, dk);
  return {s:b64(sel), i:b64(iv), c:b64(c)};
}
async function ouvre(env, secret){
  const k=await deKDF(secret, deb64(env.s));
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:deb64(env.i)}, k, deb64(env.c)));
}
async function cleDoc(dk){ return crypto.subtle.importKey("raw", dk, {name:"AES-GCM"}, false, ["encrypt","decrypt"]); }
async function chiffreDoc(obj, dk){
  const iv=alea(12), k=await cleDoc(dk);
  const c=await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, new TextEncoder().encode(JSON.stringify(obj)));
  return {i:b64(iv), c:b64(c)};
}
async function dechiffreDoc(o, dk){
  const k=await cleDoc(dk);
  const p=await crypto.subtle.decrypt({name:"AES-GCM", iv:deb64(o.i)}, k, deb64(o.c));
  return JSON.parse(new TextDecoder().decode(p));
}
/* Une pièce jointe se chiffre comme le document, avec la même clé, mais
   sans passer par du texte : le base64 ferait grossir d'un tiers une chose
   qui pèse déjà. Le vecteur est posé devant, et le serveur ne voit qu'un
   bloc d'octets dont il ignore jusqu'à la nature — le type du fichier reste
   dans l'archive, qui est elle-même chiffrée. */
async function chiffreOctets(buf, dk){
  const iv=alea(12), k=await cleDoc(dk);
  const c=await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, buf);
  const out=new Uint8Array(12+c.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(c), 12);
  return out;
}
async function dechiffreOctets(oct, dk){
  const k=await cleDoc(dk);
  const p=await crypto.subtle.decrypt({name:"AES-GCM", iv:oct.slice(0,12)}, k, oct.slice(12));
  return new Uint8Array(p);
}

/* Vingt caractères sans I, O, 0 ni 1 : on le recopie à la main, souvent au
   crayon, et il ne faut pas qu'on puisse confondre deux signes. Deux cent
   quarante-huit, c'est bien au-delà de ce qui se devine. */
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function codeNeuf(){
  const a=alea(20); let t="";
  for(let i=0;i<20;i++){ t+=ALPHA.charAt(a[i]%32); if(i%4===3 && i<19) t+="-"; }
  return t;
}
function codeNu(c){
  return String(c||"").toUpperCase().split("").filter(function(x){ return ALPHA.indexOf(x)!==-1; }).join("");
}

function syUrl(){ return String(SY.url||"").replace(/\/+$/,""); }
async function syFetch(chemin, opt){
  opt=opt||{};

  if(opt.jeton!==false && SY.jwt) h["Authorization"]="Bearer "+SY.jwt;
  const r=await fetch(syUrl()+chemin, {method:opt.method||"GET", headers:h,
    body:opt.body?JSON.stringify(opt.body):undefined, cache:"no-store"});

  if(t){ try{ j=JSON.parse(t); }catch(e){ j=null; } }
  if(!r.ok){ const e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status)); e.code=r.status; e.corps=j; throw e; }
  return j;
