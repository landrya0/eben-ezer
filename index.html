async function syPieces(){
  if(!SY.actif || pjEnCours || !SY.dk || !navigator.onLine) return;
  pjEnCours=true;
  let venu=false;
  try{
    const pieces=medTout();
    for(let i=0;i<pieces.length;i++){
      const m=pieces[i];
      if(!MED_VOYAGE[m.genre]) continue;
      const ici=await medPrend(m.id);
      if(ici){
        if(PJ.haut[m.id]) continue;
        await syJeton();
        const oct=await chiffreOctets(await ici.arrayBuffer(), deb64(SY.dk));
        await syOctets(pjChemin(m.id), {method:"POST", body:oct,
          headers:{"Content-Type":"application/octet-stream", "x-upsert":"true"}});
        PJ.haut[m.id]=1; pjSave();
      } else {
        /* Une pièce qu'on ne trouve pas là-haut n'y est peut-être pas encore :
           l'autre appareil a posé sa fiche avant son fichier. On réessaie,
           mais pas toutes les quinze secondes. */
        if(PJ.abs[m.id] && Date.now()-PJ.abs[m.id] < 1800000) continue;
        await syJeton();
        let oct;
        try{ oct=await syOctets(pjChemin(m.id), {lire:true}); }
        catch(e){ if(e.code===400 || e.code===404){ PJ.abs[m.id]=Date.now(); pjSave(); continue; } throw e; }
        const clair=await dechiffreOctets(oct, deb64(SY.dk));
        await medPose(m.id, new Blob([clair], {type:m.mime||""}));
        delete PJ.abs[m.id]; PJ.haut[m.id]=1; pjSave();
        venu=true;
      }
    }
  }catch(e){}
  pjEnCours=false;
  /* Ce qui vient d'arriver doit se voir sans qu'on ait à revenir sur l'écran. */
  if(venu) medRend();
}

/* Un jalon est une chaîne, jamais une heure : comparer les horloges de deux
   appareils, c'est se tromper le jour où l'une retarde. On ne teste que
   l'égalité — « est-ce bien la version que j'ai vue la dernière fois ? ». */
function jalonNeuf(){ return Date.now().toString(36)+"-"+DEV+"-"+Math.random().toString(36).slice(2,7); }

async function syLit(entier){
  const champs = entier ? "jalon,doc" : "jalon";
  const a=await syFetch("/rest/v1/etat?uid=eq."+encodeURIComponent(SY.uid)+"&select="+champs);
  return (a && a.length) ? a[0] : null;
}
/* Les deux enveloppes sont réémises à chaque envoi. Elles ne changent qu'à
   une récupération — qui pousse aussitôt et change le jalon, donc l'autre
   appareil relira l'archive entière avant de poser la sienne. */
async function syEcrit(doc){
  const j=jalonNeuf();
  const corps=JSON.stringify({v:2, mdp:SY.envM, rec:SY.envR,
    doc:await chiffreDoc(doc, deb64(SY.dk))});
  await syFetch("/rest/v1/etat", {method:"POST",
    headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
    body:{uid:SY.uid, doc:corps, jalon:j, maj:new Date().toISOString()}});
  return j;
}

/* Reprendre une archive déjà déposée : on l'ouvre, on la réunit avec ce que
   cet appareil tient déjà, et on repose le tout. */
async function syRejoint(r, envM){
  const env=JSON.parse(r.doc);
  const autre=sane(await dechiffreDoc(env.doc, deb64(SY.dk)));
  SY.envM = envM || env.mdp; SY.envR = env.rec;
  db = (db.nodes.length || (db.temps||[]).length) ? fusionne(db, autre) : autre;
  save(true);
  SY.actif=true; SY.vu=await syEcrit(db); SY.base=db.maj||0; SY.fait=Date.now(); sySave();
  S.syEtape=0; S.syMdp=""; S.pile=[]; S.view="reglages";
  toast("Synchronisation en route."); render();
}

/* Les pièces passent après le document, jamais avant : c'est la fiche qui
   dit quelles pièces chercher, et une pièce sans sa fiche ne sert à rien. */
let sySuite=null, syEnCours=false;
function syPlusTard(){
  if(!SY.actif) return;
  clearTimeout(sySuite);
  sySuite=setTimeout(function(){ syMaintenant(); }, 15000);
}
/* Le cœur. Quatre cas, et un seul qui demande du travail : les deux côtés ont
   bougé — alors on réunit, on garde le résultat ici, et on le repose là-bas.
   Jamais d'écrasement : un appareil vidé par le téléphone n'a plus de pierres
   tombales, donc la fusion lui rend tout. */
async function syMaintenant(manuel){
  if(!SY.actif || syEnCours) return false;
  if(!navigator.onLine){ if(manuel) toast("Pas de réseau"); return false; }
  syEnCours=true; SY.err="";
  try{
    await syJeton();
    const r=await syLit(false);
    const distantBouge = !r || r.jalon!==SY.vu;
    const localBouge   = (db.maj||0) > (SY.base||0);
    if(!r){
      SY.vu=await syEcrit(db); SY.base=db.maj||0;
    } else if(!distantBouge && !localBouge){
      /* rien à faire */
    } else if(!distantBouge){
      SY.vu=await syEcrit(db); SY.base=db.maj||0;
    } else {
      const plein=await syLit(true);
      const env=JSON.parse(plein.doc);
      SY.envM=env.mdp; SY.envR=env.rec;
      const autre=sane(await dechiffreDoc(env.doc, deb64(SY.dk)));
      if(!localBouge){
        db=autre; save(true); SY.vu=plein.jalon; SY.base=db.maj||0;
      } else {
        db=fusionne(db, autre);
        save(true);
        SY.vu=await syEcrit(db); SY.base=db.maj||0;
      }
      render();
    }
    SY.fait=Date.now(); sySave();
    if(manuel) toast("À jour.");
    /* Le texte d'abord, les pièces ensuite, et sans faire attendre : une
       photo qui monte ne doit pas retarder le mot qu'on vient d'écrire. */
    syPieces();
    return true;
  }catch(e){
    SY.err=String(e&&e.message||e); sySave();
    if(manuel) toast(syDit(e));
    return false;
  }finally{ syEnCours=false; }
}
function syDit(e){
  const m=String(e&&e.message||e);
  if(/OperationError|operation-specific/i.test(m)) return "Ce secret n'ouvre pas cette archive";
  if(/format inconnu/i.test(m)) return "Archive d'une version plus récente";
  if(/relation .* does not exist|42P01/i.test(m)) return "La table « etat » manque encore";
  if(/not confirmed/i.test(m)) return "Décoche « Confirm email » dans Supabase";
  if(/already registered/i.test(m)) return "Ce compte existe : mot de passe incorrect";
  if(/Invalid login|invalid_grant/i.test(m)) return "Adresse ou mot de passe incorrect";
  if(/Password should be|at least/i.test(m)) return "Mot de passe trop court";
  if(/JWT|token|401/i.test(m)) return "Connexion expirée — reconnecte-toi";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Serveur injoignable";
  return m.slice(0,70);
}

/* ---------- fusionner deux appareils ---------- */
/* Le téléphone et la tablette tiennent chacun l'archive entière. À la
   rencontre, on ne choisit pas un gagnant — on réunit. Chaque fiche porte son
   identifiant et l'heure de sa dernière écriture : présente d'un seul côté
   elle est reprise, présente des deux c'est la plus récemment écrite qui
   reste, et ce qui a été supprimé le demeure grâce aux pierres tombales.
   L'opération donne le même résultat des deux côtés : les deux appareils
   convergent sans se parler davantage. */
function recent(a,b){ return ((a&&a.maj)||0) >= ((b&&b.maj)||0) ? a : b; }
function fusionListe(A, B, morts){
  const m={};
  (A||[]).forEach(function(x){ if(x&&x.id) m[x.id]=x; });
  (B||[]).forEach(function(x){ if(!x||!x.id) return; m[x.id] = m[x.id] ? recent(m[x.id],x) : x; });
  return Object.keys(m).filter(function(id){
    const t=morts[id];
    return !(t && t >= (m[id].maj||0));
  }).map(function(id){ return m[id]; });
}

const SANSFIN = 8640000000000;
function finDe(b){ return (typeof b.fin==="number") ? b.fin : SANSFIN; }
/* Deux appareils qui comptaient chacun de leur côté se chevauchent forcément :
   le téléphone croit que je travaille encore pendant que la tablette compte
   la même lecture. Compter les deux doublerait l'heure et fausserait toutes
   les parts. On rejoue donc les blocs dans l'ordre où ils ont été déclarés, et
   le plus récemment dit découpe ce qui était là avant — la dernière parole sur
   un instant est celle qui vaut. Le même découpage sert quand on corrige les
   heures à la main.
   Mais il ne vaut que pour une même activité. Tant qu'une seule chose pouvait
   tourner, tout chevauchement était une contradiction à trancher ; depuis
   qu'on peut en mener plusieurs de front (13.by), deux activités différentes
   qui se recouvrent ne se contredisent pas — elles disent qu'on faisait les
   deux. Les découper ici effacerait en silence ce qu'on vient de déclarer :
   on prie en se lavant, on corrige une heure, et la prière est rognée. Seule
   une activité se découpe donc elle-même (13.bz). */
/* Le temps couvert par une liste de blocs — l'union, jamais la somme. Il
   sert de garde-fou : aucune fusion n'a le droit de le faire diminuer. */
function couvert(liste){
  const sp=(liste||[]).map(function(b){ return [b.deb, finDe(b)]; })
    .filter(function(s){ return s[1]>s[0]; })
    .sort(function(a,b){ return a[0]-b[0]; });
  let t=0, d=null, f=0;
  sp.forEach(function(s){
    if(d===null){ d=s[0]; f=s[1]; return; }
    if(s[0]<=f){ if(s[1]>f) f=s[1]; return; }
    t+=f-d; d=s[0]; f=s[1];
  });
  return d===null ? 0 : t+(f-d);
}
/* Deux blocs de la même activité qui se recouvrent, c'est une seule présence
   dite deux fois : on les RÉUNIT.
   On faisait l'inverse, et c'était une machine à effacer. Le dernier bloc
   touché mordait sur les anciens de la même activité, et ce qui se trouvait
   entièrement sous sa dent disparaissait. Tant qu'il n'y avait qu'une file,
   mordre se défendait : dire « je priais à 9 h » revenait à dire « je ne
   faisais rien d'autre ». Mais un bloc EN COURS n'a pas de fin — pour le
   calcul, il va jusqu'à la fin des temps. Il mordait donc sur TOUT ce qui le
   suivait dans la même activité. Rouvrir la prière de 7 h effaçait celle de
   9 h ; reculer le début de ce qui tourne effaçait la séance du matin. Et
   « Garder » appelait cette fusion puis posait une pierre tombale sur ce
   qu'elle avait fait tomber : même la synchronisation ne pouvait plus le
   ramener.
   Une réunion ne perd jamais une minute ; une morsure en perd toujours. Un
   bloc ne se raccourcit donc plus que par la main du disciple, sur ses
   propres bornes, à lui seul (13.cf). */
function fusionTemps(liste){
  const ligne=(liste||[]).filter(function(b){ return finDe(b)>b.deb; })
    .map(function(b){ return Object.assign({}, b); })
    .sort(function(a,b){ return (a.deb-b.deb) || (finDe(a)-finDe(b)); });
  const out=[], der={};
  ligne.forEach(function(b){
    const p=der[b.t];
    /* Collés ou recouverts, deux morceaux de la même activité n'en font
       qu'un : la journée ne se lit pas en confettis, et rien ne tombe. */
    if(p && finDe(p)>=b.deb){
      if(finDe(b)>finDe(p)){
        if(typeof b.fin==="number") p.fin=b.fin; else delete p.fin;
      }
      p.maj=Math.max(p.maj||0, b.maj||0);
      if(b.porte) p.porte=1;
      /* Réunir deux morceaux ne doit rien effacer de ce qu'on y a écrit :
         une note et des chapitres tiennent à ce qui a été vécu, pas à
         l'heure qui le porte. */
      const a=(p.note||"").trim(), c=(b.note||"").trim();
      if(c && c!==a) p.note = a ? (a+"\n"+c) : c;
      if(b.lu && b.lu.length) p.lu=(p.lu||[]).concat(b.lu);
      return;
    }
    out.push(b); der[b.t]=b;
  });
  /* Si jamais une règle future se remettait à rogner, on rend la liste telle
     quelle : garder deux fois la même minute se corrige d'une tape, une
     minute perdue ne revient pas. */
  if(couvert(out) < couvert(liste)) return (liste||[]).slice();
  return out;
}

function fusionne(A, B){
  const morts={};
  [A.morts||{}, B.morts||{}].forEach(function(m){
    Object.keys(m).forEach(function(k){ morts[k]=Math.max(morts[k]||0, m[k]||0); });
  });
  const d={
    nodes: fusionListe(A.nodes,  B.nodes,  morts),
    gens:  fusionListe(A.gens,   B.gens,   morts),
    noms:  fusionListe(A.noms,   B.noms,   morts),
    mans:  fusionListe(A.mans,   B.mans,   morts),
    cats:  fusionListe(A.cats,   B.cats,   morts),
    livres:fusionListe(A.livres, B.livres, morts),
    auteurs:fusionListe(A.auteurs, B.auteurs, morts),
    taches:fusionListe(A.taches, B.taches, morts),
    temps: fusionTemps(fusionListe(A.temps, B.temps, morts)),
    morts: morts,
    exp: Math.max(A.exp||0, B.exp||0),
    seq: Math.max(A.seq||1, B.seq||1),
    maj: Math.max(A.maj||0, B.maj||0)
  };
  /* Un lien vers un acte supprimé ailleurs ne mène nulle part ; un bloc dont
     l'activité a disparu n'a plus de part où se ranger. */
  const vivants={}; d.nodes.forEach(function(n){ vivants[n.id]=1; });
  d.nodes.forEach(function(n){ if(n.par) n.par=n.par.filter(function(p){ return vivants[p]; }); });
  d.noms.forEach(function(nm){ if(nm.nodes) nm.nodes=nm.nodes.filter(function(p){ return vivants[p]; }); });
  const ta={}; d.taches.forEach(function(t){ ta[t.id]=1; });
  d.temps=d.temps.filter(function(b){ return ta[b.t]; });
  /* Une pierre tombale ne sert que le temps que les deux appareils se
     rencontrent. Passé six mois, ils se sont parlé — ou l'autre n'existe plus. */
  const vieux=Date.now()-180*86400000;
  Object.keys(d.morts).forEach(function(k){ if(d.morts[k]<vieux) delete d.morts[k]; });
  return sane(d);
}

/* ---------- pointer : à quoi je suis ---------- */
/* Un seul écran pour deux usages, parce que c'est la même question : à quoi
   suis-je maintenant, et à quoi étais-je tout à l'heure. */
function vPointer(){
  const corr = S.blocId ? blocT(S.blocId) : null;
  const trou = (!corr && S.trou) ? S.trou : null;
  Z.titre = (corr||trou) ? "C'était quoi ?" : "À quoi maintenant ?";
  Z.retour = true;
  const o = ouvert(), ouv = ouverts(), q = (S.tQ||"").trim(), cats = CATS();
  const enCours = {};
  ouv.forEach(function(b){ enCours[b.t]=1; });
  let h = "";
  if(corr) h += `<div class="block amorce" style="margin-top:16px"><b>${esc(tacheNom(corr.t))}</b>, de ${hmin(new Date(corr.deb))} à ${corr.fin?hmin(new Date(corr.fin)):"maintenant"}.</div>`;
  else if(trou && trou.vif) h += `<div class="block amorce" style="margin-top:16px">Depuis ${hmin(new Date(trou.deb))}, rien n'est compté — ${hm(Date.now()-trou.deb)}. Dis à quoi tout ce temps est allé : le compte reprendra là, sans trou.</div>`;
  else if(trou) h += `<div class="block amorce" style="margin-top:16px">De ${hmin(new Date(trou.deb))} à ${hmin(new Date(trou.fin))} — ${hm(trou.fin-trou.deb)} — rien n'a été compté. Dis à quoi c'est allé.</div>`;
  else if(o) h += `<div class="block amorce" style="margin-top:16px">Depuis ${hmin(new Date(o.deb))}, le temps va à <b>${esc(tacheNom(o.t))}</b> — ${hm(Date.now()-o.deb)}.${
      ouv.length>1 ? " En même temps : "+ouv.filter(function(b){ return b!==o; }).map(function(b){ return "<b>"+esc(tacheNom(b.t))+"</b>"; }).join(", ")+"." : ""}</div>`;
  else h += `<div class="block amorce" style="margin-top:16px">Rien n'est compté. À partir de ce que tu touches ici, le temps aura un destinataire.</div>`;
  /* S'arrêter n'était possible qu'au fond d'un menu, sur un bloc, depuis
     « Mon temps » : trois gestes pour dire qu'on ne fait plus rien. Or on
     s'arrête souvent, et sans savoir ce qui vient après. L'arrêt est donc
     ici, en clair, juste sous ce qui tourne. Il ne range rien ailleurs : le
     temps écoulé reste à l'activité qu'il a servie, et ce qui suit n'est
     compté à personne — parce qu'il n'a servi personne. */
  /* Quand plusieurs choses tournent, le seul arrêt visible les arrêtait
     toutes : on finissait de se laver et la prière s'arrêtait avec. Arrêter
     une activité seule existait — toucher sa ligne cochée, tout en bas, dans
     sa catégorie — mais rien ne le disait, et un geste qu'il faut devinier
     n'existe pas. Ce qui tourne se lit donc ici, nommé, chacun avec son
     heure et son arrêt à soi. Tout arrêter reste dessous, pour ce qu'il est :
     un geste de plus, pas le geste par défaut. */
  if(o && !corr && !trou){
    if(ouv.length>1){
      h += titreBloc("Ce qui tourne");
      h += liste(ouv.slice().sort(function(a,b){ return a.deb-b.deb; }).map(function(b){
        return ligne({titre:esc(tacheNom(b.t))+(b.porte?` <span class="pte">porte l'heure</span>`:""),
          sous:"depuis "+hmin(new Date(b.deb))+" — toucher pour arrêter ça seulement",
          apres:esc(hm(Date.now()-b.deb)), attr:'data-stop="'+b.id+'"'});
      }).join(""));
    }
    h += liste(ligne({titre:ouv.length>1 ? "Tout arrêter" : "Arrêter de compter",
      sous:"Le temps déjà passé reste à "+(ouv.length>1 ? "ce qui l'a reçu" : "« "+esc(tacheNom(o.t))+" »"),
      attr:'data-act="arretNet"'}), "lien");
  }
  /* Un seul geste nouveau pour tout le parallèle : un interrupteur à deux
     positions, qui dit ce que la prochaine tape veut dire. « À la place »
     par défaut — l'app se comporte comme avant tant qu'on n'y touche pas.
     Il n'apparaît que si quelque chose tourne : sans cela, « en plus » de
     rien ne veut rien dire. */
  if(o && !corr && !trou)
    h += `<div class="puces" style="padding-top:2px">`
      + `<button class="puce" data-plus="0" aria-pressed="${!S.enPlus}">À la place</button>`
      + `<button class="puce" data-plus="1" aria-pressed="${!!S.enPlus}">En plus</button></div>`
      + `<div class="block amorce">${S.enPlus
          ? "La prochaine activité démarrera sans arrêter les autres."
          : "La prochaine activité arrêtera ce qui tourne."}</div>`;

  h += liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
      <input type="text" id="tQ" placeholder="Chercher, ou nommer autre chose" value="${esc(S.tQ||"")}" autocomplete="off" autocapitalize="sentences"></div></div></li>`);

  const dejaLa = (db.taches||[]).some(t=>t.nom.toLowerCase()===q.toLowerCase());
  h += `<div id="tNeuf"${(!q || dejaLa)?" hidden":""}>
      ${titreBloc("Nouvelle activité")}
      <div class="block amorce">Dans quoi la ranger ? C'est ce rangement, et lui seul, qui fera les parts.</div>
      <div class="puces">${cats.map(c=>`<button class="puce" data-tcat="${c.id}" aria-pressed="${S.tCat===c.id}">${esc(c.nom)}</button>`).join("")}</div>
      ${liste(ligne({titre:`<span class="qn">Compter « ${esc(cap(q))} »</span>`, attr:'data-act="neufTache"'}), "lien")}
    </div>`;

  if(!(db.taches||[]).length){
    h += titreBloc("Pour commencer");
    h += `<div class="block amorce">Touche-en une : elle est créée, rangée, et comptée dès cet instant. Tu en ajouteras autant que tu veux, et tu pourras les ranger autrement.</div>`;
    cats.forEach(function(c){
      const arr = TACHES_SOCLE.filter(x=>x[1]===c.id);
      if(!arr.length) return;
      h += `<div class="tgrp">${titreBloc(esc(c.nom))}${liste(arr.map(x=>ligne({titre:esc(x[0]),
        attr:'data-sugg="'+esc(x[0])+'" data-cat="'+c.id+'" data-nom="'+esc(x[0].toLowerCase())+'"'})).join(""))}</div>`;
    });
  } else {
    /* Ce qu'on fait souvent remonte de soi-même : la liste s'ordonne sur la
       vie, pas sur l'alphabet. */
    const freq = cumul(minuit(29), Date.now()).par;
    cats.forEach(function(c){
      const arr = (db.taches||[]).filter(t=>(t.cat||"reste")===c.id)
        .sort((a,b)=>(freq[b.id]||0)-(freq[a.id]||0) || a.nom.localeCompare(b.nom,"fr"));
      if(!arr.length) return;
      h += `<div class="tgrp">${titreBloc(esc(c.nom))}${liste(arr.map(t=>ligne({titre:esc(t.nom),
        apres:(enCours[t.id] && !corr && !trou) ? `<span class="coche">✓</span>` : (freq[t.id] ? esc(hm(freq[t.id])) : ""),
        attr:'data-tache="'+t.id+'" data-nom="'+esc(t.nom.toLowerCase())+'"'})).join(""))}</div>`;
    });
  }
  if(!corr && !trou) h += liste(ligne({titre:"Mon temps", attr:'data-go="temps"'}), "lien");
  Z.html = h;
}

/* Un creux, c'est un moment où rien ne tournait : il se lit sur l'union des
   périodes, jamais sur la suite des blocs (13.by). Le même calcul sert à la
   liste, à la frise et à la porte qui mène au dernier creux — un vide ne doit
   pas être compté de trois façons.
   Une minute, et non dix. Le récap tient pour non compté tout ce qui dépasse
   la minute ; la liste n'en montrait qu'au-delà de dix. L'app accusait donc
   trois minutes sans offrir de les dire. Deux seuils sur un même écran, c'est
   un reproche sans porte : il n'en reste qu'un (13.cb). */
const SEUIL_CREUX = 60000;
function creuxDe(t0, t1, seuil){
  const n=Date.now(), fus=[];
  (db.temps||[]).map(function(b){ return [Math.max(b.deb,t0), Math.min(b.fin||n, t1)]; })
    .filter(function(sp){ return sp[1]>sp[0]; })
    .sort(function(p,q){ return p[0]-q[0]; })
    .forEach(function(sp){
      const d=fus[fus.length-1];
      if(d && sp[0]<=d[1]){ if(sp[1]>d[1]) d[1]=sp[1]; }
      else fus.push([sp[0], sp[1]]);
    });
  const out=[];
  for(let i=0;i<fus.length-1;i++)
    if(fus[i+1][0]-fus[i][1] >= seuil) out.push([fus[i][1], fus[i+1][0]]);
  const der=fus.length ? fus[fus.length-1][1] : 0;
  const haut=Math.min(n, t1);
  if(der && haut-der >= seuil) out.push([der, haut]);
  return out;
}
/* Cinq teintes sourdes, au même registre que le papier : elles ne décorent
   rien, elles distinguent — sans elles, deux barres côte à côte ne disent pas
   si l'on servait Dieu ou soi-même. Une catégorie ajoutée à la main prend le
   gris du reste : mieux vaut une teinte honnête qu'une couleur inventée. */
const CCOUL = {dieu:"--c-dieu", famille:"--c-famille", travail:"--c-travail",
               moi:"--c-moi", reste:"--c-reste"};
function coulCat(id){ return "var("+(CCOUL[id]||"--c-reste")+")"; }
const PASX = [0.7, 1.6, 3.2];
/* ---------- la frise : la journée vue de haut ---------- */
/* Une liste dit la suite ; elle ne dit pas l'épaisseur. Depuis qu'on mène
   plusieurs choses de front, la question « qu'est-ce qui tournait pendant
   quoi » ne se lit plus en ligne : il faut de la largeur. Le temps descend,
   les activités se rangent en colonnes, et chacune occupe exactement ce
   qu'elle a duré — une heure, un centimètre, la même échelle d'un bout à
   l'autre, sans quoi la frise mentirait pour faire joli.
   La journée seulement : à sept jours, la même échelle ferait dix mille
   pixels, et une frise qu'on ne peut pas embrasser n'est plus une frise. */
function vFrise(){
  const n=Date.now(), f=fenetre(), t1=Math.min(n, f.t1);
  Z.titre=f.ici ? "La journée" : cap(f.court); Z.retour=true;
  const bs=(db.temps||[]).filter(function(b){ return (b.fin||n)>f.t0 && b.deb<t1; })
    .slice().sort(function(a,b){ return a.deb-b.deb; });
  if(!bs.length){ Z.html=`<p class="vide">Rien de compté ${f.nom}.</p>`; return; }
  const t0=Math.max(f.t0, bs[0].deb);
  /* La largeur ne se partage qu'entre ce qui se recouvre vraiment. Une
     seule colonne pour toute la journée gaspillait la moitié de l'écran :
     deux activités se croisaient dix minutes, et les douze heures qui
     suivaient restaient à demi vides. On découpe donc la journée en
     grappes — des suites de blocs qui se touchent de proche en proche — et
     chaque grappe partage la largeur entre ses seules colonnes. Seule, une
     activité prend toute la page ; et un bloc s'étend sur les colonnes
     libres à sa droite tant que rien ne s'y oppose. */
  const pose=bs.map(function(b){
    return {b:b, d:Math.max(b.deb, t0), f:Math.min(finDe(b), t1), l:0, sp:1, n:1};
  });
  /* Une échelle unique ne peut pas servir une journée faite d'un bloc de six
     heures et de huit blocs de sept minutes : à l'échelle du long, les courts
     deviennent des traits sans nom ; à l'échelle des courts, la journée fait
     quatre écrans. On ne triche donc pas sur l'échelle — elle reste la même
     du haut en bas — mais on la laisse se régler, et le réglage par défaut
     est celui qui rend lisible le plus court des blocs sans que la journée
     dépasse ce qu'un pouce parcourt (13.cc). */
  const mins=Math.max(1, (t1-t0)/60000);
  const court=Math.min.apply(null, pose.map(function(x){ return Math.max(1, (x.f-x.d)/60000); }));
  let iz=S.frisZ;
  if(iz===null || iz===undefined){
    iz=0;
    for(let k=0;k<PASX.length;k++){
      if(mins*PASX[k]<=2400) iz=k;
      if(court*PASX[k]>=14 && mins*PASX[k]<=2400){ iz=k; break; }
    }
  }
  const PX=PASX[iz], H=Math.max(180, Math.round(mins*PX));
  const y=function(t){ return Math.round((Math.max(t0, Math.min(t1, t))-t0)/60000*PX); };

  const grappes=[];
  let gr=null;
  pose.forEach(function(x){
    if(!gr || x.d>=gr.fin){ gr={items:[], fin:x.f}; grappes.push(gr); }
    gr.items.push(x); if(x.f>gr.fin) gr.fin=x.f;
  });
  grappes.forEach(function(g){
    const fins=[];
    g.items.forEach(function(x){
      let i=0; while(i<fins.length && fins[i]>x.d) i++;
      if(i===fins.length) fins.push(x.f); else fins[i]=Math.max(fins[i], x.f);
      x.l=i;
    });
    const nc=Math.max(1, fins.length);
    g.items.forEach(function(x){
      x.n=nc;
      let e=x.l+1;
      while(e<nc && !g.items.some(function(o){ return o!==x && o.l===e && o.d<x.f && o.f>x.d; })) e++;
      x.sp=e-x.l;
    });
  });

  /* Une activité ne porte pas l'heure tout du long : elle la porte par
     morceaux, selon ce qui tournait à côté d'elle à chaque instant. Dire
     « pleine » ou « creuse » la barre entière aurait menti sur ses bords.
     Le trait de gauche marque donc exactement les moments portés — c'est la
     règle des parts (13.by) rendue visible, et non une seconde règle. */
  const marques={};
  pose.forEach(function(x){ marques[x.d]=1; marques[x.f]=1; });
  const ts=Object.keys(marques).map(Number).sort(function(p,q){ return p-q; });
  const port={};
  for(let i=0;i<ts.length-1;i++){
    const a=ts[i], z=ts[i+1];
    const act=pose.filter(function(x){ return x.d<=a && x.f>=z; });
    if(!act.length) continue;
    const c=chef(act.map(function(x){ return x.b; }));
    if(!c) continue;
    const arr=port[c.id]||(port[c.id]=[]);
    const d=arr[arr.length-1];
    if(d && d[1]===a) d[1]=z; else arr.push([a, z]);
  }

  let h=`<div class="puces" style="padding-top:15px">${PASX.map(function(v,k){
      return `<button class="puce" data-friz="${k}" aria-pressed="${k===iz}">${["Serré","Normal","Large"][k]}</button>`;
    }).join("")}</div>`;
  h+=`<div class="block amorce">L'échelle est la même du haut en bas ; la couleur dit la catégorie. Le trait plein, à gauche, marque les moments où cette activité <b>portait l'heure</b> — le reste tournait à côté. Touche une barre pour la corriger, un tireté pour dire ce que c'était.</div>`;
  h+=`<div class="frisew"><div class="frise" style="height:${H}px">`;
  const h0=new Date(t0); h0.setMinutes(0,0,0);
  for(let t=h0.getTime(); t<=t1; t+=3600000){
    if(t<t0) continue;
    h+=`<div class="fh" style="top:${y(t)}px"><span>${new Date(t).getHours()} h</span></div>`;
  }
  creuxDe(f.t0, t1, SEUIL_CREUX).forEach(function(v){
    if(v[1]<=t0) return;
    const a=y(v[0]), z=y(v[1]), e=Math.max(2, z-a);
    h+=`<div class="ftrou" style="top:${a}px;height:${e}px" data-creux="${v[0]}|${v[1]}">${
      e>=18 ? `<span>Rien de compté — ${esc(hm(v[1]-v[0]))}</span>` : ""}</div>`;
  });
  /* Un bloc court ne peut pas porter deux lignes : les lui imposer faisait
     déborder son texte sur le suivant. Il dit alors son nom et sa durée sur
     une ligne ; plus court encore, il ne dit rien et se touche — la liste,
     dessous, le nomme. On ne triche pas sur sa hauteur : elle est son temps. */
  pose.forEach(function(x){
    const a=y(x.d), z=y(x.f), col=coulCat(tacheCat(x.b.t)), e=Math.max(9, z-a);
    const w=100/x.n, nom=esc(tacheNom(x.b.t)), dur=esc(hm((x.b.fin||n)-x.b.deb));
    const sp=(port[x.b.id]||[]).map(function(v){
      const sa=Math.max(0, Math.min(e-2, y(v[0])-a));
      return `<span class="fp" style="top:${sa}px;height:${Math.max(3, Math.min(e-sa, y(v[1])-y(v[0])))}px;background:${col}"></span>`;
    }).join("");
    const cl = e<13 ? " mini" : (e<30 ? " court" : "");
    const corps = e<13 ? "" : (e<30 ? `<b>${nom}<em>${dur}</em></b>`
                                    : `<b>${nom}</b><i>${dur}</i>`);
    h+=`<div class="fb${cl}" data-bloc="${x.b.id}" style="top:${a}px;height:${e}px;left:${x.l*w}%;width:calc(${x.sp*w}% - 4px);border-color:${col};color:${col};background:color-mix(in srgb, ${col} 11%, transparent)">${sp}${corps}</div>`;
  });
  h+=`</div></div>`;
  Z.html=h;
}

/* ---------- mon temps ---------- */
/* Des heures et des parts. Le dénominateur a d'abord été ce qui avait été
   compté, et non la journée : une part sur du temps qu'on n'a jamais réclamé
   paraissait un chiffre inventé. Elle ne l'est plus, depuis qu'on tient pour
   principe que **le temps non comptabilisé n'était pas pour Dieu** (13.bw).
   Ce n'est pas un trou dans la connaissance, c'est une réponse par défaut.
   Le dénominateur est donc le temps entier de la fenêtre, et ce qui n'a pas
   été compté y paraît pour ce qu'il vaut. Sans quoi, celui qui ne pointe que
   sa prière lirait qu'il a donné cent pour cent de sa vie à Dieu — et ce
   serait, au sens strict, une louange empruntée. */
function vMonTemps(){
  Z.titre="Mon temps"; Z.retour=true;
  const f=fenetre(), c=cumul(f.t0, f.t1), v=S.vue||"parts";
  /* L'écran disait tout à la fois — les parts, les seize routines, les
     lectures, activité par activité, puis la journée bloc par bloc — et neuf
     sections d'affilée ne se lisent pas, elles se traversent. Ce sont trois
     questions distinctes, et chacune a sa vue : où est passé le temps, ce que
     chaque routine a reçu, et ce qui s'est passé heure par heure (13.cs).
     La fenêtre, elle, vaut pour les trois : elle reste au-dessus, et sous
     une forme qui dit qu'elle filtre au lieu de choisir (13.cu). */
  /* Les vues sont des onglets, le grain est un filtre : deux ordres de
     choses, donc deux formes. Trois rangs de pastilles identiques les
     donnaient pour équivalents, et on cherchait lequel changeait quoi. */
  let h = `<div class="ongt" role="tablist">${ONG_TEMPS.map(function(o){
      return `<button role="tab" data-vue="${o[0]}" aria-selected="${v===o[0]}">${o[1]}</button>`;
    }).join("")}</div>`;
  h += barreFen(f);
  if(!c.tot){
    h += `<p class="vide">Rien de compté ${f.nom}. Touche le compteur, en bas, et dis à quoi tu es.</p>`;
    Z.html=h; return;
  }
  const ecoule=Math.max(c.tot, f.t1-f.t0);
  const creux=Math.max(0, ecoule-c.tot);
  /* Deux nombres, et c'est le second qui demande une phrase : la somme des
     activités peut dépasser la journée dès que plusieurs tournent ensemble,
     et sans explication ce serait lu comme une faute de calcul. */
  const porte=c.porte>c.tot ? c.porte : 0;
  /* Cette phrase explique les parts — elle n'a donc rien à faire ailleurs :
     la barre de fenêtre dit déjà, sur les trois vues, ce qu'on regarde. */
  if(v==="parts")
  h += `<div class="block amorce"><b>${esc(hm(c.tot))}</b> comptés sur <b>${esc(hm(ecoule))}</b> ${f.nom}. Les parts se lisent sur le temps entier : ce qu'on n'a pas compté, on le tient pour n'ayant pas été pour Lui.${
    porte ? ` Et ces ${esc(hm(c.tot))} ont porté <b>${esc(hm(porte))}</b> d'activités menées de front — <b>×${String(Math.round(porte*10/c.tot)/10).replace(".", ",")}</b>.` : ""}</div>`;

  const parCat=c.parCat;
  if(v==="parts"){
  const vus=CATS().filter(x=>parCat[x.id]).sort((a,b)=>parCat[b.id]-parCat[a.id]);
  h += titreBloc("La part de chacun");
  h += `<div class="tps">`+vus.map(function(x){
    const l=partPc(parCat[x.id], ecoule), w=ecoule ? parCat[x.id]*100/ecoule : 0;
    return `<div class="tl"><span class="tn">${esc(x.nom)}</span>
      <span class="tv"><b>${l} %</b>${esc(hm(parCat[x.id]))}</span>
      <span class="tj"><i style="width:${w}%"></i></span></div>`;
  }).join("")
   /* Une minute d'écart entre deux lectures d'horloge n'est pas un creux :
      sans ce seuil, un jour entièrement compté affichait « Non compté 0 % ». */
   + (creux>=60000 ? `<div class="tl creuse"><span class="tn">Non compté</span>
      <span class="tv"><b>${partPc(creux, ecoule)} %</b>${esc(hm(creux))}</span>
      <span class="tj"><i style="width:${ecoule?creux*100/ecoule:0}%"></i></span></div>` : "")
   + `</div>`;
  /* La bande « Non compté » disait un chiffre sans mener nulle part. Elle a
     maintenant sa porte, juste dessous : on comble du plus récent vers le
     plus ancien, parce que c'est celui qu'on a encore en mémoire. */
  const cx=creuxDe(f.t0, Math.min(f.t1, Date.now()), SEUIL_CREUX);
  if(cx.length)
    h += liste(ligne({titre:"Combler ce qui n'est pas compté",
      sous: cx.length>1 ? cx.length+" plages — on commence par la dernière"
                        : "Une plage de "+esc(hm(cx[0][1]-cx[0][0])),
      attr:'data-act="comblerDer"'}), "lien");
  }

  /* Ici, chaque activité compte tout son temps, et les pourcentages n'ont
     plus leur place : ils ne se rapporteraient à aucun total commun. Les
     parts vivent au-dessus, dans « La part de chacun », et nulle part
     ailleurs — c'est ce qui évite d'avoir deux chiffres qui se contredisent
     sur le même écran. */
  /* Les seize, toutes, dans l'ordre du message — pas seulement celles qui ont
     reçu quelque chose. Un compte rendu qui masquerait les vides ne dirait
     que ce qu'on a déjà fait ; c'est le « — » qui porte la question (13.co).
     Il reste honnête parce qu'il est dit en toutes lettres : ce tiret compte
     le temps, et une routine vécue en actes attend encore son autre face. */
  const pd=parDisc(c.par);
  if(v==="routines" && routineDite()){
    h += titreBloc("Les routines","ecart");
    h += liste(DISC.map(function(x){
      const o={titre:esc(x[1]), apres: pd[x[0]] ? esc(hm(pd[x[0]])) : "—"};
      const m=mesureDisc(x[0], f.t0, f.t1);
      if(m) o.sous=esc(m);
      return ligne(o);
    }).join(""));
    h += `<div class="block amorce">Les seize routines du message de Bertoua : <b>le temps</b>, et ce que chacune compte en propre. Un tiret dit que cette routine n'a rien reçu ${esc(f.nom)}, pas qu'elle n'a pas été vécue — ce qui se vit en actes, une dîme, une âme touchée, un compte-rendu, se comptera à côté.</div>`;
  }

  const pf=pagesFen(f.t0, f.t1);
  if(v==="routines" && (pf.pg || (db.livres||[]).length)){
    h += titreBloc("Mes lectures","ecart");
    h += liste(ligne({titre:"Pages lues",
        sous: pf.p ? "En "+pf.p+" passage"+(pf.p>1?"s":"")+" "+f.nom : "Rien de lu "+f.nom,
        apres:esc(String(pf.pg))})
      + (db.livres||[]).slice()
        .sort(function(x,y){ return (livreFini(x)?1:0)-(livreFini(y)?1:0)
                                 || pageLue(y.id)-pageLue(x.id); })
        .map(function(l){
          const vu=pageLue(l.id), tot=l.pages||0, reste=Math.max(0, tot-vu);
          return ligne({titre:esc(l.nom),
            sous: (l.a?esc(auteurNom(l.a))+" · ":"")
                + (livreFini(l) ? "Fini"
                : (tot ? partPc(Math.min(vu,tot), tot)+" % — il reste "+pagesTxt(reste)
                       : "Nombre de pages inconnu")),
            apres: esc(tot ? vu+" / "+tot : String(vu)),
            attr:'data-lv="'+l.id+'"'});
        }).join(""));
  }

  /* La liste des auteurs vit sous les lectures : c'est là qu'on se demande de
     qui l'on reçoit, et c'est de là qu'on atteint leur fiche. */
  if(v==="routines" && (db.auteurs||[]).length){
    h += titreBloc("Ceux dont tu reçois","ecart");
    h += liste(auteursConnus().map(function(x){
      const r=recuDe(x.id);
      return ligne({titre:esc(x.nom), sous:esc(recuTxt(r)), attr:'data-au="'+x.id+'"'});
    }).join(""));
  }

  const tids=Object.keys(c.par).sort((a,b)=>c.par[b]-c.par[a]);
  if(v==="parts"){
  h += titreBloc("Activité par activité","ecart");
  if(porte) h += `<div class="block amorce">Chacune compte tout son temps. Quand plusieurs sont menées de front, leur somme dépasse la journée — c'est voulu : la journée, elle, est au-dessus.</div>`;
  /* Le rangement d'abord — c'est lui qui fait les parts — et la routine
     derrière, quand elle est déclarée : c'est là qu'on veut voir l'association,
     à côté du temps qu'elle a reçu. */
  h += liste(tids.map(function(tid){
    const dd=discTache(tid);
    return ligne({titre:esc(tacheNom(tid)),
      sous:esc(catNom(tacheCat(tid))) + (dd ? " · "+esc(discNom(dd)) : ""),
      apres:esc(hm(c.par[tid])), attr:'data-tch="'+tid+'"'});
  }).join(""));
  }

  /* Le temps dit la fidélité, pas le chemin. Deux heures dans la Parole
     peuvent être dix chapitres ou un seul relu dix fois : les deux sont
     justes, et aucun des deux ne se déduit de l'autre. On compte donc à
     part — les chapitres lus sur la fenêtre, et le terrain parcouru depuis
     le début, qui lui ne grandit qu'une fois par chapitre. */
  const lf=chapFen(f.t0, f.t1), lt=chapDistincts(null);
  if(v==="routines" && (lf.ch || lt)){
    h += titreBloc("La Parole","ecart");
    h += liste(ligne({titre:"Chapitres lus",
        sous: lf.p ? "En "+lf.p+" passage"+(lf.p>1?"s":"")+" "+f.nom : "Rien de lu "+f.nom,
        apres:esc(String(lf.ch))})
      + ligne({titre:"Depuis le début",
        sous:partPc(lt, BIBLE_CH)+" % de l'Écriture — il reste "+(BIBLE_CH-lt)+" chapitres",
        apres:esc(lt+" / "+BIBLE_CH)}));
  }

  /* Les blocs ne se lisaient qu'aujourd'hui, tant qu'ils ne portaient qu'une
     heure : une heure passée ne se relit pas. Depuis qu'ils portent ce qu'on
     y a vécu, ils se relisent — sur toute la fenêtre choisie, et les plus
     récents d'abord. On en montre soixante : au-delà, ce n'est plus une
     relecture, c'est un registre. */
  const n2=Date.now();
  const bs=(db.temps||[]).filter(b=>(b.fin||n2)>f.t0 && b.deb<f.t1).slice().reverse();
  const lus=bs.slice(0,60);
  if(v==="blocs"){
  /* La frise n'a de sens que sur un jour : c'est la seule fenêtre qu'un
     regard embrasse à la même échelle. */
  if(S.per==="jour")
    h += liste(ligne({titre:"Voir la frise de la journée",
      sous:"Les activités côte à côte, heure par heure", attr:'data-go="frise"'}), "lien");
  h += titreBloc(S.per==="jour" ? "La journée, bloc par bloc" : "Bloc par bloc","ecart");
  h += `<div class="block amorce">Touche un bloc pour corriger ses heures — ou pour dire ce qui s'y est passé.</div>`;
  /* Toute une vie a précédé le compteur, et une nuit de prière ne se rattrape
     pas en touchant un creux : avant le premier bloc d'une fenêtre, on ne
     montre aucun creux, et c'est justement là que la nuit se trouve. Il faut
     donc une porte qui n'attende rien de l'existant — deux heures écrites à
     la main, puis la question habituelle : à quoi ce temps est-il allé. */
  h += liste(ligne({titre:"Ajouter un temps passé",
    sous:"Pour ce qui a eu lieu avant qu'on le compte", attr:'data-act="ajoutTemps"'}), "lien");
  /* Entre deux blocs, il y a parfois un creux : on s'est arrêté, et on n'a
     rien compté pendant ce temps-là. On ne fabrique pas une activité pour
     le remplir — « non comptabilisé » serait une part sur du temps qu'on
     n'a jamais réclamé, et le compteur tournerait toute la nuit sur rien.
     Le creux se montre donc pour ce qu'il est : un vide, nommé, daté, qu'on
     peut venir combler plus tard d'une tape. Tant qu'on ne le comble pas,
     il ne pèse sur aucune part.
     Une minute au moins, le même seuil que la bande « Non compté » du récap :
     deux seuils différents sur un même écran accusaient sans laisser
     répondre (13.cb). Et pas de creux de tête : avant le premier bloc d'une
     fenêtre il y a surtout la nuit, qu'on n'a pas à justifier — elle s'écrit
     à la main, par « Ajouter un temps passé ». */
  /* Un creux, c'est un moment où RIEN ne tournait — donc il se lit sur
     l'union des périodes, jamais sur la suite des blocs. Tant qu'un seul
     bloc courait à la fois, les deux revenaient au même ; depuis qu'on peut
     en mener plusieurs de front (13.by), comparer un bloc au précédent
     invente des trous là où une autre mission tournait encore.
     On fusionne donc les périodes, et ce qui reste entre elles est vide.
     Toute fenêtre finit à l'instant présent : le dernier creux est celui
     qu'on vient d'ouvrir en s'arrêtant. */
  const vides=creuxDe(f.t0, Math.min(n2, f.t1), SEUIL_CREUX);

  /* Blocs et creux se mêlent par l'heure, pas par le rang : un creux peut
     tomber entre deux blocs qui ne se suivent pas dans la liste. */
  const plusVieux = lus.length ? Math.max(lus[lus.length-1].deb, f.t0) : f.t0;
  const items=lus.map(function(b){ return {d:Math.max(b.deb, f.t0), b:b}; })
    .concat(vides.filter(function(v){ return v[0]>=plusVieux; })
                 .map(function(v){ return {d:v[0], v:v}; }))
    .sort(function(p,q){ return q.d-p.d; });
  h += liste(items.map(function(it){
    if(it.v) return ligneCreux(it.v[0], it.v[1]);
    const b=it.b, a=it.d;
    return ligne({titre:esc(tacheNom(b.t))+(b.porte?` <span class="pte">porte l'heure</span>`:""),
      sous:(S.per==="jour"?"":jourBref(a))+hmin(new Date(a))+" → "+(b.fin?hmin(new Date(b.fin)):"maintenant")
        +((b.lu&&b.lu.length)?`<span class="lus">${esc(passagesTxt(b))}</span>`:"")
        +((b.pg&&b.pg.length)?`<span class="lus">${esc(passagesPgTxt(b))}</span>`:"")
        +(b.note?`<span class="medNote">${esc(b.note)}</span>`:""),
      apres:esc(hm((b.fin||n2)-a)), attr:'data-bloc="'+b.id+'"'});
  }).join(""));
  if(bs.length>lus.length) h += `<p class="vide">…et ${bs.length-lus.length} blocs plus anciens.</p>`;
  }
  /* Une vue qui n'a rien à montrer le dit, plutôt que de laisser la page
     s'arrêter sur ses pastilles sans un mot. */
  if(v==="routines" && !routineDite() && !pf.pg && !lf.ch && !lt)
    h += `<p class="vide">Rien à montrer ici tant qu'aucune activité n'a dit de quelle routine elle est la mise en œuvre. Touche-en une dans « Les parts », puis choisis sa routine.</p>`;
  Z.html=h;
}

function ligneCreux(d, f){
  return ligne({titre:`<span class="creux">Rien de compté</span>`,
    sous:(S.per==="jour"?"":jourBref(d))+hmin(new Date(d))+" → "+hmin(new Date(f))+" — dire ce que c'était",
    apres:esc(hm(f-d)), attr:'data-creux="'+d+"|"+f+'"'});
}

/* ---------- corriger un bloc de temps ---------- */
/* On pointe toujours en retard : on prie vingt minutes avant d'y penser, on
   referme l'ordinateur sans le dire. Les deux bornes doivent donc s'écrire à
   la main. Déplacer une borne déplace celle du voisin collé à elle : la
   journée reste sans trou, et c'est tout l'intérêt d'un compte permanent. */
function dtl(ms){
  const d=new Date(ms), p=function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}
/* Les champs d'heure du téléphone comptent en minutes ; l'archive, elle,
   compte à la seconde. Rouvrir l'écran de correction et toucher Garder
   arasait donc les secondes d'une borne qu'on n'avait même pas touchée — et
   un bloc de quelques secondes ne pouvait plus être gardé du tout, sa fin
   retombant sur son début, l'app répondant « la fin doit venir après le
   début » à qui n'avait rien demandé.
   Tant que la minute affichée n'a pas changé, c'est l'heure d'origine qui
   est rendue, secondes comprises : un champ ne corrige que ce qu'on y a
   corrigé. Dès qu'on en change la minute, on parle bien de cette minute-là,
   et elle commence à zéro seconde (13.cj). */
function valHeure(id, origine){
  const e=document.getElementById(id);
  if(!e || !e.value) return null;
  if(typeof origine==="number" && e.value===dtl(origine)) return origine;
  const t=new Date(e.value).getTime();
  return isNaN(t) ? null : t;
}
/* Le voisin n'est plus celui qui précède dans la liste : avec plusieurs
   activités de front, l'ordre des débuts ne dit plus qui touche quoi. Est
   voisin ce qui est collé à cette borne-là, et il peut y en avoir plusieurs
   — tous suivent le mouvement, sinon déplacer une borne ouvrirait un trou
   devant l'une et pas devant l'autre. */
function voisins(b){
  const arr=(db.temps||[]).filter(function(x){ return x.id!==b.id; });
  return {avant:arr.filter(function(x){ return finDe(x)===b.deb; }),
          apres:arr.filter(function(x){ return x.deb===finDe(b); })};
}
function nomVoisins(arr){
  return "<b>"+esc(tacheNom(arr[0].t))+"</b>"
    + (arr.length>1 ? " et "+(arr.length-1)+" autre"+(arr.length>2?"s":"") : "");
}
/* Ce qui est tapé et pas encore gardé doit survivre à un redessin : on le
   relit du champ avant chaque geste qui redessine l'écran. */
function noteBloc(b){
  const e=document.getElementById("bNote");
  if(!b || !e) return;
  const v=e.value.trim();
  if(v) b.note=v; else delete b.note;
}

/* ---------- la Parole : les chapitres traversés ---------- */
/* Deux heures de lecture ne disent pas si l'on a traversé un livre ou relu
   trois versets. Le compte pèse le temps ; il ne dit rien du chemin parcouru
   dans l'Écriture — or c'est le chemin qui se relit : « j'en suis à Jérémie »,
   « j'ai lu les évangiles cette année ». On garde donc, sur le bloc, les
   chapitres lus ; et comme l'Écriture a un nombre de chapitres fini et connu,
   l'app sait où l'on s'est arrêté et propose de reprendre juste après.
   Les chapitres tiennent au bloc, jamais à l'activité : « Lecture de la
   Parole » revient tous les jours, et ce qu'on y lit change chaque fois.
   Soixante-six livres, mille cent quatre-vingt-neuf chapitres — le canon
   protestant, dans les noms de la Segond, ceux qu'on lit à la CMCI. */
const BIBLE = [
  ["Genèse",50],["Exode",40],["Lévitique",27],["Nombres",36],["Deutéronome",34],
  ["Josué",24],["Juges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Rois",22],
  ["2 Rois",25],["1 Chroniques",29],["2 Chroniques",36],["Esdras",10],["Néhémie",13],
  ["Esther",10],["Job",42],["Psaumes",150],["Proverbes",31],["Ecclésiaste",12],
  ["Cantique des cantiques",8],["Ésaïe",66],["Jérémie",52],["Lamentations",5],
  ["Ézéchiel",48],["Daniel",12],["Osée",14],["Joël",3],["Amos",9],["Abdias",1],
  ["Jonas",4],["Michée",7],["Nahum",3],["Habacuc",3],["Sophonie",3],["Aggée",2],
  ["Zacharie",14],["Malachie",4],
  ["Matthieu",28],["Marc",16],["Luc",24],["Jean",21],["Actes",28],["Romains",16],
  ["1 Corinthiens",16],["2 Corinthiens",13],["Galates",6],["Éphésiens",6],
  ["Philippiens",4],["Colossiens",4],["1 Thessaloniciens",5],["2 Thessaloniciens",3],
  ["1 Timothée",6],["2 Timothée",4],["Tite",3],["Philémon",1],["Hébreux",13],
  ["Jacques",5],["1 Pierre",5],["2 Pierre",3],["1 Jean",5],["2 Jean",1],["3 Jean",1],
  ["Jude",1],["Apocalypse",22]
];
const BIBLE_NT = 39, BIBLE_CH = 1189;
function nomLivre(li){ const l=BIBLE[li]; return l ? l[0] : "?"; }
function nbChap(li){ const l=BIBLE[li]; return l ? l[1] : 1; }
function nbLu(r){ return r[2]-r[1]+1; }
function nomPassage(r){
  const n=nomLivre(r[0]);
  return r[1]===r[2] ? n+" "+r[1] : n+" "+r[1]+" à "+r[2];
}
function passagesTxt(b){ return (b.lu||[]).map(nomPassage).join(" · "); }
function chapitresTxt(n){ return n+" chapitre"+(n>1?"s":""); }

/* Une activité ne porte pas toutes les questions : on ne demande pas des
   chapitres à un trajet. Le nom donne un premier avis — « Lecture de la
   Parole » lit la Bible — et l'écran de l'activité tranche quand le nom se
   trompe. Son avis tient : un champ posé à la main vaut mieux qu'une
   devinette qui revient. */
/* ---------- les seize routines ---------- */
/* Le message de Bertoua (2008) nomme seize disciplines à revêtir. Elles ne
   sont pas de cette application : elles lui préexistent, et c'est pourquoi
   on les cite dans leur ordre et sous leurs noms, sans les réécrire.
   On les avait d'abord rangées par mode — ce qui se mesure en durée, ce qui
   se compte en actes, ce qui se tient en posture — et le disciple a tranché :
   « toutes les routines peuvent avoir deux faces, on verra à l'usage. » Il
   avait raison dès son premier exemple : prêcher l'Évangile prend du temps.
   Aucune n'est donc fermée au compteur, et le mode a disparu (13.co). */
const DISC = [
  ["disciple","Devenir et être disciple de Jésus-Christ"],
  ["priere","La prière seul"],
  ["rdqd","Rencontres quotidiennes avec Dieu"],
  ["parole","Lecture de la Bible"],
  ["litt","Lecture de littérature chrétienne"],
  ["retraite","Retraites pour le progrès spirituel"],
  ["ensemble","Prière avec les autres"],
  ["donner","Donner à Dieu"],
  ["jeune","Le jeûne"],
  ["ames","La conquête des âmes"],
  ["former","Faire des disciples"],
  ["cr","Le compte-rendu"],
  ["eglise","Être membre fidèle d'une église locale"],
  ["servir","Servir selon son appel"],
  ["volonte","Vivre dans la volonté de Dieu en tout"],
  ["gloire","Tout faire pour la gloire de Jésus-Christ"]
];
/* Le temps n'est pas la seule mesure d'une routine : la Bible se compte
   aussi en chapitres, la littérature en pages, et demain un jeûne se comptera
   en jours. Chaque routine rend donc ce qu'elle compte en propre, en plus de
   ses heures (13.cp).
   On ne prend que les blocs dont l'activité porte cette routine-là : sans
   quoi deux routines se voleraient leurs nombres le jour où une autre
   activité se met à lire des pages. */
function mesureDisc(id, t0, t1){
  let n=0;
  (db.temps||[]).forEach(function(b){
    if(b.deb<t0 || b.deb>=t1 || discTache(b.t)!==id) return;
    if(id==="parole") (b.lu||[]).forEach(function(r){ n+=nbLu(r); });
    else if(id==="litt") (b.pg||[]).forEach(function(r){ n+=r[2]-r[1]+1; });
  });
  if(!n) return "";
  if(id==="parole") return chapitresTxt(n);
  if(id==="litt") return pagesTxt(n);
  return "";
}
/* Une activité déclare-t-elle une routine ? C'est ce qui ouvre le compte
   rendu : sans cela, seize lignes vides n'apprendraient rien. */
function routineDite(){
  return (db.taches||[]).some(function(t){ return !!discTache(t.id); });
}
function disc(id){ return DISC.filter(function(x){ return x[0]===id; })[0]; }
function discNom(id){ const d=disc(id); return d ? d[1] : ""; }
/* Le nom donne un premier avis — « Nuit de prière Paris » n'est pas la
   prière seul — et l'écran tranche quand le nom se trompe : son avis tient,
   comme pour le type (13.ce). */
function discDeNom(nom){
  const v=String(nom||"");
  if(/bible|parole|écriture|ecriture/i.test(v)) return "parole";
  if(/littérature|litterature/i.test(v)) return "litt";
  if(/retraite/i.test(v)) return "retraite";
  if(/je[uû]ne/i.test(v)) return "jeune";
  if(/rdqd|rencontre/i.test(v)) return "rdqd";
  if(/pri[eè]re|prier/i.test(v))
    return /avec|nuit|culte|r[eé]union|assembl[eé]e|ensemble|groupe/i.test(v) ? "ensemble" : "priere";
  if(/d[iî]me|offrande|donner/i.test(v)) return "donner";
  if(/[âa]me|[eé]vang[eé]lis/i.test(v)) return "ames";
  if(/disciple/i.test(v)) return "former";
  if(/compte.?rendu/i.test(v)) return "cr";
  if(/[eé]glise|assembl[eé]e|culte|r[eé]union/i.test(v)) return "eglise";
  return "";
}
function discTache(id){
  const t=tache(id);
  if(!t) return "";
  return (t.d!==undefined) ? t.d : discDeNom(t.nom);
}
/* Ce que chaque discipline a reçu sur la fenêtre. On part des totaux par
   activité, jamais de l'union : deux activités rattachées à la même
   discipline lui ont bien donné leurs deux temps. */
function parDisc(par){
  const o={};
  Object.keys(par||{}).forEach(function(tid){
    const d=discTache(tid); if(d) o[d]=(o[d]||0)+par[tid];
  });
  return o;
}
/* Un seul attribut sur l'activité : la routine. Les champs qu'on lui demande
   en découlent — les chapitres pour la Bible, les pages pour la littérature
   — au lieu d'être un second réglage qu'il faudrait tenir d'accord avec le
   premier (13.cn). */
function mesureProposee(d){
  if(d==="parole") return "bible";
  if(d==="litt") return "livre";
  return "";
}
/* Mais une routine se vit sous plusieurs supports, et le support commande la
   mesure : un enseignement suivi en vidéo est de la littérature chrétienne et
   n'a pas de pages. La routine propose donc sa mesure ; l'activité peut la
   refuser, et ne garder que le temps (13.cq). */
function spTache(id){
  const t=tache(id);
  if(!t || t.m===0) return "";
  return mesureProposee(discTache(id));
}
/* L'activité qui porte la lecture : celle qu'on a déclarée telle, et s'il y
   en a plusieurs, celle où l'on passe le plus de temps. */
function tacheBible(){
  const ts=(db.taches||[]).filter(function(t){ return spTache(t.id)==="bible"; });
  if(!ts.length) return "";
  if(ts.length===1) return ts[0].id;
  const freq=cumul(minuit(29), Date.now()).par;
  return ts.slice().sort(function(a,b){ return (freq[b.id]||0)-(freq[a.id]||0); })[0].id;
}

/* On reprend là où l'on s'est arrêté, et « là » se lit dans l'archive : le
   dernier passage noté, au bloc le plus récent. Rien à garder à part — un
   signet qu'on tient à jour soi-même se désaccorde du jour où l'on corrige
   une lecture. Le dernier chapitre du livre fait passer au livre suivant. */
function derniereLu(){
  let der=null;
  (db.temps||[]).forEach(function(b){
    if(!b.lu || !b.lu.length) return;
    if(!der || b.deb>der.deb) der=b;
  });
  return der ? {r:der.lu[der.lu.length-1], b:der} : null;
}
function apresLu(r){
  if(!r) return {li:0, d:1, f:1};
  if(r[2] < nbChap(r[0])) return {li:r[0], d:r[2]+1, f:r[2]+1};
  return {li:(r[0]+1) % BIBLE.length, d:1, f:1};
}
/* Qui lit l'Ancien le matin et le Nouveau le soir a deux signets. Changer de
   livre reprend donc au premier chapitre non lu de CE livre-là, pas au
   premier tout court. */
function repriseLivre(li){
  let m=0;
  (db.temps||[]).forEach(function(b){
    (b.lu||[]).forEach(function(r){ if(r[0]===li && r[2]>m) m=r[2]; });
  });
  return m>=nbChap(li) ? 1 : m+1;
}
/* Deux comptes, et ils ne disent pas la même chose. Sur une fenêtre, on
   compte les chapitres lus — relire Jean 3 trois fois, c'est trois fois
   avoir lu. Sur toute la vie, on compte les chapitres distincts : c'est du
   terrain parcouru, et relire ne l'agrandit pas. La lecture se rattache au
   début de son bloc : un bloc n'appartient qu'à un jour. */
function chapFen(t0, t1){
  let ch=0, p=0;
  (db.temps||[]).forEach(function(b){
    if(!b.lu || !b.lu.length || b.deb<t0 || b.deb>=t1) return;
    b.lu.forEach(function(r){ ch+=nbLu(r); p++; });
  });
  return {ch:ch, p:p};
}
function chapDistincts(tid){
  const vus={};
  (db.temps||[]).forEach(function(b){
    if(tid && b.t!==tid) return;
    (b.lu||[]).forEach(function(r){
      for(let c=r[1]; c<=r[2]; c++) vus[r[0]+"."+c]=1;
    });
  });
  return Object.keys(vus).length;
}

/* Les chapitres mis bout à bout, de Genèse 1 à Apocalypse 22 : une lecture
   continue ne connaît pas les frontières de livres, elle passe de Genèse 50
   à Exode 1 sans s'en apercevoir. Une seule liste peut donc la suivre, et
   c'est elle qui ramène le geste à un seul. */
const BIBLE_DEB = (function(){ const a=[]; let n=0;
  BIBLE.forEach(function(l){ a.push(n); n+=l[1]; }); return a; })();
function plat(li, c){ return BIBLE_DEB[li] + (c-1); }
function dePlat(i){
  i=Math.max(0, Math.min(BIBLE_CH-1, i));
  let li=0; while(li+1<BIBLE.length && BIBLE_DEB[li+1]<=i) li++;
  return {li:li, c:i-BIBLE_DEB[li]+1};
}
function nomPlat(i){ const p=dePlat(i); return nomLivre(p.li)+" "+p.c; }
/* Une traversée continue se range en un passage par livre : c'est ainsi
   qu'elle se relira, et ainsi que les chapitres se comptent. */
function passagesDe(a, z){
  const out=[]; let i=a;
  while(i<=z){
    const p=dePlat(i);
    const bout=Math.min(z, BIBLE_DEB[p.li]+nbChap(p.li)-1);
    out.push([p.li, p.c, dePlat(bout).c]);
    i=bout+1;
  }
  return out;
}
/* La question se pose au moment où elle est naturelle : on vient de fermer
   la lecture, on sait jusqu'où on est allé, et on est déjà là — aucun écran
   à traverser. L'app demande ; elle n'inscrit rien, et Retour suffit à ne
   rien dire. Un bloc trop court a déjà été effacé : on ne demande pas ce
   qu'on a lu en vingt secondes. */
function apresArret(bs, repli){
  const b=(bs||[]).filter(function(x){
    const sp=x ? spTache(x.t) : "";
    return x && blocT(x.id) && (sp==="bible" || sp==="livre");
  })[0];
  if(!b) return false;
  S.pile=[]; S.view=repli||"today"; empile();
  S.blocId=b.id;
  S.lu=null; S.luA=null; S.luZ=null; S.luPlein=false;
  S.pgL=null; S.pgA=null; S.pgZ=null;
  S.view = spTache(b.t)==="livre" ? "pages" : "lecture";
  return true;
}
function debutPlat(){
  const der=derniereLu();
  const a=apresLu(der && der.r);
  return plat(a.li, a.d);
}
function optsLivres(sel){
  function pan(a, z){
    let o="";
    for(let i=a;i<z;i++) o+=`<option value="${i}"${i===sel?" selected":""}>${esc(BIBLE[i][0])}</option>`;
    return o;
  }
  return `<optgroup label="Ancien Testament">${pan(0, BIBLE_NT)}</optgroup>`
       + `<optgroup label="Nouveau Testament">${pan(BIBLE_NT, BIBLE.length)}</optgroup>`;
}
function optsChap(li, sel, min){
  let o="";
  for(let c=(min||1); c<=nbChap(li); c++) o+=`<option value="${c}"${c===sel?" selected":""}>${c}</option>`;
  return o;
}
function champSel(id, label, corps){
  return `<li class="item-content item-input"><div class="item-inner">
      <div class="item-title item-label">${label}</div>
      <div class="item-input-wrap"><span class="sel"><select id="${id}">${corps}</select></span></div>
    </div></li>`;
}
function listeLu(b){
  return liste(b.lu.map(function(r,i){
    return ligne({titre:esc(nomPassage(r)), sous:chapitresTxt(nbLu(r)),
      apres:`<span class="rouge">Retirer</span>`, attr:'data-lusup="'+i+'"'});
  }).join(""));
}

/* Dire ce qu'on a lu coûtait sept gestes : aller dans Mon temps, faire
   défiler, toucher le bloc, ouvrir l'écran, bouger trois listes, valider.
   Or l'app SAIT où l'on s'est arrêté — elle l'annonçait même en haut de
   l'écran avant de redemander le livre et le chapitre de départ. Elle ne
   demande donc plus qu'une chose : JUSQU'OÙ. Une liste, un geste.
   Le reste — j'ai sauté, j'ai relu, j'ai préparé une prédication dans
   Romains — est le cas rare, et le cas rare ne commande pas la forme du
   geste quotidien : il garde ses trois listes, derrière une ligne (13.cg). */
function vLecture(){
  const b=blocT(S.blocId);
  if(!b){ depile("temps"); return render(); }
  if(S.luPlein) return vLecturePlein(b);
  const der=derniereLu();
  if(S.luA===null || S.luA===undefined){ S.luA=debutPlat(); S.luZ=S.luA; }
  const a=S.luA, z=Math.max(a, S.luZ);
  Z.titre="Ce que tu as lu"; Z.retour=true;
  let h=`<div class="block amorce" style="margin-top:16px">${
    !der ? "Tu commences à <b>"+esc(nomPlat(a))+"</b>. Jusqu'où es-tu allé ?"
    : der.b===b ? "Tu reprends à <b>"+esc(nomPlat(a))+"</b>. Jusqu'où es-tu allé ?"
    : "Tu t'étais arrêté à <b>"+esc(nomPassage(der.r))+"</b>. Jusqu'où es-tu allé ?"
  }</div>`;
  h+=titreBloc("Jusqu'où");
  let o="";
  const bout=Math.min(BIBLE_CH-1, a+199);
  for(let i=a;i<=bout;i++) o+=`<option value="${i}"${i===z?" selected":""}>${esc(nomPlat(i))}</option>`;
  h+=liste(champSel("luZ", "Dernier chapitre lu", o));
  const ps=passagesDe(a, z);
  h+=`<div class="block amorce"><b>${esc(ps.map(nomPassage).join(" · "))}</b> — ${chapitresTxt(z-a+1)}.</div>`;
  h+=liste(ligne({titre:"Ce n'est pas là que j'ai commencé",
      sous:"Choisir le livre et les deux bornes", attr:'data-act="luPlein"'}), "lien");
  if((b.lu||[]).length){
    h+=titreBloc("Déjà noté sur ce bloc","ecart");
    h+=listeLu(b);
  }
  Z.html=h;
  Z.action=bouton("Garder", 'data-act="addLuSimple"');
}

/* L'écran ne garde rien avant qu'on le dise : on choisit, on voit ce que ça
   fera, on ajoute. Et il ne se referme pas sur un ajout — une séance traverse
   parfois deux livres, ou saute d'un psaume à une épître. Le passage suivant
   est déjà proposé. */
function vLecturePlein(b){
  const der=derniereLu();
  if(!S.lu) S.lu=apresLu(der && der.r);
  const l=S.lu;
  Z.titre="Ce que tu as lu"; Z.retour=true;
  /* Le même fait, dit deux fois selon qu'il vient d'arriver ou d'hier :
     « la dernière fois » sonne faux trois secondes après l'avoir noté. */
  let h=`<div class="block amorce" style="margin-top:16px">${
    !der ? "Dis le livre et les chapitres traversés. Dès la prochaine fois, l'app reprendra là où tu t'arrêtes."
    : der.b===b ? "Tu viens de noter <b>"+esc(nomPassage(der.r))+"</b>. On continue juste après."
    : "La dernière fois, tu t'es arrêté à <b>"+esc(nomPassage(der.r))+"</b>. On reprend juste après."
  }</div>`;
  h+=titreBloc("Le passage");
  h+=liste(champSel("luLiv", "Le livre", optsLivres(l.li))
         + champSel("luDeb", "Du chapitre", optsChap(l.li, l.d))
         + champSel("luFin", "Jusqu'au chapitre", optsChap(l.li, l.f, l.d)));
  h+=`<div class="block amorce"><b>${esc(nomPassage([l.li, l.d, l.f]))}</b> — ${chapitresTxt(l.f-l.d+1)}.</div>`;
  if((b.lu||[]).length){
    h+=titreBloc("Déjà noté sur ce bloc","ecart");
    h+=listeLu(b);
  }
  Z.html=h;
  Z.action=bouton("Ajouter ce passage", 'data-act="addLu"');
}

/* Ce que l'app demande à une activité se règle une fois, sur l'activité —
   pas à chaque bloc. Un seul réglage pour l'instant, et c'est voulu : on
   n'ouvre pas un atelier de champs sur mesure avant de savoir, à l'usage,

function vTache(){

  h+=titreBloc("La routine");
  h+=`<div class="block amorce">Les seize routines du message de Bertoua. L'activité garde son nom ; elle dit seulement de laquelle elle est la mise en œuvre — et c'est elle qui décide de ce qu'on te demandera en plus du temps.</div>`;
  h+=liste(champSel("tDisc","Routine",
      `<option value=""${dc?"":" selected"}>— aucune —</option>`

        }).join("")));
  const prop=mesureProposee(dc);
  if(!prop){

  }else{

      ? "La lecture de la Bible se compte aussi en chapitres — sauf si cette activité-là ne les suit pas."
      : "La lecture de littérature chrétienne se compte aussi en pages. Mais une vidéo, un podcast, un enseignement suivi en ligne n'en ont pas : là, le temps suffit."}</div>`;
    h+=liste(ligne({titre: prop==="bible" ? "Les chapitres lus" : "Les pages lues",
        sous: prop==="bible" ? "Avec la reprise là où tu t'es arrêté" : "Avec un signet par livre",
        apres: sp ? `<span class="coche">✓</span>` : "", attr:'data-mes="1"'})
      + ligne({titre:"Rien de plus que le temps",
        sous:"Pour ce qui ne se compte ni en chapitres ni en pages",
        apres: !sp ? `<span class="coche">✓</span>` : "", attr:'data-mes="0"'}));
  }
  if(sp==="bible"){
    const n=chapDistincts(t.id);
    h+=titreBloc("Ce que tu as traversé","ecart");
    h+=liste(ligne({titre:"Chapitres distincts", sous:"Relire ne l'agrandit pas",
        apres:esc(n+" / "+BIBLE_CH)}));
  }
  /* Un enseignement suivi en vidéo n'a pas de pages (13.cq), mais il a
     quelqu'un derrière : c'est par l'activité qu'on le nomme, puisqu'il n'y a
     pas de livre pour le porter. */
  if(dc==="litt" && !sp){
    h+=titreBloc("L'auteur qu'on suit","ecart");
    h+=`<div class="block amorce">Ce qu'on suit en vidéo ou en podcast n'a pas de pages, mais il a quelqu'un derrière. Ce que tu écris ici se garde tout seul.</div>`;
    h+=champ("tAuteur", "Son nom", "text", t.au?esc(auteurNom(t.au)):"", 'autocapitalize="words"');
    h+=pucesAuteurs("tAuteur");
  }
  if(sp==="livre"){
    h+=titreBloc("Tes livres","ecart");
    h+=liste(((db.livres||[]).map(function(l){
        const vu=pageLue(l.id), tot=l.pages||0;
        const au=l.a?esc(auteurNom(l.a))+" · ":"";
        return ligne({titre:esc(l.nom), sous: au+(livreFini(l) ? "Fini" : "En cours"),
          apres:esc(tot ? vu+" / "+tot : String(vu)), attr:'data-lv="'+l.id+'"'});
      }).join("")) + ligne({titre:"Ajouter un livre", attr:'data-act="livreNeuf"'}));
  }
  Z.html=h;
}


/* ---------- la bibliothèque : où j'en suis dans mes livres ---------- */
/* Même besoin que pour l'Écriture, et une différence qui commande tout : la
   Bible est une liste close que l'app connaît par cœur ; une bibliothèque,
   non. Le disciple la déclare donc — le titre, et le nombre de pages, sans
   quoi « j'en suis à la 84 » ne dit rien d'un avancement.
   Et l'on mène plusieurs livres de front comme on mène plusieurs activités
   de front : chacun garde son propre signet, et c'est le dernier touché qui
   se propose, pour que le cas courant reste à un geste (13.ck). */
/* ---------- ceux dont on reçoit ---------- */
/* Un auteur n'est pas une colonne du livre : c'est quelqu'un dont on reçoit,
   et dont on reçoit par plusieurs voies — trois de ses livres, et ses
   enseignements suivis en vidéo. Une fiche à part, donc, que le livre et
   l'activité désignent tous deux (13.cr). */
/* Un nom propre n'a pas qu'une majuscule : « theodore andoseh » tapé vite
   doit ressortir « Theodore Andoseh ». Mais dès qu'une majuscule est là, on ne
   touche plus à rien — « d'Aubigné », « van Dyke » sont des noms qu'on n'a pas
   à corriger, et un nom mal recapitalisé est un manque d'égard. */
function capNom(t){
  const v=String(t||"").trim().replace(/\s+/g, " ");
  if(/[A-ZÀ-Þ]/.test(v)) return v;
  return v.replace(/(^|[\s\-'’])([a-zà-ÿ])/g, function(m,a,b){ return a+b.toUpperCase(); });
}
function auteur(id){ return (db.auteurs||[]).filter(function(a){ return a.id===id; })[0]; }
function auteurNom(id){ const a=auteur(id); return a ? a.nom : ""; }
function auteurId(nom){
  const v=String(nom||"").trim(); if(!v) return "";
  const a=(db.auteurs||[]).filter(function(x){ return x.nom.toLowerCase()===v.toLowerCase(); })[0];
  if(a) return a.id;
  const id=uid("u");
  db.auteurs=(db.auteurs||[]).concat([{id:id, nom:capNom(v), maj:Date.now()}]);
  return id;
}
/* Rangés sur ce qu'on en a reçu : celui qu'on lit le plus vient en tête, et
   le geste le plus fréquent reste le plus court (13.bb). */
function auteursConnus(){
  const poids={};
  (db.livres||[]).forEach(function(l){ if(l.a) poids[l.a]=(poids[l.a]||0)+1; });
  (db.taches||[]).forEach(function(t){ if(t.au) poids[t.au]=(poids[t.au]||0)+1; });
  return (db.auteurs||[]).slice().sort(function(x,y){
    return (poids[y.id]||0)-(poids[x.id]||0) || x.nom.localeCompare(y.nom); });
}
/* Ce qu'on a reçu d'un homme : ses livres, les pages qu'on y a lues, et les
   heures passées avec ce qu'il enseigne — par le livre ou par la vidéo. */
function recuDe(aid){
  const lv=(db.livres||[]).filter(function(l){ return l.a===aid; });
  const ts=(db.taches||[]).filter(function(t){ return t.au===aid; });
  let pages=0, ms=0;
  const sien={};
  lv.forEach(function(l){ sien[l.id]=1; pages+=pageLue(l.id); });
  (db.temps||[]).forEach(function(b){
    const t=tache(b.t);
    const parLivre=(b.pg||[]).some(function(r){ return sien[r[0]]; });
    if(parLivre || (t && t.au===aid)) ms+=Math.max(0, finDe(b)===SANSFIN ? Date.now()-b.deb : b.fin-b.deb);
  });
  return {livres:lv, taches:ts, pages:pages, ms:ms};
}
function recuTxt(r){
  const p=[];
  if(r.livres.length) p.push(r.livres.length+" livre"+(r.livres.length>1?"s":""));
  if(r.pages) p.push(pagesTxt(r.pages));
  if(r.ms) p.push(hm(r.ms));
  return p.length ? p.join(" · ") : "Rien encore";
}
function pucesAuteurs(champId){
  const a=auteursConnus();
  if(!a.length) return "";
  return `<div class="puces">`+a.map(function(x){
    return `<button class="puce" data-aut="${x.id}" data-pour="${champId}">${esc(x.nom)}</button>`;
  }).join("")+`</div>`;
}
function livre(id){ return (db.livres||[]).filter(function(l){ return l.id===id; })[0]; }
function livreNom(id){ const l=livre(id); return l ? l.nom : "—"; }
function livrePages(id){ const l=livre(id); return (l && l.pages>0) ? l.pages : 0; }
function livreId(nom, pages, aut){
  const v=String(nom||"").trim(); if(!v) return "";
  const l=(db.livres||[]).filter(function(x){ return x.nom.toLowerCase()===v.toLowerCase(); })[0];
  if(l){
    let bouge=false;
    if(pages>0 && l.pages!==pages){ l.pages=pages; bouge=true; }
    if(aut!==undefined && l.a!==aut){ l.a=aut; bouge=true; }
    if(bouge) touche(l);
    return l.id;
  }
  const id=uid("l");
  db.livres=(db.livres||[]).concat([{id:id, nom:cap(v), pages:pages>0?pages:0,
                                     a:aut||"", maj:Date.now()}]);
  return id;
}
/* Le signet se lit dans l'archive, jamais tenu à jour à part : la page la
   plus avancée qu'on ait notée dans ce livre-là. */
function pageLue(lid){
  let m=0;
  (db.temps||[]).forEach(function(b){
    (b.pg||[]).forEach(function(r){ if(r[0]===lid && r[2]>m) m=r[2]; });
  });
  return m;
}
/* Fini, c'est soit la dernière page atteinte, soit le disciple qui le dit —
   on repose un livre avant la fin, et ce n'est pas à l'app d'en juger. */
function livreFini(l){
  if(!l) return false;
  if(l.fini) return true;
  return l.pages>0 && pageLue(l.id)>=l.pages;
}
function livresOuverts(){ return (db.livres||[]).filter(function(l){ return !livreFini(l); }); }
function dernierLivre(){
  let der="", quand=-1;
  (db.temps||[]).forEach(function(b){
    (b.pg||[]).forEach(function(r){ if(b.deb>quand){ quand=b.deb; der=r[0]; } });
  });
  const l=der ? livre(der) : null;
  if(l && !livreFini(l)) return l.id;
  const ouv=livresOuverts();
  return ouv.length ? ouv[0].id : (l ? l.id : "");
}
function pagesTxt(n){ return n+" page"+(n>1?"s":""); }
function nomPassagePg(r){
  const n=livreNom(r[0]);
  return r[1]===r[2] ? n+", page "+r[1] : n+", pages "+r[1]+" à "+r[2];
}
function passagesPgTxt(b){ return (b.pg||[]).map(nomPassagePg).join(" · "); }
function pagesFen(t0, t1){
  let pg=0, p=0;
  (db.temps||[]).forEach(function(b){
    if(!b.pg || !b.pg.length || b.deb<t0 || b.deb>=t1) return;
    b.pg.forEach(function(r){ pg+=r[2]-r[1]+1; p++; });
  });
  return {pg:pg, p:p};
}
function tacheLivre(){
  const ts=(db.taches||[]).filter(function(t){ return spTache(t.id)==="livre"; });
  if(!ts.length) return "";
  if(ts.length===1) return ts[0].id;
  const freq=cumul(minuit(29), Date.now()).par;
  return ts.slice().sort(function(a,b){ return (freq[b.id]||0)-(freq[a.id]||0); })[0].id;
}
function listePg(b){
  return liste(b.pg.map(function(r,i){
    return ligne({titre:esc(nomPassagePg(r)), sous:pagesTxt(r[2]-r[1]+1),
      apres:`<span class="rouge">Retirer</span>`, attr:'data-pgsup="'+i+'"'});
  }).join(""));
}

/* Une seule liste, comme pour l'Écriture : le départ est le signet, et la
   seule question est jusqu'où. Les autres livres entamés sont là, en
   pastilles — changer de livre reste un geste, pas un écran. */
function vPages(){
  const b=blocT(S.blocId);
  if(!b){ depile("temps"); return render(); }
  Z.titre="Ce que tu as lu"; Z.retour=true;
  if(!(db.livres||[]).length){
    Z.html=`<div class="block amorce" style="margin-top:16px">Aucun livre n'est encore déclaré. Dis-en un — son titre et son nombre de pages — et l'app tiendra ton signet dedans.</div>`
      + liste(ligne({titre:"Ajouter un livre", attr:'data-act="livreNeuf"'}), "lien");
    return;
  }
  if(!S.pgL || !livre(S.pgL)) S.pgL = dernierLivre() || db.livres[0].id;
  const l=livre(S.pgL), tot=livrePages(l.id), vue=pageLue(l.id);
  if(S.pgA===null || S.pgA===undefined){
    S.pgA = tot ? Math.min(tot, vue+1) : vue+1;
    S.pgZ = S.pgA;
  }
  const a=S.pgA, z=Math.max(a, S.pgZ);
  let h=`<div class="block amorce" style="margin-top:16px">${
    vue ? "Tu reprends <b>"+esc(l.nom)+"</b> à la page <b>"+a+"</b>. Jusqu'où es-tu allé ?"
        : "Tu commences <b>"+esc(l.nom)+"</b>. Jusqu'où es-tu allé ?"
  }</div>`;
  const ouv=livresOuverts();
  if(ouv.length>1 || (ouv.length===1 && ouv[0].id!==l.id) || (db.livres||[]).length>1){
    h+=`<div class="puces">${(db.livres||[]).filter(function(x){ return !livreFini(x) || x.id===l.id; })
      .map(function(x){ return `<button class="puce" data-pgl="${x.id}" aria-pressed="${x.id===l.id}">${esc(x.nom)}</button>`; }).join("")}</div>`;
  }
  h+=titreBloc("Jusqu'où");
  let o="";
  const bout = tot ? tot : a+500;
  for(let i=a;i<=bout;i++) o+=`<option value="${i}"${i===z?" selected":""}>${i}</option>`;
  h+=liste(champSel("pgZ", "Dernière page lue", o));
  const reste = tot ? Math.max(0, tot-z) : 0;
  h+=`<div class="block amorce"><b>${esc(nomPassagePg([l.id,a,z]))}</b> — ${pagesTxt(z-a+1)}.${
    !tot ? "" : (reste ? " Il te restera "+pagesTxt(reste)+" sur "+tot+"." : " Tu l'auras terminé.")}</div>`;
  h+=liste(ligne({titre:"Un autre livre", sous:"En ajouter un, ou corriger ses pages",
      attr:'data-act="livreNeuf"'})
    + ligne({titre:"Ce livre", sous:esc(l.nom)+(tot?" — "+tot+" pages":" — pages inconnues"),
      attr:'data-lv="'+l.id+'"'}), "lien");
  if((b.pg||[]).length){
    h+=titreBloc("Déjà noté sur ce bloc","ecart");
    h+=listePg(b);
  }
  Z.html=h;
  Z.action=bouton("Garder", 'data-act="addPg"');
}

/* Un livre est une fiche minuscule — un titre, un nombre de pages — et
   c'est le nombre de pages qui fait tout le reste : sans lui, « page 84 »
   est un chiffre sans horizon. */
function vLivre(){
  const l=S.lvId ? livre(S.lvId) : null;
  Z.titre = l ? "Ce livre" : "Un livre"; Z.retour=true;
  let h=`<div class="block amorce" style="margin-top:16px">Le titre, et le nombre de pages — c'est lui qui permet de dire où tu en es, et ce qu'il te reste.</div>`;
  h+=titreBloc("Le titre");
  h+=champ("lvNom", "Le titre du livre", "text", l?esc(l.nom):"", 'autocapitalize="sentences"');
  h+=titreBloc("L'auteur","ecart");
  h+=`<div class="block amorce">Qui l'a écrit. On garde la liste, pour savoir de qui tu reçois.</div>`;
  h+=champ("lvAuteur", "Son nom", "text", (l&&l.a)?esc(auteurNom(l.a)):"", 'autocapitalize="words"');
  h+=pucesAuteurs("lvAuteur");
  h+=titreBloc("Le nombre de pages","ecart");
  h+=liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
      <input type="number" id="lvPages" inputmode="numeric" min="1" max="9999" placeholder="240" value="${(l&&l.pages)?l.pages:""}"></div></div></li>`);
  if(l){
    const vue=pageLue(l.id);
    h+=titreBloc("Où tu en es","ecart");
    h+=liste(ligne({titre:"Page atteinte", apres:esc(String(vue)+(l.pages?" / "+l.pages:""))})
      + ligne({titre: l.fini ? "Finalement, je ne l'ai pas fini" : "Je l'ai fini",
               sous: l.fini ? "Il reviendra dans les livres en cours" : "Il quittera les livres en cours",
               attr:'data-act="livreFin"'}));
  }
  Z.html=h;
  Z.action=bouton(l?"Garder":"Ajouter ce livre", 'data-act="livreGarder"');
}

/* L'auteur avait une fiche sans écran : on pouvait le nommer, pas le
   corriger, et deux orthographes d'un même homme restaient deux hommes. Ici
   il se renomme, on voit ce qu'on a reçu de lui, et deux fiches se réunissent
   (13.ct). */
function vAuteur(){
  const a=S.auId ? auteur(S.auId) : null;
  if(!a){ depile("temps"); return render(); }
  const r=recuDe(a.id);
  Z.titre=a.nom; Z.retour=true;
  let h=`<div class="block amorce" style="margin-top:16px">Ce que tu as reçu de lui : <b>${esc(recuTxt(r))}</b>.</div>`;
  h+=titreBloc("Son nom");
  h+=champ("auNom", "Son nom", "text", esc(a.nom), 'autocapitalize="words"');
  if(r.livres.length){
    h+=titreBloc("Ses livres","ecart");
    h+=liste(r.livres.map(function(l){
      const vu=pageLue(l.id), tot=l.pages||0;
      return ligne({titre:esc(l.nom), sous: livreFini(l) ? "Fini" : "En cours",
        apres:esc(tot ? vu+" / "+tot : String(vu)), attr:'data-lv="'+l.id+'"'});
    }).join(""));
  }
  if(r.taches.length){
    h+=titreBloc("Ce que tu suis de lui","ecart");
    h+=liste(r.taches.map(function(t){
      return ligne({titre:esc(t.nom), sous:esc(catNom(t.cat||"reste")),
        attr:'data-tch="'+t.id+'"'});
    }).join(""));
  }
  /* Réunir, et non supprimer : on ne perd jamais ce qui était rattaché, on le
     transporte. C'est la seule façon de rattraper « T. Andoseh » écrit un
     jour et « Theodore Andoseh » un autre. */
  const autres=auteursConnus().filter(function(x){ return x.id!==a.id; });
  if(autres.length){
    h+=titreBloc("Réunir avec un autre","ecart");
    h+=`<div class="block amorce">Si c'est le même homme écrit deux fois. Ses livres et ce que tu suis de lui passeront sur l'autre fiche, et celle-ci disparaîtra.</div>`;
    h+=liste(champSel("auFus","L'autre fiche",
        `<option value="">— choisis —</option>`
        + autres.map(function(x){ return `<option value="${x.id}">${esc(x.nom)}</option>`; }).join("")));
    h+=liste(ligne({titre:"Réunir les deux", attr:'data-act="auReunir"'}), "lien");
  }
  Z.html=h;
  Z.action=bouton("Garder", 'data-act="auGarder"');
}

function vBloc(){
  const b=blocT(S.blocId);
  if(!b){ depile("temps"); return render(); }
  const v=voisins(b), court=!b.fin;
  Z.titre="Ce bloc"; Z.retour=true;
  let h=titreBloc("L'activité");
  h+=liste(ligne({titre:esc(tacheNom(b.t)), sous:esc(catNom(tacheCat(b.t))),
      attr:'data-act="corrBloc"'}), "lien");
  /* Deux heures de prière ne disent pas ce qui s'y est passé. Le compte pèse
     le temps ; la note garde ce que le temps a produit — et elle tient à
     cette occurrence-là, pas à l'activité, qui revient tous les jours.
     Texte libre pour l'instant : ce qu'on écrit librement pendant des
     semaines dira de lui-même quelles questions poser plus tard. */
  h+=titreBloc("Ce qui s'y est passé","ecart");
  h+=`<div class="block amorce">Ce que tu écris ici se garde tout seul.</div>`;
  h+=`<div class="block"><textarea class="dicte petit" id="bNote" placeholder="Ce que tu as vu, reçu, compris, ou simplement fait…" style="min-height:84px">${esc(b.note||"")}</textarea>${micBloc("bNote")}</div>`;
  /* La question n'est posée qu'à qui peut y répondre : demander des chapitres
     à un trajet encombrerait l'écran sans rien recueillir. */
  if(spTache(b.t)==="bible"){
    h+=titreBloc("Ce que tu as lu","ecart");
    if((b.lu||[]).length) h+=listeLu(b);
    h+=liste(ligne({titre:(b.lu||[]).length ? "Ajouter un passage" : "Dire les chapitres lus",
        sous:"Le livre et les chapitres traversés", attr:'data-act="direLu"'}), "lien");
  }
  if(spTache(b.t)==="livre"){
    h+=titreBloc("Ce que tu as lu","ecart");
    if((b.pg||[]).length) h+=listePg(b);
    h+=liste(ligne({titre:(b.pg||[]).length ? "Ajouter un passage" : "Dire les pages lues",
        sous:"Le livre et les pages traversées", attr:'data-act="direPg"'}), "lien");
  }
  h+=titreBloc("Le début","ecart");
  h+=liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
      <input type="datetime-local" id="bDeb" value="${dtl(b.deb)}"></div></div></li>`);
  if(v.avant.length)
    h+=`<div class="block amorce">Juste avant : ${nomVoisins(v.avant)}. Reculer ce début le prolonge d'autant ; l'avancer le raccourcit.</div>`;
  h+=titreBloc("La fin","ecart");
  h+=liste(ligne({titre:"C'est toujours en cours",
      apres: court ? `<span class="coche">✓</span>` : "", attr:'data-act="bCours"'}));
  if(!court){
    h+=liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
        <input type="datetime-local" id="bFin" value="${dtl(b.fin)}"></div></div></li>`);
    if(v.apres.length)
      h+=`<div class="block amorce">Juste après : ${nomVoisins(v.apres)}, qui commencera à l'heure que tu poses ici.</div>`;
  } else {

  uid   uuid primary key references auth.users on delete cascade,
  doc   text not null,
  jalon text not null,
  maj   timestamptz not null default now()
);
alter table etat enable row level security;
create policy "le mien" on etat for all
  using (auth.uid() = uid) with check (auth.uid() = uid);

insert into storage.buckets (id, name, public, file_size_limit)
values ('pieces', 'pieces', false, 26214400)
on conflict (id) do nothing;

create policy "les miennes" on storage.objects for all to authenticated
  using (bucket_id = 'pieces'
         and (storage.foldername(name))[1] = auth.uid()::text)
  with check (bucket_id = 'pieces'
