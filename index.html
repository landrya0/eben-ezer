<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ében-Ézer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ében-Ézer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap">
<style>
/* Encre et indigo. Sa voix en indigo profond, les gestes en violet clair. */
:root{
  --bg:#F8F7FC; --bg2:#EFEDF8; --surface:#FFFFFF;
  --ink:#16151C; --muted:#6B6880;
  --line:#E7E4F1; --line2:#D2CDE4;
  --accent:#5747C7; --accent-ink:#FFFFFF; --accent-soft:#ECE8FC;
  --deep:#2A2367;
  --shadow:0 1px 2px rgba(22,21,28,.05), 0 14px 32px -20px rgba(42,35,103,.35);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D13; --bg2:#15131E; --surface:#1A1824;
    --ink:#F1EFF7; --muted:#9B97AF;
    --line:#262233; --line2:#3B3552;
    --accent:#9A89F7; --accent-ink:#13101F; --accent-soft:#241F3A;
    --deep:#C6BCFA;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D13; --bg2:#15131E; --surface:#1A1824;
  --ink:#F1EFF7; --muted:#9B97AF;
  --line:#262233; --line2:#3B3552;
  --accent:#9A89F7; --accent-ink:#13101F; --accent-soft:#241F3A;
  --deep:#C6BCFA;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--bg2) 0%, var(--bg) 60%);
  background-attachment:fixed;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#main{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(22px,env(safe-area-inset-left,0px));
  padding-right:max(22px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
}
#main.pad-top{padding-top:calc(26px + env(safe-area-inset-top,0px))}
h1{font-family:var(--serif);font-weight:600;font-size:31px;letter-spacing:-.018em;margin:0 0 3px;text-wrap:balance}
h2{font-size:11px;font-weight:600;color:var(--accent);margin:0 0 10px;letter-spacing:.1em;text-transform:uppercase}
p{margin:0}
.serif{font-family:var(--serif);line-height:1.36;letter-spacing:-.012em}
.voix{color:var(--deep)}
.sub{font-size:13.5px;color:var(--muted);line-height:1.55}
.meta{font-size:12.5px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.sep{border-top:1px solid var(--line)}
.item{padding:15px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;display:block;color:inherit}
.item[hidden]{display:none}
.item.on{background:var(--accent-soft);border-top-color:transparent;border-radius:14px;padding-left:14px;padding-right:14px}
.stack{display:flex;flex-direction:column}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap28{gap:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 15px;border-radius:19px;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);transition:background .12s,color .12s,border-color .12s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.rec{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{min-height:52px;padding:0 24px;border-radius:26px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500;box-shadow:var(--shadow)}
.btn.quiet{border:0;background:none;color:var(--muted);padding:0 8px;min-height:44px;font-size:15px}
.btn.full{width:100%}
.big{min-height:84px;border:0;border-top:1px solid var(--line2);background:none;text-align:left;width:100%;padding:15px 0;display:block;color:inherit}
.big .t{font-family:var(--serif);font-size:25px;letter-spacing:-.015em;display:block}
.big .n{font-size:13px;color:var(--muted);display:block;margin-top:3px}
.field{width:100%;border:1px solid var(--line2);border-radius:16px;background:var(--surface);padding:13px 15px;font-family:var(--serif);font-size:19px}
.field:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--muted);opacity:.7}
textarea.field{resize:vertical;min-height:96px;line-height:1.45}
input[type="date"].field{font-family:var(--sans);font-size:16px}
.lbl{display:block;font-size:13.5px;color:var(--muted);margin-bottom:8px}
#bar{flex:0 0 auto;padding:10px max(22px,env(safe-area-inset-left,0px)) 12px max(22px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
#bar[hidden]{display:none}
#bar button{width:100%;min-height:54px;border:0;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-size:16.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow)}
#nav{flex:0 0 auto;display:flex;padding:0 8px calc(14px + env(safe-area-inset-bottom,0px))}
#nav[hidden]{display:none}
#nav button{flex:1 1 0;min-height:48px;border:0;background:none;font-size:12px;color:var(--muted);padding:0 2px}
#nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:none;color:var(--muted);display:flex;align-items:center}
.empty{color:var(--muted);font-size:15px;padding:15px 0}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.ok{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:14px;z-index:20;box-shadow:0 8px 28px rgba(0,0,0,.22)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rec .pt{animation:pulse 1.1s ease-in-out infinite}
</style>
</head>
<body>
<div id="main" class="pad-top"></div>
<div id="bar" hidden>
  <button id="askBtn">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Noter quelque chose
  </button>
</div>
<nav id="nav" hidden aria-label="Navigation"></nav>

<script>
"use strict";
const KEY = "ebenezer.v1";
const MAN = {parle:"Il a parlé", pourvu:"Il a pourvu", ouvert:"Il a ouvert", delivre:"Il a délivré", repris:"Il a repris"};
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const ETAT = {fait:"fait", encours:"en cours", prevu:"prévu", abandon:"abandonné"};
const ETATS = [["fait","C'est fait"],["encours","Ça dure encore"],["prevu","C'est prévu"]];

let db = {nodes:[], gens:[], noms:[], seq:1};
let S = {view:"today", step:0, draft:null, filtre:"tout", rev:"noms", prev:"today", nodeId:null,
         edit:false, del:false, eMan:"", eEtat:"fait", ePrec:"j",
         aEtat:"fait", aPour:"dieu", aGid:null};

/* ---------- stockage ---------- */
function sane(v){
  const o = (v && typeof v==="object") ? v : {};
  return {nodes:Array.isArray(o.nodes)?o.nodes:[], gens:Array.isArray(o.gens)?o.gens:[],
          noms:Array.isArray(o.noms)?o.noms:[], seq:(typeof o.seq==="number"&&o.seq>0)?o.seq:1};
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r) db=sane(JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Enregistrement impossible"); } }
function nid(){ return "n"+(db.seq++); }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- dates ---------- */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ if(!s) return null; const p=String(s).split("-"); if(p.length<3) return null; return {y:+p[0], m:+p[1], d:+p[2]}; }
function human(n){
  if(n.kind==="ecriture") return n.ref || "";
  const p=parse(n.date); if(!p) return "";
  if(n.prec==="a") return ""+p.y;
  if(n.prec==="m") return MOIS[p.m-1]+" "+p.y;
  return p.d+" "+MOIS[p.m-1]+" "+p.y;
}
function ansDepuis(n){ const p=parse(n.date); if(!p) return 0; return new Date().getFullYear()-p.y; }
function manCourt(m){ return m&&MAN[m] ? MAN[m].replace("Il a ","") : ""; }

/* ---------- accès ---------- */
function node(id){ return db.nodes.find(n=>n.id===id); }
function gensNom(id){ const g=db.gens.find(x=>x.id===id); return g?g.nom:""; }
function gensId(nom){
  const v=String(nom||"").trim(); if(!v) return null;
  const k=v.toLowerCase();
  const f=db.gens.find(g=>String(g.nom).trim().toLowerCase()===k);
  if(f) return f.id;
  const id="g"+(db.seq++); db.gens.push({id:id,nom:v}); return id;
}
function enfants(id){ return db.nodes.filter(n=>(n.par||[]).indexOf(id)!==-1); }
function dessous(id){ /* lui et tout ce qui en descend — pour ne pas créer de boucle */
  const vus=[id]; let f=[id];
  while(f.length){ const g=[]; f.forEach(x=>enfants(x).forEach(e=>{ if(vus.indexOf(e.id)===-1){vus.push(e.id); g.push(e.id);} })); f=g; }
  return vus;
}
function estParole(n){ return n.kind==="rhema" || n.kind==="ecriture" || (n.act==="dieu" && n.man==="parle"); }
function acteurTxt(n){
  if(n.act==="dieu") return n.kind==="ecriture" ? "Écriture" : (n.kind==="rhema" ? "Dieu · rhema" : "Dieu");
  if(n.act==="gens"){ const nom=gensNom(n.gid)||"quelqu'un"; return n.man ? ("Lui, par "+nom) : nom; }
  const d = n.dest==="gens" ? (gensNom(n.dgid)||"quelqu'un") : (n.dest==="moi" ? "moi-même" : "Dieu");
  return "moi → "+d;
}
/* Ses œuvres : ce qu'Il a fait Lui-même, et ce qu'Il a fait par une main — reconnu à sa manière. */
function dieuNodes(){ return db.nodes.filter(n=>n.kind!=="ecriture" && (n.act==="dieu" || (n.act==="gens" && n.man))); }
function parDate(a,b){ return (b.date||"").localeCompare(a.date||""); }

/* ---------- ce qui revient ---------- */
function remontee(){
  const now=new Date(), m=now.getMonth()+1, j=now.getDate();
  const anniv = dieuNodes().filter(n=>{ const p=parse(n.date); return p && n.prec==="j" && p.m===m && p.d===j && p.y<now.getFullYear(); })
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(anniv.length) return {type:"anniv", n:anniv[0]};
  const prevu = db.nodes.filter(n=>n.etat==="prevu" && n.date && n.date<=today())
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(prevu.length) return {type:"prevu", n:prevu[0]};
  const dette = dieuNodes().filter(n=>!enfants(n.id).some(e=>e.act==="moi"))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(dette.length) return {type:"dette", n:dette[0]};
  return null;
}

/* ---------- rendu ---------- */
const main=document.getElementById("main"), bar=document.getElementById("bar"), nav=document.getElementById("nav");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const RETOUR = `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>`;
const VUES = {today:vToday, oeuvres:vOeuvres, revel:vRevel, actes:vActes, note:vNote, node:vNode, attach:vAttach, lier:vLier, data:vData};

function render(){
  if(rec) micArret();
  const plein = ["today","oeuvres","revel","actes"].indexOf(S.view)!==-1;
  bar.hidden = S.view!=="today" || !db.nodes.length;
  nav.hidden = !plein;
  main.className = plein ? "pad-top" : "";
  if(plein) navRender();
  (VUES[S.view]||vToday)();
  main.scrollTop=0;
}
function navRender(){
  const t=[["today","Aujourd'hui"],["oeuvres","Ses œuvres"],["revel","Révélations"],["actes","Mes actes"]];
  nav.innerHTML=t.map(([k,l])=>`<button data-go="${k}"${S.view===k?' aria-current="page"':""}>${l}</button>`).join("");
}
function entete(retour){
  return `<div style="display:flex;justify-content:space-between;padding-top:14px">
    <button class="back" ${retour} aria-label="Revenir">${RETOUR}</button>
    <button class="back" data-go="today" aria-label="Fermer" style="margin:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>`;
}
/* « Quand ? » — la date est toujours là, jamais cachée derrière un choix. */
function blocDate(id, val, prec, etats, etat){
  let h=`<div class="sep" style="padding-top:18px">
    <label class="lbl" for="${id}">Quand&nbsp;?</label>
    <input class="field" type="date" id="${id}" value="${val||today()}">
    <button class="btn quiet" data-act="prec${id}" style="padding:0;margin-top:2px">${prec==="m"?"✓ je ne me souviens que du mois":"Je ne me souviens que du mois"}</button>`;
  if(etats){
    h+=`<p class="lbl" style="margin-top:14px">Où ça en est&nbsp;?</p><div class="chips" id="${id}Etat">`+
      ETATS.map(([k,l])=>`<button class="chip" data-etat="${k}" aria-pressed="${etat===k}">${l}</button>`).join("")+`</div>`;
  }
  return h+`</div>`;
}

/* --- Aujourd'hui --- */
function vToday(){
  const now=new Date();
  const d = now.getDate()+" "+MOIS[now.getMonth()];
  if(!db.nodes.length){
    main.innerHTML = `<div class="stack gap20" style="padding-top:44px">
      <p class="meta">${d}</p>
      <p class="serif" style="font-size:30px;margin-top:14px">Rien encore.</p>
      <p class="sub">Note la première chose : ce qu'Il a fait, ce que tu as fait, ou ce que quelqu'un a fait.</p>
      <div class="stack gap12" style="padding-top:10px">
        <button class="btn solid" data-go="note">Noter quelque chose</button>
        <button class="btn quiet" data-act="demo" style="align-self:flex-start">Voir un exemple</button>
      </div></div>`;
    return;
  }
  const r=remontee();
  let h=`<div class="stack gap20" style="padding-top:34px"><p class="meta">${d}</p>`;
  if(!r){
    h+=`<p class="serif" style="font-size:26px;margin-top:14px">Rien ne revient aujourd'hui.</p>
        <p class="sub">Tout ce qu'Il a fait a reçu quelque chose de toi. Note la suite quand elle vient.</p>`;
  } else if(r.type==="anniv"){
    const a=ansDepuis(r.n);
    const intro = r.n.act==="gens" ? "Il est passé par "+esc(gensNom(r.n.gid))+"&nbsp;:"
                 : (r.n.man==="parle" ? "Dieu t'a dit ceci&nbsp;:" : "Dieu a fait ceci&nbsp;:");
    h+=`<button class="stack gap16" data-node="${r.n.id}" style="border:0;background:none;text-align:left;padding:0;margin-top:12px;color:inherit">
      <span>Il y a ${a} an${a>1?"s":""} jour pour jour,<br>${intro}</span>
      <span class="serif ${estParole(r.n)?"voix":""}" style="font-size:27px">${esc(r.n.txt)}</span>
      <span style="color:var(--accent);font-weight:500;display:flex;align-items:center;gap:8px;min-height:44px">${enfants(r.n.id).some(e=>e.act==="moi")?"Tu y as répondu":"Tu n'as rien fait pour cela"} →</span>
    </button>`;
  } else if(r.type==="prevu"){
    h+=`<p style="margin-top:12px">Tu avais prévu ceci&nbsp;:</p>
      <p class="serif" style="font-size:27px">${esc(r.n.txt)}</p>
      <p class="meta">${esc(acteurTxt(r.n))} · pour le ${human(r.n)}</p>
      <div class="chips" style="padding-top:6px">
        <button class="btn" data-fait="${r.n.id}">C'est fait</button>
        <button class="btn quiet" data-abandon="${r.n.id}">J'y renonce</button>
      </div>`;
  } else {
    h+=`<button class="stack gap16" data-node="${r.n.id}" style="border:0;background:none;text-align:left;padding:0;margin-top:12px;color:inherit">
      <span>Tu n'as jamais rien rendu pour ceci&nbsp;:</span>
      <span class="serif ${estParole(r.n)?"voix":""}" style="font-size:27px">${esc(r.n.txt)}</span>
      <span class="meta">${esc(acteurTxt(r.n))} · ${human(r.n)}</span>
      <span style="color:var(--accent);font-weight:500;min-height:44px;display:flex;align-items:center">Y répondre →</span>
    </button>`;
  }
  h+=`</div>`;
  main.innerHTML=h;
}

/* --- Ses œuvres --- */
function vOeuvres(){
  const list=dieuNodes().slice().sort(parDate);
  const fl=["tout","parle","pourvu","ouvert","delivre","repris"];
  let h=`<div class="stack gap16" style="padding-top:30px">
    <div><h1>Ses œuvres</h1><p class="sub">${list.length} fois, par Lui-même ou par une main.</p></div>
    <div class="chips">${fl.map(f=>`<button class="chip" data-filtre="${f}" aria-pressed="${S.filtre===f}">${f==="tout"?"Tout":MAN[f]}</button>`).join("")}</div>`;
  const vus=S.filtre==="tout"?list:list.filter(n=>n.man===S.filtre);
  if(!vus.length) h+=`<p class="empty">Rien sous ce filtre.</p>`;
  let an=null;
  h+=`<div class="stack">`;
  vus.forEach(n=>{
    const y=(parse(n.date)||{y:"?"}).y;
    if(y!==an){ an=y; h+=`<h2 style="margin:22px 0 0">${y}</h2>`; }
    const qui = n.act==="gens" ? `<span class="meta" style="display:block;margin-top:4px">par ${esc(gensNom(n.gid))}</span>` : "";
    h+=`<button class="item" data-node="${n.id}"><span class="row"><span><span class="serif ${estParole(n)?"voix":""}" style="font-size:17.5px">${esc(n.txt)}</span>${qui}</span><span class="tag">${manCourt(n.man)}</span></span></button>`;
  });
  h+=`</div><div class="sep"></div></div>`;
  main.innerHTML=h;
}

/* --- Révélations --- */
function vRevel(){
  const o=[["noms","Les noms de Dieu"],["gens","Les personnes"],["chiffres","Les chiffres"]];
  let h=`<div class="stack gap16" style="padding-top:30px">
    <div><h1>Révélations</h1><p class="sub">Ce que tout cela t'a fait connaître de Lui.</p></div>
    <div class="chips">${o.map(([k,l])=>`<button class="chip" data-rev="${k}" aria-pressed="${S.rev===k}">${l}</button>`).join("")}</div><div class="stack">`;
  if(S.rev==="noms"){
    if(!db.noms.length) h+=`<p class="empty">Aucun nom encore. Ils viennent en relisant.</p>`;
    db.noms.forEach(nm=>{
      h+=`<div class="item"><span class="row"><span class="serif voix" style="font-size:17.5px">${esc(nm.txt)}</span><span class="tag"><span class="ok">${(nm.nodes||[]).length||"—"}</span> <button class="btn quiet" data-delnom="${nm.id}" aria-label="Retirer ce nom" style="min-height:32px;padding:0 6px">×</button></span></span></div>`;
    });
    h+=`<div class="sep"></div><div style="padding-top:18px"><label class="lbl" for="newNom">Comment Il t'a traité&nbsp;? → un nom</label><input class="field" id="newNom" placeholder="« Celui qui… »"><button class="btn" style="margin-top:12px" data-act="addNom">Garder ce nom</button></div>`;
  } else if(S.rev==="gens"){
    if(!db.gens.length) h+=`<p class="empty">Personne encore.</p>`;
    db.gens.forEach(g=>{
      const par=db.nodes.filter(n=>n.gid===g.id).length;
      const dit=db.nodes.filter(n=>n.act==="moi"&&n.dest==="gens"&&n.dgid===g.id).length;
      h+=`<div class="item"><span style="font-size:17px">${esc(g.nom)}</span>
        <span class="meta" style="display:block;margin-top:4px">${par?("Il est passé par lui "+par+" fois."):"Rien de Lui par lui, encore."} ${dit?("Tu lui as rendu "+dit+" chose"+(dit>1?"s":"")+"."):"Tu ne lui as rien rendu."}</span></div>`;
    });
    h+=`<div class="sep"></div>`;
  } else {
    chiffres().forEach(t=>{ h+=`<p class="item">${t}</p>`; });
    h+=`<div class="sep"></div><p class="sub" style="padding-top:16px">Aucune moyenne n'est un jugement.</p>`;
  }
  h+=`</div><div style="padding-top:24px"><button class="btn quiet" data-go="data" style="padding:0">Mes données →</button></div></div>`;
  main.innerHTML=h;
}
function chiffres(){
  const out=[], dn=dieuNodes();
  const prem=dn.map(n=>n.date).filter(Boolean).sort()[0];
  out.push(`Il a agi <b>${dn.length}</b> fois${prem?(", depuis "+(parse(prem)||{y:"?"}).y):""}.`);
  if(dn.length){
    const sansR=dn.filter(n=>!enfants(n.id).some(e=>e.act==="moi")).length;
    out.push(sansR ? `<b>${sansR}</b> de ses actes n'ont jamais rien reçu de toi.`
                   : `Chacun de ses actes a reçu quelque chose de toi.`);
  }
  const mien=db.nodes.filter(n=>n.act==="moi");
  if(mien.length){
    out.push(`Tu as posé <b>${mien.length}</b> acte${mien.length>1?"s":""} : ${mien.filter(n=>n.dest==="dieu").length} pour Lui, ${mien.filter(n=>n.dest==="gens").length} pour d'autres, ${mien.filter(n=>n.dest==="moi").length} pour toi.`);
    const yrs={};
    mien.forEach(n=>{ const p=parse(n.date); if(!p) return; yrs[p.y]=yrs[p.y]||{t:0,moi:0}; yrs[p.y].t++; if(n.dest==="moi") yrs[p.y].moi++; });
    const ks=Object.keys(yrs).sort();
    if(ks.length>=2){
      const a=yrs[ks[0]], b=yrs[ks[ks.length-1]];
      /* Une proportion ne veut rien dire sur deux ou trois actes. */
      if(a.t>=5 && b.t>=5) out.push(`En ${ks[0]}, ${Math.round(100*a.moi/a.t)}% de tes actes étaient pour toi. En ${ks[ks.length-1]}, ${Math.round(100*b.moi/b.t)}%.`);
    }
  }
  const par={};
  db.nodes.forEach(n=>{ if(n.act==="gens"&&n.gid) par[n.gid]=(par[n.gid]||0)+1; });
  const top=Object.keys(par).sort((a,b)=>par[b]-par[a])[0];
  if(top) out.push(`Dieu est passé <b>${par[top]}</b> fois par ${esc(gensNom(top))}.`);
  return out;
}

/* ---------- dictée ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recId=null, recBase="";
const MICSVG = `<svg class="pt" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>`;
function micBloc(id){
  if(!SR) return `<p class="sub" style="margin-top:9px">Tu peux dicter : touche le micro de ton clavier.</p>`;
  return `<div class="chips" style="margin-top:10px"><button class="chip" data-mic="${id}">${MICSVG} Dicter</button></div>`;
}
function micArret(){
  if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} }
  rec=null; recId=null;
  [].forEach.call(document.querySelectorAll("[data-mic]"),b=>{ b.classList.remove("rec"); b.innerHTML=MICSVG+" Dicter"; });
}
function micBascule(id){
  if(!SR) return;
  if(rec && recId===id) return micArret();
  micArret();
  const el=document.getElementById(id); if(!el) return;
  recBase = el.value ? el.value.replace(/\s+$/,"")+" " : "";
  try{ rec=new SR(); }catch(e){ return toast("Dictée indisponible ici"); }
  rec.lang="fr-FR"; rec.interimResults=true; rec.continuous=true;
  rec.onresult=e=>{
    let s="";
    for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript;
    el.value=recBase+s;
    el.dispatchEvent(new Event("input",{bubbles:true}));
  };
  rec.onerror=ev=>{
    const m={"not-allowed":"Micro refusé — autorise-le dans les réglages","service-not-allowed":"Dictée indisponible ici","no-speech":"Je n'ai rien entendu"};
    toast(m[ev.error]||"Dictée indisponible ici"); micArret();
  };
  rec.onend=()=>micArret();
  try{ rec.start(); }catch(e){ return toast("Dictée indisponible ici"); }
  recId=id;
  const b=document.querySelector('[data-mic="'+id+'"]');
  if(b){ b.classList.add("rec"); b.innerHTML=MICSVG+" J'écoute… toucher pour arrêter"; }
}

/* ---------- actions ---------- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-go],[data-node],[data-filtre],[data-rev],[data-qui],[data-dest],[data-gens],[data-par],[data-man],[data-eman],[data-etat],[data-pour],[data-agid],[data-sug],[data-mic],[data-act],[data-attach],[data-lierview],[data-fait],[data-abandon],[data-delnom],[data-back],[data-step]");
  if(!t) return;
  const g=t.dataset;
  if(g.go){ S.view=g.go; if(g.go==="note"){S.step=0;S.draft=null;} return render(); }
  if(g.back||g.step==="-1"){
    if(S.view==="note"){ if(S.step<=0){S.view="today";} else {S.step=prevStep();} }
    else if(S.view==="lier"||S.view==="attach"){ S.view="node"; }
    else { S.view = S.prev||"today"; }
    S.edit=false; S.del=false; return render();
  }
  if(g.node){ S.prev=(S.view==="node"||S.view==="lier"||S.view==="attach")?S.prev:S.view; S.nodeId=g.node; S.view="node"; S.edit=false; S.del=false; return render(); }
  if(g.lierview){ S.nodeId=g.lierview; S.view="lier"; return render(); }
  if(g.attach){ S.nodeId=g.attach; S.view="attach"; S.aPour="dieu"; S.aEtat="fait"; S.aPrec="j"; S.aGid=null; return render(); }
  if(g.filtre){ S.filtre=g.filtre; return render(); }
  if(g.rev){ S.rev=g.rev; return render(); }
  if(g.qui){ S.draft=neuf(g.qui); S.step=(g.qui==="dieu")?3:1; return render(); }
  if(g.dest){ S.draft.dest=g.dest; S.step=(g.dest==="gens")?2:3; return render(); }
  if(g.gens){ S.draft[g.champ]=g.gens; S.step=3; return render(); }
  if(g.mic){ return micBascule(g.mic); }
  if(g.sug){ const e=document.getElementById("aq"); if(e){ e.value=g.sug; e.focus(); e.dispatchEvent(new Event("input",{bubbles:true})); } return; }
  /* ces choix-là ne redessinent pas : le clavier et la saisie restent en place */
  if(g.man){ S.draft.man=(S.draft.man===g.man?"":g.man);
    [].forEach.call(document.querySelectorAll("#mChips .chip"),c=>c.setAttribute("aria-pressed", c.dataset.man===S.draft.man)); return; }
  if(g.eman){ S.eMan=(S.eMan===g.eman?"":g.eman);
    [].forEach.call(document.querySelectorAll("#eMan .chip"),c=>c.setAttribute("aria-pressed", c.dataset.eman===S.eMan)); return; }
  if(g.etat){
    const box=t.closest(".chips"), cible=box?box.id:"";
    if(cible==="nDateEtat"&&S.draft) S.draft.etat=g.etat;
    if(cible==="aDateEtat") S.aEtat=g.etat;
    if(cible==="eDateEtat") S.eEtat=g.etat;
    [].forEach.call(box.querySelectorAll(".chip"),c=>c.setAttribute("aria-pressed", c.dataset.etat===g.etat)); return; }
  if(g.pour){ S.aPour=g.pour;
    const el=document.getElementById("aGens"); if(el) el.hidden=(g.pour!=="gens");
    [].forEach.call(document.querySelectorAll("#aPour .chip"),c=>c.setAttribute("aria-pressed", c.dataset.pour===g.pour)); return; }
  if(g.agid){ S.aGid=g.agid;
    [].forEach.call(document.querySelectorAll("#aGensList .chip"),c=>c.setAttribute("aria-pressed", c.dataset.agid===g.agid)); return; }
  if(g.par){
    if(S.view==="lier"){ const n=node(S.nodeId); if(!n) return; n.par=n.par||[];
      const i=n.par.indexOf(g.par); i===-1?n.par.push(g.par):n.par.splice(i,1); save(); }
    else { const i=S.draft.par.indexOf(g.par); i===-1?S.draft.par.push(g.par):S.draft.par.splice(i,1); }
    return render(); }
  if(g.fait){ const n=node(g.fait); if(n){ n.etat="fait"; n.prevuLe=n.date; n.date=today(); n.prec="j"; save(); toast("Fait."); } return render(); }
  if(g.abandon){ const n=node(g.abandon); if(n){ n.etat="abandon"; save(); toast("Noté."); } return render(); }
  if(g.delnom){ db.noms=db.noms.filter(x=>x.id!==g.delnom); save(); return render(); }
  if(g.act) return actions[g.act] && actions[g.act]();
});
function prevStep(){ const d=S.draft; if(S.step===3) return (d.act==="dieu")?0:(d.act==="moi"&&d.dest==="gens"?2:1); if(S.step===2) return 1; if(S.step===5) return 4; if(S.step===4) return 3; return 0; }
function saveTxt(){ const e=document.getElementById("nTxt"); if(e&&S.draft) S.draft.txt=e.value; }
function valDate(id){ const e=document.getElementById(id); return (e&&e.value)?e.value:today(); }

const actions={
  demo(){ seed(); save(); toast("Exemple chargé"); render(); },
  addGens(){ const id=gensId((document.getElementById("newGens")||{}).value); if(!id) return toast("Écris un nom"); S.draft.gid=id; save(); S.step=3; render(); },
  addGens2(){ const id=gensId((document.getElementById("newGens")||{}).value); if(!id) return toast("Écris un nom"); S.draft.dgid=id; save(); S.step=3; render(); },
  addNom(){ const v=((document.getElementById("newNom")||{}).value||"").trim(); if(!v) return toast("Écris le nom"); db.noms.push({id:"p"+(db.seq++),txt:v,nodes:[]}); save(); render(); },
  addProm(){
    const v=((document.getElementById("newProm")||{}).value||"").trim();
    if(!v) return toast("Écris la promesse");
    const n={id:nid(),act:"dieu",gid:null,dest:null,dgid:null,txt:v,man:"",kind:"ecriture",ref:"",date:today(),prec:"j",etat:"fait",par:[]};
    db.nodes.push(n);
    if(S.view==="lier"){ const c=node(S.nodeId); if(c){ c.par=c.par||[]; c.par.push(n.id); } }
    else if(S.draft){ S.draft.par.push(n.id); }
    save(); toast("Liée."); render();
  },
  toParents(){ saveTxt(); if(!S.draft.txt.trim()) return toast("Écris quelque chose"); S.step=4; render(); },
  toQuand(){ S.step=5; render(); },
  precnDate(){ S.draft.date=valDate("nDate"); S.draft.prec=(S.draft.prec==="m")?"j":"m"; render(); },
  precaDate(){ S.aDate=valDate("aDate"); S.aPrec=(S.aPrec==="m")?"j":"m"; render(); },
  preceDate(){ S.eDate=valDate("eDate"); S.ePrec=(S.ePrec==="m")?"j":"m"; render(); },
  saveNote(){
    const d=S.draft;
    const n={id:nid(),act:d.act,gid:d.gid,dest:d.act==="moi"?d.dest:null,dgid:d.dgid,txt:d.txt.trim(),man:d.man,
      kind:(d.act==="dieu"&&d.man==="parle")?"rhema":"acte",
      date:valDate("nDate"),prec:d.prec||"j",etat:d.act==="moi"?(d.etat||"fait"):"fait",par:d.par.slice()};
    db.nodes.push(n); save(); S.draft=null; S.step=0; S.view="node"; S.nodeId=n.id; S.prev="today"; S.edit=false; S.del=false; toast("Gardé."); render();
  },
  saveAttach(){
    const q=((document.getElementById("aq")||{}).value||"").trim();
    if(!q) return toast("Écris quelque chose");
    const pour=S.aPour||"dieu";
    let dgid=null;
    if(pour==="gens"){
      const nm=((document.getElementById("aNom")||{}).value||"").trim();
      dgid = nm ? gensId(nm) : (S.aGid||null);
      if(!dgid) return toast("Dis pour qui");
    }
    const n={id:nid(),act:"moi",gid:null,dest:pour,dgid:dgid,txt:q,man:"",kind:"acte",
      date:valDate("aDate"),prec:S.aPrec||"j",etat:S.aEtat||"fait",par:[S.nodeId]};
    db.nodes.push(n); save(); S.view="node"; S.edit=false; S.del=false; toast("Attaché."); render();
  },
  edit(){ const n=node(S.nodeId); if(!n) return; S.eMan=n.man||""; S.eEtat=n.etat||"fait"; S.ePrec=n.prec||"j"; S.edit=true; render(); },
  cancelEdit(){ S.edit=false; render(); },
  saveEdit(){
    const n=node(S.nodeId), e=document.getElementById("eTxt");
    if(n){
      if(e&&e.value.trim()) n.txt=e.value.trim();
      n.date=valDate("eDate"); n.prec=S.ePrec||"j";
      if(n.act!=="moi"){ n.man=S.eMan; if(n.kind!=="ecriture") n.kind=(n.act==="dieu"&&n.man==="parle")?"rhema":"acte"; }
      else { n.etat=S.eEtat||"fait"; }
      save(); toast("Corrigé.");
    }
    S.edit=false; render();
  },
  askDel(){ S.del=true; render(); },
  delNode(){
    const id=S.nodeId;
    db.nodes=db.nodes.filter(n=>n.id!==id);
    db.nodes.forEach(n=>{ if(n.par) n.par=n.par.filter(p=>p!==id); });
    db.noms.forEach(nm=>{ if(nm.nodes) nm.nodes=nm.nodes.filter(p=>p!==id); });
    save(); S.del=false; S.view=S.prev||"today"; toast("Supprimé."); render();
  },
  copy(){ const e=document.getElementById("dump"); e.select(); try{ navigator.clipboard.writeText(e.value).then(()=>toast("Copié"),()=>toast("Sélectionne et copie")); }catch(x){ toast("Sélectionne et copie"); } },
  restore(){ try{ const v=JSON.parse(document.getElementById("dump").value); if(!v||!Array.isArray(v.nodes)) throw 0; db=sane(v); save(); toast("Remplacé"); S.view="today"; render(); }catch(e){ toast("Ce texte n'est pas une sauvegarde"); } },
  wipe(){ db={nodes:[],gens:[],noms:[],seq:1}; save(); S.view="today"; toast("Effacé"); render(); }
};
document.getElementById("askBtn").onclick=()=>{S.view="note";S.step=0;S.draft=null;render();};

/* ---------- exemple ---------- */
function seed(){
  db={nodes:[],gens:[],noms:[],seq:1};
  const g1=gensId("Frère Thomas"), g2=gensId("Sœur Estelle");
  const y=new Date().getFullYear(), md=today().slice(4);
  const a={id:nid(),act:"dieu",txt:"« Je pourvoirai pour les tiens. »",man:"parle",kind:"rhema",date:(y-5)+"-08-02",prec:"j",etat:"fait",par:[]};
  const b={id:nid(),act:"dieu",txt:"« Ne crains pas pour la maison. Je m'en occupe. »",man:"parle",kind:"rhema",date:(y-3)+md,prec:"j",etat:"fait",par:[a.id]};
  const c={id:nid(),act:"moi",dest:"dieu",txt:"Remercier pour cette parole",man:"",kind:"acte",date:(y-3)+"-11-12",prec:"j",etat:"fait",par:[b.id]};
  const d={id:nid(),act:"gens",gid:g1,txt:"Il a prêté l'argent du loyer, sans que je demande",man:"pourvu",kind:"acte",date:(y-2)+"-03-04",prec:"j",etat:"fait",par:[a.id]};
  const e={id:nid(),act:"dieu",txt:"La maison de Nkolbisson",man:"pourvu",kind:"acte",date:(y-1)+"-09-18",prec:"j",etat:"fait",par:[a.id,b.id,d.id]};
  const f={id:nid(),act:"moi",dest:"gens",dgid:g1,txt:"Le lui dire",man:"",kind:"acte",date:(y-2)+"-03-12",prec:"j",etat:"fait",par:[d.id]};
  const h={id:nid(),act:"moi",dest:"dieu",txt:"Jeûner un jour",man:"",kind:"acte",date:y+"-12-15",prec:"j",etat:"prevu",par:[b.id]};
  const i={id:nid(),act:"moi",dest:"gens",dgid:g2,txt:"Dire à Estelle ce qu'Il a fait",man:"",kind:"acte",date:y+"-11-20",prec:"j",etat:"prevu",par:[e.id]};
  db.nodes.push(a,b,c,d,e,f,h,i);
  db.noms.push({id:"p"+(db.seq++),txt:"« Celui qui pourvoit au dernier moment »",nodes:[d.id,e.id]});
}

/* ---------- démarrage ---------- */
load(); render();
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
