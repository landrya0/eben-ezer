/* ---------- dictée ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recId=null, recTail="";
function micBloc(id){
  if(!SR) return `<p class="amorce" style="margin-top:12px">Tu peux dicter : touche le micro de ton clavier.</p>`;
  return `<div style="margin-top:14px"><button class="micro" data-mic="${id}">${MICSVG} Dicter</button></div>`;
}
function colle(a,b){ if(!a) return b; return /\s$/.test(a) ? a+b : a+" "+b; }
function micArret(){
  if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} }
  rec=null; recId=null; recTail="";
  [].forEach.call(document.querySelectorAll("[data-mic]"),b=>{ b.classList.remove("on"); b.innerHTML=MICSVG+" Dicter"; });
}
function micBascule(id){
  if(!SR) return;
  if(rec && recId===id) return micArret();
  micArret();
  const el=document.getElementById(id); if(!el) return;
  try{ rec=new SR(); }catch(e){ return toast("Dictée indisponible ici"); }
  rec.lang="fr-FR"; rec.interimResults=true; rec.continuous=true;
  /* On n'ajoute que ce qui vient d'être dit : ce que le disciple efface reste effacé. */
  rec.onresult=e=>{
    let fini="", provisoire="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) fini+=r[0].transcript; else provisoire+=r[0].transcript;
    }
    let base=el.value;
    if(recTail && base.slice(-recTail.length)===recTail) base=base.slice(0,base.length-recTail.length);
    if(fini.trim()) base=colle(base,fini.trim());
    recTail = provisoire ? (base&&!/\s$/.test(base) ? " " : "")+provisoire : "";
    el.value = base+recTail;
    el.dispatchEvent(new Event("input",{bubbles:true}));
  };
  rec.onerror=ev=>{
    const m={"not-allowed":"Micro refusé — autorise-le dans les réglages","service-not-allowed":"Dictée indisponible ici","no-speech":"Je n'ai rien entendu"};
    toast(m[ev.error]||"Dictée indisponible ici"); micArret();
  };
  rec.onend=()=>micArret();
  try{ rec.start(); }catch(e){ return toast("Dictée indisponible ici"); }
  recId=id;
  const b=document.querySelector('[data-mic="'+id+'"]');
  if(b){ b.classList.add("on"); b.innerHTML=MICSVG+" J'écoute… toucher pour arrêter"; }
}

/* ---------- saisies gardées ---------- */
/* Une note n'est pas une correction : on ne la valide pas, on l'écrit.
   Elle ne tenait qu'au bouton « Garder », et sortir par Retour la jetait
   sans un mot — or sortir par Retour est le geste naturel quand on vient
   d'écrire. Elle se garde donc d'elle-même : à la frappe, en quittant le
   champ, et en quittant l'écran (13.cd). */
let noteT=null;
function gardeNote(){
  clearTimeout(noteT); noteT=null;
  if(S.view!=="bloc") return;
  const b=blocT(S.blocId); if(!b) return;
  const av=b.note||"";
  noteBloc(b);
  if((b.note||"")!==av){ touche(b); save(); }
}
document.addEventListener("focusout", function(ev){
  if(ev.target && ev.target.id==="bNote") gardeNote();
}, true);
document.addEventListener("input", ev=>{
  const id=ev.target.id;
  if(id==="bNote"){ clearTimeout(noteT); noteT=setTimeout(gardeNote, 900); return; }
  /* Changer de livre reprend au premier chapitre non lu de ce livre-là, et
     une fin plus tôt que le début n'existe pas : l'écran se redessine, et
     les trois listes restent d'accord entre elles. */
  if(id==="luZ"){ S.luZ=+ev.target.value; return render(); }
  if(id==="pgZ"){ S.pgZ=+ev.target.value; return render(); }
  /* Un réglage d'activité, pas un état d'écran : il se garde tout seul. */
  if(id==="tDisc"){
    const t=tache(S.tchId);
    if(t){ t.d=ev.target.value; touche(t); save(); toast("Noté."); }
    return render();
  }
  if(id==="luLiv" || id==="luDeb" || id==="luFin"){
    if(!S.lu) return;
    const v=+ev.target.value;
    if(id==="luLiv"){ const d=repriseLivre(v); S.lu={li:v, d:d, f:d}; }
    else if(id==="luDeb"){ S.lu.d=v; if(S.lu.f<v) S.lu.f=v; }
    else S.lu.f=v;
    return render();
  }
  if(id==="cNeuf"){ S.cTxt=ev.target.value; return; }
  if(id==="cFiltre"){
    const q=ev.target.value.trim().toLowerCase();
    S.cQ=ev.target.value;
    let vus=0;
    [].forEach.call(document.querySelectorAll("[data-par]"), el=>{
      const li=el.closest("li")||el;
      const ok = el.getAttribute("data-sel")==="1"
              || (!!q && el.textContent.toLowerCase().indexOf(q)!==-1);
      li.hidden = !ok; if(ok) vus++;
    });
    const bloc=document.querySelector(".cands"),
          rien=document.getElementById("rien"),
          att=document.getElementById("attente");
    if(bloc) bloc.hidden = !vus;
    if(rien) rien.hidden = !(q && !vus);
    if(att)  att.hidden  = !!q || !!vus;
    return;
  }
  /* Redessiner à chaque lettre ferait sauter le curseur : on cache et on
     montre, et le clavier reste où il est. */
  if(id==="tQ"){
    const q=ev.target.value.trim().toLowerCase();
    S.tQ=ev.target.value;
    let exact=false;
    [].forEach.call(document.querySelectorAll("[data-nom]"), el=>{
      const li=el.closest("li")||el, nom=el.getAttribute("data-nom")||"";
      const ok = !q || nom.indexOf(q)!==-1;
      li.hidden=!ok; if(nom===q) exact=true;
    });
    [].forEach.call(document.querySelectorAll(".tgrp"), g=>{
      g.hidden = !g.querySelectorAll("li:not([hidden])").length;
    });
    const nf=document.getElementById("tNeuf");
    if(nf){
      nf.hidden = !q || exact;
      const b=nf.querySelector(".qn");
      if(b) b.textContent="Compter « "+cap(ev.target.value.trim())+" »";
    }
    return;
  }
  if(id==="nTxt" && S.draft){ S.draft.txt=ev.target.value; majRef(); }
  if(id==="nDesc" && S.draft) S.draft.desc=ev.target.value;
  if(id==="nDate" && S.draft) S.draft.date=ev.target.value;
});

/* ---------- gestes ---------- */
document.addEventListener("change", function(ev){
  if(ev.target.id==="tAuteur"){
    const t=tache(S.tchId);
    if(t){
      const au=auteurId(ev.target.value);
      if(t.au!==au){ t.au=au; touche(t); save(); toast(au?"Noté.":"Retiré."); }
      /* On rend le nom tel qu'il est rangé : le disciple voit tout de suite
         sous quelle orthographe son auteur a été retenu. */
      ev.target.value = au ? auteurNom(au) : "";
    }
    return;
  }
  if(ev.target.id==="medIn" || ev.target.id==="medCam" || ev.target.id==="medVid"){
    /* On recopie les fichiers AVANT de vider le champ : `files` est une liste
       vivante, attachée au champ, et la vider vide aussi ce qu'on croyait
       tenir à la main. C'est ainsi qu'une photo pouvait être prise, et
       n'arriver nulle part, sans qu'un seul mot soit dit. */
    const fs=[].slice.call(ev.target.files||[]);
    const n=node(S.nodeId);
    ev.target.value="";
    if(!fs.length) return;
    /* Et si l'acte a disparu entre-temps, on le dit : une photo prise pour
       rien doit au moins être annoncée pour rien. */
    if(!n) return toast("L'acte n'est plus ouvert : la photo n'a pas été jointe.");
    medJoint(n, fs);
    return;
  }
  if(ev.target.id!=="fin") return;
  const f=ev.target.files && ev.target.files[0];
  ev.target.value="";
  if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const v=JSON.parse(String(r.result));
      if(!v || !Array.isArray(v.nodes)) throw 0;
      const sacs=(v.med && typeof v.med==="object") ? v.med : null;
      db=sane(v); save(); S.pile=[]; S.view="today";
      toast("Repris"); render();
      /* Les fichiers joints reviennent en réserve derrière l'écran : on ne
         fait pas attendre devant une barre pour une photo. */
      if(sacs) Object.keys(sacs).reduce(function(suite, id){
        return suite.then(function(){
          const d=sacs[id]; if(!d || !d.b64) return;

/* Choisir une activité, c'est soit dire à quoi je suis maintenant, soit
   rendre à un bloc passé son vrai nom. Le même geste, deux destinations. */
function poseTache(id){
  if(!id) return;
  /* On ne crée le bloc qu'ici, quand il reçoit enfin un nom : un bloc sans
     activité, posé d'avance, resterait dans l'archive si on repartait sans
     choisir. Et on range par heure de départ, pour que le bloc en cours —
     s'il y en a un — reste le dernier, ce dont tout le compte dépend. */
  /* Un trou en attente ne doit pas détourner une correction de bloc :
     corriger, c'est désigner un bloc, et le bloc désigné passe devant. */
  if(S.trou && !S.blocId){
    const t=S.trou; S.trou=null;
    const b={id:uid("b"), t:id, deb:t.deb, maj:Date.now()};
    if(!t.vif) b.fin=t.fin;
    db.temps.push(b);
    db.temps.sort(function(a,b){ return a.deb-b.deb; });
    save();
    if(t.vif){ S.pile=[]; S.view="today"; toast("On compte : "+tacheNom(id)+", depuis "+hmin(new Date(t.deb))); return render(); }
    toast("Comblé : "+tacheNom(id)); depile("temps"); return render();
  }
  if(S.blocId){
    const b=blocT(S.blocId);
    if(b){ b.t=id; touche(b); save(); toast("Corrigé."); }
    S.blocId=null; depile("temps"); return render();
  }
  /* Toucher une activité qui tourne déjà, c'est l'arrêter — elle seule.
     C'est la seule lecture possible d'une tape sur une ligne cochée, et
     c'est ce qui permet de fermer une mission sans fermer l'autre. */
  const dejaLa=ouverts().filter(function(b){ return b.t===id; })[0];
  if(dejaLa){
    arreteUn(dejaLa); S.pile=[]; S.view="today";
    toast("Arrêté : "+tacheNom(id));
    apresArret([dejaLa]); return render();
  }
  const enPlus=!!S.enPlus;
  const chg=pointe(id, enPlus);
  save(); S.pile=[]; S.view="today";
  toast(chg ? (enPlus ? "En plus : "+tacheNom(id) : "On compte : "+tacheNom(id)) : "C'était déjà ça.");
  render();
}

  bCours(){

    const d=valHeure("bDeb", b.deb);
    if(d!==null && d<=Date.now()) b.deb=d;
    noteBloc(b);
    /* Rouvrir un bloc était refusé dès qu'un autre avait commencé après
       lui : il n'y avait qu'une file, et la rouvrir l'aurait fait mordre
       sur son suivant. Depuis qu'on mène plusieurs choses de front, mordre
       n'est plus une faute — c'est le cas même qu'on voulait servir. On a
       prié en se lavant, la toilette est finie, la prière continue : il
       faut pouvoir le dire. */
    if(b.fin){
      delete b.fin;

         gonflerait un bloc de trente secondes au moment même où l'on vient

    v.avant.forEach(function(x){ if(d>x.deb){ x.fin=d; touche(x); } });

  const noir = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", !!noir);
}
theme();
if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme); }catch(e){} }

   c'est le moment où l'autre appareil a pu parler. */

  if(document.hidden || !SY.actif) return;

/* Android fige l'orientation au moment de l'installation : la petite
   application fabriquée alors porte « portrait » dans son manifeste, et
   relire la page n'y change rien. Demander à la page de lever le verrou
   suffit parfois à rendre la rotation sans réinstaller ; quand ça ne suffit
   pas, ça ne casse rien, et il reste à retirer puis remettre l'icône. */
try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}

/* La mise à jour doit arriver sans qu'on ait à supprimer l'app.
   « updateViaCache: none » empêche le téléphone de servir un vieux sw.js ;
   on redemande une vérification à chaque fois que l'app revient à l'écran ;
   et quand un nouveau service worker prend la main, on recharge une fois. */
if("serviceWorker" in navigator){
  try{
    const avaitUnControleur = !!navigator.serviceWorker.controller;
    let recharge = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!avaitUnControleur || recharge) return;
      recharge = true; location.reload();
    });
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(function(reg){
      reg.update();
      document.addEventListener("visibilitychange", function(){
        if(!document.hidden) { try{ reg.update(); }catch(e){} }
      });
    }).catch(function(){});
  }catch(e){}
}
</script>
</body>
