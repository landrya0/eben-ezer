<style>
/* Direction « Amandier ». Les composants viennent de Framework7 ; ici, la nappe
   de lumière, le verre dépoli qui la floute, la hiérarchie des textes, et le
   rameau.

   La fleur a sa vraie couleur — écorce, feuille, pétale — mais elle reste dans
   le dessin : ce qui se touche est vert sauge, jamais rose.

   Règle de lecture, tenue partout :
   · serif            → ce qui est dit (Sa parole, les actes) et les titres de page
   · sans MAJUSCULES  → les intitulés de section, jamais autre chose
   · sans normal      → ce que l'application dit
   · couleur d'accent → uniquement ce qui se touche                              */

/* La police voyage avec l'app : sans elle, le téléphone retombe sur Georgia
   et toute la typographie change de visage. */
@font-face{font-family:'Lora';font-style:normal;font-weight:400 700;
  font-display:swap;src:url(vendor/lora-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:400 700;
  font-display:swap;src:url(vendor/lora-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,
    U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  --f7-theme-color:#4E6152;
  --f7-theme-color-rgb:78,97,82;
  --f7-theme-color-shade:#3E4E42;
  --f7-theme-color-tint:#5F7563;

  --f7-page-bg-color:#F8F5F2;
  --f7-text-color:#1D1A17;
  --f7-list-strong-bg-color:rgba(255,255,255,.66);
  --f7-block-strong-bg-color:rgba(255,255,255,.66);
  --f7-list-item-border-color:rgba(29,26,23,.11);
  --f7-list-outline-inset-border-color:rgba(29,26,23,.11);
  --f7-list-outline-border-color:rgba(29,26,23,.11);
  --f7-list-item-after-text-color:#736D66;
  --f7-list-item-text-text-color:#736D66;
  --f7-list-item-subtitle-text-color:#736D66;
  --f7-block-title-text-color:#736D66;
  --f7-block-title-font-size:11px;
  --f7-list-link-pressed-bg-color:rgba(78,97,82,.09);
  --f7-input-text-color:#1D1A17;

  --muted:#736D66;
  --voix:#2C332C;
  --filet:rgba(29,26,23,.12);
  --verre:rgba(255,255,255,.66);
  --eclat:rgba(255,255,255,.92);
  --barre:rgba(255,255,255,.72);
  --ombre:0 1px 0 var(--eclat) inset, 0 12px 32px -20px rgba(40,28,20,.6);
  --lueur:rgba(78,97,82,.5);
  --flou:blur(22px) saturate(175%);
  /* la nappe de lumière : rose d'un côté, vert de l'autre, très diffus */
  --nappe:radial-gradient(78% 42% at 96% 0%,#F3E7E3 0%,transparent 62%),
          radial-gradient(78% 40% at 0% 94%,#EAEFE6 0%,transparent 60%);
  /* le rameau */
  --br:#6B5244; --fe:#D9DECF; --pe:#EFD4CE;
}
.dark{
  --f7-theme-color:#9DB7A4;
  --f7-theme-color-rgb:157,183,164;
  --f7-theme-color-shade:#8BA793;
  --f7-theme-color-tint:#B2C7B7;

  --f7-page-bg-color:#13100E;
  --f7-text-color:#EEE9E3;
  --f7-list-strong-bg-color:rgba(255,255,255,.065);
  --f7-block-strong-bg-color:rgba(255,255,255,.065);
  --f7-list-item-border-color:rgba(238,233,227,.11);
  --f7-list-outline-inset-border-color:rgba(238,233,227,.11);
  --f7-list-outline-border-color:rgba(238,233,227,.11);
  --f7-list-item-after-text-color:#99918A;
  --f7-list-item-text-text-color:#99918A;
  --f7-list-item-subtitle-text-color:#99918A;
  --f7-block-title-text-color:#99918A;
  --f7-list-link-pressed-bg-color:rgba(255,255,255,.07);
  --f7-list-group-title-bg-color:transparent;
  --f7-list-group-title-text-color:#99918A;
  --f7-actions-button-border-color:rgba(238,233,227,.11);
  --f7-actions-label-text-color:#99918A;
  --f7-input-text-color:#EEE9E3;
  --f7-bars-text-color:#EEE9E3;

  --muted:#99918A;
  --voix:#E3E8DF;
  --filet:rgba(238,233,227,.12);
  --verre:rgba(255,255,255,.065);
  --eclat:rgba(255,255,255,.13);
  --barre:rgba(19,16,14,.62);
  --ombre:0 1px 0 var(--eclat) inset, 0 12px 32px -20px rgba(0,0,0,.9);
  --lueur:rgba(157,183,164,.35);
  --nappe:radial-gradient(78% 42% at 96% 0%,#2A1E1B 0%,transparent 62%),
          radial-gradient(78% 40% at 0% 94%,#161C16 0%,transparent 60%);
  --br:#9A7A66; --fe:#3B4639; --pe:#C9A49C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;position:relative;
  background:var(--f7-page-bg-color);font-family:var(--sans)}
/* la nappe, derrière tout, fixe : c'est elle que le verre floute */
body::before{content:"";position:fixed;inset:0;z-index:0;background:var(--nappe);
  pointer-events:none}
.verre{background:var(--verre);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}

/* ---------- hiérarchie des textes ---------- */
/* Une tranche de temps ne se sépare pas de la suivante comme deux actes se
   séparent l'un de l'autre : c'est elle qui découpe la lecture. */
.block-title.ecart{margin-top:42px}
.block-title{font-family:var(--sans);font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;font-size:11px;color:var(--f7-block-title-text-color);
  margin-top:28px;margin-bottom:9px}
.titre-page{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.006em;
  margin:20px 16px 3px;line-height:1.2;color:var(--f7-text-color)}
.ssTitre{margin:0 16px 4px;font-size:13px;color:var(--muted);line-height:1.5}
.grand{font-family:var(--sans);font-size:21px;font-weight:500;line-height:1.4;
  letter-spacing:-.002em;margin:0;color:var(--f7-text-color);
  border-left:2px solid var(--filet);padding-left:15px}
.grand.voix{color:var(--voix);border-left-color:var(--f7-theme-color)}
.voix{color:var(--voix)}
/* Partout où du texte d'acte s'affiche, ce qui est entre guillemets passe
   en romaine, et lui seul. */
.cite{font-family:var(--serif);font-weight:400;letter-spacing:.006em;color:var(--voix)}
.grand .cite{font-size:1.04em;line-height:1.5}
.meta{font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.015em;
  color:var(--muted);margin:13px 0 0 17px;line-height:1.5}
.amorce{font-family:var(--sans);font-size:14.5px;line-height:1.52;color:var(--muted);margin:0}
/* Le code de récupération : fait pour être recopié à la main, donc grand,
   espacé, et à chasse fixe pour qu'aucun signe n'en imite un autre. */
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;
  line-height:1.9;letter-spacing:.06em;font-weight:600;text-align:center;
  color:var(--f7-text-color);word-break:break-all;-webkit-user-select:all;user-select:all}
.list .item-title{font-family:var(--sans);font-size:16px;font-weight:500;line-height:1.35;
  white-space:normal;color:var(--f7-text-color)}
.list .item-title.serif{font-family:var(--serif);font-weight:400;font-size:16px;
  line-height:1.5;letter-spacing:.006em;color:var(--voix)}
.list .item-subtitle{font-family:var(--sans);font-size:13px;font-weight:400;
  white-space:normal;margin-top:3px;letter-spacing:.005em}
.list .item-text{font-family:var(--sans);font-size:13.5px;line-height:1.45;
  white-space:normal;overflow:visible;-webkit-line-clamp:4;margin-top:4px}
.list .item-after{font-family:var(--sans);font-size:12.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;flex-shrink:0;align-self:flex-start;padding-top:4px}
.list .item-inner{align-items:flex-start}
/* Une ligne d'acte, la même partout : la pastille de l'acteur, deux lignes
   de texte au plus — le reste est sur l'écran de l'acte — puis le pied qui
   dit qui a agi, de quelle manière et quand. Pas de chevron : la ligne
   entière se touche, et le répéter treize fois n'ajoute rien. */
.list .acte .item-inner{display:flex;align-items:flex-start;gap:11px;
  padding-top:15px;padding-bottom:15px;padding-right:15px;min-height:0}
.list .acte .item-inner::before{display:none}
.acte .pt{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px;
  box-sizing:border-box}
.acte .pt.lui{background:var(--f7-theme-color);border:2px solid var(--f7-theme-color)}
.acte .pt.moi{background:transparent;border:2px solid var(--muted)}
.acte .pt.gens{background:var(--muted);border:2px solid var(--muted)}
.acte .corps{flex:1 1 auto;min-width:0;display:block}
.acte .ph{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-family:var(--sans);font-size:15.5px;font-weight:500;
  line-height:1.42;color:var(--f7-text-color)}
.acte .ph .cite{font-size:16px;line-height:1.5}
.acte .pied{display:block;font-family:var(--sans);font-size:12px;line-height:1.45;
  color:var(--muted);margin-top:6px}
.acte .coche{flex:0 0 auto;margin-top:3px}
.lien .item-title{color:var(--f7-theme-color);font-weight:600}
.coche{color:var(--f7-theme-color);font-weight:700}
.vide{margin:0;padding:13px 16px;color:var(--muted);font-size:14.5px;font-style:italic}
.rien{color:var(--muted);font-style:italic;font-weight:400}

/* Un chemin : un filet vertical, et des pastilles qui disent qui a parlé.
   Aucun trait n'est tracé entre les actes — les convergences se lisent
   dans le « après : … », pas dans un dessin (14.5-bis.b). */
.fil{position:relative;margin:14px 16px 4px;padding-left:25px}
.fil::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;
  width:1px;background:var(--filet)}
.pas{display:block;position:relative;padding:13px 0;color:inherit;text-decoration:none}
.pas::before{content:"";position:absolute;left:-25px;top:17px;width:11px;height:11px;
  border-radius:50%;box-sizing:border-box;background:var(--f7-page-bg-color)}
.pas.dieu::before{background:var(--f7-theme-color);border:2px solid var(--f7-theme-color)}
.pas.moi::before{border:2px solid var(--muted)}
.pas.gens::before{background:var(--muted);border:2px solid var(--muted)}
.pas .dit{display:block;font-family:var(--sans);font-size:16px;font-weight:500;
  line-height:1.4;color:var(--f7-text-color)}
.pas .dit .cite{font-size:17px;line-height:1.5}
.pas .sous{display:block;font-family:var(--sans);font-size:12.5px;font-weight:500;
  letter-spacing:.015em;color:var(--muted);margin-top:5px}
/* La phrase est la voix, la description est le commentaire : deux fontes,
   pour qu'on ne les confonde pas d'un coup d'œil (13.q). */
.dicte.petit{font-family:var(--sans);font-size:15.5px;line-height:1.55;letter-spacing:0}
.desc{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--muted);
  margin:14px 0 0 17px;white-space:pre-wrap}
.pas .apres{display:block;font-family:var(--sans);font-size:12.5px;line-height:1.45;
  color:var(--muted);margin-top:4px;font-style:italic}
/* Ce qui est prévu n'a pas encore eu lieu : le point reste creux et pointillé,
   le texte se retire d'un cran, et une étiquette le dit en toutes lettres. */
.pas.prevu::before{background:transparent;border:2px dashed var(--muted)}
.pas.prevu .dit{color:var(--muted)}
.etiq{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--filet);border-radius:9px;padding:1px 7px;margin-right:7px;
  vertical-align:1px}
.fil .coupure{position:relative;margin:18px 0 2px;font-family:var(--sans);font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--muted)}
.fil .coupure::before{content:"";position:absolute;left:-25px;top:-9px;width:11px;height:1px;
  background:var(--filet)}

/* les groupes sont en verre, posés sur la nappe */
.list.inset>ul{-webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  box-shadow:var(--ombre)}

/* ---------- le rameau d'amandier ---------- */
/* Deux emplacements seulement : le filigrane d'un écran, la marque de l'accueil. */
.rameau{display:block;pointer-events:none}
.filigrane{position:absolute;top:-10px;right:-22px;width:118px;opacity:.3;z-index:0}
.marque{width:60px;margin:6px 0 2px 13px;opacity:1}

/* ---------- charpente : les barres passent par-dessus le contenu ---------- */
#main{position:absolute;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#haut{position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:4px;min-height:52px;
  padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;
  background:var(--barre);border-bottom:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#haut[hidden]{display:none}
/* Sur un écran de liste, ce n'est pas une barre : c'est l'en-tête de la page,
   qui porte son nom et ses commandes et ne bouge pas pendant qu'on parcourt.
   La liste glisse dessous, derrière le verre dépoli. */
#haut.libre{display:block;min-height:0;
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
/* Une en-tête ne se fige que si elle commande la liste : des filtres, des
   onglets, un compte qui suit le filtre. Celle d'Aujourd'hui ne commande rien
   — elle ne faisait que retenir un quart de l'écran pendant qu'on fait
   défiler. Elle défile donc avec le reste, et l'écran revient au contenu. */
.entete{display:block;padding:0 0 10px}
#haut.libre .titre-page, .entete .titre-page{margin:0 16px 2px}
#haut.libre .marque, .entete .marque{margin:0 0 4px 13px}
#haut.libre .ssTitre, .entete .ssTitre{margin:0 16px 0}
#haut.libre .ptitre{margin:12px 16px -2px}
#haut.libre .puces{padding:10px 16px 0}
#haut.libre .puces.suite{padding-top:0}
#haut.libre .plier{margin:11px 16px 0;background:none;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--filet)}
#haut .t{flex:1 1 auto;min-width:0;text-align:center;font-size:16px;font-weight:600;
  letter-spacing:-.01em;color:var(--f7-text-color);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#haut button{flex:0 0 auto;width:auto;min-width:46px;min-height:44px;border:0;background:none;
  color:var(--f7-theme-color);display:flex;align-items:center;justify-content:center;gap:2px;
  font-size:16px;padding:0 6px;cursor:pointer}
#haut button[disabled]{opacity:0;pointer-events:none}

#avance{position:absolute;left:0;right:0;z-index:21;height:2px;background:var(--filet)}
#avance[hidden]{display:none}
#avance i{display:block;height:100%;background:var(--f7-theme-color);transition:width .25s ease}

#bas{position:absolute;left:0;right:0;bottom:0;z-index:20}
#acte{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--barre);border-top:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#acte[hidden]{display:none}
#acte.surNav{padding-bottom:10px}
#acte .button{width:100%;font-weight:600;letter-spacing:.005em;box-shadow:var(--ombre)}
/* La même phrase écrite en travers des quatre onglets finit par n'être plus
   lue : c'est un bandeau, pas une invitation. Le geste tient dans un rond,
   posé au pouce droit, et le bas de l'écran redevient calme. La phrase
   revient là où l'archive est vide — c'est le seul moment où il faut encore
   dire quoi faire. */
#acte.geste{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:8px 16px 12px;
  background:none;border-top:0;-webkit-backdrop-filter:none;backdrop-filter:none}
#acte.geste.surNav{padding-bottom:12px}
/* La pastille : le geste discret, mais il garde son mot.
   Les autres boutons de l'application sont translucides parce qu'ils ont
   toujours eu une barre de verre dépoli derrière eux. La pastille flotte
   seule au-dessus de la liste : translucide, elle laissait passer le texte
   d'une ligne sous elle, et on lisait « Aller travailler » à travers le mot
   « Noter ». Un bouton qui flotte est opaque. */
#acte .pastille{display:inline-flex;align-items:center;gap:8px;
  height:52px;padding:0 22px 0 18px;border-radius:26px;
  background:var(--f7-theme-color);color:#fff;
  font-family:var(--sans);font-size:15.5px;font-weight:600;letter-spacing:.004em;
  box-shadow:0 12px 28px -12px rgba(26,42,32,.55);cursor:pointer}
#acte .pastille svg{display:block;width:19px;height:19px;flex:0 0 auto}
.dark #acte .pastille{background:#2B3129;color:#C8DFCE;
  border:1px solid rgba(157,183,164,.46);
  box-shadow:0 1px 0 var(--eclat) inset, 0 14px 30px -12px #000}
.dark #acte .button-fill{background:rgba(157,183,164,.17);color:#C4DCCA;
  border:1px solid rgba(157,183,164,.42);box-shadow:0 1px 0 var(--eclat) inset,
  0 10px 26px -14px var(--lueur)}

#nav{display:flex;
  background:var(--barre);border-top:1px solid var(--filet);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#nav[hidden]{display:none}
#nav button{flex:1 1 0;min-height:52px;border:0;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.004em;
  color:var(--muted);padding:7px 2px 6px;cursor:pointer}
#nav button svg{display:block;width:23px;height:23px;flex:0 0 auto}
#nav button span{display:block;white-space:nowrap}
#nav button[aria-current="page"]{color:var(--f7-theme-color);font-weight:700}
/* L'onglet où l'on est a le trait un peu plus appuyé : la couleur seule ne
   suffit pas à tous les yeux. */
#nav button[aria-current="page"] svg{stroke-width:1.8}

/* ---------- ce qui revient : des cartes qui défilent ---------- */
.carr{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carr::-webkit-scrollbar{display:none}
.carte{scroll-snap-align:center;flex:0 0 87%;display:flex;flex-direction:column;
  background:var(--verre);border:1px solid var(--filet);border-radius:18px;
  padding:19px 19px 17px;box-shadow:var(--ombre);text-decoration:none;color:inherit;
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  -webkit-tap-highlight-color:transparent}
.carte:active{transform:scale(.985)}
.carte .quand{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--f7-theme-color)}
/* Les cartes se tiennent côte à côte : la plus longue impose sa hauteur à
   toutes. Une phrase de douze lignes laissait donc sept cartes aux trois
   quarts vides, et une seule chose visible à l'écran au lieu de trois. On
   borne ce qui se lit d'un coup d'œil ; la phrase entière est dans l'acte,
   à un doigt. */
.carte .grand{font-size:20px;line-height:1.44;padding-left:13px;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.carte .meta{margin:12px 0 0 15px}
.points{display:flex;justify-content:center;gap:6px;padding:2px 0 4px}
.points i{width:6px;height:6px;border-radius:50%;background:var(--filet);transition:background .2s}
.points i.on{background:var(--f7-theme-color)}

/* ---------- le compteur : toujours là, toujours vrai ---------- */
/* Il ne dit qu'une chose — à quoi va le temps en ce moment — et il la dit
   sans qu'on ait rien à ouvrir. Le point bat tant que le compte est vivant ;
   il se creuse quand le bloc dure depuis trop longtemps pour être honnête,
   et le chiffre pâlit avec lui. Aucun mot de reproche : un signe suffit. */
#chrono{flex:1 1 auto;min-width:0;display:block}
.tic{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 15px;
  border-radius:26px;background:var(--verre);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  box-shadow:var(--ombre);color:inherit;text-decoration:none}
.tic:active{transform:scale(.985)}
.tic .pt{flex:0 0 auto;width:9px;height:9px;border-radius:50%;
  background:var(--f7-theme-color);animation:pouls 2.8s ease-in-out infinite}
.tic .pt.creux,.tic.vieux .pt{background:transparent;border:1.5px solid var(--muted);
  animation:none;box-shadow:none}
.tic .quoi{flex:1 1 auto;min-width:0;font-family:var(--sans);font-size:14.5px;font-weight:600;
  letter-spacing:.004em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tic .dur{flex:0 0 auto;font-family:var(--sans);font-size:13.5px;font-weight:700;
  letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--f7-theme-color)}
.tic.vieux .dur{color:var(--muted)}
@keyframes pouls{0%,100%{box-shadow:0 0 0 0 var(--lueur)}50%{box-shadow:0 0 0 6px transparent}}
.dark .tic{background:#20241F;border:1px solid rgba(157,183,164,.26)}

/* ---------- la part de chacun ---------- */
/* Des heures d'abord, la part ensuite, et une barre pour que l'œil saisisse
   d'un coup ce que le chiffre met une seconde à dire. */
.tps{margin:2px 16px 0}
.tl{padding:12px 0 13px;border-bottom:1px solid var(--filet)}
.tl:last-child{border-bottom:0}
.tn{display:block;font-family:var(--sans);font-size:15.5px;font-weight:600;letter-spacing:.004em}
.tv{display:flex;align-items:baseline;gap:9px;margin-top:3px;
  font-family:var(--sans);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tv b{font-size:14px;font-weight:700;color:var(--f7-theme-color);letter-spacing:.01em}
.tj{display:block;height:5px;margin-top:8px;border-radius:3px;background:var(--filet);overflow:hidden}
.tj i{display:block;height:100%;min-width:3px;border-radius:3px;background:var(--f7-theme-color)}

/* ---------- puces de filtre ---------- */
.puces{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.puces.suite{padding-top:0}
/* Trois rangs de pastilles mangeaient l'écran avant la première œuvre.
   Repliés, ils tiennent sur une ligne qui dit ce qui est filtré. */
.plier{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);
  margin:14px 16px 0;padding:10px 14px;border:0;border-radius:15px;
  background:var(--barre);-webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  box-shadow:var(--ombre);font-family:var(--sans);font-size:13px;line-height:1.35;
  color:var(--muted);text-align:left;cursor:pointer}

.plier b{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;
  color:var(--f7-theme-color);flex:0 0 auto}
.plier .q{flex:1 1 auto;min-width:0}
.plier .ch{flex:0 0 auto;transition:transform .2s;color:var(--muted)}
.plier[aria-expanded="true"] .ch{transform:rotate(180deg)}
.ptitre{font-family:var(--sans);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-size:10.5px;color:var(--muted);margin:14px 16px -2px}
.puces::-webkit-scrollbar{display:none}
.puce{flex:0 0 auto;width:auto;min-height:33px;padding:0 14px;border-radius:17px;
  font-family:var(--sans);font-size:13px;font-weight:500;border:1px solid var(--filet);
  background:var(--verre);color:var(--muted);cursor:pointer}
.puce[aria-pressed="true"]{background:var(--f7-theme-color);color:#FBFAF8;
  border-color:var(--f7-theme-color)}
.dark .puce[aria-pressed="true"]{color:#13100E}

/* ---------- saisie ---------- */
textarea.dicte{width:100%;min-height:120px;border:0;background:transparent;resize:none;
  font-family:var(--serif);font-size:21px;line-height:1.5;letter-spacing:.004em;
  color:var(--f7-text-color);padding:0}
textarea.dicte::placeholder{color:var(--muted);opacity:.6}
textarea.dicte:focus{outline:0}
.micro{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 15px;
  border-radius:19px;font-family:var(--sans);font-size:13.5px;font-weight:600;
  border:1px solid var(--f7-theme-color);background:var(--verre);
  color:var(--f7-theme-color);cursor:pointer}
.micro.on{background:var(--f7-theme-color);color:#FBFAF8}
.dark .micro.on{color:#13100E}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.4}}
.micro.on svg{animation:bat 1.1s ease-in-out infinite}

/* ---------- feuilles d'action (Framework7 les cache, son JS les montre ; on fait sans) ---------- */
.actions-backdrop{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(14,10,8,.45);
  z-index:13000;opacity:0;visibility:hidden;transition:opacity .3s}
.actions-backdrop.backdrop-in{opacity:1;visibility:visible}
.actions-modal{display:none;position:fixed;left:0;right:0;bottom:0;z-index:13500}
.actions-modal.modal-in{display:block;animation:monte .28s cubic-bezier(.2,.8,.3,1)}
@keyframes monte{from{transform:translate3d(0,100%,0)}to{transform:none}}
.actions-button{font-family:var(--sans)}
.actions-button.rouge{color:#A8453B}
.dark .actions-button.rouge{color:#E78C82}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:#1D1A17;color:#F8F5F2;padding:11px 18px;border-radius:22px;
  font-family:var(--sans);font-size:14px;z-index:14000;max-width:80%;text-align:center;
  box-shadow:0 12px 34px -16px rgba(0,0,0,.7)}
.dark .toast{background:#EEE9E3;color:#13100E}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

    <g transform="translate(58,112) rotate(-26)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(66,88) rotate(206) scale(.9)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(40,164) rotate(-14) scale(.85)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(33,186) rotate(196) scale(.72)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>

</defs></svg>
<div id="haut" hidden></div>
<div id="avance" hidden><i></i></div>

<script>
"use strict";
/* Écrite à l'écran, dans Mes données. Sans elle, « je ne vois pas la
   nouvelle version » est une phrase que ni lui ni moi ne pouvons vérifier :
   on en est réduit à deviner. Elle monte avec le cache du service worker. */
const VERSION = "v27";
const KEY = "ebenezer.v1";
/* Cinq manières au départ — mais Il n'en a pas cinq. Le disciple en ajoute
   à la volée, et les siennes se rangent après celles-ci. */
const MAN_SOCLE = {parle:"Il a parlé", pourvu:"Il a pourvu", ouvert:"Il a ouvert", delivre:"Il a délivré", repris:"Il a repris"};
function MANS(){
  const m=Object.assign({}, MAN_SOCLE);
  (db.mans||[]).forEach(x=>{ if(x && x.id) m[x.id]=x.txt; });
  return m;
}
function manTxt(k){ return MANS()[k]||""; }
/* « Il a… » est sous-entendu dans la question : on l'écrit si le disciple
   ne l'a pas écrit, pour que la liste se lise d'une seule voix. */
function manId(txt){
  let v=String(txt||"").trim(); if(!v) return null;
  if(!/^il[\s']/i.test(v)) v = "Il a "+v.charAt(0).toLowerCase()+v.slice(1);
  const m=MANS(), k=Object.keys(m).find(x=>m[x].toLowerCase()===v.toLowerCase());
  if(k) return k;
  db.mans=db.mans||[];
  const id=uid("man"); db.mans.push({id:id, txt:v, maj:Date.now()}); return id;
}
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const ETAT = {fait:"fait", encours:"en cours", prevu:"prévu", abandon:"abandonné"};
const ETATS = [["fait","C'est fait"],["encours","Ça dure encore"],["prevu","C'est prévu"]];

/* Les quatre destinataires d'une journée, et ce qui n'en est aucun. « Le
   reste » n'est pas un reproche : c'est l'attente, le trajet, le flottement.
   Il doit porter un nom, sinon la journée mentirait de ce qu'elle ne compte
   pas, et les parts seraient fausses. */
const CAT_SOCLE = [["dieu","Pour Dieu"],["famille","Ma famille"],["travail","Mon travail"],["moi","Moi"],["reste","Le reste"]];
/* Une liste vide au premier geste, c'est un écran qui demande du travail
   avant de rendre service. On propose ; rien n'entre en mémoire avant d'être
   touché. */
const TACHES_SOCLE = [
  ["Prière","dieu"],["Lecture de la Parole","dieu"],["Culte","dieu"],["Service dans l'assemblée","dieu"],
  ["Temps en famille","famille"],["Repas en famille","famille"],["Prière en famille","famille"],
  ["Travail","travail"],["Réunion","travail"],["Trajet","travail"],
  ["Sommeil","moi"],["Repas","moi"],["Sport","moi"],["Lecture","moi"],
  ["Attente","reste"],["Écrans","reste"]
];

let db = {nodes:[], gens:[], noms:[], mans:[], cats:[], taches:[], temps:[], exp:0, seq:1};
let S = {view:"today", step:0, draft:null, filtre:"tout", ret:"tout", grain:"an", rev:"noms", pile:[], nodeId:null,
         cheminId:null, faits:-1, eMan:"", eEtat:"fait", ePrec:"j",
         descOuvert:false, plie:true, cNeuf:false, cTxt:"", cType:"", cQ:"",
         per:"jour", tQ:"", tCat:"", blocId:null};

/* Un seul « écran précédent » ne suffisait pas : en ouvrant un retour depuis
   un acte, il finissait par désigner l'acte lui-même, et le bouton Retour ne
   faisait plus rien. On empile donc les écrans traversés, et on dépile en
   sautant ce qui n'existe plus. Un bouton qui ne ramène nulle part est pire
   que pas de bouton. */
function empile(){
  S.pile.push({view:S.view, nodeId:S.nodeId, cheminId:S.cheminId});
  if(S.pile.length>12) S.pile.shift();
}
function depile(repli){
  while(S.pile.length){
    const p=S.pile.pop();
    if(p.view==="node" && !node(p.nodeId)) continue;
    if(p.view==="chemin" && !cheminDe(p.cheminId)) continue;
    if(p.view===S.view && p.nodeId===S.nodeId && p.cheminId===S.cheminId) continue;
    S.view=p.view; S.nodeId=p.nodeId; S.cheminId=p.cheminId; return;
  }
  S.view=repli||"today";
}

/* ---------- stockage ---------- */
function sane(v){
  const o = (v && typeof v==="object") ? v : {};
  const d = {nodes:Array.isArray(o.nodes)?o.nodes:[], gens:Array.isArray(o.gens)?o.gens:[],
          noms:Array.isArray(o.noms)?o.noms:[], mans:Array.isArray(o.mans)?o.mans:[],
          cats:Array.isArray(o.cats)?o.cats:[], taches:Array.isArray(o.taches)?o.taches:[],
          temps:Array.isArray(o.temps)?o.temps:[], exp:(typeof o.exp==="number")?o.exp:0,
          morts:(o.morts && typeof o.morts==="object")?o.morts:{},
          maj:(typeof o.maj==="number")?o.maj:0,
          seq:(typeof o.seq==="number"&&o.seq>0)?o.seq:1};
  /* Les fiches d'avant la synchronisation n'ont pas d'heure. On leur en donne
     la plus ancienne possible : la moindre écriture réelle les dépassera. */
  [d.nodes,d.gens,d.noms,d.mans,d.cats,d.taches,d.temps].forEach(function(a){
    a.forEach(function(x){ if(x && typeof x.maj!=="number") x.maj=1; });
  });
  /* Un bloc sans départ ou sans activité ne dit rien ; deux blocs mal rangés
     font un « maintenant » qui n'est pas le dernier. On nettoie et on range
     une fois pour toutes, au chargement. */
  d.temps = d.temps.filter(b=>b && typeof b.deb==="number" && b.t)
                   .sort((a,b)=>a.deb-b.deb);
  d.temps.forEach((b,i)=>{ if(!b.id) b.id="b"+(d.seq++)+"-"+DEV;
    if(i<d.temps.length-1 && !b.fin) b.fin=d.temps[i+1].deb; });
  /* La date d'un acte dit quand il est arrivé ; elle ne dit pas dans quel
     ordre on l'a gardé. Deux actes du même jour se présentaient donc dans
     l'ordre où ils dormaient en mémoire — c'est-à-dire le plus ancien
     d'abord, juste quand on vient d'en écrire un. On garde l'heure.
     Les actes d'avant n'en ont pas : ils reçoivent leur rang, qui met le
     dernier gardé au-dessus et laisse toujours passer un acte neuf. */
  d.nodes.forEach((n,i)=>{ if(typeof n.ts!=="number") n.ts=i+1; });
  return d;
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r) db=sane(JSON.parse(r)); }catch(e){} }
/* L'heure locale peut reculer d'un appareil à l'autre ; ce jalon-ci ne doit
   jamais reculer, sinon une modification vraie passerait pour déjà envoyée. */
function save(sil){
  if(!sil) db.maj = Math.max(Date.now(), (db.maj||0)+1);
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Enregistrement impossible"); }
  if(!sil) syPlusTard();
}
/* Deux appareils qui créent chacun de leur côté produiraient le même « n42 »
   et l'un écraserait l'autre à la fusion. Chaque installation porte donc sa
   marque, tirée une fois et gardée hors de l'archive — elle appartient à
   l'appareil, pas aux données. */
const DEV = (function(){
  try{
    let d=localStorage.getItem("ebenezer.dev");
    if(!d){ d=Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,4);
            localStorage.setItem("ebenezer.dev", d); }
    return d;
  }catch(e){ return "x"+Math.random().toString(36).slice(2,7); }
})();
function uid(p){ return p+(db.seq++)+"-"+DEV; }
function nid(){ return uid("n"); }
/* Qui a parlé en dernier l'emporte : chaque fiche porte l'heure de sa
   dernière écriture. */
function touche(o){ if(o) o.maj=Date.now(); return o; }
/* Une fiche simplement absente d'un appareil ressusciterait à la fusion : on
   garde donc la trace de ce qui a été supprimé, et pour qui veut la lire,
   combien de temps. */
function tue(id){ if(id){ db.morts=db.morts||{}; db.morts[id]=Date.now(); } }
function ts(){ return Date.now(); }
function cap(t){ t=String(t||""); return t.charAt(0).toUpperCase()+t.slice(1); }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- dates ---------- */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ if(!s) return null; const p=String(s).split("-"); if(p.length<3) return null; return {y:+p[0], m:+p[1], d:+p[2]}; }
function human(n){
  if(n.kind==="ecriture") return n.ref || "";
  const p=parse(n.date); if(!p) return "";
  if(n.prec==="a") return ""+p.y;
  if(n.prec==="m") return MOIS[p.m-1]+" "+p.y;
  return p.d+" "+MOIS[p.m-1]+" "+p.y;
}
/* On ne range pas un acte plus fin que ce qu'on sait de sa date : une date
   connue à l'année près ne peut pas entrer dans une semaine sans mentir. */
function lundi(p){
  const t=new Date(p.y, p.m-1, p.d);
  t.setDate(t.getDate() - ((t.getDay()+6)%7));
  return t;
}
function tranche(n, grain){
  const p=parse(n.date); if(!p) return "Sans date";
  if(grain==="an" || n.prec==="a") return ""+p.y;
  if(grain==="mois" || n.prec==="m") return MOIS[p.m-1]+" "+p.y;
  const l=lundi(p);
  return "Semaine du "+l.getDate()+" "+MOIS[l.getMonth()]+" "+l.getFullYear();
}
function ansDepuis(n){ const p=parse(n.date); if(!p) return 0; return new Date().getFullYear()-p.y; }
function manCourt(m){ const t=manTxt(m); return t ? t.replace(/^Il (a |m'a |l'a )?/,"") : ""; }

/* ---------- le temps ---------- */
/* Le temps donné n'est pas un acte : il ne se garde pas dans le mémorial, il
   se pèse à côté. Quarante blocs par jour noieraient l'archive, et l'archive
   existe pour être relue. Deux registres, donc : les actes, et les heures. */
function CATS(){
  return CAT_SOCLE.map(function(c){ return {id:c[0], nom:c[1]}; })
    .concat((db.cats||[]).map(function(c){ return {id:c.id, nom:c.nom}; }));
}
function catNom(id){ const c=CATS().filter(x=>x.id===id)[0]; return c ? c.nom : "Le reste"; }
function catId(nom){
  const v=String(nom||"").trim(); if(!v) return "";
  const t=CATS().filter(c=>c.nom.toLowerCase()===v.toLowerCase())[0];
  if(t) return t.id;
  const id=uid("k"); db.cats.push({id:id, nom:cap(v), maj:Date.now()}); return id;
}
function tache(id){ return (db.taches||[]).filter(t=>t.id===id)[0]; }
function tacheNom(id){ const t=tache(id); return t ? t.nom : "—"; }
function tacheCat(id){ const t=tache(id); return t ? (t.cat||"reste") : "reste"; }
function tacheId(nom, cat){
  const v=String(nom||"").trim(); if(!v) return "";
  const t=(db.taches||[]).filter(x=>x.nom.toLowerCase()===v.toLowerCase())[0];
  if(t){ if(cat && t.cat!==cat){ t.cat=cat; touche(t); } return t.id; }
  const id=uid("a"); db.taches.push({id:id, nom:cap(v), cat:cat||"reste", maj:Date.now()}); return id;
}
function blocT(id){ return (db.temps||[]).filter(b=>b.id===id)[0]; }

/* Permanent, mais pas en marche : une page web s'arrête dès qu'on la quitte,
   et aucun chronomètre ne survit à l'app fermée. On ne garde que l'heure de
   départ — la soustraction reste juste après trois jours de silence. Un seul
   bloc est ouvert à la fois : c'est là tout le « permanent ». */
function ouvert(){ const a=db.temps||[]; const b=a[a.length-1]; return (b && !b.fin) ? b : null; }
/* Vingt secondes, c'est un doigt qui s'est trompé, pas du temps vécu : on ne
   garde pas la trace d'une erreur de pouce. */
function pointe(tid){
  const n=Date.now(), o=ouvert();
  if(o){
    if(o.t===tid) return false;
    o.fin=n; touche(o);
    if(o.fin-o.deb<20000){ db.temps.pop(); tue(o.id); }
  }
  db.temps.push({id:uid("b"), t:tid, deb:n, maj:n});
  save(); return true;
}
function arrete(){
  const o=ouvert(); if(!o) return;
  o.fin=Date.now(); touche(o);
  if(o.fin-o.deb<20000){ db.temps.pop(); tue(o.id); }
  save();
}

function hm(ms){
  const m=Math.max(0, Math.floor(ms/60000));
  const h=Math.floor(m/60), r=m%60;
  if(!h) return m+" min";
  return r ? h+" h "+String(r).padStart(2,"0") : h+" h";
}
function hmin(d){ return d.getHours()+" h "+String(d.getMinutes()).padStart(2,"0"); }
function minuit(dec){ const d=new Date(); d.setHours(0,0,0,0); if(dec) d.setDate(d.getDate()-dec); return d.getTime(); }

/* Un bloc qui traverse la nuit appartient aux deux jours. On ne le coupe pas
   en mémoire — on le coupe à la lecture, en ne comptant que ce qui tombe dans
   la fenêtre. Le sommeil rend ainsi à chaque jour sa part, sans qu'on ait
   touché à quoi que ce soit à minuit. */
function cumul(t0, t1){
  const par={}; let tot=0; const n=Date.now();
  (db.temps||[]).forEach(function(b){
    const a=Math.max(b.deb, t0), z=Math.min(b.fin||n, t1);
    if(z>a){ par[b.t]=(par[b.t]||0)+(z-a); tot+=z-a; }
  });
  return {par:par, tot:tot};
}
const PERIODES = [["jour","Aujourd'hui"],["sem","7 jours"],["mois","30 jours"],["tout","Tout"]];
function fenetre(){
  const n=Date.now();
  if(S.per==="jour") return {t0:minuit(0), t1:n, nom:"aujourd'hui"};
  if(S.per==="sem")  return {t0:minuit(6), t1:n, nom:"sur sept jours"};
  if(S.per==="mois") return {t0:minuit(29), t1:n, nom:"sur trente jours"};
  const d=(db.temps||[])[0];
  return {t0:d?d.deb:n, t1:n, nom:"depuis le début"};
}
function pcent(x, tot){ return tot ? Math.round(x*100/tot) : 0; }

/* ---------- accès ---------- */
function node(id){ return db.nodes.find(n=>n.id===id); }
function gensNom(id){ const g=db.gens.find(x=>x.id===id); return g?g.nom:""; }
function gensId(nom){
  const v=String(nom||"").trim(); if(!v) return null;
  const k=v.toLowerCase();
  const f=db.gens.find(g=>String(g.nom).trim().toLowerCase()===k);
  if(f) return f.id;
  const id=uid("g"); db.gens.push({id:id,nom:v,maj:Date.now()}); return id;
}
function enfants(id){ return db.nodes.filter(n=>(n.par||[]).indexOf(id)!==-1); }
function dessous(id){
  const vus=[id]; let f=[id];
  while(f.length){ const g=[]; f.forEach(x=>enfants(x).forEach(e=>{ if(vus.indexOf(e.id)===-1){vus.push(e.id); g.push(e.id);} })); f=g; }
  return vus;
}
/* Un chemin, c'est un morceau du graphe où tout se tient : on part d'un acte,
   on suit les liens dans les deux sens, et on ramasse tout ce qui est relié.
   Ce n'est donc ni une branche ni une ligne — c'est ce qui se répond. */
function chemins(){
  const grp={}, vu={};
  db.nodes.forEach(n=>{ grp[n.id]=n.id; vu[n.id]=true; });
  function racine(x){ while(grp[x]!==x){ grp[x]=grp[grp[x]]; x=grp[x]; } return x; }
  db.nodes.forEach(n=>(n.par||[]).forEach(p=>{
    if(!vu[p]) return;
    const a=racine(n.id), b=racine(p); if(a!==b) grp[a]=b;
  }));
  const paquets={};
  db.nodes.forEach(n=>{ const r=racine(n.id); (paquets[r]=paquets[r]||[]).push(n); });
  return Object.keys(paquets).map(k=>paquets[k])
    .filter(a=>a.length>1)
    .map(a=>a.slice().sort(parDateAsc))
    /* Le chemin qui a bougé le plus récemment se lit d'abord — la longueur
       n'est pas ce qu'on cherche en ouvrant la liste. */
    .sort((a,b)=>parDate(a[a.length-1],b[b.length-1]) || b.length-a.length);
}
function cheminDe(id){ if(!id) return null; return chemins().filter(a=>a.some(n=>n.id===id))[0]||null; }
/* La romaine est réservée à ce qui est CITÉ, jamais à ce qui est raconté au
   sujet d'une parole. « Dieu m'a parlé pendant la croisade » n'est pas une
   parole : c'est un récit. Le texte lui-même le dit, par ses guillemets, et
   l'application n'a qu'à les lire — rien de plus à demander au disciple.
   Une parole notée sans guillemets est citée tout entière : c'est le seul
   cas où l'on devine, et il est sans danger. */
const GUIL = /«[^»]*»|“[^”]*”|"[^"]{1,600}"/g;
function cite(n){
  const t = String((n && n.txt!=null ? n.txt : n) || "");
  GUIL.lastIndex = 0;
  if(n && n.txt!=null && estParole(n) && !GUIL.test(t))
    return '<span class="cite">'+esc(t)+'</span>';
  GUIL.lastIndex = 0;
  let out="", i=0, m;
  while((m=GUIL.exec(t))){
    out += esc(t.slice(i, m.index)) + '<span class="cite">'+esc(m[0])+'</span>';
    i = m.index + m[0].length;
  }
  return out + esc(t.slice(i));
}
/* « … » suivi d'autre chose : ce qui suit la citation est sa référence, pas
   la parole. On ne devine que dans ce cas précis — le texte COMMENCE par une
   citation — parce qu'ailleurs la suite est une phrase, pas une source.
   Et l'on ne déplace rien : on propose, le disciple touche (P9). */
function reference(txt){
  const t=String(txt||"").trim();
  if(!/^[«“"]/.test(t)) return "";
  GUIL.lastIndex=0;
  const m=GUIL.exec(t);
  if(!m || m.index!==0) return "";
  const q=t.slice(m[0].length).replace(/^[\s,.;:–—-]+/,"").trim();
  return (q.length>=2 && q.length<=90) ? q : "";
}
function estParole(n){ return n.kind==="rhema" || n.kind==="ecriture" || (n.act==="dieu" && n.man==="parle"); }
function acteurTxt(n){
  if(n.act==="dieu") return n.kind==="ecriture" ? "Écriture" : (n.kind==="rhema" ? "Dieu · rhema" : "Dieu");
  if(n.act==="gens"){ const nom=gensNom(n.gid)||"quelqu'un"; return n.man ? ("Lui, par "+nom) : nom; }
  const d = n.dest==="gens" ? (gensNom(n.dgid)||"quelqu'un") : (n.dest==="moi" ? "moi-même" : "Dieu");
  return "moi → "+d;
}
function dieuNodes(){ return db.nodes.filter(n=>n.kind!=="ecriture" && (n.act==="dieu" || (n.act==="gens" && n.man))); }
function parDate(a,b){ return (b.date||"").localeCompare(a.date||"") || ((b.ts||0)-(a.ts||0)); }
/* Les deux lectures qui remontent le temps — un chemin, ce qui est prévu —
   prennent le même départage, retourné : à date égale, le premier gardé
   ouvre la marche. Sans quoi deux actes du même jour se croisent au hasard
   de la mémoire, et une chaîne qui se croise ne se lit plus. */
function parDateAsc(a,b){ return (a.date||"").localeCompare(b.date||"") || ((a.ts||0)-(b.ts||0)); }

/* ---------- ce qui revient ----------
   Pas un seul souvenir : tout ce qui revient aujourd'hui, à faire défiler.
   Une semaine, un mois, un an — et, quand la mémoire est pleine, le hasard. */
function jour0(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function joursDepuis(n){
  const p=parse(n.date); if(!p) return null;
  return Math.round((jour0(new Date()) - new Date(p.y,p.m-1,p.d)) / 86400000);
}
const FENETRES = [
  {j:7,   tol:0, t:"Il y a une semaine"},
  {j:14,  tol:1, t:"Il y a deux semaines"},
  {j:30,  tol:2, t:"Il y a un mois"},
  {j:91,  tol:4, t:"Il y a trois mois"},
  {j:182, tol:5, t:"Il y a six mois"}
];
function ansJourPourJour(n){
  const p=parse(n.date), now=new Date();
  if(!p || n.prec!=="j") return 0;
  if(p.m!==now.getMonth()+1 || p.d!==now.getDate()) return 0;
  const a=now.getFullYear()-p.y;
  return a>0 ? a : 0;
}
function carteAnniv(n){
  const a=ansJourPourJour(n);
  if(a) return {n:n, type:"anniv", quand:"Il y a "+(a===1?"un an":a+" ans"), rang:100-a};
  const j=joursDepuis(n);
  if(j==null || j<=1) return null;
  for(let i=0;i<FENETRES.length;i++){
    const f=FENETRES[i];
    if(Math.abs(j-f.j)<=f.tol) return {n:n, type:"anniv", quand:f.t, rang:i};
  }
  return null;
}
function remontees(){
  const vus={}, cartes=[];
  const prends=c=>{ if(c && !vus[c.n.id]){ vus[c.n.id]=1; cartes.push(c); } };

  db.nodes.filter(n=>n.etat==="prevu" && n.date && n.date<=today())
    .sort(parDateAsc)
    .slice(0,2)
    .forEach(n=>prends({n:n, type:"prevu", quand:"Tu avais prévu"}));

  dieuNodes().map(carteAnniv).filter(Boolean)
    .sort((a,b)=>a.rang-b.rang).forEach(prends);

  dieuNodes().filter(n=>!enfants(n.id).some(e=>e.act==="moi"))
    .sort(parDateAsc)
    .slice(0,2)
    .forEach(n=>prends({n:n, type:"dette", quand:"Sans réponse de toi"}));

  /* Quand il y en a beaucoup, le hasard ramène ce qu'on ne cherchait pas. */
  const reste=dieuNodes().filter(n=>!vus[n.id]);
  for(let k=0; k<3 && reste.length && cartes.length<8; k++){
    const n=reste.splice(Math.floor(Math.random()*reste.length),1)[0];
    prends({n:n, type:"hasard", quand:"Au hasard"});
  }
  return cartes;
}

function liste(contenu, opt){ return `<div class="list list-strong list-outline list-dividers inset ${opt||""}"><ul>${contenu}</ul></div>`; }
function ligne(o){
  const inner = `<div class="item-inner">
      <div class="item-title ${o.serif?"serif voix":""}">${o.titre}${o.sous?`<div class="item-subtitle">${o.sous}</div>`:""}${o.texte?`<div class="item-text">${o.texte}</div>`:""}</div>

  if(o.attr) return `<li><a class="item-link item-content" ${o.attr}>${inner}</a></li>`;
  return `<li><div class="item-content">${inner}</div></li>`;
}
function ligneActe(n, o){
  o=o||{};
  const cls = n.act==="dieu" ? "lui" : (n.act==="gens" ? "gens" : "moi");
  /* « Dieu · rhema · parlé » dit deux fois la même chose : la nature de
     l'acte porte déjà la manière. */
  const pied = [ acteurTxt(n),
                 (n.man && n.kind!=="rhema") ? manCourt(n.man) : "",
                 human(n),
                 (n.etat && n.etat!=="fait") ? ETAT[n.etat] : "" ]
               .filter(Boolean).map(esc).join(" · ");
  return `<li><a class="item-link item-content acte" ${o.attr||""}>
      <div class="item-inner"><span class="pt ${cls}"></span>
        <span class="corps"><span class="ph">${cite(n)}</span>${pied?`<span class="pied">${pied}</span>`:""}</span>
        ${o.coche?`<span class="coche">✓</span>`:""}

}

function phrase(c){

       : (n.man==="parle" ? "Il t'a dit ceci :" : "Il a fait ceci :");
}

/* ---------- Ses œuvres ---------- */
function vOeuvres(){
  const list=dieuNodes().slice().sort(parDate);
  const fl=["tout"].concat(Object.keys(MANS()));
  /* Deux lectures de la même archive : comment Il a agi, et ce que j'en ai
     fait. La seconde est la plus dure à regarder, c'est pour ça qu'elle doit
     être à portée de pouce. */
  const fr=[["tout","Tout"],["oui","J'ai répondu"],["non","Je n'ai rien rendu"]];
  const fg=[["an","Par année"],["mois","Par mois"],["semaine","Par semaine"]];
  /* Replié, le bandeau dit lui-même ce qu'il cache : sans cela, on filtre
     sans le savoir et on croit l'archive vide. */
  /* Le bandeau ne dit que ce qui s'écarte de l'ordinaire. « Toutes Ses
     manières · par année » décrivait l'état normal de l'écran en six mots :
     un bandeau qui parle quand il n'a rien à dire, on cesse de le lire, et le
     jour où il a quelque chose à dire on ne le lit plus non plus. Rien de
     réglé : « Filtres », et c'est tout. */
  const resume=[
    S.filtre==="tout" ? "" : manCourt(S.filtre),
    S.ret==="oui" ? "j'ai répondu" : (S.ret==="non" ? "rien rendu" : ""),
    S.grain==="an" ? "" : (S.grain==="mois" ? "par mois" : "par semaine")
  ].filter(Boolean).join(" · ");
  /* Un compte qui ne bouge pas quand le filtre retranche fait croire que
     l'archive est plus vide qu'elle n'est — ou plus pleine. */
  const rendu=n=>enfants(n.id).some(e=>e.act==="moi");
  const vus=list
    .filter(n=>S.filtre==="tout" || n.man===S.filtre)
    .filter(n=>S.ret==="tout" || rendu(n)===(S.ret==="oui"));
  const compte = (S.filtre==="tout" && S.ret==="tout")
    ? `${list.length} fois, par Lui-même ou par une main.`
    : `${vus.length} sur ${list.length}, sous ce filtre.`;
  Z.haut=`<p class="titre-page">Ses œuvres</p><p class="ssTitre">${compte}</p>
    <button class="plier" data-act="plier" aria-expanded="${!S.plie}">
      <b>Filtres</b>${resume?`<span class="q">${esc(resume)}</span>`:""}${BAS}</button>`;
  if(!S.plie) Z.haut+=`<div class="ptitre">Sa manière</div>
    <div class="puces">${fl.map(f=>`<button class="puce" data-filtre="${f}" aria-pressed="${S.filtre===f}">${f==="tout"?"Tout":manTxt(f)}</button>`).join("")}</div>
    <div class="ptitre">Mon retour</div>
    <div class="puces suite">${fr.map(([k,l])=>`<button class="puce" data-fret="${k}" aria-pressed="${S.ret===k}">${l}</button>`).join("")}</div>
    <div class="ptitre">Ranger</div>
    <div class="puces suite">${fg.map(([k,l])=>`<button class="puce" data-grain="${k}" aria-pressed="${S.grain===k}">${l}</button>`).join("")}</div>`;
  let h="";
  if(!vus.length) h+=`<p class="vide">Rien sous ce filtre.</p>`;
  let an=null, buf="";
  vus.forEach(n=>{
    const y=tranche(n, S.grain);
    if(y!==an){ if(buf){ h+=liste(buf); buf=""; } h+=titreBloc(esc(y), an===null?"":"ecart"); an=y; }
    buf += ligneActe(n, {attr:'data-node="'+n.id+'"'});
  });
  if(buf) h+=liste(buf);
  Z.html=h;
}

      return ligne({titre:esc(g.nom),

              (dit?("Tu lui as rendu "+dit+" chose"+(dit>1?"s":"")+".") : "Tu ne lui as rien rendu.")});
    }).join(""));
  } else {

       après qu'on a déjà lu les chiffres. */

      Ce que le chiffre veut dire reste à toi.</div>`;
    CS=constats();
    if(!CS.length) h+=`<p class="vide">Pas encore de quoi compter. Garde quelques actes, et relie-les.</p>`;
    else {
      let fam=null, buf="", prem=true;
      CS.forEach((c,i)=>{
        if(c.fam!==fam){
          if(buf){ h+=liste(buf); buf=""; }
          h+=titreBloc(c.fam, prem?"":"ecart"); fam=c.fam; prem=false;
        }
        buf+=ligne({titre:c.txt, sous:c.ids.length?(c.ids.length+" acte"+(c.ids.length>1?"s":"")):"",
          attr:c.ids.length?'data-faits="'+i+'"':""});
      });
      if(buf) h+=liste(buf);
    }

  h+=liste(ligne({titre:"Mes données", attr:'data-go="data"'}));

function jours(a,b){
  const pa=parse(a), pb=parse(b); if(!pa||!pb) return null;
  return Math.round((Date.UTC(pb.y,pb.m-1,pb.d)-Date.UTC(pa.y,pa.m-1,pa.d))/86400000);
}
function duree(j){
  j=Math.abs(Math.round(j));
  if(j<31) return j+" jour"+(j>1?"s":"");
  const m=Math.round(j/30.44); if(m<24) return m+" mois";
  return Math.round(j/365.25)+" ans";
}
function court(t,n){ t=String(t||""); n=n||44;
  return t.length>n ? esc(t.slice(0,n-1).replace(/\s+\S*$/,""))+"…" : esc(t); }
/* Une citation déjà entre guillemets, remise entre guillemets, en porte deux
   paires : « « Je pourvoirai » ». On dénude avant de citer. */
function nue(t){ return String(t||"").trim().replace(/^[«“"]\s*/,"").replace(/\s*[»”"]$/,"").replace(/\s*\.$/,""); }

/* Mes chiffres : pas une jauge, des phrases. Chacune s'ouvre sur les faits
   qui la composent — un constat qu'on ne peut pas vérifier n'est pas un
   constat, c'est un verdict (14.5-bis.f, P4). Une famille dont la mémoire
   n'a pas encore de quoi parler se tait : mieux vaut six phrases vraies que
   douze dont la moitié dit « 0 sur 0 ». */
let CS=[];
function constats(){
  const out=[], dn=dieuNodes(), mien=db.nodes.filter(n=>n.act==="moi");
  const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
  const dit=(fam,txt,ids)=>out.push({fam:fam, txt:txt, ids:uniq(ids||[])});
  const pl=(n,m,p)=>n>1?(p||(m+"s")):m;

  /* --- Ses délais --- */
  const paroles=db.nodes.filter(n=>n.kind==="rhema"||n.kind==="ecriture");
  const paires=[];
  paroles.forEach(p=>enfants(p.id).filter(e=>e.act!=="moi"&&e.etat!=="prevu").forEach(e=>{
    const j=jours(p.date,e.date); if(j!=null&&j>=0) paires.push({p:p,e:e,j:j});
  }));
  if(paires.length){
    const moy=paires.reduce((s,x)=>s+x.j,0)/paires.length;
    dit("Ses délais", `Entre une parole et ce qui l'accomplit, Il a mis <b>${duree(moy)}</b> en moyenne, sur ${paires.length} ${pl(paires.length,"fois","fois")}.`, paires.map(x=>x.e.id));
    const max=paires.slice().sort((a,b)=>b.j-a.j)[0];
    if(max.j>0) dit("Ses délais", `Le plus long : <b>${duree(max.j)}</b>, après « ${court(nue(max.p.txt))} ».`, [max.p.id,max.e.id]);
  }
  const attente=paroles.filter(n=>!enfants(n.id).some(e=>e.act!=="moi"));
  if(attente.length) dit("Ses délais", `<b>${attente.length}</b> ${pl(attente.length,"parole")} ${attente.length>1?"attendent":"attend"} encore.`, attente.map(n=>n.id));

  /* --- Ce qui marche --- */
  const faits=mien.filter(n=>n.etat==="fait");
  const suivis=faits.filter(n=>enfants(n.id).some(e=>e.act!=="moi"));
  if(faits.length>=3) dit("Ce qui marche", `Sur tes ${faits.length} actes, <b>${suivis.length}</b> ont été suivis d'un acte de Lui.`, suivis.map(n=>n.id));
  [["dieu","pour Lui"],["gens","pour d'autres"],["moi","pour toi"]].forEach(([k,l])=>{
    const a=faits.filter(n=>n.dest===k); if(a.length<3) return;
    const b=a.filter(n=>enfants(n.id).some(e=>e.act!=="moi"));
    dit("Ce qui marche", `Tes actes ${l} : <b>${b.length}</b> sur ${a.length} ${b.length>1?"ont été suivis":"a été suivi"} d'un acte de Lui.`, b.map(n=>n.id));
  });

  /* --- Ta réponse --- */
  if(dn.length){
    const sans=dn.filter(n=>!enfants(n.id).some(e=>e.act==="moi"));
    dit("Ta réponse", sans.length
      ? `<b>${sans.length}</b> de Ses actes ${sans.length>1?"n'ont":"n'a"} jamais rien reçu de toi.`
      : `Chacun de Ses actes a reçu quelque chose de toi.`, sans.map(n=>n.id));
    const vieux=sans.filter(n=>n.date).sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0];
    if(vieux){ const j=jours(vieux.date,today());
      if(j!=null&&j>60) dit("Ta réponse", `Le plus ancien attend depuis <b>${duree(j)}</b>.`, [vieux.id]); }
    const rep=[];
    dn.forEach(n=>{
      const e=enfants(n.id).filter(x=>x.act==="moi"&&x.etat==="fait")
                           .sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0];
      if(e){ const j=jours(n.date,e.date); if(j!=null&&j>=0) rep.push({e:e,j:j}); }
    });
    if(rep.length>=2){ const moy=rep.reduce((s,x)=>s+x.j,0)/rep.length;
      dit("Ta réponse", `Quand tu réponds, tu mets <b>${duree(moy)}</b> en moyenne.`, rep.map(x=>x.e.id)); }
  }

  /* --- Les hommes --- */
  const par={};
  db.nodes.forEach(n=>{ if(n.act==="gens"&&n.gid) (par[n.gid]=par[n.gid]||[]).push(n.id); });
  const gids=Object.keys(par);
  if(gids.length){
    const top=gids.slice().sort((a,b)=>par[b].length-par[a].length)[0];
    dit("Les hommes", `Dieu est passé <b>${par[top].length}</b> fois par ${esc(gensNom(top))}.`, par[top]);
    const muets=gids.filter(g=>!db.nodes.some(n=>n.act==="moi"&&n.dest==="gens"&&n.dgid===g));
    if(muets.length) dit("Les hommes", `Tu n'as jamais rien rendu à <b>${muets.length}</b> ${pl(muets.length,"personne")} par qui Il est passé.`,
      [].concat.apply([], muets.map(g=>par[g])));
  }

  /* --- Tes chemins --- */
  const ch=chemins();
  if(ch.length){
    const plus=ch.slice().sort((a,b)=>b.length-a.length)[0];
    dit("Tes chemins", `Ta plus longue histoire compte <b>${plus.length}</b> actes.`, plus.map(n=>n.id));
    if(ch.length>1){
      const moy=ch.reduce((s,a)=>s+a.length,0)/ch.length;
      dit("Tes chemins", `<b>${ch.length}</b> chemins, ${String(Math.round(moy*10)/10).replace(".",",")} actes en moyenne.`, []);
    }
    const dort=ch.filter(a=>{ const j=jours(a[a.length-1].date, today()); return j!=null && j>365; });
    if(dort.length) dit("Tes chemins", `<b>${dort.length}</b> ${pl(dort.length,"chemin")} ${dort.length>1?"n'ont":"n'a"} rien reçu depuis plus d'un an.`,
      dort.map(a=>a[a.length-1].id));
  }

  /* --- Tes saisons --- */
  const ans={};
  db.nodes.forEach(n=>{ const p=parse(n.date); if(p) (ans[p.y]=ans[p.y]||[]).push(n.id); });
  const ks=Object.keys(ans).sort();
  if(ks.length>=2){
    const dense=ks.slice().sort((a,b)=>ans[b].length-ans[a].length)[0];
    dit("Tes saisons", `Ton année la plus dense : <b>${dense}</b>, ${ans[dense].length} actes.`, ans[dense]);
    const trous=[]; for(let y=+ks[0]+1; y<+ks[ks.length-1]; y++){ if(!ans[y]) trous.push(y); }
    if(trous.length) dit("Tes saisons", `Rien n'est gardé pour <b>${trous.join(", ")}</b>.`, []);
  }
  return out;
}

/* ---------- un chemin ---------- */
/* Le fil est la lecture, les liens sont la vérité : les actes se déroulent
   dans l'ordre du temps, et chacun dit « après : … » quand il ne vient pas
   simplement de celui du dessus. Aucun trait n'est tracé (14.5-bis.b). */
function vChemin(){
  const suite=cheminDe(S.cheminId);
  if(!suite){ S.view="revel"; return render(); }
  Z.titre="Un chemin"; Z.retour=true;
  /* Un acte prévu n'est pas un acte : le mettre dans le fil au milieu du passé
     laisserait croire qu'il a eu lieu. On le garde dans le chemin — c'est bien
     une promesse de ce chemin-là — mais sous une coupure, à la fin. */
  const faits=suite.filter(n=>n.etat!=="prevu"), prevus=suite.filter(n=>n.etat==="prevu");
  const ordre=faits.concat(prevus);
  const pos={}; ordre.forEach((n,i)=>{ pos[n.id]=i; });
  /* L'en-tête porte déjà le nom de l'écran : le dire deux fois ne dit rien. */
  let h=`<div class="block amorce" style="margin-top:20px">Ce n'est pas une ligne :
      plusieurs fils se rejoignent ici.</div>
    <div class="fil">`;
  ordre.forEach((n,i)=>{
    if(i===faits.length) h+=`<div class="coupure">Ce qui est prévu</div>`;
    const cls = (n.act==="dieu" ? "dieu" : (n.act==="gens" ? "gens" : "moi"))
              + (n.etat==="prevu" ? " prevu" : "");
    const prec=(n.par||[]).map(node).filter(Boolean).filter(p=>pos[p.id]!==i-1);
    let apres="";
    /* Rappeler d'où ça vient, pas le relire en entier. */
    const court=t=>{ t=String(t); return t.length>46 ? esc(t.slice(0,45).replace(/\s+\S*$/,""))+"…" : esc(t); };
    if(prec.length) apres=`après : ${prec.map(p=>court(p.txt)).join(" · ")}`;
    else if(i>0 && !(n.par||[]).length) apres="un autre fil commence ici";
    h+=`<a class="pas ${cls}" data-node="${n.id}">
        <span class="dit">${cite(n)}</span>
        <span class="sous">${n.etat&&n.etat!=="fait"?`<span class="etiq">${ETAT[n.etat]}</span>`:""}${esc(acteurTxt(n))}${human(n)?" · "+human(n):""}</span>
        ${apres?`<span class="apres">${apres}</span>`:""}
      </a>`;
  });
  h+=`</div>`;
  /* Une chaîne qui s'arrête sur un acte de Lui pose une question, et laisse
     le droit de ne pas répondre (14.5-bis.e). */
  const fin=faits[faits.length-1];
  if(fin && fin.act!=="moi" && !enfants(fin.id).length){
    h+=`<div class="block amorce" style="margin-top:18px">Qu'est-ce qui est sorti de ceci ?
      <span class="rien">Tu as le droit de ne pas répondre.</span></div>`;
    Z.action=bouton("Dire ce qui a suivi", 'data-attach="'+fin.id+'"');
  }
  Z.html=h;
}

/* ---------- un acte ---------- */
function vNode(){
  const n=node(S.nodeId); if(!n){ S.view="today"; return render(); }
  Z.titre="Un acte"; Z.retour=true; Z.plus=true;
  const par=(n.par||[]).map(node).filter(Boolean), enf=enfants(n.id);
  const dte=human(n);
  let h=`<div class="block" style="margin-top:20px;position:relative">

const NEUFS = [
  ["ecriture", "Une promesse de l'Écriture",   "elle ne compte pas parmi Ses œuvres", true],
  ["rhema",    "Une parole qu'Il m'a dite",    "", true],
  ["moi",      "Quelque chose que j'ai fait",  "une prière, un jeûne, une démarche", false],
  ["dieu",     "Quelque chose qu'Il a fait",   "", false]

function choixCause(sel, exclus){
  /* Deuxième mode : on écrit la cause qui manque. La liste disparaît. */
  if(S.cNeuf){
    return `<div class="block" style="margin-top:18px">
        <textarea class="dicte" id="cNeuf" placeholder="La parole, la prière, l'acte qui a précédé…"

          attr:'data-ctype="'+n[0]+'"'})).join(""));

  const cands = db.nodes
    .filter(x => exclus.indexOf(x.id)===-1 && x.etat!=="prevu" && x.etat!=="abandon")
    .sort(parDate);

        : `<p class="vide">Rien d'autre dans ta mémoire pour l'instant.</p>`)
    + `<p class="vide" id="attente" hidden>Écris un mot : ce que tu as déjà gardé apparaîtra.</p>`
    + `<p class="vide" id="rien" hidden>Rien ne correspond. Touche « Ajouter quelque chose de nouveau ».</p>`;

function etapes(d){

/* ---------- la synchronisation ---------- */
/* Rien ne part en clair. Le journal nomme des frères et des sœurs, porte ce
   qu'Il a dit, et tient le relevé minute par minute d'une vie. Le serveur n'en
   voit qu'un bloc opaque, et celui qui l'héberge ne peut rien y lire. */
/* Mais « le serveur ne lit pas » et « on peut récupérer » semblent s'exclure,
   et c'est faux. Une clé est tirée au sort pour chaque personne : c'est elle
   qui chiffre l'archive. Cette clé est ensuite mise sous enveloppe DEUX fois —
   une enveloppe que le mot de passe ouvre, une enveloppe qu'un code de
   récupération ouvre. Le serveur ne garde que les deux enveloppes closes. Qui
   oublie son mot de passe ressort son code et retrouve tout ; le serveur,
   lui, n'a jamais rien pu lire. C'est le procédé des gestionnaires de mots de
   passe, et il n'y en a pas d'autre qui tienne les deux bouts. */
/* Rempli à la publication. Personne d'autre que l'auteur n'a à connaître
   Supabase, ni à exécuter du SQL pour tenir son journal : l'adresse et la clé
   publique du projet voyagent avec l'application. Le formulaire reste là,
   derrière un lien, pour qui veut héberger le sien. */
const SUPA = {url:"https://oxuhnypkgvfaijzpgpqb.supabase.co",
              cle:"sb_publishable_x6KO1BBEhLG7kwP8dieRqw_G3RpLOuh"};
const SYK = "ebenezer.sync";
const SYVIDE = {url:"", cle:"", mail:"", uid:"", jwt:"", raf:"", exp:0,
                dk:"", envM:null, envR:null, aVoir:"",
                vu:"", base:0, fait:0, err:"", actif:false};
let SY = Object.assign({}, SYVIDE);
function syLoad(){ try{ const r=localStorage.getItem(SYK); if(r) Object.assign(SY, JSON.parse(r)); }catch(e){} }
function sySave(){ try{ localStorage.setItem(SYK, JSON.stringify(SY)); }catch(e){} }

function b64(buf){ let s=""; const a=new Uint8Array(buf);
  for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
function deb64(t){ const s=atob(t), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function alea(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function deKDF(secret, sel){
  const brut=await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:sel, iterations:250000, hash:"SHA-256"},
    brut, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function ferme(dk, secret){
  const sel=alea(16), iv=alea(12), k=await deKDF(secret, sel);
  const c=await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, dk);
  return {s:b64(sel), i:b64(iv), c:b64(c)};
}
async function ouvre(env, secret){
  const k=await deKDF(secret, deb64(env.s));
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:deb64(env.i)}, k, deb64(env.c)));
}
async function cleDoc(dk){ return crypto.subtle.importKey("raw", dk, {name:"AES-GCM"}, false, ["encrypt","decrypt"]); }
async function chiffreDoc(obj, dk){
  const iv=alea(12), k=await cleDoc(dk);
  const c=await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, new TextEncoder().encode(JSON.stringify(obj)));
  return {i:b64(iv), c:b64(c)};
}
async function dechiffreDoc(o, dk){
  const k=await cleDoc(dk);
  const p=await crypto.subtle.decrypt({name:"AES-GCM", iv:deb64(o.i)}, k, deb64(o.c));
  return JSON.parse(new TextDecoder().decode(p));
}
/* Vingt caractères sans I, O, 0 ni 1 : on le recopie à la main, souvent au
   crayon, et il ne faut pas qu'on puisse confondre deux signes. Deux cent
   quarante-huit, c'est bien au-delà de ce qui se devine. */
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function codeNeuf(){
  const a=alea(20); let t="";
  for(let i=0;i<20;i++){ t+=ALPHA.charAt(a[i]%32); if(i%4===3 && i<19) t+="-"; }
  return t;
}
function codeNu(c){
  return String(c||"").toUpperCase().split("").filter(function(x){ return ALPHA.indexOf(x)!==-1; }).join("");
}

/* On parle à Supabase en HTTP nu, sans bibliothèque : l'application reste sans
   dépendance, sans étape de compilation, et entièrement hors ligne. */
function syUrl(){ return String(SY.url||"").replace(/\/+$/,""); }
async function syFetch(chemin, opt){
  opt=opt||{};
  const h=Object.assign({"apikey":SY.cle, "Content-Type":"application/json"}, opt.headers||{});
  if(opt.jeton!==false && SY.jwt) h["Authorization"]="Bearer "+SY.jwt;
  const r=await fetch(syUrl()+chemin, {method:opt.method||"GET", headers:h,
    body:opt.body?JSON.stringify(opt.body):undefined, cache:"no-store"});
  let j=null; const t=await r.text();
  if(t){ try{ j=JSON.parse(t); }catch(e){ j=null; } }
  if(!r.ok){ const e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status)); e.code=r.status; e.corps=j; throw e; }
  return j;
}
/* Le mot de passe fait deux métiers : il ouvre la porte du serveur, et il
   ouvre l'enveloppe qui contient la clé. Un seul secret à retenir au lieu de
   deux — et donc une occasion d'oublier au lieu de deux. */
async function sySignup(mail, mdp){
  return syFetch("/auth/v1/signup", {method:"POST", jeton:false, body:{email:mail, password:mdp}});
}
async function syMotDePasse(mail, mdp){
  const j=await syFetch("/auth/v1/token?grant_type=password", {method:"POST", jeton:false, body:{email:mail, password:mdp}});
  SY.jwt=j.access_token; SY.raf=j.refresh_token; SY.exp=Date.now()+((j.expires_in||3600)*1000);
  SY.uid=(j.user&&j.user.id)||""; SY.mail=mail; sySave();
  return j;
}
async function syJeton(){
  if(SY.jwt && SY.exp>Date.now()+90000) return true;
  if(!SY.raf) return false;
  const j=await syFetch("/auth/v1/token?grant_type=refresh_token", {method:"POST", jeton:false, body:{refresh_token:SY.raf}});
  SY.jwt=j.access_token; SY.raf=j.refresh_token; SY.exp=Date.now()+((j.expires_in||3600)*1000); sySave();
  return true;
}

/* Un jalon est une chaîne, jamais une heure : comparer les horloges de deux
   appareils, c'est se tromper le jour où l'une retarde. On ne teste que
   l'égalité — « est-ce bien la version que j'ai vue la dernière fois ? ». */
function jalonNeuf(){ return Date.now().toString(36)+"-"+DEV+"-"+Math.random().toString(36).slice(2,7); }

async function syLit(entier){
  const champs = entier ? "jalon,doc" : "jalon";
  const a=await syFetch("/rest/v1/etat?uid=eq."+encodeURIComponent(SY.uid)+"&select="+champs);
  return (a && a.length) ? a[0] : null;
}
/* Les deux enveloppes sont réémises à chaque envoi. Elles ne changent qu'à
   une récupération — qui pousse aussitôt et change le jalon, donc l'autre
   appareil relira l'archive entière avant de poser la sienne. */
async function syEcrit(doc){
  const j=jalonNeuf();
  const corps=JSON.stringify({v:2, mdp:SY.envM, rec:SY.envR,
    doc:await chiffreDoc(doc, deb64(SY.dk))});
  await syFetch("/rest/v1/etat", {method:"POST",
    headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
    body:{uid:SY.uid, doc:corps, jalon:j, maj:new Date().toISOString()}});
  return j;
}

/* Reprendre une archive déjà déposée : on l'ouvre, on la réunit avec ce que
   cet appareil tient déjà, et on repose le tout. */
async function syRejoint(r, envM){
  const env=JSON.parse(r.doc);
  const autre=sane(await dechiffreDoc(env.doc, deb64(SY.dk)));
  SY.envM = envM || env.mdp; SY.envR = env.rec;
  db = (db.nodes.length || (db.temps||[]).length) ? fusionne(db, autre) : autre;
  save(true);
  SY.actif=true; SY.vu=await syEcrit(db); SY.base=db.maj||0; SY.fait=Date.now(); sySave();
  S.syEtape=0; S.syMdp=""; S.pile=[]; S.view="data";
  toast("Synchronisation en route."); render();
}

let sySuite=null, syEnCours=false;
function syPlusTard(){
  if(!SY.actif) return;
  clearTimeout(sySuite);
  sySuite=setTimeout(function(){ syMaintenant(); }, 15000);
}
/* Le cœur. Quatre cas, et un seul qui demande du travail : les deux côtés ont
   bougé — alors on réunit, on garde le résultat ici, et on le repose là-bas.
   Jamais d'écrasement : un appareil vidé par le téléphone n'a plus de pierres
   tombales, donc la fusion lui rend tout. */
async function syMaintenant(manuel){
  if(!SY.actif || syEnCours) return false;
  if(!navigator.onLine){ if(manuel) toast("Pas de réseau"); return false; }
  syEnCours=true; SY.err="";
  try{
    await syJeton();
    const r=await syLit(false);
    const distantBouge = !r || r.jalon!==SY.vu;
    const localBouge   = (db.maj||0) > (SY.base||0);
    if(!r){
      SY.vu=await syEcrit(db); SY.base=db.maj||0;
    } else if(!distantBouge && !localBouge){
      /* rien à faire */
    } else if(!distantBouge){
      SY.vu=await syEcrit(db); SY.base=db.maj||0;
    } else {
      const plein=await syLit(true);
      const env=JSON.parse(plein.doc);
      SY.envM=env.mdp; SY.envR=env.rec;
      const autre=sane(await dechiffreDoc(env.doc, deb64(SY.dk)));
      if(!localBouge){
        db=autre; save(true); SY.vu=plein.jalon; SY.base=db.maj||0;
      } else {
        db=fusionne(db, autre);
        save(true);
        SY.vu=await syEcrit(db); SY.base=db.maj||0;
      }
      render();
    }
    SY.fait=Date.now(); sySave();
    if(manuel) toast("À jour.");
    return true;
  }catch(e){
    SY.err=String(e&&e.message||e); sySave();
    if(manuel) toast(syDit(e));
    return false;
  }finally{ syEnCours=false; }
}
function syDit(e){
  const m=String(e&&e.message||e);
  if(/OperationError|operation-specific/i.test(m)) return "Ce secret n'ouvre pas cette archive";
  if(/format inconnu/i.test(m)) return "Archive d'une version plus récente";
  if(/relation .* does not exist|42P01/i.test(m)) return "La table « etat » manque encore";
  if(/not confirmed/i.test(m)) return "Décoche « Confirm email » dans Supabase";
  if(/already registered/i.test(m)) return "Ce compte existe : mot de passe incorrect";
  if(/Invalid login|invalid_grant/i.test(m)) return "Adresse ou mot de passe incorrect";
  if(/Password should be|at least/i.test(m)) return "Mot de passe trop court";
  if(/JWT|token|401/i.test(m)) return "Connexion expirée — reconnecte-toi";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Serveur injoignable";
  return m.slice(0,70);
}

/* ---------- fusionner deux appareils ---------- */
/* Le téléphone et la tablette tiennent chacun l'archive entière. À la
   rencontre, on ne choisit pas un gagnant — on réunit. Chaque fiche porte son
   identifiant et l'heure de sa dernière écriture : présente d'un seul côté
   elle est reprise, présente des deux c'est la plus récemment écrite qui
   reste, et ce qui a été supprimé le demeure grâce aux pierres tombales.
   L'opération donne le même résultat des deux côtés : les deux appareils
   convergent sans se parler davantage. */
function recent(a,b){ return ((a&&a.maj)||0) >= ((b&&b.maj)||0) ? a : b; }
function fusionListe(A, B, morts){
  const m={};
  (A||[]).forEach(function(x){ if(x&&x.id) m[x.id]=x; });
  (B||[]).forEach(function(x){ if(!x||!x.id) return; m[x.id] = m[x.id] ? recent(m[x.id],x) : x; });
  return Object.keys(m).filter(function(id){
    const t=morts[id];
    return !(t && t >= (m[id].maj||0));
  }).map(function(id){ return m[id]; });
}

const SANSFIN = 8640000000000;
function finDe(b){ return (typeof b.fin==="number") ? b.fin : SANSFIN; }
/* Deux appareils qui comptaient chacun de leur côté se chevauchent forcément :
   le téléphone croit que je travaille encore pendant que la tablette compte
   une lecture. Compter les deux doublerait l'heure et fausserait toutes les
   parts. On rejoue donc les blocs dans l'ordre où ils ont été déclarés, et le
   plus récemment dit découpe ce qui était là avant — la dernière parole sur un
   instant est celle qui vaut. Le même découpage sert quand on corrige les
   heures à la main. */
function fusionTemps(liste){
  const dits=(liste||[]).slice().sort(function(a,b){ return ((a.maj||0)-(b.maj||0)) || (a.deb-b.deb); });
  let ligne=[];
  dits.forEach(function(b){
    const d=b.deb, f=finDe(b);
    if(!(f>d)) return;
    const suite=[];
    ligne.forEach(function(x){
      const xd=x.deb, xf=finDe(x);
      if(xf<=d || xd>=f){ suite.push(x); return; }
      if(xd<d) suite.push(Object.assign({}, x, {fin:d}));
      /* La queue d'un bloc coupé en deux doit porter un identifiant que les
         deux appareils calculent pareil, sinon ils divergeraient à la
         fusion suivante. On le dérive de la coupure elle-même. */
      if(xf>f) suite.push(Object.assign({}, x, {deb:f, id:x.id+"@"+f}));
    });
    suite.push(Object.assign({}, b));
    ligne=suite;
  });
  ligne.sort(function(a,b){ return a.deb-b.deb; });
  const out=[];
  ligne.forEach(function(b){
    if(!(finDe(b)>b.deb)) return;
    const p=out[out.length-1];
    /* Recollé : deux morceaux voisins de la même activité redeviennent un
       seul bloc, sinon la journée se lirait en confettis. */
    if(p && p.t===b.t && finDe(p)===b.deb){ p.fin=b.fin; p.maj=Math.max(p.maj||0,b.maj||0); return; }
    out.push(b);
  });
  out.forEach(function(b){ if(b.fin===SANSFIN) delete b.fin; });
  return out;
}

function fusionne(A, B){
  const morts={};
  [A.morts||{}, B.morts||{}].forEach(function(m){
    Object.keys(m).forEach(function(k){ morts[k]=Math.max(morts[k]||0, m[k]||0); });
  });
  const d={
    nodes: fusionListe(A.nodes,  B.nodes,  morts),
    gens:  fusionListe(A.gens,   B.gens,   morts),
    noms:  fusionListe(A.noms,   B.noms,   morts),
    mans:  fusionListe(A.mans,   B.mans,   morts),
    cats:  fusionListe(A.cats,   B.cats,   morts),
    taches:fusionListe(A.taches, B.taches, morts),
    temps: fusionTemps(fusionListe(A.temps, B.temps, morts)),
    morts: morts,
    exp: Math.max(A.exp||0, B.exp||0),
    seq: Math.max(A.seq||1, B.seq||1),
    maj: Math.max(A.maj||0, B.maj||0)
  };
  /* Un lien vers un acte supprimé ailleurs ne mène nulle part ; un bloc dont
     l'activité a disparu n'a plus de part où se ranger. */
  const vivants={}; d.nodes.forEach(function(n){ vivants[n.id]=1; });
  d.nodes.forEach(function(n){ if(n.par) n.par=n.par.filter(function(p){ return vivants[p]; }); });
  d.noms.forEach(function(nm){ if(nm.nodes) nm.nodes=nm.nodes.filter(function(p){ return vivants[p]; }); });
  const ta={}; d.taches.forEach(function(t){ ta[t.id]=1; });
  d.temps=d.temps.filter(function(b){ return ta[b.t]; });
  /* Une pierre tombale ne sert que le temps que les deux appareils se
     rencontrent. Passé six mois, ils se sont parlé — ou l'autre n'existe plus. */
  const vieux=Date.now()-180*86400000;
  Object.keys(d.morts).forEach(function(k){ if(d.morts[k]<vieux) delete d.morts[k]; });
  return sane(d);
}

/* ---------- pointer : à quoi je suis ---------- */
/* Un seul écran pour deux usages, parce que c'est la même question : à quoi
   suis-je maintenant, et à quoi étais-je tout à l'heure. */
function vPointer(){
  const corr = S.blocId ? blocT(S.blocId) : null;
  Z.titre = corr ? "C'était quoi ?" : "À quoi maintenant ?";
  Z.retour = true;
  const o = ouvert(), q = (S.tQ||"").trim(), cats = CATS();
  let h = "";
  if(corr) h += `<div class="block amorce" style="margin-top:16px"><b>${esc(tacheNom(corr.t))}</b>, de ${hmin(new Date(corr.deb))} à ${corr.fin?hmin(new Date(corr.fin)):"maintenant"}.</div>`;
  else if(o) h += `<div class="block amorce" style="margin-top:16px">Depuis ${hmin(new Date(o.deb))}, le temps va à <b>${esc(tacheNom(o.t))}</b> — ${hm(Date.now()-o.deb)}.</div>`;
  else h += `<div class="block amorce" style="margin-top:16px">Rien n'est compté. À partir de ce que tu touches ici, le temps aura un destinataire.</div>`;

  h += liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
      <input type="text" id="tQ" placeholder="Chercher, ou nommer autre chose" value="${esc(S.tQ||"")}" autocomplete="off" autocapitalize="sentences"></div></div></li>`);

  const dejaLa = (db.taches||[]).some(t=>t.nom.toLowerCase()===q.toLowerCase());
  h += `<div id="tNeuf"${(!q || dejaLa)?" hidden":""}>
      ${titreBloc("Nouvelle activité")}
      <div class="block amorce">Dans quoi la ranger ? C'est ce rangement, et lui seul, qui fera les parts.</div>
      <div class="puces">${cats.map(c=>`<button class="puce" data-tcat="${c.id}" aria-pressed="${S.tCat===c.id}">${esc(c.nom)}</button>`).join("")}</div>
      ${liste(ligne({titre:`<span class="qn">Compter « ${esc(cap(q))} »</span>`, attr:'data-act="neufTache"'}), "lien")}
    </div>`;

  if(!(db.taches||[]).length){
    h += titreBloc("Pour commencer");
    h += `<div class="block amorce">Touche-en une : elle est créée, rangée, et comptée dès cet instant. Tu en ajouteras autant que tu veux, et tu pourras les ranger autrement.</div>`;
    cats.forEach(function(c){
      const arr = TACHES_SOCLE.filter(x=>x[1]===c.id);
      if(!arr.length) return;
      h += `<div class="tgrp">${titreBloc(esc(c.nom))}${liste(arr.map(x=>ligne({titre:esc(x[0]),
        attr:'data-sugg="'+esc(x[0])+'" data-cat="'+c.id+'" data-nom="'+esc(x[0].toLowerCase())+'"'})).join(""))}</div>`;
    });
  } else {
    /* Ce qu'on fait souvent remonte de soi-même : la liste s'ordonne sur la
       vie, pas sur l'alphabet. */
    const freq = cumul(minuit(29), Date.now()).par;
    cats.forEach(function(c){
      const arr = (db.taches||[]).filter(t=>(t.cat||"reste")===c.id)
        .sort((a,b)=>(freq[b.id]||0)-(freq[a.id]||0) || a.nom.localeCompare(b.nom,"fr"));
      if(!arr.length) return;
      h += `<div class="tgrp">${titreBloc(esc(c.nom))}${liste(arr.map(t=>ligne({titre:esc(t.nom),
        apres:(o && o.t===t.id && !corr) ? `<span class="coche">✓</span>` : (freq[t.id] ? esc(hm(freq[t.id])) : ""),
        attr:'data-tache="'+t.id+'" data-nom="'+esc(t.nom.toLowerCase())+'"'})).join(""))}</div>`;
    });
