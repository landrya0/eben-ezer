<!-- Le rameau d'amandier : shaqed, l'amandier, et shoqed, celui qui veille —
     le même mot en hébreu (Jérémie 1.11). Il fleurit avant tous les autres,
     quand l'hiver n'est pas fini. Les couleurs passent par des variables :
     un <use> crée un arbre que les sélecteurs CSS ne traversent pas. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <g id="fleur"><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(72)"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(144)"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(216)"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(288)"/><circle style="fill:var(--br)" cx="0" cy="0" r="2.6"/></g>
  <g id="amandier">
    <path style="fill:none;stroke:var(--br);stroke-width:2.1;stroke-linecap:round" d="M20 214C44 180 51 144 59 108 65 80 73 50 93 22"/>
    <path style="fill:none;stroke:var(--br);stroke-width:2.1;stroke-linecap:round" d="M56 128C71 124 85 116 96 104"/>
    <path style="fill:none;stroke:var(--br);stroke-width:2.1;stroke-linecap:round" d="M68 84C54 78 42 68 35 54"/>
    <g transform="translate(58,112) rotate(-26)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(66,88) rotate(206) scale(.9)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(40,164) rotate(-14) scale(.85)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>

    <use href="#fleur" transform="translate(96,104) scale(.78)"/>
    <use href="#fleur" transform="translate(35,54) scale(.66)"/>
  </g>
</defs></svg>
