<style>
/* Direction « Amandier ». Les composants viennent de Framework7 ; ici, la nappe
   de lumière, le verre dépoli qui la floute, la hiérarchie des textes, et le
   rameau.

   La fleur a sa vraie couleur — écorce, feuille, pétale — mais elle reste dans
   le dessin : ce qui se touche est vert sauge, jamais rose.

   Règle de lecture, tenue partout :
   · serif            → ce qui est dit (Sa parole, les actes) et les titres de page
   · sans MAJUSCULES  → les intitulés de section, jamais autre chose
   · sans normal      → ce que l'application dit
   · couleur d'accent → uniquement ce qui se touche                              */

/* La police voyage avec l'app : sans elle, le téléphone retombe sur Georgia
   et toute la typographie change de visage. */
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;
  font-display:swap;src:url(vendor/instrument-serif-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;
  font-display:swap;src:url(vendor/instrument-serif-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,
    U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  --f7-theme-color:#4E6152;
  --f7-theme-color-rgb:78,97,82;
  --f7-theme-color-shade:#3E4E42;
  --f7-theme-color-tint:#5F7563;

  --f7-page-bg-color:#F8F5F2;
  --f7-text-color:#1D1A17;
  --f7-list-strong-bg-color:rgba(255,255,255,.66);
  --f7-block-strong-bg-color:rgba(255,255,255,.66);
  --f7-list-item-border-color:rgba(29,26,23,.11);
  --f7-list-outline-inset-border-color:rgba(29,26,23,.11);
  --f7-list-outline-border-color:rgba(29,26,23,.11);
  --f7-list-item-after-text-color:#736D66;
  --f7-list-item-text-text-color:#736D66;
  --f7-list-item-subtitle-text-color:#736D66;
  --f7-block-title-text-color:#736D66;
  --f7-block-title-font-size:11px;
  --f7-list-link-pressed-bg-color:rgba(78,97,82,.09);
  --f7-input-text-color:#1D1A17;

  --muted:#736D66;
  --voix:#2C332C;
  --filet:rgba(29,26,23,.12);
  --verre:rgba(255,255,255,.66);
  --eclat:rgba(255,255,255,.92);
  --barre:rgba(255,255,255,.72);
  --ombre:0 1px 0 var(--eclat) inset, 0 12px 32px -20px rgba(40,28,20,.6);
  --lueur:rgba(78,97,82,.5);
  --flou:blur(22px) saturate(175%);
  /* la nappe de lumière : rose d'un côté, vert de l'autre, très diffus */
  --nappe:radial-gradient(78% 42% at 96% 0%,#F3E7E3 0%,transparent 62%),
          radial-gradient(78% 40% at 0% 94%,#EAEFE6 0%,transparent 60%);
  /* le rameau */
  --br:#6B5244; --fe:#D9DECF; --pe:#EFD4CE;
}
.dark{
  --f7-theme-color:#9DB7A4;
  --f7-theme-color-rgb:157,183,164;
  --f7-theme-color-shade:#8BA793;
  --f7-theme-color-tint:#B2C7B7;

  --f7-page-bg-color:#13100E;
  --f7-text-color:#EEE9E3;
  --f7-list-strong-bg-color:rgba(255,255,255,.065);
  --f7-block-strong-bg-color:rgba(255,255,255,.065);
  --f7-list-item-border-color:rgba(238,233,227,.11);
  --f7-list-outline-inset-border-color:rgba(238,233,227,.11);
  --f7-list-outline-border-color:rgba(238,233,227,.11);
  --f7-list-item-after-text-color:#99918A;
  --f7-list-item-text-text-color:#99918A;
  --f7-list-item-subtitle-text-color:#99918A;
  --f7-block-title-text-color:#99918A;
  --f7-list-link-pressed-bg-color:rgba(255,255,255,.07);
  --f7-list-group-title-bg-color:transparent;
  --f7-list-group-title-text-color:#99918A;
  --f7-actions-button-border-color:rgba(238,233,227,.11);
  --f7-actions-label-text-color:#99918A;
  --f7-input-text-color:#EEE9E3;
  --f7-bars-text-color:#EEE9E3;

  --muted:#99918A;
  --voix:#E3E8DF;
  --filet:rgba(238,233,227,.12);
  --verre:rgba(255,255,255,.065);
  --eclat:rgba(255,255,255,.13);
  --barre:rgba(19,16,14,.62);
  --ombre:0 1px 0 var(--eclat) inset, 0 12px 32px -20px rgba(0,0,0,.9);
  --lueur:rgba(157,183,164,.35);
  --nappe:radial-gradient(78% 42% at 96% 0%,#2A1E1B 0%,transparent 62%),
          radial-gradient(78% 40% at 0% 94%,#161C16 0%,transparent 60%);
  --br:#9A7A66; --fe:#3B4639; --pe:#C9A49C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;position:relative;
  background:var(--f7-page-bg-color);font-family:var(--sans)}
/* la nappe, derrière tout, fixe : c'est elle que le verre floute */
body::before{content:"";position:fixed;inset:0;z-index:0;background:var(--nappe);
  pointer-events:none}
.verre{background:var(--verre);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}

/* ---------- hiérarchie des textes ---------- */
.block-title{font-family:var(--sans);font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;font-size:11px;color:var(--f7-block-title-text-color);
  margin-top:28px;margin-bottom:9px}
.titre-page{font-family:var(--serif);font-size:36px;font-weight:400;letter-spacing:-.018em;
  margin:20px 16px 2px;line-height:1.1;color:var(--f7-text-color)}
.ssTitre{margin:0 16px 4px;font-size:13px;color:var(--muted);line-height:1.5}
.grand{font-family:var(--serif);font-size:28px;line-height:1.18;letter-spacing:-.014em;
  margin:0;color:var(--f7-text-color);border-left:2px solid var(--filet);padding-left:15px}
.grand.voix{color:var(--voix);border-left-color:var(--f7-theme-color)}
.voix{font-family:var(--serif);color:var(--voix)}
.meta{font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.015em;
  color:var(--muted);margin:13px 0 0 17px;line-height:1.5}
.amorce{font-family:var(--sans);font-size:14.5px;line-height:1.52;color:var(--muted);margin:0}
.list .item-title{font-family:var(--sans);font-size:16px;font-weight:500;line-height:1.35;
  white-space:normal;color:var(--f7-text-color)}
.list .item-title.serif{font-family:var(--serif);font-weight:400;font-size:19px;
  letter-spacing:-.01em;color:var(--voix)}
.list .item-subtitle{font-family:var(--sans);font-size:13px;font-weight:400;
  white-space:normal;margin-top:3px;letter-spacing:.005em}
.list .item-text{font-family:var(--sans);font-size:13.5px;line-height:1.45;
  white-space:normal;overflow:visible;-webkit-line-clamp:4;margin-top:4px}
.list .item-after{font-family:var(--sans);font-size:12.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;flex-shrink:0;align-self:flex-start;padding-top:4px}
.list .item-inner{align-items:flex-start}
.lien .item-title{color:var(--f7-theme-color);font-weight:600}
.coche{color:var(--f7-theme-color);font-weight:700}
.vide{margin:0;padding:13px 16px;color:var(--muted);font-size:14.5px;font-style:italic}

/* les groupes sont en verre, posés sur la nappe */
.list.inset>ul{-webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  box-shadow:var(--ombre)}

/* ---------- le rameau d'amandier ---------- */
/* Deux emplacements seulement : le filigrane d'un écran, la marque de l'accueil. */
.rameau{display:block;pointer-events:none}
.filigrane{position:absolute;top:-10px;right:-22px;width:118px;opacity:.3;z-index:0}
.marque{width:84px;margin:6px 0 2px 13px;opacity:1}

/* ---------- charpente : les barres passent par-dessus le contenu ---------- */
#main{position:absolute;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#haut{position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:4px;min-height:52px;
  padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;
  background:var(--barre);border-bottom:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#haut[hidden]{display:none}
#haut .t{flex:1 1 auto;min-width:0;text-align:center;font-size:16px;font-weight:600;
  letter-spacing:-.01em;color:var(--f7-text-color);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#haut button{flex:0 0 auto;width:auto;min-width:46px;min-height:44px;border:0;background:none;
  color:var(--f7-theme-color);display:flex;align-items:center;justify-content:center;gap:2px;
  font-size:16px;padding:0 6px;cursor:pointer}
#haut button[disabled]{opacity:0;pointer-events:none}

#avance{position:absolute;left:0;right:0;z-index:21;height:2px;background:var(--filet)}
#avance[hidden]{display:none}
#avance i{display:block;height:100%;background:var(--f7-theme-color);transition:width .25s ease}

#acte{position:absolute;left:0;right:0;z-index:20;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--barre);border-top:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#acte[hidden]{display:none}
#acte.surNav{padding-bottom:10px}
#acte .button{width:100%;font-weight:600;letter-spacing:.005em;box-shadow:var(--ombre)}
.dark #acte .button-fill{background:rgba(157,183,164,.17);color:#C4DCCA;
  border:1px solid rgba(157,183,164,.42);box-shadow:0 1px 0 var(--eclat) inset,
  0 10px 26px -14px var(--lueur)}

#nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--barre);border-top:1px solid var(--filet);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#nav[hidden]{display:none}
#nav button{flex:1 1 0;min-height:49px;border:0;background:none;font-size:11px;
  font-weight:500;color:var(--muted);padding:0 2px;cursor:pointer}
#nav button[aria-current="page"]{color:var(--f7-theme-color);font-weight:700}

/* ---------- ce qui revient : des cartes qui défilent ---------- */
.carr{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carr::-webkit-scrollbar{display:none}
.carte{scroll-snap-align:center;flex:0 0 87%;display:flex;flex-direction:column;
  background:var(--verre);border:1px solid var(--filet);border-radius:18px;
  padding:19px 19px 17px;box-shadow:var(--ombre);text-decoration:none;color:inherit;
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  -webkit-tap-highlight-color:transparent}
.carte:active{transform:scale(.985)}
.carte .quand{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--f7-theme-color)}
.carte .grand{font-size:24px;padding-left:13px}
.carte .meta{margin:12px 0 0 15px}
.points{display:flex;justify-content:center;gap:6px;padding:2px 0 4px}
.points i{width:6px;height:6px;border-radius:50%;background:var(--filet);transition:background .2s}
.points i.on{background:var(--f7-theme-color)}

/* ---------- puces de filtre ---------- */
.puces{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex:0 0 auto;width:auto;min-height:33px;padding:0 14px;border-radius:17px;
  font-family:var(--sans);font-size:13px;font-weight:500;border:1px solid var(--filet);
  background:var(--verre);color:var(--muted);cursor:pointer}
.puce[aria-pressed="true"]{background:var(--f7-theme-color);color:#FBFAF8;
  border-color:var(--f7-theme-color)}
.dark .puce[aria-pressed="true"]{color:#13100E}

/* ---------- saisie ---------- */
textarea.dicte{width:100%;min-height:120px;border:0;background:transparent;resize:none;
  font-family:var(--serif);font-size:25px;line-height:1.28;letter-spacing:-.012em;
  color:var(--f7-text-color);padding:0}
textarea.dicte::placeholder{color:var(--muted);opacity:.6}
textarea.dicte:focus{outline:0}
.micro{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 15px;
  border-radius:19px;font-family:var(--sans);font-size:13.5px;font-weight:600;
  border:1px solid var(--f7-theme-color);background:var(--verre);
  color:var(--f7-theme-color);cursor:pointer}
.micro.on{background:var(--f7-theme-color);color:#FBFAF8}
.dark .micro.on{color:#13100E}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.4}}
.micro.on svg{animation:bat 1.1s ease-in-out infinite}

/* ---------- feuilles d'action (Framework7 les cache, son JS les montre ; on fait sans) ---------- */
.actions-backdrop{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(14,10,8,.45);
  z-index:13000;opacity:0;visibility:hidden;transition:opacity .3s}
.actions-backdrop.backdrop-in{opacity:1;visibility:visible}
.actions-modal{display:none;position:fixed;left:0;right:0;bottom:0;z-index:13500}
.actions-modal.modal-in{display:block;animation:monte .28s cubic-bezier(.2,.8,.3,1)}
@keyframes monte{from{transform:translate3d(0,100%,0)}to{transform:none}}
.actions-button{font-family:var(--sans)}
.actions-button.rouge{color:#A8453B}
.dark .actions-button.rouge{color:#E78C82}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:#1D1A17;color:#F8F5F2;padding:11px 18px;border-radius:22px;
  font-family:var(--sans);font-size:14px;z-index:14000;max-width:80%;text-align:center;
  box-shadow:0 12px 34px -16px rgba(0,0,0,.7)}
.dark .toast{background:#EEE9E3;color:#13100E}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<!-- Le rameau d'amandier : shaqed, l'amandier, et shoqed, celui qui veille —
     le même mot en hébreu (Jérémie 1.11). Il fleurit avant tous les autres,
     quand l'hiver n'est pas fini. Les couleurs passent par des variables :
     un <use> crée un arbre que les sélecteurs CSS ne traversent pas. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <g id="amandier">
    <path style="fill:none;stroke:var(--br);stroke-width:2.1;stroke-linecap:round" d="M20 214C44 180 51 144 59 108 65 80 73 50 93 22"/>
    <path style="fill:none;stroke:var(--br);stroke-width:2.1;stroke-linecap:round" d="M56 128C71 124 85 116 96 104"/>
    <path style="fill:none;stroke:var(--br);stroke-width:2.1;stroke-linecap:round" d="M68 84C54 78 42 68 35 54"/>
    <g transform="translate(58,112) rotate(-26)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(66,88) rotate(206) scale(.9)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(40,164) rotate(-14) scale(.85)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g transform="translate(33,186) rotate(196) scale(.72)"><path style="fill:var(--fe);stroke:var(--br);stroke-width:1.4" d="M0 0C9-9 27-9 36 0 27 9 9 9 0 0Z"/><path style="fill:none;stroke:var(--br);stroke-width:1" d="M4 0H32"/></g>
    <g id="fleur"><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(72)"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(144)"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(216)"/><ellipse style="fill:var(--pe);stroke:var(--br);stroke-width:1.2" cx="0" cy="-9" rx="5.2" ry="8.6" transform="rotate(288)"/><circle style="fill:var(--br)" cx="0" cy="0" r="2.6"/></g>
    <use href="#fleur" transform="translate(93,22)"/>
    <use href="#fleur" transform="translate(96,104) scale(.78)"/>
    <use href="#fleur" transform="translate(35,54) scale(.66)"/>
  </g>
</defs></svg>
<div id="haut" hidden></div>
<div id="avance" hidden><i></i></div>
<div id="main"></div>
<div id="acte" hidden></div>
<nav id="nav" hidden aria-label="Navigation"></nav>
<div class="actions-backdrop" id="fond"></div>
<div class="actions-modal" id="menu"></div>

<script>
"use strict";
const KEY = "ebenezer.v1";
const MAN = {parle:"Il a parlé", pourvu:"Il a pourvu", ouvert:"Il a ouvert", delivre:"Il a délivré", repris:"Il a repris"};
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const ETAT = {fait:"fait", encours:"en cours", prevu:"prévu", abandon:"abandonné"};
const ETATS = [["fait","C'est fait"],["encours","Ça dure encore"],["prevu","C'est prévu"]];

let db = {nodes:[], gens:[], noms:[], seq:1};
let S = {view:"today", step:0, draft:null, filtre:"tout", rev:"noms", prev:"today", nodeId:null,
         eMan:"", eEtat:"fait", ePrec:"j",
         cNeuf:false, cTxt:"", cType:"", cQ:""};

/* ---------- stockage ---------- */
function sane(v){
  const o = (v && typeof v==="object") ? v : {};
  return {nodes:Array.isArray(o.nodes)?o.nodes:[], gens:Array.isArray(o.gens)?o.gens:[],
          noms:Array.isArray(o.noms)?o.noms:[], seq:(typeof o.seq==="number"&&o.seq>0)?o.seq:1};
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r) db=sane(JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Enregistrement impossible"); } }
function nid(){ return "n"+(db.seq++); }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- dates ---------- */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ if(!s) return null; const p=String(s).split("-"); if(p.length<3) return null; return {y:+p[0], m:+p[1], d:+p[2]}; }
function human(n){
  if(n.kind==="ecriture") return n.ref || "";
  const p=parse(n.date); if(!p) return "";
  if(n.prec==="a") return ""+p.y;
  if(n.prec==="m") return MOIS[p.m-1]+" "+p.y;
  return p.d+" "+MOIS[p.m-1]+" "+p.y;
}
function ansDepuis(n){ const p=parse(n.date); if(!p) return 0; return new Date().getFullYear()-p.y; }
function manCourt(m){ return m&&MAN[m] ? MAN[m].replace("Il a ","") : ""; }

/* ---------- accès ---------- */
function node(id){ return db.nodes.find(n=>n.id===id); }
function gensNom(id){ const g=db.gens.find(x=>x.id===id); return g?g.nom:""; }
function gensId(nom){
  const v=String(nom||"").trim(); if(!v) return null;
  const k=v.toLowerCase();
  const f=db.gens.find(g=>String(g.nom).trim().toLowerCase()===k);
  if(f) return f.id;
  const id="g"+(db.seq++); db.gens.push({id:id,nom:v}); return id;
}
function enfants(id){ return db.nodes.filter(n=>(n.par||[]).indexOf(id)!==-1); }
function dessous(id){
  const vus=[id]; let f=[id];
  while(f.length){ const g=[]; f.forEach(x=>enfants(x).forEach(e=>{ if(vus.indexOf(e.id)===-1){vus.push(e.id); g.push(e.id);} })); f=g; }
  return vus;
}
function estParole(n){ return n.kind==="rhema" || n.kind==="ecriture" || (n.act==="dieu" && n.man==="parle"); }
function acteurTxt(n){
  if(n.act==="dieu") return n.kind==="ecriture" ? "Écriture" : (n.kind==="rhema" ? "Dieu · rhema" : "Dieu");
  if(n.act==="gens"){ const nom=gensNom(n.gid)||"quelqu'un"; return n.man ? ("Lui, par "+nom) : nom; }
  const d = n.dest==="gens" ? (gensNom(n.dgid)||"quelqu'un") : (n.dest==="moi" ? "moi-même" : "Dieu");
  return "moi → "+d;
}
function dieuNodes(){ return db.nodes.filter(n=>n.kind!=="ecriture" && (n.act==="dieu" || (n.act==="gens" && n.man))); }
function parDate(a,b){ return (b.date||"").localeCompare(a.date||""); }

/* ---------- ce qui revient ----------
   Pas un seul souvenir : tout ce qui revient aujourd'hui, à faire défiler.
   Une semaine, un mois, un an — et, quand la mémoire est pleine, le hasard. */
function jour0(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function joursDepuis(n){
  const p=parse(n.date); if(!p) return null;
  return Math.round((jour0(new Date()) - new Date(p.y,p.m-1,p.d)) / 86400000);
}
const FENETRES = [
  {j:7,   tol:0, t:"Il y a une semaine"},
  {j:14,  tol:1, t:"Il y a deux semaines"},
  {j:30,  tol:2, t:"Il y a un mois"},
  {j:91,  tol:4, t:"Il y a trois mois"},
  {j:182, tol:5, t:"Il y a six mois"}
];
function ansJourPourJour(n){
  const p=parse(n.date), now=new Date();
  if(!p || n.prec!=="j") return 0;
  if(p.m!==now.getMonth()+1 || p.d!==now.getDate()) return 0;
  const a=now.getFullYear()-p.y;
  return a>0 ? a : 0;
}
function carteAnniv(n){
  const a=ansJourPourJour(n);
  if(a) return {n:n, type:"anniv", quand:"Il y a "+(a===1?"un an":a+" ans"), rang:100-a};
  const j=joursDepuis(n);
  if(j==null || j<=1) return null;
  for(let i=0;i<FENETRES.length;i++){
    const f=FENETRES[i];
    if(Math.abs(j-f.j)<=f.tol) return {n:n, type:"anniv", quand:f.t, rang:i};
  }
  return null;
}
function remontees(){
  const vus={}, cartes=[];
  const prends=c=>{ if(c && !vus[c.n.id]){ vus[c.n.id]=1; cartes.push(c); } };

  db.nodes.filter(n=>n.etat==="prevu" && n.date && n.date<=today())
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""))
    .slice(0,2)
    .forEach(n=>prends({n:n, type:"prevu", quand:"Tu avais prévu"}));

  dieuNodes().map(carteAnniv).filter(Boolean)
    .sort((a,b)=>a.rang-b.rang).forEach(prends);

  dieuNodes().filter(n=>!enfants(n.id).some(e=>e.act==="moi"))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""))
    .slice(0,2)
    .forEach(n=>prends({n:n, type:"dette", quand:"Sans réponse de toi"}));

  /* Quand il y en a beaucoup, le hasard ramène ce qu'on ne cherchait pas. */
  const reste=dieuNodes().filter(n=>!vus[n.id]);
  for(let k=0; k<3 && reste.length && cartes.length<8; k++){
    const n=reste.splice(Math.floor(Math.random()*reste.length),1)[0];
    prends({n:n, type:"hasard", quand:"Au hasard"});
  }
  return cartes;
}

function liste(contenu, opt){ return `<div class="list list-strong list-outline list-dividers inset ${opt||""}"><ul>${contenu}</ul></div>`; }
function ligne(o){

}
function champ(id, ph, type, val){

function ouvreMenu(groupes){

      : `<div class="actions-button ${b.rouge?"rouge":""}" ${b.attr||""}>${esc(b.txt)}</div>`).join("")

/* Les barres flottent au-dessus de la liste pour que le verre ait quelque chose

function place(){

function chiffres(){
  const out=[], dn=dieuNodes();
  const prem=dn.map(n=>n.date).filter(Boolean).sort()[0];
  out.push(`Il a agi <b>${dn.length}</b> fois${prem?(", depuis "+(parse(prem)||{y:"?"}).y):""}.`);
  if(dn.length){
    const sansR=dn.filter(n=>!enfants(n.id).some(e=>e.act==="moi")).length;
    out.push(sansR ? `<b>${sansR}</b> de ses actes n'ont jamais rien reçu de toi.`
                   : `Chacun de ses actes a reçu quelque chose de toi.`);
  }
  const mien=db.nodes.filter(n=>n.act==="moi");
  if(mien.length){
    out.push(`Tu as posé <b>${mien.length}</b> acte${mien.length>1?"s":""} : ${mien.filter(n=>n.dest==="dieu").length} pour Lui, ${mien.filter(n=>n.dest==="gens").length} pour d'autres, ${mien.filter(n=>n.dest==="moi").length} pour toi.`);
    const yrs={};
    mien.forEach(n=>{ const p=parse(n.date); if(!p) return; yrs[p.y]=yrs[p.y]||{t:0,moi:0}; yrs[p.y].t++; if(n.dest==="moi") yrs[p.y].moi++; });
    const ks=Object.keys(yrs).sort();
    if(ks.length>=2){
      const a=yrs[ks[0]], b=yrs[ks[ks.length-1]];
      if(a.t>=5 && b.t>=5) out.push(`En ${ks[0]}, ${Math.round(100*a.moi/a.t)}% de tes actes étaient pour toi. En ${ks[ks.length-1]}, ${Math.round(100*b.moi/b.t)}%.`);
    }
  }
  const par={};
  db.nodes.forEach(n=>{ if(n.act==="gens"&&n.gid) par[n.gid]=(par[n.gid]||0)+1; });
  const top=Object.keys(par).sort((a,b)=>par[b]-par[a])[0];
  if(top) out.push(`Dieu est passé <b>${par[top]}</b> fois par ${esc(gensNom(top))}.`);
  return out;
}

/* ---------- choisir une cause ----------
   Un seul écran, pour l'assistant comme pour un acte déjà gardé (13.o).
   On cherche au texte ; si la cause n'est pas encore dans la mémoire,
   on l'écrit ici même, sans quitter l'écran. */
const NEUFS = [
  ["ecriture", "Une promesse de l'Écriture",   "elle ne compte pas parmi Ses œuvres", true],
  ["rhema",    "Une parole qu'Il m'a dite",    "", true],
  ["moi",      "Quelque chose que j'ai fait",  "une prière, un jeûne, une démarche", false],
  ["dieu",     "Quelque chose qu'Il a fait",   "", false]
];
function choixCause(sel, exclus){
  /* Deuxième mode : on écrit la cause qui manque. La liste disparaît. */
  if(S.cNeuf){
    return `<div class="block" style="margin-top:18px">
        <textarea class="dicte" id="cNeuf" placeholder="La parole, la prière, l'acte qui a précédé…"
          style="min-height:84px">${esc(S.cTxt)}</textarea>${micBloc("cNeuf")}</div>`
      + titreBloc("Qu'est-ce que c'est ?")
      + liste(NEUFS.map(n=>ligne({titre:n[1], sous:n[2], serif:n[3],
          apres:S.cType===n[0]?`<span class="coche">✓</span>`:"",
          attr:'data-ctype="'+n[0]+'"'})).join(""));
  }
  /* Premier mode : on cherche dans ce qui est déjà gardé. */
  const cands = db.nodes
    .filter(x => exclus.indexOf(x.id)===-1 && x.etat!=="prevu" && x.etat!=="abandon")
    .sort(parDate);
  return champ("cFiltre","Cherche : une parole, une prière, un acte…")
    + liste(ligne({titre:`<span class="coche">+ Ajouter quelque chose de nouveau</span>`,
        attr:'data-act="causeNeuf"'}))
    + (cands.length
        ? liste(cands.map(x=>ligne({titre:esc(x.txt), serif:estParole(x),
            sous:esc(acteurTxt(x))+(human(x)?" · "+human(x):""),
            apres:sel.indexOf(x.id)!==-1?`<span class="coche">✓</span>`:"",
            attr:'data-par="'+x.id+'"'})).join(""), "cands")
        : `<p class="vide">Rien d'autre dans ta mémoire pour l'instant.</p>`)
    + `<p class="vide" id="rien" hidden>Rien ne correspond. Touche « Ajouter quelque chose de nouveau ».</p>`;
}

/* ---------- rattacher une cause ---------- */
function vLier(){
  const n=node(S.nodeId); if(!n){ S.view="today"; return render(); }
  Z.titre = S.cNeuf ? "Ajouter une cause" : "Rattacher une cause"; Z.retour=true;
  Z.html = `<div class="block" style="margin-top:18px">
      <p class="grand ${estParole(n)?"voix":""}" style="font-size:21px">${esc(n.txt)}</p>
      <p class="meta">${S.cNeuf ? "Ce qui a précédé n'était pas encore gardé. Écris-le ici."
        : "Une parole, une prière, un bienfait d'avant."}</p></div>`
    + choixCause(n.par||[], dessous(n.id));
  Z.action = S.cNeuf ? bouton("Ajouter et lier", 'data-act="ajoute"')
                     : bouton("Terminer", 'data-back="1"');
}

/* ---------- l'assistant : noter, et attacher une réponse ---------- */
function neuf(act){ return {act:act,gid:null,dest:"dieu",dgid:null,txt:"",man:"",par:[],etat:"fait",date:today(),prec:"j",fige:false}; }
/* L'ordre des questions se déduit du brouillon : une question par écran. */
function etapes(d){
  const e=[];
  e.push("qui");
  if(d.act==="gens") e.push("gens");
  if(d.act==="moi") e.push("dest");
  if(d.act==="moi" && d.dest==="gens") e.push("destGens");
  e.push("txt");
  if(d.act!=="moi") e.push("man");
  e.push("quand");
  if(!d.fige) e.push("par");
  return e;
}
function vNote(){
  const d=S.draft||(S.draft=neuf(null));
  const et=etapes(d);
  if(S.step>=et.length) S.step=et.length-1;
  if(S.step<0) S.step=0;
  const cle=et[S.step];
  Z.avance=(S.step+1)/et.length;
  Z.retour = S.step>0;
  Z.fermer = S.step===0;
  const parent = d.fige && d.par.length ? node(d.par[0]) : null;

  if(cle==="qui"){
    Z.titre = parent ? "Qui a répondu ?" : "Qu'est-ce que tu gardes ?";
    Z.html = liste(parent
      ? ligne({titre:"Dieu a répondu…", sous:"sans passer par personne", serif:true, attr:'data-qui="dieu"'})+
        ligne({titre:"J'ai répondu…", serif:true, attr:'data-qui="moi"'})+
        ligne({titre:"Je vais répondre…", sous:"ce que tu t'engages à faire", serif:true, attr:'data-qui="moiPrevu"'})+
        ligne({titre:"Quelqu'un a répondu…", sous:"même si c'est Lui derrière", serif:true, attr:'data-qui="gens"'})
      : ligne({titre:"Dieu a fait…", sous:"sans passer par personne", serif:true, attr:'data-qui="dieu"'})+
        ligne({titre:"J'ai fait…", serif:true, attr:'data-qui="moi"'})+
        ligne({titre:"Je vais faire…", sous:"une résolution, un engagement, un vœu", serif:true, attr:'data-qui="moiPrevu"'})+
        ligne({titre:"Quelqu'un a fait…", sous:"même si c'est Lui derrière", serif:true, attr:'data-qui="gens"'}));
  }
  else if(cle==="dest"){
    Z.titre="Pour qui ?";
    Z.html = (parent?rappel(parent):"") + liste(
      ligne({titre:"Pour Dieu", serif:true, attr:'data-dest="dieu"'})+
      ligne({titre:"Pour quelqu'un", serif:true, attr:'data-dest="gens"'})+
      ligne({titre:"Pour moi", serif:true, attr:'data-dest="moi"'}));
  }
  else if(cle==="gens" || cle==="destGens"){
    const ch = cle==="gens" ? "gid" : "dgid";
    Z.titre = cle==="gens" ? "Qui a fait ?" : "Pour qui ?";
    Z.html = (db.gens.length
        ? liste(db.gens.map(g=>ligne({titre:esc(g.nom),
            apres:d[ch]===g.id?`<span class="coche">✓</span>`:"",
            attr:'data-gens="'+g.id+'" data-champ="'+ch+'"'})).join(""))
        : `<p class="vide">Personne encore.</p>`)
      + titreBloc("Un autre nom") + champ("newGens","Frère…, Sœur…")
      + `<div class="block">${bouton("Ajouter", 'data-act="addGens" data-champ="'+ch+'"')}</div>`;
  }
  else if(cle==="txt"){
    const futur = d.act==="moi" && d.etat==="prevu";
    const ph = d.act==="dieu" ? "Il a guéri maman en une nuit"
             : (d.act==="moi" ? "Remercier à voix haute pour…" : "Il a payé le loyer, sans que je demande");
    Z.titre = d.act==="dieu" ? "Qu'est-ce qu'Il a fait ?"
            : (d.act==="moi" ? (futur ? "Qu'est-ce que tu vas faire ?" : "Qu'est-ce que tu as fait ?")
                             : "Qu'a fait "+(gensNom(d.gid)||"cette personne")+" ?");
    let h = parent?rappel(parent):"";
    h+=`<div class="block"><textarea class="dicte" id="nTxt" placeholder="${ph}">${esc(d.txt)}</textarea>${micBloc("nTxt")}</div>`;
    if(d.act==="moi"){
      const sug = (parent && parent.act==="gens")
        ? ["Le lui dire","Lui rendre un service","Prier pour lui","Remercier Dieu pour lui"]
        : ["Remercier à voix haute","Donner","Jeûner un jour","Le proclamer","Méditer sur ce bienfait"];
      h+=titreBloc("Ou choisis")+liste(sug.map(s=>ligne({titre:esc(s), attr:'data-sug="'+esc(s)+'"'})).join(""));
    }
    Z.html=h;
    Z.action = bouton("Continuer", 'data-act="suite"');
  }
  else if(cle==="man"){
    Z.titre = d.act==="dieu" ? "Sa manière ?" : "Reconnais-tu Sa main ?";
    let h="";
    if(d.act==="gens") h+=`<div class="block amorce" style="margin-top:16px">Si tu choisis une manière, cet acte entrera dans Ses œuvres.</div>`;
    h+=liste(Object.keys(MAN).map(k=>ligne({titre:MAN[k], serif:true,
      apres:d.man===k?`<span class="coche">✓</span>`:"", attr:'data-man="'+k+'"'})).join(""));
    Z.html=h;
    Z.action = bouton(d.man?"Continuer":"Passer", 'data-act="suite"');
  }
  else if(cle==="par"){
    Z.titre = S.cNeuf ? "Ajouter une cause" : "En réponse à quoi ?";
    Z.html = `<div class="block amorce" style="margin-top:16px">${S.cNeuf
        ? "Ce qui a précédé n'était pas encore gardé. Écris-le ici."
        : "Une parole, une prière, un bienfait d'avant. Autant de liens que nécessaire."}</div>`
      + choixCause(d.par, []);
    if(S.cNeuf){ Z.action = bouton("Ajouter et lier", 'data-act="ajoute"'); }
    else {
      const der = S.step===etapes(d).length-1;
      Z.action = d.par.length
        ? bouton((der?"Garder — ":"Continuer — ")+d.par.length+" lien"+(d.par.length>1?"s":""), 'data-act="'+(der?"saveNote":"suite")+'"')
        : bouton(der?"Garder sans lien":"Non, comme ça", 'data-act="'+(der?"saveNote":"suite")+'"');
    }
  }
  else {
    Z.titre = (d.act==="moi" && d.etat==="prevu") ? "Pour quand ?" : "Quand ?";
    Z.html = blocQuand("nDate", d.date, d.prec, d.act==="moi", d.etat);
    Z.action = bouton(S.step===etapes(d).length-1?"Garder":"Continuer",
      'data-act="'+(S.step===etapes(d).length-1?"saveNote":"suiteDate")+'"');
  }
}
function rappel(p){
  return `<div class="block amorce" style="margin-top:16px">En réponse à :
    <span class="${estParole(p)?"voix":""}">${esc(p.txt)}</span></div>`;
}
/* La date est toujours visible. L'état est une question séparée. */
function blocQuand(id, val, prec, avecEtat, etat){
  let h=titreBloc(etat==="prevu" ? "Pour quand ?" : "Quand ?")+
    liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
      <input type="date" id="${id}" value="${val||today()}"></div></div></li>`+
      ligne({titre:(prec==="m"?`<span class="coche">Je ne me souviens que du mois</span>`:"Je ne me souviens que du mois"),
             apres:prec==="m"?`<span class="coche">✓</span>`:"", attr:'data-prec="'+id+'"'}));
  if(avecEtat){
    h+=titreBloc("Où ça en est ?")+liste(ETATS.map(([k,l])=>ligne({titre:l,
      apres:etat===k?`<span class="coche">✓</span>`:"", attr:'data-etat="'+k+'"'})).join(""));
  }
  return h;
}

/* ---------- mes données ---------- */
function vData(){
  Z.titre="Mes données"; Z.retour=true;
  Z.html = `<div class="block amorce" style="margin-top:18px">Tout est gardé sur ce téléphone, et nulle part ailleurs. Copie ce texte de temps en temps et garde-le quelque part : c'est ta sauvegarde.</div>
    ${liste(`<li class="item-content item-input"><div class="item-inner"><div class="item-input-wrap">
      <textarea id="dump" style="min-height:150px;font-size:12px">${esc(JSON.stringify(db))}</textarea></div></div></li>`)}
    ${liste(ligne({titre:"Remplacer par ce texte", attr:'data-act="restore"'})+
            ligne({titre:`<span class="rouge">Tout effacer</span>`, attr:'data-act="askWipe"'}))}`;
  Z.action = bouton("Copier", 'data-act="copy"');

/* Depuis n'importe quel onglet, le geste reste à portée. */
function vListe(f){ return function(){ f(); if(!Z.action) Z.action=bouton("Noter quelque chose",'data-go="note"'); }; }
const VUES = {today:vToday, oeuvres:vListe(vOeuvres), revel:vListe(vRevel), actes:vListe(vActes),
              note:vNote, node:vNode, edit:vEdit, lier:vLier, data:vData};

/* ---------- dictée ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recId=null, recTail="";
function micBloc(id){
  if(!SR) return `<p class="amorce" style="margin-top:12px">Tu peux dicter : touche le micro de ton clavier.</p>`;
  return `<div style="margin-top:14px"><button class="micro" data-mic="${id}">${MICSVG} Dicter</button></div>`;
}
function colle(a,b){ if(!a) return b; return /\s$/.test(a) ? a+b : a+" "+b; }
function micArret(){
  if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} }
  rec=null; recId=null; recTail="";
  [].forEach.call(document.querySelectorAll("[data-mic]"),b=>{ b.classList.remove("on"); b.innerHTML=MICSVG+" Dicter"; });
}
function micBascule(id){
  if(!SR) return;
  if(rec && recId===id) return micArret();
  micArret();
  const el=document.getElementById(id); if(!el) return;
  try{ rec=new SR(); }catch(e){ return toast("Dictée indisponible ici"); }
  rec.lang="fr-FR"; rec.interimResults=true; rec.continuous=true;
  /* On n'ajoute que ce qui vient d'être dit : ce que le disciple efface reste effacé. */
  rec.onresult=e=>{
    let fini="", provisoire="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) fini+=r[0].transcript; else provisoire+=r[0].transcript;
    }
    let base=el.value;
    if(recTail && base.slice(-recTail.length)===recTail) base=base.slice(0,base.length-recTail.length);
    if(fini.trim()) base=colle(base,fini.trim());
    recTail = provisoire ? (base&&!/\s$/.test(base) ? " " : "")+provisoire : "";
    el.value = base+recTail;
    el.dispatchEvent(new Event("input",{bubbles:true}));
  };
  rec.onerror=ev=>{
    const m={"not-allowed":"Micro refusé — autorise-le dans les réglages","service-not-allowed":"Dictée indisponible ici","no-speech":"Je n'ai rien entendu"};
    toast(m[ev.error]||"Dictée indisponible ici"); micArret();
  };
  rec.onend=()=>micArret();
  try{ rec.start(); }catch(e){ return toast("Dictée indisponible ici"); }
  recId=id;
  const b=document.querySelector('[data-mic="'+id+'"]');
  if(b){ b.classList.add("on"); b.innerHTML=MICSVG+" J'écoute… toucher pour arrêter"; }
}

/* ---------- saisies gardées ---------- */
document.addEventListener("input", ev=>{
  const id=ev.target.id;
  if(id==="cNeuf"){ S.cTxt=ev.target.value; return; }
  if(id==="cFiltre"){
    const q=ev.target.value.trim().toLowerCase();
    S.cQ=ev.target.value;
    let vus=0;
    [].forEach.call(document.querySelectorAll("[data-par]"), el=>{
      const li=el.closest("li")||el;
      const ok = !q || el.textContent.toLowerCase().indexOf(q)!==-1;
      li.hidden = !ok; if(ok) vus++;
    });
    const bloc=document.querySelector(".cands"), rien=document.getElementById("rien");
    if(bloc) bloc.hidden = !vus;
    if(rien) rien.hidden = !(q && !vus);
    return;
  }
  if(id==="nTxt" && S.draft) S.draft.txt=ev.target.value;
  if(id==="nDate" && S.draft) S.draft.date=ev.target.value;
});

/* ---------- gestes ---------- */
fond.addEventListener("click", ()=>fermeMenu());
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-go],[data-node],[data-filtre],[data-rev],[data-qui],[data-dest],[data-gens],[data-par],[data-man],[data-eman],[data-etat],[data-prec],[data-sug],[data-mic],[data-act],[data-ctype],[data-attach],[data-lierview],[data-fait],[data-abandon],[data-back]");
  if(!t) return;
  const g=t.dataset;
  if(g.mic) return micBascule(g.mic);
  if(g.go){ fermeMenu(); S.view=g.go; if(g.go==="note"){S.step=0;S.draft=null;} return render(); }
  if(g.back){
    if(S.cNeuf){ S.cNeuf=false; S.cTxt=""; S.cType=""; return render(); }
    if(S.view==="note" && S.step>0){ S.step--; return render(); }
    if(S.view==="note"){ S.view=S.prev||"today"; S.draft=null; return render(); }
    if(S.view==="lier"||S.view==="edit"){ S.view="node"; return render(); }
    S.view = S.prev||"today"; return render();
  }
  if(g.node){ fermeMenu(); if(["node","lier","edit","note"].indexOf(S.view)===-1) S.prev=S.view; S.nodeId=g.node; S.view="node"; return render(); }
  if(g.lierview){ S.nodeId=g.lierview; S.view="lier"; return render(); }
  if(g.ctype){ S.cTxt=((document.getElementById("cNeuf")||{}).value)||S.cTxt; S.cType=g.ctype; return render(); }
  if(g.attach){
    fermeMenu(); S.nodeId=g.attach;
    S.draft=neuf("moi"); S.draft.fige=true; S.draft.par=[g.attach];
    S.step=0; S.view="note"; S.prev="node"; return render();
  }
  if(g.filtre){ S.filtre=g.filtre; return render(); }
  if(g.rev){ S.rev=g.rev; return render(); }
  if(g.qui){
    const a=S.draft||{}, prevu=(g.qui==="moiPrevu");
    S.draft=neuf(prevu?"moi":g.qui);
    S.draft.etat = prevu ? "prevu" : "fait";
    S.draft.par=(a.par||[]).slice(); S.draft.fige=!!a.fige;
    S.step=1; return render();
  }
  if(g.dest){ S.draft.dest=g.dest; S.step++; return render(); }
  if(g.gens){ S.draft[g.champ]=g.gens; S.step++; return render(); }
  if(g.sug){ const e=document.getElementById("nTxt"); if(e){ e.value=g.sug; e.dispatchEvent(new Event("input",{bubbles:true})); e.focus(); } return; }
  if(g.man){ S.draft.man=(S.draft.man===g.man?"":g.man); return render(); }
  if(g.eman){ S.eMan=(S.eMan===g.eman?"":g.eman); return render(); }
  if(g.etat){ if(S.view==="edit") S.eEtat=g.etat; else if(S.draft) S.draft.etat=g.etat; return render(); }
  if(g.prec){
    const el=document.getElementById(g.prec), v=el&&el.value;
    if(S.view==="edit"){ S.ePrec=(S.ePrec==="m")?"j":"m"; if(v){ const n=node(S.nodeId); if(n) n.date=v; } }
    else if(S.draft){ if(v) S.draft.date=v; S.draft.prec=(S.draft.prec==="m")?"j":"m"; }
    return render();
  }
  if(g.par){
    if(S.view==="lier"){ const n=node(S.nodeId); if(!n) return; n.par=n.par||[];
      const i=n.par.indexOf(g.par); i===-1?n.par.push(g.par):n.par.splice(i,1); save(); }
    else if(S.draft){ const i=S.draft.par.indexOf(g.par); i===-1?S.draft.par.push(g.par):S.draft.par.splice(i,1); }
    return render();
  }
  if(g.fait){ fermeMenu(); const n=node(g.fait); if(n){ n.etat="fait"; n.prevuLe=n.date; n.date=today(); n.prec="j"; save(); toast("Fait."); } return render(); }
  if(g.abandon){ fermeMenu(); const n=node(g.abandon); if(n){ n.etat="abandon"; save(); toast("Noté."); } return render(); }
  if(g.act) return actions[g.act] && actions[g.act](t);
});

function valDate(id, repli){ const e=document.getElementById(id); return (e&&e.value)?e.value:(repli||today()); }
function saveTxt(){ const e=document.getElementById("nTxt"); if(e&&S.draft) S.draft.txt=e.value; }

const actions={
  menu(){ if(S.view==="node") menuNode(); },
  fermeMenu(){ fermeMenu(); },
  demo(){ seed(); save(); toast("Exemple chargé"); render(); },
  suite(){
    const d=S.draft, et=etapes(d), cle=et[S.step];
    if(cle==="txt"){ saveTxt(); if(!d.txt.trim()) return toast("Écris ou dicte quelque chose"); }
    S.step++; render();
  },
  suiteDate(){ const v=valDate("nDate", S.draft&&S.draft.date); if(v && S.draft) S.draft.date=v; S.step++; render(); },
  addGens(t){
    const ch=(t&&t.dataset.champ)||"gid";
    const id=gensId((document.getElementById("newGens")||{}).value);
    if(!id) return toast("Écris un nom");
    S.draft[ch]=id; save(); S.step++; render();
  },
  addNom(){ const v=((document.getElementById("newNom")||{}).value||"").trim(); if(!v) return toast("Écris le nom"); db.noms.push({id:"p"+(db.seq++),txt:v,nodes:[]}); save(); render(); },
  /* La cause n'était pas encore gardée : on la garde ici, et on la lie.
     Elle hérite de la date de l'acte qu'elle précède — à corriger d'un geste
     en l'ouvrant, c'est toujours plus juste qu'aujourd'hui. */
  causeNeuf(){ S.cNeuf=true; S.cTxt=""; S.cType=""; render(); },
  causeListe(){ S.cNeuf=false; S.cTxt=""; S.cType=""; render(); },
  ajoute(){
    const el=document.getElementById("cNeuf");
    const v=((el&&el.value)||S.cTxt||"").trim();
    if(!v) return toast("Écris ou dicte la cause");
    if(!S.cType) return toast("Dis ce que c'est");
    const quoi=S.cType, cible=(S.view==="lier") ? node(S.nodeId) : S.draft;
    const n={id:nid(), act:(quoi==="moi"?"moi":"dieu"), gid:null,
      dest:(quoi==="moi"?"dieu":null), dgid:null, txt:v,
      man:(quoi==="rhema"?"parle":""),
      kind:(quoi==="ecriture"?"ecriture":(quoi==="rhema"?"rhema":"acte")), ref:"",
      date:(cible&&cible.date)||today(), prec:(cible&&cible.prec)||"j",
      etat:"fait", par:[]};
    db.nodes.push(n);
    if(S.view==="lier"){ const c=node(S.nodeId); if(c){ c.par=c.par||[]; c.par.push(n.id); } }
    else if(S.draft){ S.draft.par.push(n.id); }
    save(); S.cNeuf=false; S.cTxt=""; S.cType="";
    toast("Ajouté et lié"); render();
  },
  saveNote(){
    const d=S.draft;
    const n={id:nid(),act:d.act,gid:d.gid,dest:d.act==="moi"?d.dest:null,dgid:d.dgid,txt:d.txt.trim(),man:d.man,
      kind:(d.act==="dieu"&&d.man==="parle")?"rhema":"acte",
      date:valDate("nDate", d.date),prec:d.prec||"j",etat:d.act==="moi"?(d.etat||"fait"):"fait",par:d.par.slice()};
    db.nodes.push(n); save();
    /* On repart là où l'acte est désormais rangé : le disciple le voit,
       et l'écran a ses onglets — il n'est jamais enfermé. */
    const onglet = n.act==="moi" ? "actes" : "oeuvres";
    const ou = n.act==="moi" ? "Mes actes" : "Ses œuvres";
    const fige=d.fige;
    S.draft=null; S.step=0; S.prev=onglet;
    if(fige){ S.view="node"; S.nodeId=d.par[0]; } else { S.view=onglet; S.nodeId=n.id; }
    toast(fige ? "Rattaché · dans "+ou : "Gardé dans "+ou); render();
  },
  edit(){ fermeMenu(); const n=node(S.nodeId); if(!n) return; S.eMan=n.man||""; S.eEtat=n.etat||"fait"; S.ePrec=n.prec||"j"; S.view="edit"; render(); },
  saveEdit(){
    const n=node(S.nodeId), e=document.getElementById("eTxt");
    if(n){
      if(e&&e.value.trim()) n.txt=e.value.trim();
      n.date=valDate("eDate"); n.prec=S.ePrec||"j";
      if(n.act!=="moi"){ n.man=S.eMan; if(n.kind!=="ecriture") n.kind=(n.act==="dieu"&&n.man==="parle")?"rhema":"acte"; }
      else { n.etat=S.eEtat||"fait"; }
      save(); toast("Corrigé.");
    }
    S.view="node"; render();
  },
  askDel(){
    fermeMenu();
    ouvreMenu([[{label:"Cet acte sera effacé, et ses liens avec."},
                {txt:"Supprimer", rouge:true, attr:'data-act="delNode"'}],
               [{txt:"Annuler", attr:'data-act="fermeMenu"'}]]);
  },
  delNode(){
    fermeMenu();
    const id=S.nodeId;
    db.nodes=db.nodes.filter(n=>n.id!==id);
    db.nodes.forEach(n=>{ if(n.par) n.par=n.par.filter(p=>p!==id); });
    db.noms.forEach(nm=>{ if(nm.nodes) nm.nodes=nm.nodes.filter(p=>p!==id); });
    save(); S.view=S.prev||"today"; toast("Supprimé."); render();
  },
  copy(){ const e=document.getElementById("dump"); e.select(); try{ navigator.clipboard.writeText(e.value).then(()=>toast("Copié"),()=>toast("Sélectionne et copie")); }catch(x){ toast("Sélectionne et copie"); } },
  restore(){ try{ const v=JSON.parse(document.getElementById("dump").value); if(!v||!Array.isArray(v.nodes)) throw 0; db=sane(v); save(); toast("Remplacé"); S.view="today"; render(); }catch(e){ toast("Ce texte n'est pas une sauvegarde"); } },
  askWipe(){
    ouvreMenu([[{label:"Tous tes mémoriaux seront effacés. Copie d'abord ta sauvegarde."},
                {txt:"Tout effacer", rouge:true, attr:'data-act="wipe"'}],
               [{txt:"Annuler", attr:'data-act="fermeMenu"'}]]);
  },
  wipe(){ fermeMenu(); db={nodes:[],gens:[],noms:[],seq:1}; save(); S.view="today"; toast("Effacé"); render(); }
};

/* ---------- exemple ---------- */
function seed(){
  db={nodes:[],gens:[],noms:[],seq:1};
  const g1=gensId("Frère Thomas"), g2=gensId("Sœur Estelle");
  const y=new Date().getFullYear(), md=today().slice(4);
  const a={id:nid(),act:"dieu",txt:"« Je pourvoirai pour les tiens. »",man:"parle",kind:"rhema",date:(y-5)+"-08-02",prec:"j",etat:"fait",par:[]};
  const b={id:nid(),act:"dieu",txt:"« Ne crains pas pour la maison. Je m'en occupe. »",man:"parle",kind:"rhema",date:(y-3)+md,prec:"j",etat:"fait",par:[a.id]};
  const c={id:nid(),act:"moi",dest:"dieu",txt:"Remercier pour cette parole",man:"",kind:"acte",date:(y-3)+"-11-12",prec:"j",etat:"fait",par:[b.id]};
  const d={id:nid(),act:"gens",gid:g1,txt:"Il a prêté l'argent du loyer, sans que je demande",man:"pourvu",kind:"acte",date:(y-2)+"-03-04",prec:"j",etat:"fait",par:[a.id]};
  const e={id:nid(),act:"dieu",txt:"La maison de Nkolbisson",man:"pourvu",kind:"acte",date:(y-1)+"-09-18",prec:"j",etat:"fait",par:[a.id,b.id,d.id]};
  const f={id:nid(),act:"moi",dest:"gens",dgid:g1,txt:"Le lui dire",man:"",kind:"acte",date:(y-2)+"-03-12",prec:"j",etat:"fait",par:[d.id]};
  const h={id:nid(),act:"moi",dest:"dieu",txt:"Jeûner un jour",man:"",kind:"acte",date:y+"-12-15",prec:"j",etat:"prevu",par:[b.id]};
  const i={id:nid(),act:"moi",dest:"gens",dgid:g2,txt:"Dire à Estelle ce qu'Il a fait",man:"",kind:"acte",date:y+"-11-20",prec:"j",etat:"prevu",par:[e.id]};
  db.nodes.push(a,b,c,d,e,f,h,i);
  db.noms.push({id:"p"+(db.seq++),txt:"« Celui qui pourvoit au dernier moment »",nodes:[d.id,e.id]});
}

/* ---------- démarrage ---------- */
function theme(){
  const noir = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", !!noir);
}
theme();
if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme); }catch(e){} }
load(); render();
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
</script>
