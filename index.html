<style>
/* Direction « Amandier ». Les composants viennent de Framework7 ; ici, la nappe
   de lumière, le verre dépoli qui la floute, la hiérarchie des textes, et le
   rameau.

   La fleur a sa vraie couleur — écorce, feuille, pétale — mais elle reste dans
   le dessin : ce qui se touche est vert sauge, jamais rose.

   Règle de lecture, tenue partout :
   · serif            → ce qui est dit (Sa parole, les actes) et les titres de page
   · sans MAJUSCULES  → les intitulés de section, jamais autre chose
   · sans normal      → ce que l'application dit
   · couleur d'accent → uniquement ce qui se touche                              */

/* La police voyage avec l'app : sans elle, le téléphone retombe sur Georgia
   et toute la typographie change de visage. */
@font-face{font-family:'Lora';font-style:normal;font-weight:400 700;
  font-display:swap;src:url(vendor/lora-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:400 700;
  font-display:swap;src:url(vendor/lora-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,
    U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  --f7-theme-color:#4E6152;
  --f7-theme-color-rgb:78,97,82;
  --f7-theme-color-shade:#3E4E42;
  --f7-theme-color-tint:#5F7563;

  --f7-page-bg-color:#F8F5F2;
  --f7-text-color:#1D1A17;
  --f7-list-strong-bg-color:rgba(255,255,255,.66);
  --f7-block-strong-bg-color:rgba(255,255,255,.66);
  --f7-list-item-border-color:rgba(29,26,23,.11);
  --f7-list-outline-inset-border-color:rgba(29,26,23,.11);
  --f7-list-outline-border-color:rgba(29,26,23,.11);
  --f7-list-item-after-text-color:#736D66;
  --f7-list-item-text-text-color:#736D66;
  --f7-list-item-subtitle-text-color:#736D66;
  --f7-block-title-text-color:#736D66;
  --f7-block-title-font-size:11px;
  --f7-list-link-pressed-bg-color:rgba(78,97,82,.09);
  --f7-input-text-color:#1D1A17;

  --c-dieu:#4E6152;
  --c-famille:#7B6A4C;
  --c-travail:#4D5B6E;
  --c-moi:#6E5560;
  --c-reste:#6B6560;

  --muted:#736D66;
  --voix:#2C332C;
  --filet:rgba(29,26,23,.12);
  --verre:rgba(255,255,255,.66);
  --eclat:rgba(255,255,255,.92);
  --barre:rgba(255,255,255,.72);
  --ombre:0 1px 0 var(--eclat) inset, 0 12px 32px -20px rgba(40,28,20,.6);
  --lueur:rgba(78,97,82,.5);
  --flou:blur(22px) saturate(175%);
  /* la nappe de lumière : rose d'un côté, vert de l'autre, très diffus */
  --nappe:radial-gradient(78% 42% at 96% 0%,#F3E7E3 0%,transparent 62%),
          radial-gradient(78% 40% at 0% 94%,#EAEFE6 0%,transparent 60%);
  /* le rameau */
  --br:#6B5244; --fe:#D9DECF; --pe:#EFD4CE;
}
.dark{
  --f7-theme-color:#9DB7A4;
  --f7-theme-color-rgb:157,183,164;
  --f7-theme-color-shade:#8BA793;
  --f7-theme-color-tint:#B2C7B7;

  --f7-page-bg-color:#13100E;
  --f7-text-color:#EEE9E3;
  --f7-list-strong-bg-color:rgba(255,255,255,.065);
  --f7-block-strong-bg-color:rgba(255,255,255,.065);
  --f7-list-item-border-color:rgba(238,233,227,.11);
  --f7-list-outline-inset-border-color:rgba(238,233,227,.11);
  --f7-list-outline-border-color:rgba(238,233,227,.11);
  --f7-list-item-after-text-color:#99918A;
  --f7-list-item-text-text-color:#99918A;
  --f7-list-item-subtitle-text-color:#99918A;
  --f7-block-title-text-color:#99918A;
  --f7-list-link-pressed-bg-color:rgba(255,255,255,.07);
  --f7-list-group-title-bg-color:transparent;
  --f7-list-group-title-text-color:#99918A;
  --f7-actions-button-border-color:rgba(238,233,227,.11);
  --f7-actions-label-text-color:#99918A;
  --f7-input-text-color:#EEE9E3;
  --f7-bars-text-color:#EEE9E3;

  --c-dieu:#9DB7A4;
  --c-famille:#C6B289;
  --c-travail:#97AAC4;
  --c-moi:#C0A0AE;
  --c-reste:#A9A29B;

  --muted:#99918A;
  --voix:#E3E8DF;
  --filet:rgba(238,233,227,.12);
  --verre:rgba(255,255,255,.065);
  --eclat:rgba(255,255,255,.13);
  --barre:rgba(19,16,14,.62);
  --ombre:0 1px 0 var(--eclat) inset, 0 12px 32px -20px rgba(0,0,0,.9);
  --lueur:rgba(157,183,164,.35);
  --nappe:radial-gradient(78% 42% at 96% 0%,#2A1E1B 0%,transparent 62%),
          radial-gradient(78% 40% at 0% 94%,#161C16 0%,transparent 60%);
  --br:#9A7A66; --fe:#3B4639; --pe:#C9A49C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;position:relative;
  background:var(--f7-page-bg-color);font-family:var(--sans)}
/* la nappe, derrière tout, fixe : c'est elle que le verre floute */
body::before{content:"";position:fixed;inset:0;z-index:0;background:var(--nappe);
  pointer-events:none}
.verre{background:var(--verre);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}

/* ---------- hiérarchie des textes ---------- */
/* Une tranche de temps ne se sépare pas de la suivante comme deux actes se
   séparent l'un de l'autre : c'est elle qui découpe la lecture. */
.block-title.ecart{margin-top:42px}
.block-title{font-family:var(--sans);font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;font-size:11px;color:var(--f7-block-title-text-color);
  margin-top:28px;margin-bottom:9px}
.titre-page{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.006em;
  margin:20px 16px 3px;line-height:1.2;color:var(--f7-text-color)}
.ssTitre{margin:0 16px 4px;font-size:13px;color:var(--muted);line-height:1.5}
.grand{font-family:var(--sans);font-size:21px;font-weight:500;line-height:1.4;
  letter-spacing:-.002em;margin:0;color:var(--f7-text-color);
  border-left:2px solid var(--filet);padding-left:15px}
.grand.voix{color:var(--voix);border-left-color:var(--f7-theme-color)}
.voix{color:var(--voix)}
/* Partout où du texte d'acte s'affiche, ce qui est entre guillemets passe
   en romaine, et lui seul. */
.cite{font-family:var(--serif);font-weight:400;letter-spacing:.006em;color:var(--voix)}
.grand .cite{font-size:1.04em;line-height:1.5}
.meta{font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.015em;
  color:var(--muted);margin:13px 0 0 17px;line-height:1.5}
.amorce{font-family:var(--sans);font-size:14.5px;line-height:1.52;color:var(--muted);margin:0}
/* Le code de récupération : fait pour être recopié à la main, donc grand,
   espacé, et à chasse fixe pour qu'aucun signe n'en imite un autre. */
#haut.libre, .entete{position:relative}
/* Le rouage était accroché à l'en-tête : sur deux onglets l'en-tête est fixe
   et il restait, sur les deux autres elle défile et il partait. Un réglage
   qui n'est pas toujours au même endroit se cherche. Il est donc posé sur
   l'écran, pas sur la page — même coin, les quatre onglets, qu'on ait fait
   défiler ou non. Et comme du texte peut passer dessous, il porte son propre
   disque de verre : sans lui, on lisait une date à travers la roue.
   Mais un cercle cerné d'un filet, c'est un bouton — et un bouton réclame
   l'œil autant que ce qu'on vient lire. Le filet tombe, le verre s'éclaircit
   jusqu'à n'être qu'une respiration, et le trait s'affine. Il reste juste
   assez de matière pour qu'une date ne traverse jamais la roue ; au doigt,
   elle reprend sa pleine voix. Discret ne veut pas dire effacé : il est
   toujours là, au même coin, et on le trouve sans avoir à le chercher.
   Les deux opacités ne sont pas la même parce que les deux fonds ne le sont
   pas : chacune est posée au seuil où le trait garde trois pour un contre
   son fond, ce qu'il faut pour qu'un dessin reste lisible. Un cran plus bas,
   on ne le verrait plus ; un cran plus haut, on ne verrait que lui.
   Sa place suit le rail : quand le compteur tourne, il descend dessous —
   sans quoi il passe derrière, et c'est comme s'il n'existait plus. Mais
   seulement quand il est dans la page : l'en-tête fixe porte un flou, et un
   flou fait de l'élément le repère des positions fixes qu'il contient. La
   roue qui y est logée descend donc déjà avec elle ; lui ajouter la hauteur
   du rail la ferait descendre deux fois. */
#haut.libre .rouage, .entete .rouage{position:fixed;z-index:25;
  right:max(5px,env(safe-area-inset-right,0px));
  top:calc(5px + env(safe-area-inset-top,0px));
  width:40px;min-width:40px;height:40px;min-height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  padding:0;margin:0;border:0;color:var(--muted);opacity:.8;
  background:rgba(255,252,249,.34);
  -webkit-backdrop-filter:blur(13px) saturate(150%);backdrop-filter:blur(13px) saturate(150%);
  transition:opacity .2s ease, transform .2s ease;
  -webkit-appearance:none;-webkit-tap-highlight-color:transparent}
.dark #haut.libre .rouage, .dark .entete .rouage{background:rgba(32,36,31,.36);opacity:.64}
#haut.libre .rouage svg, .entete .rouage svg{width:20px;height:20px;stroke-width:1.4}
#haut.libre .rouage:active, .entete .rouage:active{opacity:1;transform:scale(.92);
  color:var(--f7-theme-color)}
body.avecRail .entete .rouage{top:calc(var(--rail,0px) + 5px)}
.oeilleton{position:relative}
.oeilleton input{padding-right:42px}
.oeil{position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  padding:0;margin:0;border:0;background:none;color:var(--muted);
  -webkit-appearance:none;-webkit-tap-highlight-color:transparent}
.oeil svg{width:20px;height:20px}
.oeil:active{color:var(--f7-theme-color)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;
  line-height:1.9;letter-spacing:.06em;font-weight:600;text-align:center;
  color:var(--f7-text-color);word-break:break-all;-webkit-user-select:all;user-select:all}
.list .item-title{font-family:var(--sans);font-size:16px;font-weight:500;line-height:1.35;
  white-space:normal;color:var(--f7-text-color)}
.list .item-title.serif{font-family:var(--serif);font-weight:400;font-size:16px;
  line-height:1.5;letter-spacing:.006em;color:var(--voix)}
.list .item-subtitle{font-family:var(--sans);font-size:13px;font-weight:400;
  white-space:normal;margin-top:3px;letter-spacing:.005em}
.list .item-text{font-family:var(--sans);font-size:13.5px;line-height:1.45;
  white-space:normal;overflow:visible;-webkit-line-clamp:4;margin-top:4px}
.list .item-after{font-family:var(--sans);font-size:12.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;flex-shrink:0;align-self:flex-start;padding-top:4px}
.list .item-inner{align-items:flex-start}
/* Une ligne d'acte, la même partout : la pastille de l'acteur, deux lignes
   de texte au plus — le reste est sur l'écran de l'acte — puis le pied qui
   dit qui a agi, de quelle manière et quand. Pas de chevron : la ligne
   entière se touche, et le répéter treize fois n'ajoute rien. */
.list .acte .item-inner{display:flex;align-items:flex-start;gap:11px;
  padding-top:15px;padding-bottom:15px;padding-right:15px;min-height:0}
.list .acte .item-inner::before{display:none}
.acte .pt{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px;
  box-sizing:border-box}
.acte .pt.lui{background:var(--f7-theme-color);border:2px solid var(--f7-theme-color)}
.acte .pt.moi{background:transparent;border:2px solid var(--muted)}
.acte .pt.gens{background:var(--muted);border:2px solid var(--muted)}
.acte .corps{flex:1 1 auto;min-width:0;display:block}
.acte .ph{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-family:var(--sans);font-size:15.5px;font-weight:500;
  line-height:1.42;color:var(--f7-text-color)}
.acte .ph .cite{font-size:16px;line-height:1.5}
.acte .pied{display:block;font-family:var(--sans);font-size:12px;line-height:1.45;
  color:var(--muted);margin-top:6px}
.acte .coche{flex:0 0 auto;margin-top:3px}
.lien .item-title{color:var(--f7-theme-color);font-weight:600}
.coche{color:var(--f7-theme-color);font-weight:700}
.vide{margin:0;padding:13px 16px;color:var(--muted);font-size:14.5px;font-style:italic}
.rien{color:var(--muted);font-style:italic;font-weight:400}

/* Un chemin : un filet vertical, et des pastilles qui disent qui a parlé.
   Aucun trait n'est tracé entre les actes — les convergences se lisent
   dans le « après : … », pas dans un dessin (14.5-bis.b). */
.fil{position:relative;margin:14px 16px 4px;padding-left:25px}
.fil::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;
  width:1px;background:var(--filet)}
.pas{display:block;position:relative;padding:13px 0;color:inherit;text-decoration:none}
.pas::before{content:"";position:absolute;left:-25px;top:17px;width:11px;height:11px;
  border-radius:50%;box-sizing:border-box;background:var(--f7-page-bg-color)}
.pas.dieu::before{background:var(--f7-theme-color);border:2px solid var(--f7-theme-color)}
.pas.moi::before{border:2px solid var(--muted)}
.pas.gens::before{background:var(--muted);border:2px solid var(--muted)}
.pas .dit{display:block;font-family:var(--sans);font-size:16px;font-weight:500;
  line-height:1.4;color:var(--f7-text-color)}
.pas .dit .cite{font-size:17px;line-height:1.5}
.pas .sous{display:block;font-family:var(--sans);font-size:12.5px;font-weight:500;
  letter-spacing:.015em;color:var(--muted);margin-top:5px}
/* La phrase est la voix, la description est le commentaire : deux fontes,
   pour qu'on ne les confonde pas d'un coup d'œil (13.q). */
.dicte.petit{font-family:var(--sans);font-size:15.5px;line-height:1.55;letter-spacing:0}
/* Ce qu'on joint se montre entier ou se dit absent — jamais une case grise
   qu'on prendrait pour une panne (13.bo). Une photo garde ses proportions :
   recadrer sans le dire, c'est modifier un souvenir. */
.meds{display:flex;flex-direction:column;gap:11px;
  margin:0 var(--f7-list-inset-side-margin,16px) 2px}
.med{position:relative;margin:0;border-radius:16px;overflow:hidden;
  border:1px solid var(--filet);background:var(--f7-list-bg-color,var(--verre))}
.med .medZone{display:block;min-height:46px}
.med img,.med video{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#000}
.med audio{display:block;width:100%;padding:9px 10px;box-sizing:border-box}
.medAbs{margin:0;padding:13px 15px;font-family:var(--sans);font-size:13.5px;line-height:1.45;color:var(--muted)}
.medSup{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--filet);
  background:var(--verre);backdrop-filter:var(--flou);color:var(--f7-text-color)}
.medNote{display:block;margin-top:3px;font-style:italic;white-space:pre-wrap}
/* Un creux n'est pas un bloc : il n'a pas de nom, il a une absence de nom.
   Il se lit donc en gris et en italique — présent dans la liste, jamais
   confondu avec ce qu'on a vraiment compté. */
.item-title .creux{color:var(--muted);font-style:italic;font-weight:500}
/* Quand on a désigné soi-même le porteur, le bloc le dit : sans cela, on
   relit « La part de chacun » sans comprendre pourquoi l'heure est allée
   là plutôt qu'ailleurs. */
.item-title .pte{display:inline-block;margin-left:7px;font-family:var(--sans);
  font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--filet);border-radius:999px;padding:1px 6px;
  vertical-align:1px}
/* Enregistrer demande de savoir que ça tourne : le point bat, et les
   secondes défilent. Sans compteur, on parle en se demandant si on parle. */
.enr{position:fixed;z-index:13500;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(340px,calc(100% - 32px));
  box-sizing:border-box;padding:20px 20px 16px;border-radius:24px;text-align:center;
  background:var(--barre);backdrop-filter:var(--flou);border:1px solid var(--filet);
  box-shadow:0 18px 48px -18px rgba(26,42,32,.6);font-family:var(--sans)}
.dark .enr{box-shadow:0 1px 0 var(--eclat) inset,0 18px 48px -18px #000}
.enrQuoi{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.enrQuoi i{width:9px;height:9px;border-radius:50%;background:#C0564B;animation:bat 1.1s infinite}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.25}}
.enrDur{margin:8px 0 0;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.enrDit{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.enrBtns{display:flex;gap:10px;margin-top:16px}
.enrBtns button{flex:1;min-height:44px;border-radius:22px;font-family:var(--sans);font-size:15px;
  border:1px solid var(--filet);background:transparent;color:inherit}
.enrBtns .primaire{border-color:transparent;background:var(--f7-theme-color,#4E6152);color:#fff}
.desc{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--muted);
  margin:14px 0 0 17px;white-space:pre-wrap}
.pas .apres{display:block;font-family:var(--sans);font-size:12.5px;line-height:1.45;
  color:var(--muted);margin-top:4px;font-style:italic}
/* Ce qui est prévu n'a pas encore eu lieu : le point reste creux et pointillé,
   le texte se retire d'un cran, et une étiquette le dit en toutes lettres. */
.pas.prevu::before{background:transparent;border:2px dashed var(--muted)}
.pas.prevu .dit{color:var(--muted)}
.etiq{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--filet);border-radius:9px;padding:1px 7px;margin-right:7px;
  vertical-align:1px}
.fil .coupure{position:relative;margin:18px 0 2px;font-family:var(--sans);font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--muted)}
.fil .coupure::before{content:"";position:absolute;left:-25px;top:-9px;width:11px;height:1px;
  background:var(--filet)}

/* les groupes sont en verre, posés sur la nappe */
.list.inset>ul{-webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  box-shadow:var(--ombre)}

/* ---------- le rameau d'amandier ---------- */
/* Deux emplacements seulement : le filigrane d'un écran, la marque de l'accueil. */
.rameau{display:block;pointer-events:none}
.filigrane{position:absolute;top:-10px;right:-22px;width:118px;opacity:.3;z-index:0}
.marque{width:60px;margin:6px 0 2px 13px;opacity:1}

/* ---------- charpente : les barres passent par-dessus le contenu ---------- */
#main{position:absolute;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Le compteur ne flotte plus au-dessus de la lecture : il tient un rail, en
   haut, sous la barre d'état. C'est là que l'œil arrive, c'est l'endroit que
   tout le monde connaît pour « quelque chose tourne en ce moment » — la
   barre d'appel, la barre d'enregistrement — et le bas reste au pouce.
   Surtout : c'est du mobilier, donc mesuré, donc il ne couvre jamais rien.
   Et il n'existe que pendant qu'on compte : une bande permanente qui
   répéterait « rien n'est compté » prendrait de la place pour ne rien dire. */
#rail{position:absolute;top:0;left:0;right:0;z-index:22;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--barre);border-bottom:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#rail[hidden]{display:none}
/* Replié, le rail ne disparaît pas : il se réduit à un trait. Le disciple a
   le droit de dégager le haut de son écran, il n'a pas le droit d'oublier
   qu'un compteur tourne — et c'est pour qu'on n'oublie pas que le rail
   existe (13.bt). Le point qui battait s'étire donc en une barre de trois
   pixels, qui respire au même rythme : moins de place, même phrase. */
#rail.plie{border-bottom:0}
#rail.plie .tic{min-height:0;height:7px;padding:0;gap:0;overflow:hidden}
#rail.plie .tic .quoi,#rail.plie .tic .dur{display:none}
#rail.plie .tic .pt{width:54px;height:3px;border-radius:2px;
  margin:2px 0 2px max(16px,env(safe-area-inset-left,0px));
  border:0;box-shadow:none;animation:respire 2.8s ease-in-out infinite}
#rail.plie .tic.vieux .pt,#rail.plie .tic.rien .pt{background:var(--muted);animation:none}
@keyframes respire{0%,100%{opacity:1}50%{opacity:.38}}
/* Sept pixels, c'est beau à voir et impossible à viser. La zone sensible
   déborde donc sous le trait — mais s'arrête avant le coin droit, où le
   rouage attend son propre doigt. */
#rail.plie::after{content:"";position:absolute;top:100%;height:16px;
  left:0;right:56px}
/* Quand le rail est là, c'est lui qui porte l'encoche : la barre en dessous
   ne doit pas la payer une seconde fois. */
#haut.sousRail{padding-top:6px}
#haut.libre.sousRail{padding-top:12px}
#haut{position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:4px;min-height:52px;
  padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;
  background:var(--barre);border-bottom:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#haut[hidden]{display:none}
/* Sur un écran de liste, ce n'est pas une barre : c'est l'en-tête de la page,
   qui porte son nom et ses commandes et ne bouge pas pendant qu'on parcourt.
   La liste glisse dessous, derrière le verre dépoli. */
#haut.libre{display:block;min-height:0;
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
/* Une en-tête ne se fige que si elle commande la liste : des filtres, des
   onglets, un compte qui suit le filtre. Celle d'Aujourd'hui ne commande rien
   — elle ne faisait que retenir un quart de l'écran pendant qu'on fait
   défiler. Elle défile donc avec le reste, et l'écran revient au contenu. */
.entete{display:block;padding:0 0 10px}
#haut.libre .titre-page, .entete .titre-page{margin:0 16px 2px}
#haut.libre .marque, .entete .marque{margin:0 0 4px 13px}
#haut.libre .ssTitre, .entete .ssTitre{margin:0 16px 0}
#haut.libre .ptitre{margin:12px 16px -2px}
#haut.libre .puces{padding:10px 16px 0}
#haut.libre .puces.suite{padding-top:0}
#haut.libre .plier{margin:11px 16px 0;background:none;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--filet)}
#haut .t{flex:1 1 auto;min-width:0;text-align:center;font-size:16px;font-weight:600;
  letter-spacing:-.01em;color:var(--f7-text-color);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#haut button{flex:0 0 auto;width:auto;min-width:46px;min-height:44px;border:0;background:none;
  color:var(--f7-theme-color);display:flex;align-items:center;justify-content:center;gap:2px;
  font-size:16px;padding:0 6px;cursor:pointer}
#haut button[disabled]{opacity:0;pointer-events:none}

#avance{position:absolute;left:0;right:0;z-index:21;height:2px;background:var(--filet)}
#avance[hidden]{display:none}
#avance i{display:block;height:100%;background:var(--f7-theme-color);transition:width .25s ease}

#bas{position:absolute;left:0;right:0;bottom:0;z-index:20}
#acte{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--barre);border-top:1px solid var(--filet);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#acte[hidden]{display:none}
#acte.surNav{padding-bottom:10px}
#acte .button{width:100%;font-weight:600;letter-spacing:.005em;box-shadow:var(--ombre)}
/* La pastille flottante a vécu ici : un rond posé au pouce droit, par-dessus
   la liste. Elle visait mal — on tape au bord d'un écran sans bien le voir —
   et elle couvrait ce qu'on lisait. Le geste est descendu dans la barre, au
   milieu (voir #nav .noter). Il ne reste ici que les boutons d'action des
   écrans, qui eux tiennent toute la largeur. */
.dark #acte .button-fill{background:rgba(157,183,164,.17);color:#C4DCCA;
  border:1px solid rgba(157,183,164,.42);box-shadow:0 1px 0 var(--eclat) inset,
  0 10px 26px -14px var(--lueur)}

#nav{display:flex;
  background:var(--barre);border-top:1px solid var(--filet);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou)}
#nav[hidden]{display:none}
#nav button{flex:1 1 0;min-height:52px;border:0;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.004em;
  color:var(--muted);padding:7px 2px 6px;cursor:pointer}
#nav button svg{display:block;width:23px;height:23px;flex:0 0 auto}
#nav button span{display:block;white-space:nowrap}
#nav button[aria-current="page"]{color:var(--f7-theme-color);font-weight:700}
/* L'onglet où l'on est a le trait un peu plus appuyé : la couleur seule ne
   suffit pas à tous les yeux. */
#nav button[aria-current="page"] svg{stroke-width:1.8}
/* Le geste central. Il était posé au-dessus du contenu, au pouce droit : on
   le visait mal, et il couvrait ce qu'on lisait. Il prend donc sa place dans
   la barre, au milieu, deux onglets de chaque côté — et il déborde par le
   haut pour dire qu'il n'est pas un onglet parmi quatre, mais le geste
   d'où tout part. Le mot reste sous le rond, à la hauteur des autres
   étiquettes : la barre garde son rythme. */
#nav .noter{flex:0 0 auto;width:76px;gap:4px}
#nav .noter i{display:flex;align-items:center;justify-content:center;
  width:54px;height:54px;border-radius:50%;margin-top:-26px;
  background:var(--f7-theme-color);color:#fff;
  box-shadow:0 10px 26px -8px rgba(26,42,32,.55)}
#nav .noter i svg{width:25px;height:25px;stroke-width:2.2}
#nav .noter span{color:var(--f7-theme-color);font-weight:700}
#nav .noter:active i{transform:scale(.94)}
.dark #nav .noter i{background:#2B3129;color:#C8DFCE;
  border:1px solid rgba(157,183,164,.46);
  box-shadow:0 1px 0 var(--eclat) inset, 0 14px 30px -12px #000}

/* ---------- la tablette : une colonne, pas une nappe ---------- */
/* Déverrouiller le paysage ne suffit pas. Une phrase qui court sur mille
   pixels cesse d'être lisible : au retour à la ligne, l'œil ne retrouve plus
   celle qu'il quitte. Le texte garde donc la colonne du téléphone, posée au
   milieu de l'écran.
   Mais les barres, elles, vont d'un bord à l'autre. Resserrées comme le
   texte, elles flottaient au milieu de l'écran sans rien toucher, et ça ne
   se lit pas comme une intention : ça se lit comme un écran mal réglé. Une
   barre tient le bord ; seul ce qu'elle porte se range sur la colonne.
   Et le seuil est haut : une tablette tenue debout fait huit cents points de
   large, c'est-à-dire un grand téléphone, et on ne lui prend pas sa largeur
   pour rien. La colonne n'apparaît qu'au vrai paysage. */
@media (min-width:900px){
  :root{--colonne:700px}
  #main>*{max-width:var(--colonne);margin-left:auto;margin-right:auto}
  #haut{padding-left:max(8px,calc((100% - var(--colonne))/2));
        padding-right:max(8px,calc((100% - var(--colonne))/2))}
  #haut.libre{padding-left:max(0px,calc((100% - var(--colonne))/2));
              padding-right:max(0px,calc((100% - var(--colonne))/2))}
  #acte{padding-left:max(16px,calc((100% - var(--colonne))/2));
                     padding-right:max(16px,calc((100% - var(--colonne))/2))}
  #nav{padding-left:max(0px,calc((100% - var(--colonne))/2));
       padding-right:max(0px,calc((100% - var(--colonne))/2))}
  #haut.libre .rouage, .entete .rouage{right:max(5px,calc((100% - var(--colonne))/2 + 5px))}
}
/* Un téléphone couché a de la largeur mais presque pas de hauteur : trois
   étages de mobilier y mangeraient tout. On resserre les barres plutôt que
   de refuser la rotation. */
@media (max-height:460px) and (orientation:landscape){
  #haut{min-height:44px;padding-top:calc(3px + env(safe-area-inset-top,0px));padding-bottom:3px}
  #haut.libre{padding-top:calc(7px + env(safe-area-inset-top,0px));padding-bottom:7px}
  #nav button{min-height:44px;padding:4px 2px 3px}
  #nav button svg{width:20px;height:20px}
  #nav .noter i{width:44px;height:44px;margin-top:-20px}
  #nav .noter i svg{width:21px;height:21px}
  .tic{min-height:34px;padding:2px 16px 3px}
  .entete{padding-bottom:2px}
  #haut.libre .marque, .entete .marque{width:40px;margin-top:0;margin-bottom:0}
  #haut.libre .titre-page, .entete .titre-page{font-size:23px;margin-top:8px}
  .carr{padding-top:9px;padding-bottom:6px}
}

/* ---------- ce qui revient : des cartes qui défilent ---------- */
.carr{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carr::-webkit-scrollbar{display:none}
/* Une carte prenait 87 % de la largeur : juste sur un téléphone, absurde sur
   une tablette, où trois mots flottaient au milieu de six cents points de
   vide pendant que la suivante n'était qu'une tranche de syllabes coupées.
   On borne : au-delà, les cartes se tiennent côte à côte au lieu de
   s'étirer. */
.carte{scroll-snap-align:center;flex:0 0 87%;display:flex;flex-direction:column;
  background:var(--verre);border:1px solid var(--filet);border-radius:18px;
  padding:19px 19px 17px;box-shadow:var(--ombre);text-decoration:none;color:inherit;
  -webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  -webkit-tap-highlight-color:transparent}
.carte:active{transform:scale(.985)}
.carte .quand{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--f7-theme-color)}
/* Les cartes se tiennent côte à côte : la plus longue impose sa hauteur à
   toutes. Une phrase de douze lignes laissait donc sept cartes aux trois
   quarts vides, et une seule chose visible à l'écran au lieu de trois. On
   borne ce qui se lit d'un coup d'œil ; la phrase entière est dans l'acte,
   à un doigt. */
.carte .grand{font-size:20px;line-height:1.44;padding-left:13px;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.carte .meta{margin:12px 0 0 15px}
.points{display:flex;justify-content:center;gap:6px;padding:2px 0 4px}
.points i{width:6px;height:6px;border-radius:50%;background:var(--filet);transition:background .2s}
.points i.on{background:var(--f7-theme-color)}
/* Sur un téléphone, la carte suivante dépasse d'un doigt : c'est ce qui dit
   qu'il y en a d'autres, et on la lit comme une invitation à glisser.
   Dès qu'il y a de la place, la même coupure ne s'excuse plus — on voit une
   phrase tranchée au milieu d'un mot et on croit à un défaut. Alors deux
   cartes entières, et ce sont les points qui disent la suite. Seule, une
   carte prend toute la largeur : une demi-carte suivie de vide serait une
   maladresse de plus. */
@media (min-width:720px){
  .carte{flex-basis:calc((100% - 13px)/2)}
  .carte:only-child{flex-basis:100%}
}

/* ---------- le compteur : toujours là, toujours vrai ---------- */
/* Il ne dit qu'une chose — à quoi va le temps en ce moment — et il la dit
   sans qu'on ait rien à ouvrir. Le point bat tant que le compte est vivant ;
   il se creuse quand le bloc dure depuis trop longtemps pour être honnête,
   et le chiffre pâlit avec lui. Aucun mot de reproche : un signe suffit. */
#chrono{flex:1 1 auto;min-width:0;display:block}
/* Le compteur a d'abord flotté au-dessus de la liste. Opaque, il ne la
   laissait plus traverser — mais il la couvrait encore, et on ne pouvait pas
   lire dessous. Un objet qui dit une chose vraie en permanence n'a rien à
   faire par-dessus la lecture : il lui faut une place à lui. C'est le rail.
   Plus de pastille, donc : une ligne, pleine largeur, dans le verre du rail. */
.tic{display:flex;align-items:center;gap:10px;min-height:40px;padding:3px 16px 4px;
  color:inherit;text-decoration:none}
.tic:active{opacity:.6}
.tic .pt{flex:0 0 auto;width:9px;height:9px;border-radius:50%;
  background:var(--f7-theme-color);animation:pouls 2.8s ease-in-out infinite}
.tic .pt.creux,.tic.vieux .pt{background:transparent;border:1.5px solid var(--muted);
  animation:none;box-shadow:none}
.tic .quoi{flex:1 1 auto;min-width:0;font-family:var(--sans);font-size:14.5px;font-weight:600;
  letter-spacing:.004em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tic .dur{flex:0 0 auto;font-family:var(--sans);font-size:13.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--f7-theme-color)}
/* Combien d'autres tournent en même temps. Replié, le chiffre disparaît
   avec le reste : il ne reste que le trait. */
.tic .pl{flex:0 0 auto;font-family:var(--sans);font-size:11px;font-weight:700;
  color:var(--muted);border:1px solid var(--filet);border-radius:999px;
  padding:1px 6px;letter-spacing:.01em}
#rail.plie .tic .pl{display:none}
.tic.vieux .dur,.tic.rien .dur{color:var(--muted)}
.tic.rien .quoi{font-weight:500;font-style:italic;color:var(--muted)}
.tic .dur i{font-style:normal;font-size:.76em;font-weight:600;opacity:.5;
  margin-left:3px;vertical-align:.42em;line-height:1;font-variant-numeric:tabular-nums}
@keyframes pouls{0%,100%{box-shadow:0 0 0 0 var(--lueur)}50%{box-shadow:0 0 0 6px transparent}}


/* ---------- la part de chacun ---------- */
/* Des heures d'abord, la part ensuite, et une barre pour que l'œil saisisse
   d'un coup ce que le chiffre met une seconde à dire. */
.tps{margin:2px 16px 0}
.tl{padding:12px 0 13px;border-bottom:1px solid var(--filet)}
.tl:last-child{border-bottom:0}
.tn{display:block;font-family:var(--sans);font-size:15.5px;font-weight:600;letter-spacing:.004em}
.tv{display:flex;align-items:baseline;gap:9px;margin-top:3px;
  font-family:var(--sans);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tv b{font-size:14px;font-weight:700;color:var(--f7-theme-color);letter-spacing:.01em}
.tj{display:block;height:5px;margin-top:8px;border-radius:3px;background:var(--filet);overflow:hidden}
.tj i{display:block;height:100%;min-width:3px;border-radius:3px;background:var(--f7-theme-color)}
/* La part du temps non compté se lit comme les autres, mais elle n'est pas
   une part comme les autres : personne ne l'a réclamée. Grise, donc, et sa
   jauge aussi — on la voit sans qu'elle se vante. */
.tl.creuse .tn,.tl.creuse .tv b{color:var(--muted)}
.tl.creuse .tj i{background:var(--muted);opacity:.5}

.frisew{padding:6px 16px 14px 46px}
.frise{position:relative}
.fh{position:absolute;left:-46px;right:0;border-top:1px solid var(--filet);z-index:0}
.fh span{position:absolute;left:0;top:-8px;font-family:var(--sans);font-size:10px;
  color:var(--muted);letter-spacing:.02em}
.ftrou{position:absolute;left:0;right:0;z-index:1;border-radius:5px;
  background:repeating-linear-gradient(135deg,var(--filet) 0 3px,transparent 3px 11px)}
.ftrou::after{content:"";position:absolute;left:0;right:0;top:-7px;bottom:-7px}
.ftrou span{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font-family:var(--sans);font-size:10.5px;color:var(--muted);white-space:nowrap}
.fb{position:absolute;z-index:2;box-sizing:border-box;border-radius:7px;
  padding:3px 7px 3px 12px;overflow:hidden;border:1px solid;
  background:var(--f7-list-strong-bg-color);
  font-family:var(--sans);font-size:11px;line-height:1.3;
  transition:transform .12s ease}
.fb b,.fb i{position:relative;z-index:1;display:block}
.fb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb i{font-style:normal;font-size:10px;opacity:.75}
.fb .fp{position:absolute;left:0;width:4px;border-radius:0 3px 3px 0;z-index:0}
.fb.court{padding:1px 6px 1px 11px;display:flex;align-items:center}
.fb.court b{font-size:10.5px;width:100%}
.fb.court b em{font-style:normal;font-weight:400;opacity:.7;margin-left:7px}
.fb.mini{padding:0;border-radius:5px}
.fb:active{transform:scale(.985)}

/* ---------- puces de filtre ---------- */
.puces{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.puces.suite{padding-top:0}
/* Trois rangs de pastilles mangeaient l'écran avant la première œuvre.
   Repliés, ils tiennent sur une ligne qui dit ce qui est filtré. */
.plier{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);
  margin:14px 16px 0;padding:10px 14px;border:0;border-radius:15px;
  background:var(--barre);-webkit-backdrop-filter:var(--flou);backdrop-filter:var(--flou);
  box-shadow:var(--ombre);font-family:var(--sans);font-size:13px;line-height:1.35;
  color:var(--muted);text-align:left;cursor:pointer}

.plier b{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;
  color:var(--f7-theme-color);flex:0 0 auto}
.plier .q{flex:1 1 auto;min-width:0}
.plier .ch{flex:0 0 auto;transition:transform .2s;color:var(--muted)}
.plier[aria-expanded="true"] .ch{transform:rotate(180deg)}
.ptitre{font-family:var(--sans);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-size:10.5px;color:var(--muted);margin:14px 16px -2px}
.puces::-webkit-scrollbar{display:none}
.puce{flex:0 0 auto;width:auto;min-height:33px;padding:0 14px;border-radius:17px;
  font-family:var(--sans);font-size:13px;font-weight:500;border:1px solid var(--filet);
  background:var(--verre);color:var(--muted);cursor:pointer}
.puce[aria-pressed="true"]{background:var(--f7-theme-color);color:#FBFAF8;
  border-color:var(--f7-theme-color)}
.dark .puce[aria-pressed="true"]{color:#13100E}

/* ---------- onglets de vue, et la ligne de fenêtre ----------
   Les trois vues et le grain avaient la même forme : trois rangs de
   pastilles identiques, où rien ne disait lequel changeait quoi. Or ce ne
   sont pas deux réglages du même ordre. Les vues sont trois lectures du
   temps : on en habite une. Le grain et la position sont un filtre : ils
   disent seulement la portion regardée, et valent pour les trois.
   Les vues prennent donc la forme d'onglets — un soulignement, pas une
   pastille - et le filtre se replie sur une seule ligne. */
.ongt{display:flex;align-items:stretch;margin:15px 16px 0;border-bottom:1px solid var(--filet)}
.ongt button{flex:1 1 0;min-width:0;min-height:42px;padding:0 2px;position:relative;
  border:0;background:transparent;cursor:pointer;font-family:var(--sans);
  font-size:13.5px;font-weight:600;letter-spacing:.005em;color:var(--muted)}
.ongt button[aria-selected="true"]{color:var(--f7-text-color)}
.ongt button[aria-selected="true"]::after{content:"";position:absolute;
  left:7px;right:7px;bottom:-1px;height:2px;border-radius:2px;
  background:var(--f7-theme-color)}
.ongt button:active{opacity:.6}

/* La ligne de fenêtre : deux chevrons pour avancer d'un cran, et au milieu
   le nom de ce qu'on regarde, qui s'ouvre sur le choix du grain — et sur le
   retour au présent quand on s'en est éloigné. Le grain n'occupe donc plus
   un rang de pastilles à lui seul : il vit dans la ligne qu'il qualifie. */
.fnav{display:flex;align-items:center;gap:2px;padding:1px 10px 0}
.fnav .fnp{flex:0 0 auto;width:40px;min-height:40px;border:0;border-radius:20px;
  background:transparent;color:var(--muted);font-size:21px;line-height:1;cursor:pointer}
.fnav .fnp:disabled{opacity:.22;cursor:default}
.fnav .fnt{flex:1;min-height:40px;display:inline-flex;align-items:center;
  justify-content:center;gap:5px;border:0;background:transparent;cursor:pointer;

  color:var(--f7-text-color)}
.fnav .fnt .ch{color:var(--muted);flex:0 0 auto}
/* Quand on s'est éloigné du present, le nom le dit déjà ; la couleur le
   confirme, pour qu'on ne lise pas un total d'octobre comme celui du jour. */
.fnav .fnt.loin{color:var(--f7-theme-color)}
.fnav .fnt.loin .ch{color:var(--f7-theme-color);opacity:.7}

/* ---------- saisie ---------- */
textarea.dicte{width:100%;min-height:120px;border:0;background:transparent;resize:none;
  font-family:var(--serif);font-size:21px;line-height:1.5;letter-spacing:.004em;
  color:var(--f7-text-color);padding:0}
textarea.dicte::placeholder{color:var(--muted);opacity:.6}
textarea.dicte:focus{outline:0}
.micro{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 15px;
  border-radius:19px;font-family:var(--sans);font-size:13.5px;font-weight:600;
  border:1px solid var(--f7-theme-color);background:var(--verre);
  color:var(--f7-theme-color);cursor:pointer}
.micro.on{background:var(--f7-theme-color);color:#FBFAF8}
.dark .micro.on{color:#13100E}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.4}}
.micro.on svg{animation:bat 1.1s ease-in-out infinite}

/* ---------- choisir dans une liste ---------- */
/* Un chapitre se choisit, il ne s'écrit pas : « Genèse 51 » n'existe pas, et
   une liste déroulante le sait. Notre bundle Framework7 est taillé et ne
   connaît pas les select ; on les habille donc ici, au registre des champs,
   avec le chevron qu'un doigt attend. */
.sel{position:relative;display:block}
.sel::after{content:"";position:absolute;right:3px;top:50%;width:7px;height:7px;
  margin-top:-6px;border-right:1.7px solid var(--muted);border-bottom:1.7px solid var(--muted);
  transform:rotate(45deg);pointer-events:none}
.sel select{width:100%;min-height:38px;border:0;background:transparent;border-radius:0;
  font-family:var(--sans);font-size:17px;line-height:1.3;color:var(--f7-text-color);
  appearance:none;-webkit-appearance:none;padding:0 22px 0 0}
.sel select:focus{outline:0}
.item-title.item-label{font-family:var(--sans);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0}
/* Les chapitres traversés ne sont pas une note : ils se lisent d'un coup
   d'oeil, en clair, sous le bloc qui les a reçus. */
.item-subtitle .lus{display:block;margin-top:3px;font-weight:600;color:var(--f7-theme-color)}

/* ---------- feuilles d'action (Framework7 les cache, son JS les montre ; on fait sans) ---------- */
.actions-backdrop{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(14,10,8,.45);
  z-index:13000;opacity:0;visibility:hidden;transition:opacity .3s}
.actions-backdrop.backdrop-in{opacity:1;visibility:visible}
/* Framework7 recentre sa feuille au-delà de 496 points — mais il le fait
   avec « left:50% » et une marge négative de la moitié de sa largeur. Nous
   posons left:0 et right:0 pour tenir les deux bords du téléphone ; la marge
   négative, elle, survivait, et la feuille partait à moins deux cent quarante
   points du bord gauche. Sur tablette, les choix étaient coupés : « une
   photo », « mer », « er un son ». On ne défait pas la moitié d'une règle
   étrangère : on la défait en entier, et on recentre à notre façon — bornée
   comme la colonne de lecture, jamais plus large (13.bn). */
.actions-modal{display:none;position:fixed;left:0;right:0;bottom:0;z-index:13500;
  width:auto;max-width:480px;margin-left:auto;margin-right:auto}
.actions-modal.modal-in{display:block;animation:monte .28s cubic-bezier(.2,.8,.3,1)}
@keyframes monte{from{transform:translate3d(0,100%,0)}to{transform:none}}
.actions-button{font-family:var(--sans)}
.actions-button.rouge{color:#A8453B}
.dark .actions-button.rouge{color:#E78C82}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:#1D1A17;color:#F8F5F2;padding:11px 18px;border-radius:22px;
  font-family:var(--sans);font-size:14px;z-index:14000;max-width:80%;text-align:center;
  box-shadow:0 12px 34px -16px rgba(0,0,0,.7)}
.dark .toast{background:#EEE9E3;color:#13100E}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script>
"use strict";
/* Écrite à l'écran, dans Mes données. Sans elle, « je ne vois pas la
   nouvelle version » est une phrase que ni lui ni moi ne pouvons vérifier :
   on en est réduit à deviner. Elle monte avec le cache du service worker. */
const VERSION = "v67";
const KEY = "ebenezer.v1";
/* Cinq manières au départ — mais Il n'en a pas cinq. Le disciple en ajoute
   à la volée, et les siennes se rangent après celles-ci. */
const MAN_SOCLE = {parle:"Il a parlé", pourvu:"Il a pourvu", ouvert:"Il a ouvert", delivre:"Il a délivré", repris:"Il a repris"};
function MANS(){
  const m=Object.assign({}, MAN_SOCLE);
  (db.mans||[]).forEach(x=>{ if(x && x.id) m[x.id]=x.txt; });
  return m;
}
function manTxt(k){ return MANS()[k]||""; }
/* « Il a… » est sous-entendu dans la question : on l'écrit si le disciple
   ne l'a pas écrit, pour que la liste se lise d'une seule voix. */
function manId(txt){
  let v=String(txt||"").trim(); if(!v) return null;
  if(!/^il[\s']/i.test(v)) v = "Il a "+v.charAt(0).toLowerCase()+v.slice(1);
  const m=MANS(), k=Object.keys(m).find(x=>m[x].toLowerCase()===v.toLowerCase());
  if(k) return k;
  db.mans=db.mans||[];
  const id=uid("man"); db.mans.push({id:id, txt:v, maj:Date.now()}); return id;
}
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const ETAT = {fait:"fait", encours:"en cours", prevu:"prévu", abandon:"abandonné"};
const ETATS = [["fait","C'est fait"],["encours","Ça dure encore"],["prevu","C'est prévu"]];

/* Les quatre destinataires d'une journée, et ce qui n'en est aucun. « Le
   reste » n'est pas un reproche : c'est l'attente, le trajet, le flottement.
   Il doit porter un nom, sinon la journée mentirait de ce qu'elle ne compte
   pas, et les parts seraient fausses. */
const CAT_SOCLE = [["dieu","Pour Dieu"],["famille","Ma famille"],["travail","Mon travail"],["moi","Moi"],["reste","Le reste"]];
/* Une liste vide au premier geste, c'est un écran qui demande du travail
   avant de rendre service. On propose ; rien n'entre en mémoire avant d'être
   touché. */
const TACHES_SOCLE = [
  ["Prière","dieu"],["Lecture de la Parole","dieu"],["Culte","dieu"],["Service dans l'assemblée","dieu"],
  ["Temps en famille","famille"],["Repas en famille","famille"],["Prière en famille","famille"],
  ["Travail","travail"],["Réunion","travail"],["Trajet","travail"],
  ["Sommeil","moi"],["Repas","moi"],["Sport","moi"],["Lecture","moi"],
  ["Attente","reste"],["Écrans","reste"]
];

let db = {nodes:[], gens:[], noms:[], mans:[], cats:[], taches:[], temps:[], livres:[], auteurs:[], exp:0, seq:1};
let S = {view:"today", step:0, draft:null, filtre:"tout", ret:"tout", grain:"an", rev:"noms", pile:[], nodeId:null,
         cheminId:null, faits:-1, eMan:"", eEtat:"fait", ePrec:"j",
         descOuvert:false, plie:true, cNeuf:false, cTxt:"", cType:"", cQ:"",
         per:"jour", anc:null, vue:"parts", tQ:"", tCat:"", blocId:null, medId:null, trou:null, quand:null,
         noteFocus:false, frisZ:null, enPlus:false, tchId:null,
         lu:null, luA:null, luZ:null, luPlein:false,
         pgL:null, pgA:null, pgZ:null, lvId:null, auId:null};

/* Un seul « écran précédent » ne suffisait pas : en ouvrant un retour depuis
   un acte, il finissait par désigner l'acte lui-même, et le bouton Retour ne
   faisait plus rien. On empile donc les écrans traversés, et on dépile en
   sautant ce qui n'existe plus. Un bouton qui ne ramène nulle part est pire
   que pas de bouton. */
function empile(){
  S.pile.push({view:S.view, nodeId:S.nodeId, cheminId:S.cheminId});
  if(S.pile.length>12) S.pile.shift();
}
function depile(repli){
  while(S.pile.length){
    const p=S.pile.pop();
    if(p.view==="node" && !node(p.nodeId)) continue;
    if(p.view==="chemin" && !cheminDe(p.cheminId)) continue;
    if(p.view===S.view && p.nodeId===S.nodeId && p.cheminId===S.cheminId) continue;
    S.view=p.view; S.nodeId=p.nodeId; S.cheminId=p.cheminId; return;
  }
  S.view=repli||"today";
}

/* ---------- stockage ---------- */
function sane(v){
  const o = (v && typeof v==="object") ? v : {};
  const d = {nodes:Array.isArray(o.nodes)?o.nodes:[], gens:Array.isArray(o.gens)?o.gens:[],
          noms:Array.isArray(o.noms)?o.noms:[], mans:Array.isArray(o.mans)?o.mans:[],
          cats:Array.isArray(o.cats)?o.cats:[], taches:Array.isArray(o.taches)?o.taches:[],
          livres:Array.isArray(o.livres)?o.livres:[],
          auteurs:Array.isArray(o.auteurs)?o.auteurs:[],
          temps:Array.isArray(o.temps)?o.temps:[], exp:(typeof o.exp==="number")?o.exp:0,
          morts:(o.morts && typeof o.morts==="object")?o.morts:{},
          maj:(typeof o.maj==="number")?o.maj:0,
          seq:(typeof o.seq==="number"&&o.seq>0)?o.seq:1};
  /* Les fiches d'avant la synchronisation n'ont pas d'heure. On leur en donne
     la plus ancienne possible : la moindre écriture réelle les dépassera. */
  [d.nodes,d.gens,d.noms,d.mans,d.cats,d.taches,d.temps,d.livres,d.auteurs].forEach(function(a){
    a.forEach(function(x){ if(x && typeof x.maj!=="number") x.maj=1; });
  });
  /* Le type de champs était un réglage à part ; il devient une conséquence de
     la routine (13.cn). On reprend l'ancien à la lettre, le choix explicite
     de « rien de plus » compris, et chaque appareil fait la même traduction
     de son côté — rien à propager. */
  d.taches.forEach(function(t){
    if(t && t.d===undefined && t.sp!==undefined)
      t.d = t.sp==="bible" ? "parole" : (t.sp==="livre" ? "litt" : "");
  });
  /* Un bloc sans départ ou sans activité ne dit rien : on nettoie et on
     range une fois pour toutes, au chargement.
     Ce qu'on ne fait plus ici : fermer un bloc sans fin parce qu'un autre
     commence après lui. Quand il n'y avait qu'une file, un bloc ouvert qui
     n'était pas le dernier était forcément une avarie, et le refermer sur le
     départ du suivant remettait la journée d'aplomb. Depuis qu'on mène
     plusieurs choses de front (13.by), c'est la situation la plus ordinaire
     qui soit : l'application tourne depuis 8 h, une réunion s'ouvre à 9 h
     par-dessus — et la simple ouverture de l'écran arrêtait l'application à
     9 h. Tout ce qui avait suivi devenait du temps non compté, et plus rien
     ne tournait : « subitement, rien n'était fait depuis ». Un bloc sans fin
     est un bloc EN COURS, et personne ne le ferme à la place du disciple
     (13.cf). */
  d.temps = d.temps.filter(b=>b && typeof b.deb==="number" && b.t)
                   .sort((a,b)=>a.deb-b.deb);
  d.temps.forEach(b=>{ if(!b.id) b.id="b"+(d.seq++)+"-"+DEV; });
  /* La date d'un acte dit quand il est arrivé ; elle ne dit pas dans quel
     ordre on l'a gardé. Deux actes du même jour se présentaient donc dans
     l'ordre où ils dormaient en mémoire — c'est-à-dire le plus ancien
     d'abord, juste quand on vient d'en écrire un. On garde l'heure.
     Les actes d'avant n'en ont pas : ils reçoivent leur rang, qui met le
     dernier gardé au-dessus et laisse toujours passer un acte neuf. */
  d.nodes.forEach((n,i)=>{ if(typeof n.ts!=="number") n.ts=i+1; });
  return d;
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r) db=sane(JSON.parse(r)); }catch(e){} }
/* L'heure locale peut reculer d'un appareil à l'autre ; ce jalon-ci ne doit
   jamais reculer, sinon une modification vraie passerait pour déjà envoyée. */
function save(sil){
  if(!sil) db.maj = Math.max(Date.now(), (db.maj||0)+1);
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Enregistrement impossible"); }
  if(!sil) syPlusTard();
}
/* Deux appareils qui créent chacun de leur côté produiraient le même « n42 »
   et l'un écraserait l'autre à la fusion. Chaque installation porte donc sa
   marque, tirée une fois et gardée hors de l'archive — elle appartient à
   l'appareil, pas aux données. */
const DEV = (function(){
  try{
    let d=localStorage.getItem("ebenezer.dev");
    if(!d){ d=Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,4);
            localStorage.setItem("ebenezer.dev", d); }
    return d;
  }catch(e){ return "x"+Math.random().toString(36).slice(2,7); }
})();
function uid(p){ return p+(db.seq++)+"-"+DEV; }
function nid(){ return uid("n"); }
/* Qui a parlé en dernier l'emporte : chaque fiche porte l'heure de sa
   dernière écriture. */
function touche(o){ if(o) o.maj=Date.now(); return o; }
/* Une fiche simplement absente d'un appareil ressusciterait à la fusion : on
   garde donc la trace de ce qui a été supprimé, et pour qui veut la lire,
   combien de temps. */
function tue(id){ if(id){ db.morts=db.morts||{}; db.morts[id]=Date.now(); } }
function ts(){ return Date.now(); }
function cap(t){ t=String(t||""); return t.charAt(0).toUpperCase()+t.slice(1); }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- dates ---------- */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ if(!s) return null; const p=String(s).split("-"); if(p.length<3) return null; return {y:+p[0], m:+p[1], d:+p[2]}; }
function human(n){
  if(n.kind==="ecriture") return n.ref || "";
  const p=parse(n.date); if(!p) return "";
  if(n.prec==="a") return ""+p.y;
  if(n.prec==="m") return MOIS[p.m-1]+" "+p.y;
  return p.d+" "+MOIS[p.m-1]+" "+p.y;
}
/* On ne range pas un acte plus fin que ce qu'on sait de sa date : une date
   connue à l'année près ne peut pas entrer dans une semaine sans mentir. */
function lundi(p){
  const t=new Date(p.y, p.m-1, p.d);
  t.setDate(t.getDate() - ((t.getDay()+6)%7));
  return t;
}
function tranche(n, grain){
  const p=parse(n.date); if(!p) return "Sans date";
  if(grain==="an" || n.prec==="a") return ""+p.y;
  if(grain==="mois" || n.prec==="m") return MOIS[p.m-1]+" "+p.y;
  const l=lundi(p);
  return "Semaine du "+l.getDate()+" "+MOIS[l.getMonth()]+" "+l.getFullYear();
}
function ansDepuis(n){ const p=parse(n.date); if(!p) return 0; return new Date().getFullYear()-p.y; }
function manCourt(m){ const t=manTxt(m); return t ? t.replace(/^Il (a |m'a |l'a )?/,"") : ""; }

/* ---------- le temps ---------- */
/* Le temps donné n'est pas un acte : il ne se garde pas dans le mémorial, il
   se pèse à côté. Quarante blocs par jour noieraient l'archive, et l'archive
   existe pour être relue. Deux registres, donc : les actes, et les heures. */
function CATS(){
  return CAT_SOCLE.map(function(c){ return {id:c[0], nom:c[1]}; })
    .concat((db.cats||[]).map(function(c){ return {id:c.id, nom:c.nom}; }));
}
function catNom(id){ const c=CATS().filter(x=>x.id===id)[0]; return c ? c.nom : "Le reste"; }
function catId(nom){
  const v=String(nom||"").trim(); if(!v) return "";
  const t=CATS().filter(c=>c.nom.toLowerCase()===v.toLowerCase())[0];
  if(t) return t.id;
  const id=uid("k"); db.cats.push({id:id, nom:cap(v), maj:Date.now()}); return id;
}
function tache(id){ return (db.taches||[]).filter(t=>t.id===id)[0]; }
function tacheNom(id){ const t=tache(id); return t ? t.nom : "—"; }
function tacheCat(id){ const t=tache(id); return t ? (t.cat||"reste") : "reste"; }
/* Une activité naît avec son type, comme elle naît avec sa catégorie : le
   deviner d'après le nom dépannait les anciennes, ce n'est pas une manière
   de créer les nouvelles. À défaut de choix, le nom tranche — mais le choix
   est offert, au même écran (13.cg). */
function tacheId(nom, cat, d){
  const v=String(nom||"").trim(); if(!v) return "";
  const t=(db.taches||[]).filter(x=>x.nom.toLowerCase()===v.toLowerCase())[0];
  if(t){ if(cat && t.cat!==cat){ t.cat=cat; touche(t); } return t.id; }
  const id=uid("a");
  db.taches.push({id:id, nom:cap(v), cat:cat||"reste",
                  d:(d===undefined||d===null) ? discDeNom(v) : d, maj:Date.now()});
  return id;
}
function blocT(id){ return (db.temps||[]).filter(b=>b.id===id)[0]; }
/* Un bloc qui en recouvre un autre, même partiellement : c'est le seul cas
   où la question « lequel porte l'heure ? » se pose. Ailleurs, l'offrir
   serait proposer un choix qui n'existe pas. */
function chevauche(b){
  const f=finDe(b);
  return (db.temps||[]).some(function(x){ return x!==b && x.deb<f && finDe(x)>b.deb; });
}

/* Permanent, mais pas en marche : une page web s'arrête dès qu'on la quitte,
   et aucun chronomètre ne survit à l'app fermée. On ne garde que l'heure de
   départ — la soustraction reste juste après trois jours de silence.
   Plusieurs blocs peuvent tourner ensemble (13.by) : deux missions que l'IA
   fait avancer en parallèle ne se disputent pas la journée, elles la
   couvrent toutes les deux. Ce qui ne se duplique jamais, c'est la journée
   elle-même — et c'est le calcul qui s'en charge, pas le pointage. */
function ouverts(){ return (db.temps||[]).filter(function(b){ return !b.fin; }); }
/* Quand plusieurs tournent, un seul porte l'heure pour « La part de chacun »
   — celui qui le réclame, sinon celui qui tournait déjà. « ouvert() » rend
   ce porteur : c'est lui que le rail nomme, et lui que le reste du code
   attend là où il n'en espérait qu'un. */
function chef(arr){
  let c=null;
  for(let i=0;i<arr.length;i++){
    const b=arr[i];
    if(!c) { c=b; continue; }
    if(!!b.porte > !!c.porte) c=b;
    else if(!c.porte && b.deb<c.deb) c=b;
  }
  return c;
}
function ouvert(){ return chef(ouverts()); }
/* Vingt secondes passaient pour une erreur de pouce, et l'app les effaçait
   d'elle-même. Mais une intercession de dix secondes est du temps vécu, et
   rien n'autorise l'outil à décider que ce qui est bref n'a pas eu lieu —
   surtout dans un registre dont toute la valeur tient à ce qu'il ne maquille
   rien. Le disciple efface ce qu'il veut effacer ; l'app garde (13.ci).
   Reste un plancher d'une seconde, qui n'invente aucune durée vécue : il
   tient seulement le bloc au-dessus de la durée nulle, que la fusion laisse
   tomber sans rien dire. */
function fermeBloc(b){
  if(!b || b.fin) return;
  b.fin=Math.max(Date.now(), b.deb+1000); touche(b);
}
function pointe(tid, enPlus){
  const n=Date.now(), ouv=ouverts();
  if(ouv.some(function(b){ return b.t===tid; })) return false;
  if(!enPlus) ouv.forEach(fermeBloc);
  db.temps.push({id:uid("b"), t:tid, deb:n, maj:n});
  save(); return true;
}
function arrete(){
  const ouv=ouverts(); if(!ouv.length) return;
  ouv.forEach(fermeBloc); save();
}
function arreteUn(b){ if(!b || b.fin) return; fermeBloc(b); save(); }

/* Sous la minute, l'app annonçait « 0 min » d'un temps qu'elle avait pourtant
   compté à la milliseconde. Un bloc de trente-cinq secondes existe, il pèse
   dans les totaux, et l'écran le niait — or un chiffre faux, si petit soit-il,
   fait douter de tous les autres. Elle le dit maintenant en secondes, et le
   dernier mot sur ce qui est trop court pour être gardé reste au seuil des
   vingt secondes, qui lui efface vraiment (13.ch). */
function hm(ms){
  const s=Math.max(0, Math.round(ms/1000));
  if(s<60) return s+" s";
  const m=Math.floor(s/60), h=Math.floor(m/60), r=m%60;
  if(!h) return m+" min";
  return r ? h+" h "+String(r).padStart(2,"0") : h+" h";
}
function hmin(d){ return d.getHours()+" h "+String(d.getMinutes()).padStart(2,"0"); }
/* Dans une fenêtre de sept ou trente jours, « 9 h 20 » ne dit pas quel jour.
   Aujourd'hui n'a pas besoin d'être daté ; le reste si. */
function jourBref(ms){
  const m=new Date(); m.setHours(0,0,0,0);
  if(ms>=m.getTime()) return "";
  return new Date(ms).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" · ";
}
function minuit(dec){ const d=new Date(); d.setHours(0,0,0,0); if(dec) d.setDate(d.getDate()-dec); return d.getTime(); }

/* Un bloc qui traverse la nuit appartient aux deux jours. On ne le coupe pas
   en mémoire — on le coupe à la lecture, en ne comptant que ce qui tombe dans
   la fenêtre. Le sommeil rend ainsi à chaque jour sa part, sans qu'on ait
   touché à quoi que ce soit à minuit. */
/* Trois nombres, et il ne faut jamais les confondre (13.by).
   « par »   — ce que chaque activité a duré, pour elle-même. Deux missions
               menées ensemble durent chacune tout leur temps : on les
               additionne et la somme peut dépasser la journée, c'est juste.
   « tot »   — la journée vécue : l'UNION des périodes, jamais leur somme.
               Dix heures à seize heures occupées par deux missions font six
               heures de vie, pas douze. C'est le seul nombre qui ait le
               droit d'être comparé au temps écoulé.
   « parCat »— la part de chaque catégorie dans cette union. Sur chaque
               tranche, un seul bloc porte : celui qui le réclame, sinon
               celui qui tournait déjà. C'est ce qui fait qu'un repas pris
               en codant ne retire rien à l'œuvre.
   On balaie les bornes dans l'ordre en tenant à jour la liste de ce qui est
   ouvert : comparer chaque tranche à tous les blocs serait quadratique, et
   la fenêtre « Tout » en contient des milliers. */
function cumul(t0, t1){
  const n=Date.now(), par={}, parCat={}, bs=[];
  (db.temps||[]).forEach(function(b){
    const a=Math.max(b.deb, t0), z=Math.min(b.fin||n, t1);
    if(z>a){ par[b.t]=(par[b.t]||0)+(z-a); bs.push({a:a, z:z, b:b}); }
  });
  let porte=0;
  Object.keys(par).forEach(function(k){ porte+=par[k]; });
  if(!bs.length) return {par:par, parCat:parCat, tot:0, porte:0};

  const cat={};
  function catDe(tid){ if(cat[tid]===undefined) cat[tid]=tacheCat(tid); return cat[tid]; }

  const marques={};
  bs.forEach(function(x){ marques[x.a]=1; marques[x.z]=1; });
  const ts=Object.keys(marques).map(Number).sort(function(p,q){ return p-q; });
  bs.sort(function(p,q){ return p.a-q.a; });

  let tot=0, k=0; const actifs=[];
  for(let i=0;i<ts.length-1;i++){
    const x=ts[i], y=ts[i+1];
    while(k<bs.length && bs[k].a<=x){ actifs.push(bs[k]); k++; }
    for(let j=actifs.length-1;j>=0;j--) if(actifs[j].z<=x) actifs.splice(j,1);
    if(!actifs.length) continue;
    let c=null;
    for(let j=0;j<actifs.length;j++){
      const o=actifs[j].b;
      if(!c){ c=o; continue; }
      if(!!o.porte > !!c.porte) c=o;
      else if(!c.porte && o.deb<c.deb) c=o;
    }
    tot+=y-x;
    const k2=catDe(c.t);
    parCat[k2]=(parCat[k2]||0)+(y-x);
  }
  return {par:par, parCat:parCat, tot:tot, porte:porte};
}
/* Les fenêtres étaient glissantes — « les sept derniers jours », « les
   trente derniers » — et une fenêtre glissante ne se remonte pas : il n'y a
   pas de jour d'avant les sept derniers jours. Elles sont devenues des
   fenêtres du calendrier, qui se parcourent : le jour, la semaine, le mois,
   l'année. Les pastilles ne disent plus que le grain ; c'est la barre en
   dessous qui dit laquelle on regarde. */
const ONG_TEMPS = [["parts","Les parts"],["routines","Les routines"],["blocs","Les blocs"]];
const PERIODES = [["jour","Jour"],["sem","Semaine"],["mois","Mois"],["an","Année"],["tout","Tout"]];
/* Les bornes se calculent toujours sur un objet Date, jamais en ajoutant des
   millisecondes : l'heure d'hiver fait des journées de vingt-cinq heures, et
   un mois n'a pas de durée. */
function bornes(per, t){
  const d=new Date(t); d.setHours(0,0,0,0);
  if(per==="jour"){ const f=new Date(d); f.setDate(f.getDate()+1); return [d.getTime(), f.getTime()]; }
  if(per==="sem"){ d.setDate(d.getDate()-((d.getDay()+6)%7));
                   const f=new Date(d); f.setDate(f.getDate()+7); return [d.getTime(), f.getTime()]; }
  if(per==="mois"){ d.setDate(1); const f=new Date(d); f.setMonth(f.getMonth()+1); return [d.getTime(), f.getTime()]; }
  d.setMonth(0,1); const f=new Date(d); f.setFullYear(f.getFullYear()+1); return [d.getTime(), f.getTime()];
}
/* On ne décale jamais qu'un début de période — le 1er du mois, un lundi,
   minuit — ce qui évite le piège du 31 janvier qu'on avance d'un mois. */
function decale(per, t0, sens){
  const d=new Date(t0);
  if(per==="jour") d.setDate(d.getDate()+sens);
  else if(per==="sem") d.setDate(d.getDate()+7*sens);
  else if(per==="mois") d.setMonth(d.getMonth()+sens);
  else d.setFullYear(d.getFullYear()+sens);
  return bornes(per, d.getTime())[0];
}
function memeAn(t){ return new Date(t).getFullYear()===new Date().getFullYear(); }
/* Deux noms pour la même fenêtre : celui qui entre dans une phrase — « rien
   de compté le mardi 4 novembre » — et celui qui tient dans la barre. */
function nomFen(per, t0){
  const n=Date.now(), ici=bornes(per,n)[0], av=decale(per,ici,-1), d=new Date(t0);
  if(per==="jour"){
    if(t0===ici) return "aujourd'hui";
    if(t0===av) return "hier";
    return "le "+d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})
      +(memeAn(t0) ? "" : " "+d.getFullYear());
  }
  if(per==="sem"){
    if(t0===ici) return "cette semaine";
    if(t0===av) return "la semaine dernière";
    return "la semaine du "+d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})
      +(memeAn(t0) ? "" : " "+d.getFullYear());
  }
  if(per==="mois"){
    if(t0===ici) return "ce mois-ci";
    if(t0===av) return "le mois dernier";
    return "en "+d.toLocaleDateString("fr-FR",{month:"long"})+(memeAn(t0) ? "" : " "+d.getFullYear());
  }
  if(t0===ici) return "cette année";
  if(t0===av) return "l'an dernier";
  return "en "+d.getFullYear();
}
function courtFen(per, t0){
  const n=Date.now(), ici=bornes(per,n)[0], d=new Date(t0);
  if(per==="jour"){
    if(t0===ici) return "Aujourd'hui";
    if(t0===decale(per,ici,-1)) return "Hier";
    return cap(d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}))
      +(memeAn(t0) ? "" : " "+d.getFullYear());
  }
  if(per==="sem") return (t0===ici ? "Cette semaine"
    : "Semaine du "+d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})
      +(memeAn(t0) ? "" : " "+d.getFullYear()));
  if(per==="mois") return cap(d.toLocaleDateString("fr-FR",{month:"long"}))
    +(memeAn(t0) ? "" : " "+d.getFullYear());
  return String(d.getFullYear());
}
function fenetre(){
  const n=Date.now();
  if(S.per==="tout"){
    const d=(db.temps||[])[0];
    return {t0:d?d.deb:n, t1:n, nom:"depuis le début", court:"Tout",
            ici:true, avant:false, apres:false};
  }
  const b=bornes(S.per, S.anc===null ? n : S.anc), ici=(b[0]===bornes(S.per,n)[0]);
  const prem=(db.temps||[])[0];
  /* Une fenêtre passée s'arrête à sa propre fin ; celle d'aujourd'hui
     s'arrête maintenant. C'est ce qui fait qu'hier se lit sur vingt-quatre
     heures et aujourd'hui sur ce qui s'est écoulé. */
  return {t0:b[0], t1:Math.min(b[1], n), nom:nomFen(S.per,b[0]), court:courtFen(S.per,b[0]),
          ici:ici,
          /* On ne remonte pas avant le premier bloc de l'archive, et on ne
             descend pas dans un jour qui n'a pas eu lieu. */
          avant: !!prem && prem.deb < b[0],
          apres: !ici};
}
/* Le nom du retour suit le grain : on ne revient pas « à aujourd'hui »
   quand on lit des années. */
function retourTxt(per){
  if(per==="sem") return "Revenir à cette semaine";
  if(per==="mois") return "Revenir à ce mois-ci";
  if(per==="an") return "Revenir à cette année";
  return "Revenir à aujourd'hui";
}
/* La ligne reste même sur « Tout », où les chevrons n'ont rien à faire :
   elle est la seule porte vers le grain, et une porte ne se retire pas. */
function barreFen(f){
  return `<div class="fnav">
    <button class="fnp" data-fdec="-1" aria-label="Avant"${f.avant?"":" disabled"}>&lsaquo;</button>
    <button class="fnt${f.ici?"":" loin"}" data-act="fenGrain" aria-haspopup="true">${esc(f.court)}${BAS}</button>
    <button class="fnp" data-fdec="1" aria-label="Après"${f.apres?"":" disabled"}>&rsaquo;</button>
  </div>`;
}
function pcent(x, tot){ return tot ? Math.round(x*100/tot) : 0; }
/* Sur trente jours, une heure de prière pèse deux dixièmes de pour cent.
   L'arrondir à zéro serait faux — une heure a été donnée — et dur pour
   rien. Sous le demi pour cent, on écrit donc le dixième. */
function partPc(x, tot){
  if(!tot) return "0";
  const p=x*100/tot;
  if(p>0 && p<0.5) return String(Math.round(p*10)/10).replace(".", ",");
  return String(Math.round(p));
}

/* ---------- les médias ---------- */
/* Une photo ne tient pas dans la mémoire du navigateur où vit l'archive :
   cinq mégaoctets pour tout, et une seule image en prendrait la moitié. Les
   fichiers vivent donc à côté, dans la réserve ; l'acte ne garde que leur
   fiche. L'archive reste légère — et elle reste lisible, ce qui est le but.
   Conséquence qu'il faut dire et non cacher : la fiche voyage d'un appareil
   à l'autre, le fichier non. Un média absent le dit lui-même. */
const MED_MAX = 25*1024*1024;
/* Trois phrases entières plutôt qu'un nom qu'on recolle : à force
   d'assembler des morceaux, on écrit « une photo, resté », et une phrase
   bancale fait douter de tout le reste. */
const MED_DIT = {
  photo:{loin:"Une photo, restée sur l'appareil où on l'a prise. Relie tes appareils, et elle suivra.",
         venir:"Une photo, pas encore arrivée ici. Elle viendra à la prochaine synchronisation."},
  son:{loin:"Un son, resté sur l'appareil où on l'a enregistré. Relie tes appareils, et il suivra.",
       venir:"Un son, pas encore arrivé ici. Il viendra à la prochaine synchronisation."},
  video:{loin:"Une vidéo, restée sur l'appareil où on l'a filmée : trop lourde pour le dépôt partagé, elle ne voyage pas.",
         venir:"Une vidéo, restée sur l'appareil où on l'a filmée : trop lourde pour le dépôt partagé, elle ne voyage pas."}
};
let medBase=null;
function medOuvre(){
  if(medBase) return medBase;
  medBase = new Promise(function(ok, non){
    let r;
    try{ r=indexedDB.open("ebenezer.med", 1); }catch(e){ return non(e); }
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore("fic", {keyPath:"id"}); }catch(e){} };
    r.onsuccess=function(){ ok(r.result); };
    r.onerror=function(){ non(r.error); };
  });
  return medBase;
}
function medAttend(req){
  return new Promise(function(ok, non){
    req.onsuccess=function(){ ok(req.result); };
    req.onerror=function(){ non(req.error); };
  });
}
function medSac(mode){
  return medOuvre().then(function(d){ return d.transaction("fic", mode).objectStore("fic"); });
}
function medPose(id, blob){ return medSac("readwrite").then(function(x){ return medAttend(x.put({id:id, blob:blob})); }); }
function medPrend(id){ return medSac("readonly").then(function(x){ return medAttend(x.get(id)); })
  .then(function(r){ return r ? r.blob : null; }).catch(function(){ return null; }); }
function medEfface(id){ return medSac("readwrite").then(function(x){ return medAttend(x.delete(id)); }).catch(function(){}); }
function medGenre(mime){
  const m=String(mime||"");
  if(m.indexOf("image/")===0) return "photo";
  if(m.indexOf("audio/")===0) return "son";
  if(m.indexOf("video/")===0) return "video";
  return "";
}
function poids(o){
  if(o<1024) return o+" o";
  if(o<1024*1024) return Math.round(o/1024)+" Ko";
  const m=o/(1024*1024);
  return (m<10 ? m.toFixed(1) : Math.round(m))+" Mo";
}
function medTout(){
  const a=[];
  db.nodes.forEach(function(n){ (n.med||[]).forEach(function(m){ a.push(m); }); });
  return a;
}
function medPoids(){ let t=0; medTout().forEach(function(m){ t+=(m.taille||0); }); return t; }
/* Une photo de téléphone pèse quatre mégaoctets pour douze millions de
   points, quand un écran en montre un. On la réduit avant de la ranger :
   ce qui est gardé doit pouvoir ressortir dans un fichier, et un fichier
   trop lourd pour être déplacé n'est plus une sauvegarde. */
function medReduit(f){
  return new Promise(function(ok){
    let u;
    try{ u=URL.createObjectURL(f); }catch(e){ return ok(f); }
    const im=new Image();
    im.onload=function(){
      try{ URL.revokeObjectURL(u); }catch(e){}
      const max=1600, e=Math.min(1, max/Math.max(im.width||1, im.height||1));
      if(e>=1 && f.size<900000) return ok(f);
      try{
        const c=document.createElement("canvas");
        c.width=Math.max(1, Math.round((im.width||1)*e));
        c.height=Math.max(1, Math.round((im.height||1)*e));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(function(b){ ok(b && b.size<f.size ? b : f); }, "image/jpeg", 0.72);
      }catch(x){ ok(f); }
    };
    im.onerror=function(){ try{ URL.revokeObjectURL(u); }catch(e){} ok(f); };
    im.src=u;
  });
}
function medJoint(n, fichiers){
  const fics=[].slice.call(fichiers||[]);
  let pris=0, lourd=0, autre=0;
  return fics.reduce(function(suite, f){
    return suite.then(function(){
      const g=medGenre(f.type);
      if(!g){ autre++; return; }
      return (g==="photo" ? medReduit(f) : Promise.resolve(f)).then(function(b){
        if(b.size>MED_MAX){ lourd++; return; }
        const id=uid("m");
        return medPose(id, b).then(function(){
          n.med=n.med||[];
          n.med.push({id:id, genre:g, mime:b.type||f.type||"", taille:b.size, dev:DEV, maj:Date.now()});
          pris++;
        }, function(){ autre++; });
      });
    });
  }, Promise.resolve()).then(function(){
    if(pris){ touche(n); save(); }
    /* Ce qui n'est pas entré doit se dire : un fichier qu'on croit joint et
       qui ne l'est pas, on ne s'en aperçoit que le jour où on le cherche. */
    if(lourd) toast("Trop lourd : "+poids(MED_MAX)+" au plus.");
    else if(autre && !pris) toast("Ni photo, ni son, ni vidéo : rien n'a été joint.");
    else if(autre) toast(pris+" joint"+(pris>1?"s":"")+", "+autre+" laissé"+(autre>1?"s":"")+" de côté.");
    else if(pris) toast(pris===1 ? "Joint." : pris+" fichiers joints.");
    render();
  });
}
/* Les adresses d'affichage sont rendues au navigateur à chaque redessin :
   sans ça, feuilleter dix actes garderait dix vidéos ouvertes en mémoire. */
let medUrls=[];
function medRend(){
  medUrls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  medUrls=[];
  [].forEach.call(document.querySelectorAll("[data-med]"), function(el){
    const id=el.getAttribute("data-med"), g=el.getAttribute("data-genre");
    const zone=el.querySelector(".medZone"); if(!zone) return;
    medPrend(id).then(function(b){
      if(!zone.isConnected) return;
      if(!b){
        const t=MED_DIT[g];
        const dit = !t ? "Un fichier, resté sur l'appareil où on l'a pris."
                  : ((SY.actif && MED_VOYAGE[g]) ? t.venir : t.loin);
        zone.innerHTML = `<p class="medAbs">${dit}</p>`; return;

      let u; try{ u=URL.createObjectURL(b); }catch(e){ return; }

      else if(g==="son") zone.innerHTML = `<audio controls preload="none" src="${u}"></audio>`;
      else zone.innerHTML = `<video controls playsinline preload="metadata" src="${u}"></video>`;
    });

}
/* Joindre se propose partout où l'acte se regarde : on ne photographie pas
   au moment de noter — la capture doit rester brève (P2) — mais le soir,

function medBloc(n, corr){
  const m=n.med||[];

  if(m.length) h += `<div class="meds">`+m.map(function(x){

  h += liste(ligne({titre:`<span class="coche">+ Joindre une photo, un son, une vidéo</span>`,
      sous: m.length ? "" : "à prendre maintenant, ou déjà sur l'appareil", attr:'data-act="medPioche"'}));
  /* L'appareil photo et la caméra passent par le système : c'est lui qui
     sait cadrer, et le disciple connaît déjà son propre appareil. Le son,
     lui, s'enregistre ici — sur iPhone, le système ne propose pas de

  h += `<input type="file" id="medIn" accept="image/*,audio/*,video/*" multiple hidden>
